ているこちらのお店\nみせ\n、文\nぶん\n房\nぼう\n具\nぐ\nなど、ちょっと見\nみ\nたところよくある普\nふ\n通\nつう\nのものが\n売\nう\nられていますが、大\nたい\n変\nへん\n人\nにん\n気\nき\nがあって、全\nぜん\n国\nこく\nからお客\nきゃく\nさんが集\nあつ\nまってくるそうです。すべ\nての商\nしょう\n品\nひん\nが左\nひだり\n利\nき\nきの人\nひと\nのためのものなんです。普\nふ\n段\nだん\nはあまり意\nい\n識\nしき\nしないかもしれませんが、\n普\nふ\n通\nつう\nのはさみ、包\nほう\n丁\nちょう\nなどは右\nみぎ\n手\nて\nで使\nつか\nうように作\nつく\nられています。こちらのお店\nみせ\nには、日\nにち\n常\nじょう\n使\nつか\nうものからパソコンのキーボードなどの電\nでん\n気\nき\n製\nせい\n品\nひん\n、ギターなどの楽\nがっ\n器\nき\nまであるんですよ。す\nごいですね。\nアナウンサーは主\nおも\nに何\nなに\nについて話\nはな\nしていますか。\n１． 左\nひだり\n利\nき\nき用\nよう\nの道\nどう\n具\nぐ\nの特\nとく\n徴\nちょう\n２． 左\nひだり\n利\nき\nきの人\nひと\nの苦\nく\n労\nろう\n３． この店\nみせ\nで扱\nあつか\nっている商\nしょう\n品\nひん\n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、指\nし\n導\nどう\n者\nしゃ\nになることも考\nかんが\nえました。でも、目\nもく\n標\nひょう\nを持\nも\nって頑\nがん\n張\nば\nる若\nわか\nい選\nせん\n手\nしゅ\nたちの試\nし\n合\nあい\nを\n見\nみ\nて、まだあきらめられない気\nき\n持\nも\nちが出\nで\nてきました。自\nじ\n分\nぶん\nもその場\nば\n所\nしょ\nに立\nた\nちたいと思\nおも\nい、選\nせん\n手\nしゅ\nを育\nそだ\nてるのはもう少\nすこ\nし先\nさき\nでもいいと思\nおも\nったんです。休\nやす\nんでいる間\nあいだ\nも応\nおう\n援\nえん\nしてくださった方\nかた\nたちのためにも、新\nあたら\nしい気\nき\n持\nも\nちでやっていきたいと思\nおも\nいます。\nこのスポーツ選\nせん\n手\nしゅ\nが伝\nつた\nえたいことは何\nなん\nですか。\n１． 選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむということ\n２． 選\nせん\n手\nしゅ\nをやめるということ\n３． 指\nし\n導\nどう\n者\nしゃ\nになるということ\n４． もう一\nいち\n度\nど\n選\nせん\n手\nしゅ\nとして活\nかつ\n動\nどう\nするということ\n聴解スクリプト\n9\n\n3 番\nテレビで博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nが話\nはな\nしています。\nＭ ： 子\nこ\n供\nども\nに科\nか\n学\nがく\nを好\nす\nきになってもらいたいご両\nりょう\n親\nしん\n、多\nおお\nいと思\nおも\nいます。でも、子\nこ\n供\nども\nに正\nただ\nしく分\nわ\nかっ\nてもらおうと、つい大\nおとな\n人に説\nせつ\n明\nめい\nするときのように数\nすう\n学\nがく\n的\nてき\nな話\nはなし\nや専\nせん\n門\nもん\n的\nてき\nな話\nはなし\nをしていません\nか。子\nこ\n供\nども\nには難\nむずか\nしい話\nはなし\nをしてもしかたありません。言\nこと\n葉\nば\nで詳\nくわ\nしく説\nせつ\n明\nめい\nするよりも実\nじっ\n際\nさい\nに経\nけい\n験\nけん\nさせることが大\nたい\n切\nせつ\nなんです。例\nたと\nえば、月\nつき\nでの重\nおも\nさの感\nかん\nじ方\nかた\nを教\nおし\nえるときだったら、地\nち\n球\nきゅう\nで\n1 キログラムのものが月\nつき\nではどのくらいの重\nおも\nさに感\nかん\nじるか、持\nも\nった感\nかん\n覚\nかく\nで分\nわ\nかるようにする\nといいですよ。\n博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nは何\nなに\nについて話\nはな\nしていますか。\n１． 子\nこ\n供\nども\nが科\nか\n学\nがく\nを好\nす\nきな理\nり\n由\nゆう\n２． 子\nこ\n供\nども\nへの科\nか\n学\nがく\nの教\nおし\nえ方\nかた\n３． 子\nこ\n供\nども\nに科\nか\n学\nがく\nを学\nまな\nばせる理\nり\n由\nゆう\n４． 子\nこ\n供\nども\nにとって必\nひつ\n要\nよう\nな科\nか\n学\nがく\nの知\nち\n識\nしき\n問題4\n例\nホテルのテレビが壊\nこわ\nれています。何\nなん\nと言\nい\nいますか。\nＦ ： １．テレビがつかないんですが。\n \n ２．テレビをつけてもいいですか。\n \n ３．テレビをつけたほうがいいですよ。\n1 番\n約\nやく\n束\nそく\nの時\nじ\n間\nかん\nに少\nすこ\nし遅\nおく\nれました。友\nとも\n達\nだち\nに何\nなん\nと言\nい\nいますか。  \nＦ ： １．待\nま\nたせてごめん。\n \n ２．急\nいそ\nがせちゃってごめん。\n \n ３．ごめん、お先\nさき\nに。\n聴解スクリプト\n10\n\n2 番\n観\nかん\n光\nこう\nの案\nあん\n内\nない\nをしています。建\nたて\n物\nもの\nを見\nみ\nてもらいたいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．こちらでお目\nめ\nにかかります。\n \n ２．こちらをご覧\nらん\nください。\n \n ３．お見\nみ\nせくださいますか。\n3 番\n荷\nに\n物\nもつ\nを受\nう\nけ取\nと\nります。サインするところが分\nわ\nかりません。何\nなん\nと言\nい\nいますか。\nＭ ： １．どこにサインが書\nか\nいてありますか。\n \n ２．どこでサインを渡\nわた\nしましょうか。\n \n ３．どこにサインをすればいいですか。\n4 番\n今\nきょう\n日はあまりおなかがすいていません。ご飯\nはん\nを普\nふ\n通\nつう\nより少\nすく\nなくしてほしいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．ご飯\nはん\n、少\nすく\nなすぎるんですけど。\n \n ２．ご飯\nはん\n、あと少\nすこ\nしほしいです。\n \n ３．ご飯\nはん\n、少\nすく\nな目\nめ\nでお願\nねが\nいします。\n問題5\n例\nＭ ： すみません、今\nいま\n、時\nじ\n間\nかん\n、ありますか。\nＦ ： １．ええと、１０時\nじ\n２０分\nぷん\nです。\n \n ２．ええ。何\nなん\nですか。\n \n ３．時\nと\n計\nけい\nはあそこですよ。\n聴解スクリプト\n11\n\n1 番\nＭ ： 山\nやま\n田\nだ\nさん、作\nつく\nり直\nなお\nしてくれた資\nし\n料\nりょう\n、見\nみ\nやすくなってましたよ。  \nＦ ： １．ありがとうございます。よかったです。\n \n ２．分\nわ\nかりました。すぐに直\nなお\nします。\n \n ３．もっと簡\nかん\n単\nたん\nにするんですか。\n2 番\nＦ ： ねえ、ちょっと木\nき\n村\nむら\nさんに用\nよう\nがあるんだけど、見\nみ\nなかった？\nＭ ： １．じゃ、一\nいっ\n緒\nしょ\nに見\nみ\nよう。\n \n ２．特\nとく\nに用\nよう\nはないんだけど。\n \n ３．さあ。ほかの人\nひと\nに聞\nき\nいてみて。\n3 番\nＭ ： 昨\nきのう\n日貸\nか\nしてくれた本\nほん\n、読\nよ\nみ出\nだ\nしたら止\nと\nまらなくなっちゃったよ。\nＦ ： １．じゃ、全\nぜん\n部\nぶ\n読\nよ\nまなくてもいいよ。\n \n ２．けっこうおもしろかったでしょう。\n \n ３．本\nほん\n、なくなっちゃったの？\n4 番\nＦ ： どうぞお入\nはい\nりください。すぐお茶\nちゃ\n入\nい\nれますから。  \nＭ ： １．おかまいなく。\n \n ２．ごちそうさまでした。\n \n ３．どういたしまして。\n5 番\nＭ：　リーさん、あのう、リーさんの研\nけん\n究\nきゅう\nでお聞\nき\nきしたいことがあるんですが。  \nＦ ： １．あ、はい、どんなことでしょうか。\n \n ２．ああ、聞\nき\nいたことが \nが出\nで\nてるのに、数\nすう\n字\nじ\nが並\nなら\nんでるだ\nけだから、伝\nつた\nわりにくいって。\nＭ ： じゃ、グラフを加\nくわ\nえようか。\nＦ ： そうだね。それからもう一\nいっ\n点\nてん\n、私\nわたし\nたちの主\nしゅ\n張\nちょう\nが発\nはっ\n表\nぴょう\nの最\nさい\n後\nご\nにしかないから、途\nと\n中\nちゅう\nまで何\nなに\nが言\nい\nいたいのか分\nわ\nからないって。ねえ、発\nはっ\n表\nぴょう\nの流\nなが\nれ、変\nか\nえてみない？\nＭ ： うん、やってみよう。流\nなが\nれを変\nか\nえたら、調\nちょう\n査\nさ\n結\nけっ\n果\nか\nの見\nみ\nせ方\nかた\nも変\nか\nわってくるだろうから、グラ\nフのことは後\nあと\nにして、それからやろう。\nＦ ： うん。\n聴解スクリプト\n7\n\nＭ ： 先\nせん\n輩\nぱい\nにお礼\nれい\n言\nい\nっといてね。\n二\nふたり\n人はこのあとまず何\nなに\nをしますか。\n問題3\n例\n女\nおんな\nの人\nひと\nが友\nとも\n達\nだち\nのうちに来\nき\nて、話\nはな\nしています。\nＦ１ ： 田\nた\n中\nなか\nです。\nＦ２ ： あ、はあい。昨\nきのう\n日友\nとも\n達\nだち\nが泊\nと\nまりに来\nき\nてたんで、片\nかた\n付\nづ\nいてないけど、入\nはい\nって。\nＦ１ ： あ、でもここで。すぐ帰\nかえ\nるから。あのう、この前\nまえ\n借\nか\nりた本\nほん\nなんだけど、ちょっと破\nやぶ\nれちゃって。\nＦ２ ： え、本\nほん\n当\nとう\n？\nＦ１ ： うん、このページなんだけど。\nＦ２ ： あっ、うん、このくらいなら大\nだい\n丈\nじょう\n夫\nぶ\n。読\nよ\nめるし。\nＦ１ ： ほんと？　ごめん。これからは気\nき\nをつけるから。\nＦ２ ： うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１ ： ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nのうちへ何\nなに\nをしに来\nき\nましたか。\n１． 謝\nあやま\nりに来\nき\nた\n２． 本\nほん\nを借\nか\nりに来\nき\nた\n３． 泊\nと\nまりに来\nき\nた\n４． コーヒーを飲\nの\nみに来\nき\nた\n聴解スクリプト\n8\n\n1 番\nテレビでアナウンサーが話\nはな\nしています。\nＦ ： 皆\nみな\nさん、突\nとつ\n然\nぜん\nですが、私\nわたし\n、左\nひだり\n利\nき\nきなんです。マイクを持\nも\nつのも左\nひだり\n手\nて\n、はしを持\nも\nつのも左\nひだり\n手\nて\nです。今\nいま\n来\nき\nているこちらのお店\nみせ\n、文\nぶん\n房\nぼう\n具\nぐ\nなど、ちょっと見\nみ\nたところよくある普\nふ\n通\nつう\nのものが\n売\nう\nられていますが、大\nたい\n変\nへん\n人\nにん\n気\nき\nがあって、全\nぜん\n国\nこく\nからお客\nきゃく\nさんが集\nあつ\nまってくるそうです。すべ\nての商\nしょう\n品\nひん\nが左\nひだり\n利\nき\nきの人\nひと\nのためのものなんです。普\nふ\n段\nだん\nはあまり意\nい\n識\nしき\nしないかもしれませんが、\n普\nふ\n通\nつう\nのはさみ、包\nほう\n丁\nちょう\nなどは右\nみぎ\n手\nて\nで使\nつか\nうように作\nつく\nられています。こちらのお店\nみせ\nには、日\nにち\n常\nじょう\n使\nつか\nうものからパソコンのキーボードなどの電\nでん\n気\nき\n製\nせい\n品\nひん\n、ギターなどの楽\nがっ\n器\nき\nまであるんですよ。す\nごいですね。\nアナウンサーは主\nおも\nに何\nなに\nについて話\nはな\nしていますか。\n１． 左\nひだり\n利\nき\nき用\nよう\nの道\nどう\n具\nぐ\nの特\nとく\n徴\nちょう\n２． 左\nひだり\n利\nき\nきの人\nひと\nの苦\nく\n労\nろう\n３． この店\nみせ\nで扱\nあつか\nっている商\nしょう\n品\nひん\n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、指\nし\n導\nどう\n者\nしゃ\nになることも考\nかんが\nえました。でも、目\nもく\n標\nひょう\nを持\nも\nって頑\nがん\n張\nば\nる若\nわか\nい選\nせん\n手\nしゅ\nたちの試\nし\n合\nあい\nを\n見\nみ\nて、まだあきらめられない気\nき\n持\nも\nちが出\nで\nてきました。自\nじ\n分\nぶん\nもその場\nば\n所\nしょ\nに立\nた\nちたいと思\nおも\nい、選\nせん\n手\nしゅ\nを育\nそだ\nてるのはもう少\nすこ\nし先\nさき\nでもいいと思\nおも\nったんです。休\nやす\nんでいる間\nあいだ\nも応\nおう\n援\nえん\nしてくださった方\nかた\nたちのためにも、新\nあたら\nしい気\nき\n持\nも\nちでやっていきたいと思\nおも\nいます。\nこのスポーツ選\nせん\n手\nしゅ\nが伝\nつた\nえたいことは何\nなん\nですか。\n１． 選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむということ\n２． 選\nせん\n手\nしゅ\nをやめるということ\n３． 指\nし\n導\nどう\n者\nしゃ\nになるということ\n４． もう一\nいち\n度\nど\n選\nせん\n手\nしゅ\nとして活\nかつ\n動\nどう\nするということ\n聴解スクリプト\n9\n\n3 番\nテレビで博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nが話\nはな\nしています。\nＭ ： 子\nこ\n供\nども\nに科\nか\n学\nがく\nを好\nす\nきになってもらいたいご両\nりょう\n親\nしん\n、多\nおお\nいと思\nおも\nいます。でも、子\nこ\n供\nども\nに正\nただ\nしく分\nわ\nかっ\nてもらおうと、つい大\nおとな\n人に説\nせつ\n明\nめい\nするときのように数\nすう\n学\nがく\n的\nてき\nな話\nはなし\nや専\nせん\n門\nもん\n的\nてき\nな話\nはなし\nをしていません\nか。子\nこ\n供\nども\nには難\nむずか\nしい話\nはなし\nをしてもしかたありません。言\nこと\n葉\nば\nで詳\nくわ\nしく説\nせつ\n明\nめい\nするよりも実\nじっ\n際\nさい\nに経\nけい\n験\nけん\nさせることが大\nたい\n切\nせつ\nなんです。例\nたと\nえば、月\nつき\nでの重\nおも\nさの感\nかん\nじ方\nかた\nを教\nおし\nえるときだったら、地\nち\n球\nきゅう\nで\n1 キログラムのものが月\nつき\nではどのくらいの重\nおも\nさに感\nかん\nじるか、持\nも\nった感\nかん\n覚\nかく\nで分\nわ\nかるようにする\nといいですよ。\n博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nは何\nなに\nについて話\nはな\nしていますか。\n１． 子\nこ\n供\nども\nが科\nか\n学\nがく\nを好\nす\nきな理\nり\n由\nゆう\n２． 子\nこ\n供\nども\nへの科\nか\n学\nがく\nの教\nおし\nえ方\nかた\n３． 子\nこ\n供\nども\nに科\nか\n学\nがく\nを学\nまな\nばせる理\nり\n由\nゆう\n４． 子\nこ\n供\nども\nにとって必\nひつ\n要\nよう\nな科\nか\n学\nがく\nの知\nち\n識\nしき\n問題4\n例\nホテルのテレビが壊\nこわ\nれています。何\nなん\nと言\nい\nいますか。\nＦ ： １．テレビがつかないんですが。\n \n ２．テレビをつけてもいいですか。\n \n ３．テレビをつけたほうがいいですよ。\n1 番\n約\nやく\n束\nそく\nの時\nじ\n間\nかん\nに少\nすこ\nし遅\nおく\nれました。友\nとも\n達\nだち\nに何\nなん\nと言\nい\nいますか。  \nＦ ： １．待\nま\nたせてごめん。\n \n ２．急\nいそ\nがせちゃってごめん。\n \n ３．ごめん、お先\nさき\nに。\n聴解スクリプト\n10\n\n2 番\n観\nかん\n光\nこう\nの案\nあん\n内\nない\nをしています。建\nたて\n物\nもの\nを見\nみ\nてもらいたいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．こちらでお目\nめ\nにかかります。\ って、お客\nきゃく\n様\nさま\nがいらっ\nしゃるかどうか心\nしん\n配\nぱい\nだったんですが、近\nきん\n所\nじょ\nの方\nかた\nがよく朝\nちょう\n食\nしょく\nを食\nた\nべに来\nき\nてくださるので、驚\nおどろ\nきました。\nＭ ： 確\nたし\nかに予\nよ\n想\nそう\n以\nい\n上\nじょう\nだったね。\nＦ ： はい。それと、食\nしょく\n事\nじ\nがすんでいるのに、ずっとお帰\nかえ\nりにならない方\nかた\nがけっこういらっしゃる\nのが気\nき\nになります。アルバイトの森\nもり\nさんが言\nい\nってたんですけど、せっかく来\nき\nてくださったお\n客\nきゃく\n様\nさま\nが席\nせき\nがなくて入\nはい\nれないっていうことが何\nなん\n回\nかい\nかあったそうです。\nＭ ： そういうときは、お客\nきゃく\n様\nさま\nの気\nき\n分\nぶん\nを悪\nわる\nくさせずに席\nせき\nを空\nあ\nけていただくように頼\nたの\nまなきゃいけな\nいんだけど。うちの店\nみせ\nは若\nわか\nい店\nてん\n員\nいん\nが多\nおお\nいから、上\nじょう\n手\nず\nに伝\nつた\nえるのは難\nむずか\nしいかもしれないね。\n女\nおんな\nの店\nてん\n員\nいん\nは店\nみせ\nについて何\nなに\nが問\nもん\n題\nだい\nだと言\nい\nっていますか。\n6 番\n女\nおんな\nの学\nがく\n生\nせい\nと男\nおとこ\nの学\nがく\n生\nせい\nが授\nじゅ\n業\nぎょう\nの発\nはっ\n表\nぴょう\nで使\nつか\nう資\nし\n料\nりょう\nについて話\nはな\nしています。二\nふたり\n人はこのあとまず何\nなに\nをしますか。\nＦ ： ねえ、社\nしゃ\n会\nかい\n学\nがく\nの授\nじゅ\n業\nぎょう\nで一\nいっ\n緒\nしょ\nにやる発\nはっ\n表\nぴょう\nのことなんだけど。\nＭ ： うん。準\nじゅん\n備\nび\nも終\nお\nわったし、発\nはっ\n表\nぴょう\nを待\nま\nつだけだね。\nＦ ： 実\nじつ\nはね、昨\nきのう\n日、ゼミの先\nせん\n輩\nぱい\nに私\nわたし\nたちが準\nじゅん\n備\nび\nした、発\nはっ\n表\nぴょう\nで使\nつか\nう資\nし\n料\nりょう\nとか発\nはっ\n表\nぴょう\nの流\nなが\nれを見\nみ\nて\nもらったら、先\nせん\n輩\nぱい\nが問\nもん\n題\nだい\n点\nてん\nをいくつかあげてくれて。直\nなお\nしたほうがいいと思\nおも\nうんだ。\nＭ ： どこ？\nＦ ： うん。まずね、せっかく自\nじ\n分\nぶん\nたちで調\nちょう\n査\nさ\nして、面\nおも\n白\nしろ\nい結\nけっ\n果\nか\nが出\nで\nてるのに、数\nすう\n字\nじ\nが並\nなら\nんでるだ\nけだから、伝\nつた\nわりにくいって。\nＭ ： じゃ、グラフを加\nくわ\nえようか。\nＦ ： そうだね。それからもう一\nいっ\n点\nてん\n、私\nわたし\nたちの主\nしゅ\n張\nちょう\nが発\nはっ\n表\nぴょう\nの最\nさい\n後\nご\nにしかないから、途\nと\n中\nちゅう\nまで何\nなに\nが言\nい\nいたいのか分\nわ\nからないって。ねえ、発\nはっ\n表\nぴょう\nの流\nなが\nれ、変\nか\nえてみない？\nＭ ： うん、やってみよう。流\nなが\nれを変\nか\nえたら、調\nちょう\n査\nさ\n結\nけっ\n果\nか\nの見\nみ\nせ方\nかた\nも変\nか\nわってくるだろうから、グラ\nフのことは後\nあと\nにして、それからやろう。\nＦ ： うん。\n聴解スクリプト\n7\n\nＭ ： 先\nせん\n輩\nぱい\nにお礼\nれい\n言\nい\nっといてね。\n二\nふたり\n人はこのあとまず何\nなに\nをしますか。\n問題3\n例\n女\nおんな\nの人\nひと\nが友\nとも\n達\nだち\nのうちに来\nき\nて、話\nはな\nしています。\nＦ１ ： 田\nた\n中\nなか\nです。\nＦ２ ： あ、はあい。昨\nきのう\n日友\nとも\n達\nだち\nが泊\nと\nまりに来\nき\nてたんで、片\nかた\n付\nづ\nいてないけど、入\nはい\nって。\nＦ１ ： あ、でもここで。すぐ帰\nかえ\nるから。あのう、この前\nまえ\n借\nか\nりた本\nほん\nなんだけど、ちょっと破\nやぶ\nれちゃって。\nＦ２ ： え、本\nほん\n当\nとう\n？\nＦ１ ： うん、このページなんだけど。\nＦ２ ： あっ、うん、このくらいなら大\nだい\n丈\nじょう\n夫\nぶ\n。読\nよ\nめるし。\nＦ１ ： ほんと？　ごめん。これからは気\nき\nをつけるから。\nＦ２ ： うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１ ： ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nのうちへ何\nなに\nをしに来\nき\nましたか。\n１． 謝\nあやま\nりに来\nき\nた\n２． 本\nほん\nを借\nか\nりに来\nき\nた\n３． 泊\nと\nまりに来\nき\nた\n４． コーヒーを飲\nの\nみに来\nき\nた\n聴解スクリプト\n8\n\n1 番\nテレビでアナウンサーが話\nはな\nしています。\nＦ ： 皆\nみな\nさん、突\nとつ\n然\nぜん\nですが、私\nわたし\n、左\nひだり\n利\nき\nきなんです。マイクを持\nも\nつのも左\nひだり\n手\nて\n、はしを持\nも\nつのも左\nひだり\n手\nて\nです。今\nいま\n来\nき\nているこちらのお店\nみせ\n、文\nぶん\n房\nぼう\n具\nぐ\nなど、ちょっと見\nみ\nたところよくある普\nふ\n通\nつう\nのものが\n売\nう\nられていますが、大\nたい\n変\nへん\n人\nにん\n気\nき\nがあって、全\nぜん\n国\nこく\nからお客\nきゃく\nさんが集\nあつ\nまってくるそうです。すべ\nての商\nしょう\n品\nひん\nが左\nひだり\n利\nき\nきの人\nひと\nのためのものなんです。普\nふ\n段\nだん\nはあまり意\nい\n識\nしき\nしないかもしれませんが、\n普\nふ\n通\nつう\nのはさみ、包\nほう\n丁\nちょう\nなどは右\nみぎ\n手\nて\nで使\nつか\nうように作\nつく\nられています。こちらのお店\nみせ\nには、日\nにち\n常\nじょう\n使\nつか\nうものからパソコンのキーボードなどの電\nでん\n気\nき\n製\nせい\n品\nひん\n、ギターなどの楽\nがっ\n器\nき\nまであるんですよ。す\nごいですね。\nアナウンサーは主\nおも\nに何\nなに\nについて話\nはな\nしていますか。\n１． 左\nひだり\n利\nき\nき用\nよう\nの道\nどう\n具\nぐ\nの特\nとく\n徴\nちょう\n２． 左\nひだり\n利\nき\nきの人\nひと\nの苦\nく\n労\nろう\n３． この店\nみせ\nで扱\nあつか\nっている商\nしょう\n品\nひん\n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、指\nし\n導\nどう\n者\nしゃ\nになることも考\nかんが\nえました。でも、目\nもく\n標\nひょう\nを持\nも\nって頑\nがん\n張\nば\nる若\nわか\nい選\nせん\n手\nしゅ\nたちの試\nし\n合\nあい\nを\n見\nみ\nて、まだあきらめられない気\nき\n持\nも\nちが出\nで\nてきました。自\nじ\n分\nぶん\nもその場\nば\n所\nしょ\nに立\nた\nちたいと思\nおも\nい、選\nせん\n手\nしゅ\nを育\nそだ\nてるのはもう少\nすこ\nし先\nさき\nでもいいと思\nおも\nったんです。休\nやす\nんでいる間\nあいだ\nも応\nおう\n援\nえん\nしてくださった方\nかた\nたちのためにも、新\nあたら\nしい気\nき\n持\nも\nちでやっていきたいと思\nおも\nいます。\nこのスポーツ選\nせん\n手\nしゅ\nが伝\nつた\nえたいことは何\nなん\nですか。\n１． 選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむということ\n２． 選\nせん\n手\nしゅ\nをやめるということ\n３． 指\nし\n導\nどう\n者\nしゃ\nになるということ\n４． もう一\nいち\n度\nど\n選\nせん\n手\nしゅ\nとして活\nかつ\n動\nどう\nするということ\n聴解スクリプト\n9\n\n3 番\nテレビで博\nはく\n物 ひと\nのためのものなんです。普\nふ\n段\nだん\nはあまり意\nい\n識\nしき\nしないかもしれませんが、\n普\nふ\n通\nつう\nのはさみ、包\nほう\n丁\nちょう\nなどは右\nみぎ\n手\nて\nで使\nつか\nうように作\nつく\nられています。こちらのお店\nみせ\nには、日\nにち\n常\nじょう\n使\nつか\nうものからパソコンのキーボードなどの電\nでん\n気\nき\n製\nせい\n品\nひん\n、ギターなどの楽\nがっ\n器\nき\nまであるんですよ。す\nごいですね。\nアナウンサーは主\nおも\nに何\nなに\nについて話\nはな\nしていますか。\n１． 左\nひだり\n利\nき\nき用\nよう\nの道\nどう\n具\nぐ\nの特\nとく\n徴\nちょう\n２． 左\nひだり\n利\nき\nきの人\nひと\nの苦\nく\n労\nろう\n３． この店\nみせ\nで扱\nあつか\nっている商\nしょう\n品\nひん\n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、指\nし\n導\nどう\n者\nしゃ\nになることも考\nかんが\nえました。でも、目\nもく\n標\nひょう\nを持\nも\nって頑\nがん\n張\nば\nる若\nわか\nい選\nせん\n手\nしゅ\nたちの試\nし\n合\nあい\nを\n見\nみ\nて、まだあきらめられない気\nき\n持\nも\nちが出\nで\nてきました。自\nじ\n分\nぶん\nもその場\nば\n所\nしょ\nに立\nた\nちたいと思\nおも\nい、選\nせん\n手\nしゅ\nを育\nそだ\nてるのはもう少\nすこ\nし先\nさき\nでもいいと思\nおも\nったんです。休\nやす\nんでいる間\nあいだ\nも応\nおう\n援\nえん\nしてくださった方\nかた\nたちのためにも、新\nあたら\nしい気\nき\n持\nも\nちでやっていきたいと思\nおも\nいます。\nこのスポーツ選\nせん\n手\nしゅ\nが伝\nつた\nえたいことは何\nなん\nですか。\n１． 選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむということ\n２． 選\nせん\n手\nしゅ\nをやめるということ\n３． 指\nし\n導\nどう\n者\nしゃ\nになるということ\n４． もう一\nいち\n度\nど\n選\nせん\n手\nしゅ\nとして活\nかつ\n動\nどう\nするということ\n聴解スクリプト\n9\n\n3 番\nテレビで博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nが話\nはな\nしています。\nＭ ： 子\nこ\n供\nども\nに科\nか\n学\nがく\nを好\nす\nきになってもらいたいご両\nりょう\n親\nしん\n、多\nおお\nいと思\nおも\nいます。でも、子\nこ\n供\nども\nに正\nただ\nしく分\nわ\nかっ\nてもらおうと、つい大\nおとな\n人に説\nせつ\n明\nめい\nするときのように数\nすう\n学\nがく\n的\nてき\nな話\nはなし\nや専\nせん\n門\nもん\n的\nてき\nな話\nはなし\nをしていません\nか。子\nこ\n供\nども\nには難\nむずか\nしい話\nはなし\nをしてもしかたありません。言\nこと\n葉\nば\nで詳\nくわ\nしく説\nせつ\n明\nめい\nするよりも実\nじっ\n際\nさい\nに経\nけい\n験\nけん\nさせることが大\nたい\n切\nせつ\nなんです。例\nたと\nえば、月\nつき\nでの重\nおも\nさの感\nかん\nじ方\nかた\nを教\nおし\nえるときだったら、地\nち\n球\nきゅう\nで\n1 キログラムのものが月\nつき\nではどのくらいの重\nおも\nさに感\nかん\nじるか、持\nも\nった感\nかん\n覚\nかく\nで分\nわ\nかるようにする\nといいですよ。\n博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nは何\nなに\nについて話\nはな\nしていますか。\n１． 子\nこ\n供\nども\nが科\nか\n学\nがく\nを好\nす\nきな理\nり\n由\nゆう\n２． 子\nこ\n供\nども\nへの科\nか\n学\nがく\nの教\nおし\nえ方\nかた\n３． 子\nこ\n供\nども\nに科\nか\n学\nがく\nを学\nまな\nばせる理\nり\n由\nゆう\n４． 子\nこ\n供\nども\nにとって必\nひつ\n要\nよう\nな科\nか\n学\nがく\nの知\nち\n識\nしき\n問題4\n例\nホテルのテレビが壊\nこわ\nれています。何\nなん\nと言\nい\nいますか。\nＦ ： １．テレビがつかないんですが。\n \n ２．テレビをつけてもいいですか。\n \n ３．テレビをつけたほうがいいですよ。\n1 番\n約\nやく\n束\nそく\nの時\nじ\n間\nかん\nに少\nすこ\nし遅\nおく\nれました。友\nとも\n達\nだち\nに何\nなん\nと言\nい\nいますか。  \nＦ ： １．待\nま\nたせてごめん。\n \n ２．急\nいそ\nがせちゃってごめん。\n \n ３．ごめん、お先\nさき\nに。\n聴解スクリプト\n10\n\n2 番\n観\nかん\n光\nこう\nの案\nあん\n内\nない\nをしています。建\nたて\n物\nもの\nを見\nみ\nてもらいたいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．こちらでお目\nめ\nにかかります。\n \n ２．こちらをご覧\nらん\nください。\n \n ３．お見\nみ\nせくださいますか。\n3 番\n荷\nに\n物\nもつ\nを受\nう\nけ取\nと\nります。サインするところが分\nわ\nかりません。何\nなん\nと言\nい\nいますか。\nＭ ： １．どこにサインが書\nか\nいてありますか。\n \n ２．どこでサインを渡\nわた\nしましょうか。\n \n ３．どこにサインをすればいいですか。\n4 番\n今\nきょう\n日はあまりおなかがすいていません。ご飯\nはん\nを普\nふ\n通\nつう\nより少\nすく\nなくしてほしいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．ご飯\nはん\n、少\nすく\nなすぎるんですけど。\n \n ２．ご飯\nはん\n、あと少\nすこ\nしほしいです。\n \n ３．ご飯\nはん\n、少\nすく\nな目\nめ\nでお願\nねが\nいします。\n問題5\n例\nＭ ： すみません、今\nいま\n、時\nじ\n間\nかん\n、ありますか。\nＦ ： １．ええと、１０時\nじ\n２０分\nぷん\nです。\n \n ２．ええ。何\nなん\nですか。\n \n ３．時\nと\n計\nけい\nはあそこですよ。\n聴解スクリプト\n11\n\n1 番\nＭ ： 山\nやま\n田\nだ\nさん、作\nつく\nり直\nなお\nしてくれた資\nし\n料\nりょう\n、見\nみ\nやすくなってましたよ。  \nＦ ： １．ありがとうございます。よかったです。\n \n ２．分\nわ\nかりました。すぐに直\nなお\nします。\n \n ３．もっと簡\nかん\n単\nたん\nにするんですか。\n2 番\nＦ ： ねえ、ちょっと木\nき\n村\nむら\nさんに用\nよう\nがあるんだけど、見\nみ\nなかった？\nＭ ： １．じゃ、一\nいっ\n緒\nしょ\nに見\nみ\nよう。\n \n ２．特\nとく\nに用\nよう\nはないんだけど。\n \n ３．さあ。ほかの人\nひと\nに聞\nき\nいてみて。\n3 番\nＭ ： 昨\nきのう\n日貸\nか\nしてくれた本\nほん\n、読\nよ\nみ出\nだ\nしたら止\nと\nまらなくなっちゃったよ。\nＦ ： １．じゃ、全\nぜん\n部\nぶ\n読\nよ\nまなくてもいいよ。\n \n ２．けっこうおもしろかったでしょう。\n \n ３．本\nほん\n、なくなっちゃったの？\n4 番\nＦ ： どうぞお入\nはい\nりください。すぐお茶\nちゃ\n入\nい\nれますから。  \nＭ ： １．おかまいなく。\n \n ２．ごちそうさまでした。\n \n ３．どういたしまして。\n5 番\nＭ：　リーさん、あのう、リーさんの研\nけん\n究\nきゅう\nでお聞\nき\nきしたいことがあるんですが。  \nＦ ： １．あ、はい、どんなことでしょうか。\n \n ２．ああ、聞\nき\nいたことがあります。\n \n ３．いえ、質\nしつ\n問\nもん\nはありませんが。\n聴解スクリプト\n12\n\n6 番\nＭ ： 友\nとも\n達\nだち\nに赤\nあか\nちゃんが生\nう\nまれたんだけど、どんなものをあげたらいいと思\nおも\nう？  \nＦ ： １．うん、それがいいと思\nおも\nうよ。\n \n ２．プレゼントをあげたらどう？  \n \n ３．何\nなん\nでも喜\nよろこ\nんでくれる nい\nいたいのか分\nわ\nからないって。ねえ、発\nはっ\n表\nぴょう\nの流\nなが\nれ、変\nか\nえてみない？\nＭ ： うん、やってみよう。流\nなが\nれを変\nか\nえたら、調\nちょう\n査\nさ\n結\nけっ\n果\nか\nの見\nみ\nせ方\nかた\nも変\nか\nわってくるだろうから、グラ\nフのことは後\nあと\nにして、それからやろう。\nＦ ： うん。\n聴解スクリプト\n7\n\nＭ ： 先\nせん\n輩\nぱい\nにお礼\nれい\n言\nい\nっといてね。\n二\nふたり\n人はこのあとまず何\nなに\nをしますか。\n問題3\n例\n女\nおんな\nの人\nひと\nが友\nとも\n達\nだち\nのうちに来\nき\nて、話\nはな\nしています。\nＦ１ ： 田\nた\n中\nなか\nです。\nＦ２ ： あ、はあい。昨\nきのう\n日友\nとも\n達\nだち\nが泊\nと\nまりに来\nき\nてたんで、片\nかた\n付\nづ\nいてないけど、入\nはい\nって。\nＦ１ ： あ、でもここで。すぐ帰\nかえ\nるから。あのう、この前\nまえ\n借\nか\nりた本\nほん\nなんだけど、ちょっと破\nやぶ\nれちゃって。\nＦ２ ： え、本\nほん\n当\nとう\n？\nＦ１ ： うん、このページなんだけど。\nＦ２ ： あっ、うん、このくらいなら大\nだい\n丈\nじょう\n夫\nぶ\n。読\nよ\nめるし。\nＦ１ ： ほんと？　ごめん。これからは気\nき\nをつけるから。\nＦ２ ： うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１ ： ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nのうちへ何\nなに\nをしに来\nき\nましたか。\n１． 謝\nあやま\nりに来\nき\nた\n２． 本\nほん\nを借\nか\nりに来\nき\nた\n３． 泊\nと\nまりに来\nき\nた\n４． コーヒーを飲\nの\nみに来\nき\nた\n聴解スクリプト\n8\n\n1 番\nテレビでアナウンサーが話\nはな\nしています。\nＦ ： 皆\nみな\nさん、突\nとつ\n然\nぜん\nですが、私\nわたし\n、左\nひだり\n利\nき\nきなんです。マイクを持\nも\nつのも左\nひだり\n手\nて\n、はしを持\nも\nつのも左\nひだり\n手\nて\nです。今\nいま\n来\nき\nているこちらのお店\nみせ\n、文\nぶん\n房\nぼう\n具\nぐ\nなど、ちょっと見\nみ\nたところよくある普\nふ\n通\nつう\nのものが\n売\nう\nられていますが、大\nたい\n変\nへん\n人\nにん\n気\nき\nがあって、全\nぜん\n国\nこく\nからお客\nきゃく\nさんが集\nあつ\nまってくるそうです。すべ\nての商\nしょう\n品\nひん\nが左\nひだり\n利\nき\nきの人\nひと\nのためのものなんです。普\nふ\n段\nだん\nはあまり意\nい\n識\nしき\nしないかもしれませんが、\n普\nふ\n通\nつう\nのはさみ、包\nほう\n丁\nちょう\nなどは右\nみぎ\n手\nて\nで使\nつか\nうように作\nつく\nられています。こちらのお店\nみせ\nには、日\nにち\n常\nじょう\n使\nつか\nうものからパソコンのキーボードなどの電\nでん\n気\nき\n製\nせい\n品\nひん\n、ギターなどの楽\nがっ\n器\nき\nまであるんですよ。す\nごいですね。\nアナウンサーは主\nおも\nに何\nなに\nについて話\nはな\nしていますか。\n１． 左\nひだり\n利\nき\nき用\nよう\nの道\nどう\n具\nぐ\nの特\nとく\n徴\nちょう\n２． 左\nひだり\n利\nき\nきの人\nひと\nの苦\nく\n労\nろう\n３． この店\nみせ\nで扱\nあつか\nっている商\nしょう\n品\nひん\n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、指\nし\n導\nどう\n者\nしゃ\nになることも考\nかんが\nえました。でも、目\nもく\n標\nひょう\nを持\nも\nって頑\nがん\n張\nば\nる若\nわか\nい選\nせん\n手\nしゅ\nたちの試\nし\n合\nあい\nを\n見\nみ\nて、まだあきらめられない気\nき\n持\nも\nちが出\nで\nてきました。自\nじ\n分\nぶん\nもその場\nば\n所\nしょ\nに立\nた\nちたいと思\nおも\nい、選\nせん\n手\nしゅ\nを育\nそだ\nてるのはもう少\nすこ\nし先\nさき\nでもいいと思\nおも\nったんです。休\nやす\nんでいる間\nあいだ\nも応\nおう\n援\nえん\nしてくださった方\nかた\nたちのためにも、新\nあたら\nしい気\nき\n持\nも\nちでやっていきたいと思\nおも\nいます。\nこのスポーツ選\nせん\n手\nしゅ\nが伝\nつた\nえたいことは何\nなん\nですか。\n１． 選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむということ\n２． 選\nせん\n手\nしゅ\nをやめるということ\n３． 指\nし\n導\nどう\n者\nしゃ\nになるということ\n４． もう一\nいち\n度\nど\n選\nせん\n手\nしゅ\nとして活\nかつ\n動\nどう\nするということ\n聴解スクリプト\n9\n\n3 番\nテレビで博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nが話\nはな\nしています。\nＭ ： 子\nこ\n供\nども\nに科\nか\n学\nがく\nを好\nす\nきになってもらいたいご両\nりょう\n親\nしん\n、多\nおお\nいと思\nおも\nいます。でも、子\nこ\n供\nども\nに正\nただ\nしく分\nわ\nかっ\nてもらおうと、つい大\nおとな\n人に説\nせつ\n明\nめい\nするときのように数\nすう\n学\nがく\n的\nてき\nな話\nはなし\nや専\nせん\n門\nもん\n的\nてき\nな話\nはなし\nをしていません\nか。子\nこ\n供\nども\nには難\nむずか\nしい話\nはなし\nをしてもしかたありません。言\nこと\n葉\nば\nで詳\nくわ\nしく説\nせつ\n明\nめい\nするよりも実\nじっ\n際\nさい\nに経\nけい\n験\nけん\nさせることが大\nたい\n切\nせつ\nなんです。例\nたと\nえば、月\nつき\nでの重\nおも\nさの感\nかん\nじ方\nかた\nを教\nおし\nえるときだったら、地\nち\n球\nきゅう\nで\n1 キログラムのものが月\nつき\nではどのくらいの重\nおも\nさに感\nかん\nじるか、持\nも\nった感\nかん\n覚\nかく\nで分\nわ\nかるようにする\nといいですよ。\n博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nは何\nなに\nについて話\nはな\nしていますか。\n１． 子\nこ\n供\nども\nが科\nか\n学\nがく\nを好\nす\nきな理\nり\n由\nゆう\n２． 子\nこ\n供\nども\nへの科\nか\n学\nがく\nの教\nおし\nえ方\nかた\n３． 子\nこ\n供\nども\nに科\nか\n学\nがく\nを学\nまな\nばせる理\nり\n由\nゆう\n４． 子\nこ\n供\nども\nにとって必\nひつ\n要\nよう\nな科\nか\n学\nがく\nの知\nち\n識\nしき\n問題4\n例\nホテルのテレビが壊\nこわ\nれています。何\nなん\nと言\nい\nいますか。\nＦ ： １．テレビがつかないんですが。\n \n ２．テレビをつけてもいいですか。\n \n ３．テレビをつけたほうがいいですよ。\n1 番\n約\nやく\n束\nそく\nの時\nじ\n間\nかん\nに少\nすこ\nし遅\nおく\nれました。友\nとも\n達\nだち\nに何\nなん\nと言\nい\nいますか。  \nＦ ： １．待\nま\nたせてごめん。\n \n ２．急\nいそ\nがせちゃってごめん。\n \n ３．ごめん、お先\nさき\nに。\n聴解スクリプト\n10\n\n2 番\n観\nかん\n光\nこう\nの案\nあん\n内\nない\nをしています。建\nたて\n物\nもの\nを見\nみ\nてもらいたいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．こちらでお目\nめ\nにかかります。\n \n ２．こちらをご覧\nらん\nください。\n \n ３．お見\nみ\nせくださいますか。\n3 番\n荷\nに\n物\nもつ\nを受\nう\nけ取\nと\nります。サインするところが分\nわ\nかりません。何\nなん\nと言\nい\nいますか。\nＭ ： １．どこにサインが書\nか\nいてありますか。\n \n ２．どこでサインを渡\nわた\nしましょうか。\n \n ３．どこにサインをすればいいですか。 でいるのに、ずっとお帰\nかえ\nりにならない方\nかた\nがけっこういらっしゃる\nのが気\nき\nになります。アルバイトの森\nもり\nさんが言\nい\nってたんですけど、せっかく来\nき\nてくださったお\n客\nきゃく\n様\nさま\nが席\nせき\nがなくて入\nはい\nれないっていうことが何\nなん\n回\nかい\nかあったそうです。\nＭ ： そういうときは、お客\nきゃく\n様\nさま\nの気\nき\n分\nぶん\nを悪\nわる\nくさせずに席\nせき\nを空\nあ\nけていただくように頼\nたの\nまなきゃいけな\nいんだけど。うちの店\nみせ\nは若\nわか\nい店\nてん\n員\nいん\nが多\nおお\nいから、上\nじょう\n手\nず\nに伝\nつた\nえるのは難\nむずか\nしいかもしれないね。\n女\nおんな\nの店\nてん\n員\nいん\nは店\nみせ\nについて何\nなに\nが問\nもん\n題\nだい\nだと言\nい\nっていますか。\n6 番\n女\nおんな\nの学\nがく\n生\nせい\nと男\nおとこ\nの学\nがく\n生\nせい\nが授\nじゅ\n業\nぎょう\nの発\nはっ\n表\nぴょう\nで使\nつか\nう資\nし\n料\nりょう\nについて話\nはな\nしています。二\nふたり\n人はこのあとまず何\nなに\nをしますか。\nＦ ： ねえ、社\nしゃ\n会\nかい\n学\nがく\nの授\nじゅ\n業\nぎょう\nで一\nいっ\n緒\nしょ\nにやる発\nはっ\n表\nぴょう\nのことなんだけど。\nＭ ： うん。準\nじゅん\n備\nび\nも終\nお\nわったし、発\nはっ\n表\nぴょう\nを待\nま\nつだけだね。\nＦ ： 実\nじつ\nはね、昨\nきのう\n日、ゼミの先\nせん\n輩\nぱい\nに私\nわたし\nたちが準\nじゅん\n備\nび\nした、発\nはっ\n表\nぴょう\nで使\nつか\nう資\nし\n料\nりょう\nとか発\nはっ\n表\nぴょう\nの流\nなが\nれを見\nみ\nて\nもらったら、先\nせん\n輩\nぱい\nが問\nもん\n題\nだい\n点\nてん\nをいくつかあげてくれて。直\nなお\nしたほうがいいと思\nおも\nうんだ。\nＭ ： どこ？\nＦ ： うん。まずね、せっかく自\nじ\n分\nぶん\nたちで調\nちょう\n査\nさ\nして、面\nおも\n白\nしろ\nい結\nけっ\n果\nか\nが出\nで\nてるのに、数\nすう\n字\nじ\nが並\nなら\nんでるだ\nけだから、伝\nつた\nわりにくいって。\nＭ ： じゃ、グラフを加\nくわ\nえようか。\nＦ ： そうだね。それからもう一\nいっ\n点\nてん\n、私\nわたし\nたちの主\nしゅ\n張\nちょう\nが発\nはっ\n表\nぴょう\nの最\nさい\n後\nご\nにしかないから、途\nと\n中\nちゅう\nまで何\nなに\nが言\nい\nいたいのか分\nわ\nからないって。ねえ、発\nはっ\n表\nぴょう\nの流\nなが\nれ、変\nか\nえてみない？\nＭ ： うん、やってみよう。流\nなが\nれを変\nか\nえたら、調\nちょう\n査\nさ\n結\nけっ\n果\nか\nの見\nみ\nせ方\nかた\nも変\nか\nわってくるだろうから、グラ\nフのことは後\nあと\nにして、それからやろう。\nＦ ： うん。\n聴解スクリプト\n7\n\nＭ ： 先\nせん\n輩\nぱい\nにお礼\nれい\n言\nい\nっといてね。\n二\nふたり\n人はこのあとまず何\nなに\nをしますか。\n問題3\n例\n女\nおんな\nの人\nひと\nが友\nとも\n達\nだち\nのうちに来\nき\nて、話\nはな\nしています。\nＦ１ ： 田\nた\n中\nなか\nです。\nＦ２ ： あ、はあい。昨\nきのう\n日友\nとも\n達\nだち\nが泊\nと\nまりに来\nき\nてたんで、片\nかた\n付\nづ\nいてないけど、入\nはい\nって。\nＦ１ ： あ、でもここで。すぐ帰\nかえ\nるから。あのう、この前\nまえ\n借\nか\nりた本\nほん\nなんだけど、ちょっと破\nやぶ\nれちゃって。\nＦ２ ： え、本\nほん\n当\nとう\n？\nＦ１ ： うん、このページなんだけど。\nＦ２ ： あっ、うん、このくらいなら大\nだい\n丈\nじょう\n夫\nぶ\n。読\nよ\nめるし。\nＦ１ ： ほんと？　ごめん。これからは気\nき\nをつけるから。\nＦ２ ： うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１ ： ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nのうちへ何\nなに\nをしに来\nき\nましたか。\n１． 謝\nあやま\nりに来\nき\nた\n２． 本\nほん\nを借\nか\nりに来\nき\nた\n３． 泊\nと\nまりに来\nき\nた\n４． コーヒーを飲\nの\nみに来\nき\nた\n聴解スクリプト\n8\n\n1 番\nテレビでアナウンサーが話\nはな\nしています。\nＦ ： 皆\nみな\nさん、突\nとつ\n然\nぜん\nですが、私\nわたし\n、左\nひだり\n利\nき\nきなんです。マイクを持\nも\nつのも左\nひだり\n手\nて\n、はしを持\nも\nつのも左\nひだり\n手\nて\nです。今\nいま\n来\nき\nているこちらのお店\nみせ\n、文\nぶん\n房\nぼう\n具\nぐ\nなど、ちょっと見\nみ\nたところよくある普\nふ\n通\nつう\nのものが\n売\nう\nられていますが、大\nたい\n変\nへん\n人\nにん\n気\nき\nがあって、全\nぜん\n国\nこく\nからお客\nきゃく\nさんが集\nあつ\nまってくるそうです。すべ\nての商\nしょう\n品\nひん\nが左\nひだり\n利\nき\nきの人\nひと\nのためのものなんです。普\nふ\n段\nだん\nはあまり意\nい\n識\nしき\nしないかもしれませんが、\n普\nふ\n通\nつう\nのはさみ、包\nほう\n丁\nちょう\nなどは右\nみぎ\n手\nて\nで使\nつか\nうように作\nつく\nられています。こちらのお店\nみせ\nには、日\nにち\n常\nじょう\n使\nつか\nうものからパソコンのキーボードなどの電\nでん\n気\nき\n製\nせい\n品\nひん\n、ギターなどの楽\nがっ\n器\nき\nまであるんですよ。す\nごいですね。\nアナウンサーは主\nおも\nに何\nなに\nについて話\nはな\nしていますか。\n１． 左\nひだり\n利\nき\nき用\nよう\nの道\nどう\n具\nぐ\nの特\nとく\n徴\nちょう\n２． 左\nひだり\n利\nき\nきの人\nひと\nの苦\nく\n労\nろう\n３． この店\nみせ\nで扱\nあつか\nっている商\nしょう\n品\nひん\n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、指\nし\n導\nどう\n者\nしゃ\nになることも考\nかんが\nえました。でも、目\nもく\n標\nひょう\nを持\nも\nって頑\nがん\n張\nば\nる若\nわか\nい選\nせん\n手\nしゅ\nたちの試\nし\n合\nあい\nを\n見\nみ\nて、まだあきらめられない気\nき\n持\nも\nちが出\nで\nてきました。自\nじ\n分\nぶん\nもその場\nば\n所\nしょ\nに立\nた\nちたいと思\nおも\nい、選\nせん\n手\nしゅ\nを育\nそだ\nてるのはもう少\nすこ\nし先\nさき\nでもいいと思\nおも\nったんです。休\nやす\nんでいる間\nあいだ\nも応\nおう\n援\nえん\nしてくださった方\nかた\nたちのためにも、新\nあたら\nしい気\nき\n持\nも\nちでやっていきたいと思\nおも\nいます。\nこのスポーツ選\nせん\n手\nしゅ\nが伝\nつた\nえたいことは何\nなん\nですか。\n１． 選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむということ\n２． 選\nせん\n手\nしゅ\nをやめるということ\n３． 指\nし\n導\nどう\n者\nしゃ\nになるということ\n４． もう一\nいち\n度\nど\n選\nせん\n手\nしゅ\nとして活\nかつ\n動\nどう\nするということ\n聴解スクリプト\n9\n\n3 番\nテレビで博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nが話\nはな\nしています。\nＭ ： 子\nこ\n供\nども\nに科\nか\n学\nがく\nを好\nす\nきになってもらいたいご両\nりょう\n親\nしん\n、多\nおお\nいと思\nおも\nいます。でも、子\nこ\n供\nども\nに正\nただ\nしく分\nわ\nかっ\nてもらおうと、つい大\nおとな\n人に説\nせつ\n明\nめい\nするときのように数\nすう\n学\ n品\nひん\n、ギターなどの楽\nがっ\n器\nき\nまであるんですよ。す\nごいですね。\nアナウンサーは主\nおも\nに何\nなに\nについて話\nはな\nしていますか。\n１． 左\nひだり\n利\nき\nき用\nよう\nの道\nどう\n具\nぐ\nの特\nとく\n徴\nちょう\n２． 左\nひだり\n利\nき\nきの人\nひと\nの苦\nく\n労\nろう\n３． この店\nみせ\nで扱\nあつか\nっている商\nしょう\n品\nひん\n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、指\nし\n導\nどう\n者\nしゃ\nになることも考\nかんが\nえました。でも、目\nもく\n標\nひょう\nを持\nも\nって頑\nがん\n張\nば\nる若\nわか\nい選\nせん\n手\nしゅ\nたちの試\nし\n合\nあい\nを\n見\nみ\nて、まだあきらめられない気\nき\n持\nも\nちが出\nで\nてきました。自\nじ\n分\nぶん\nもその場\nば\n所\nしょ\nに立\nた\nちたいと思\nおも\nい、選\nせん\n手\nしゅ\nを育\nそだ\nてるのはもう少\nすこ\nし先\nさき\nでもいいと思\nおも\nったんです。休\nやす\nんでいる間\nあいだ\nも応\nおう\n援\nえん\nしてくださった方\nかた\nたちのためにも、新\nあたら\nしい気\nき\n持\nも\nちでやっていきたいと思\nおも\nいます。\nこのスポーツ選\nせん\n手\nしゅ\nが伝\nつた\nえたいことは何\nなん\nですか。\n１． 選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむということ\n２． 選\nせん\n手\nしゅ\nをやめるということ\n３． 指\nし\n導\nどう\n者\nしゃ\nになるということ\n４． もう一\nいち\n度\nど\n選\nせん\n手\nしゅ\nとして活\nかつ\n動\nどう\nするということ\n聴解スクリプト\n9\n\n3 番\nテレビで博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nが話\nはな\nしています。\nＭ ： 子\nこ\n供\nども\nに科\nか\n学\nがく\nを好\nす\nきになってもらいたいご両\nりょう\n親\nしん\n、多\nおお\nいと思\nおも\nいます。でも、子\nこ\n供\nども\nに正\nただ\nしく分\nわ\nかっ\nてもらおうと、つい大\nおとな\n人に説\nせつ\n明\nめい\nするときのように数\nすう\n学\nがく\n的\nてき\nな話\nはなし\nや専\nせん\n門\nもん\n的\nてき\nな話\nはなし\nをしていません\nか。子\nこ\n供\nども\nには難\nむずか\nしい話\nはなし\nをしてもしかたありません。言\nこと\n葉\nば\nで詳\nくわ\nしく説\nせつ\n明\nめい\nするよりも実\nじっ\n際\nさい\nに経\nけい\n験\nけん\nさせることが大\nたい\n切\nせつ\nなんです。例\nたと\nえば、月\nつき\nでの重\nおも\nさの感\nかん\nじ方\nかた\nを教\nおし\nえるときだったら、地\nち\n球\nきゅう\nで\n1 キログラムのものが月\nつき\nではどのくらいの重\nおも\nさに感\nかん\nじるか、持\nも\nった感\nかん\n覚\nかく\nで分\nわ\nかるようにする\nといいですよ。\n博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nは何\nなに\nについて話\nはな\nしていますか。\n１． 子\nこ\n供\nども\nが科\nか\n学\nがく\nを好\nす\nきな理\nり\n由\nゆう\n２． 子\nこ\n供\nども\nへの科\nか\n学\nがく\nの教\nおし\nえ方\nかた\n３． 子\nこ\n供\nども\nに科\nか\n学\nがく\nを学\nまな\nばせる理\nり\n由\nゆう\n４． 子\nこ\n供\nども\nにとって必\nひつ\n要\nよう\nな科\nか\n学\nがく\nの知\nち\n識\nしき\n問題4\n例\nホテルのテレビが壊\nこわ\nれています。何\nなん\nと言\nい\nいますか。\nＦ ： １．テレビがつかないんですが。\n \n ２．テレビをつけてもいいです \nＭ ： 先\nせん\n輩\nぱい\nにお礼\nれい\n言\nい\nっといてね。\n二\nふたり\n人はこのあとまず何\nなに\nをしますか。\n問題3\n例\n女\nおんな\nの人\nひと\nが友\nとも\n達\nだち\nのうちに来\nき\nて、話\nはな\nしています。\nＦ１ ： 田\nた\n中\nなか\nです。\nＦ２ ： あ、はあい。昨\nきのう\n日友\nとも\n達\nだち\nが泊\nと\nまりに来\nき\nてたんで、片\nかた\n付\nづ\nいてないけど、入\nはい\nって。\nＦ１ ： あ、でもここで。すぐ帰\nかえ\nるから。あのう、この前\nまえ\n借\nか\nりた本\nほん\nなんだけど、ちょっと破\nやぶ\nれちゃって。\nＦ２ ： え、本\nほん\n当\nとう\n？\nＦ１ ： うん、このページなんだけど。\nＦ２ ： あっ、うん、このくらいなら大\nだい\n丈\nじょう\n夫\nぶ\n。読\nよ\nめるし。\nＦ１ ： ほんと？　ごめん。これからは気\nき\nをつけるから。\nＦ２ ： うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１ ： ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nのうちへ何\nなに\nをしに来\nき\nましたか。\n１． 謝\nあやま\nりに来\nき\nた\n２． 本\nほん\nを借\nか\nりに来\nき\nた\n３． 泊\nと\nまりに来\nき\nた\n４． コーヒーを飲\nの\nみに来\nき\nた\n聴解スクリプト\n8\n\n1 番\nテレビでアナウンサーが話\nはな\nしています。\nＦ ： 皆\nみな\nさん、突\nとつ\n然\nぜん\nですが、私\nわたし\n、左\nひだり\n利\nき\nきなんです。マイクを持\nも\nつのも左\nひだり\n手\nて\n、はしを持\nも\nつのも左\nひだり\n手\nて\nです。今\nいま\n来\nき\nているこちらのお店\nみせ\n、文\nぶん\n房\nぼう\n具\nぐ\nなど、ちょっと見\nみ\nたところよくある普\nふ\n通\nつう\nのものが\n売\nう\nられていますが、大\nたい\n変\nへん\n人\nにん\n気\nき\nがあって、全\nぜん\n国\nこく\nからお客\nきゃく\nさんが集\nあつ\nまってくるそうです。すべ\nての商\nしょう\n品\nひん\nが左\nひだり\n利\nき\nきの人\nひと\nのためのものなんです。普\nふ\n段\nだん\nはあまり意\nい\n識\nしき\nしないかもしれませんが、\n普\nふ\n通\nつう\nのはさみ、包\nほう\n丁\nちょう\nなどは右\nみぎ\n手\nて\nで使\nつか\nうように作\nつく\nられています。こちらのお店\nみせ\nには、日\nにち\n常\nじょう\n使\nつか\nうものからパソコンのキーボードなどの電\nでん\n気\nき\n製\nせい\n品\nひん\n、ギターなどの楽\nがっ\n器\nき\nまであるんですよ。す\nごいですね。\nアナウンサーは主\nおも\nに何\nなに\nについて話\nはな\nしていますか。\n１． 左\nひだり\n利\nき\nき用\nよう\nの道\nどう\n具\nぐ\nの特\nとく\n徴\nちょう\n２． 左\nひだり\n利\nき\nきの人\nひと\nの苦\nく\n労\nろう\n３． この店\nみせ\nで扱\nあつか\nっている商\nしょう\n品\nひん\n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、指\nし\n導\nどう\n者\nしゃ\nになることも考\nかんが\nえました。でも、目\nもく\n標\nひょう\nを持\nも\nって頑\nがん\n張\nば\nる若\nわか\nい選\nせん\n手\nしゅ\nたちの試\nし\n合\nあい\nを\n見\nみ\nて、まだあきらめられない気\nき\n持\nも\nちが出\nで\nてきました。自\nじ\n分\nぶん\nもその場\nば\n所\nしょ\nに立\nた\nちたいと思\nおも\nい、選\nせん\n手\nしゅ\nを育\nそだ\nてるのはもう少\nすこ\nし先\nさき\nでもいいと思\nおも\nったんです。休\nやす\nんでいる間\nあいだ\nも応\nおう\n援\nえん\nしてくださった方\nかた\nたちのためにも、新\nあたら\nしい気\nき\n持\nも\nちでやっていきたいと思\nおも\nいます。\nこのスポーツ選\nせん\n手\nしゅ\nが伝\nつた\nえたいことは何\nなん\nですか。\n１． 選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむということ\n２． 選\nせん\n手\nしゅ\nをやめるということ\n３． 指\nし\n導\nどう\n者\nしゃ\nになるということ\n４． もう一\nいち\n度\nど\n選\nせん\n手\nしゅ\nとして活\nかつ\n動\nどう\nするということ\n聴解スクリプト\n9\n\n3 番\nテレビで博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nが話\nはな\nしています。\nＭ ： 子\nこ\n供\nども\nに科\nか\n学\nがく\nを好\nす\nきになってもらいたいご両\nりょう\n親\nしん\n、多\nおお\nいと思\nおも\nいます。でも、子\nこ\n供\nども\nに正\nただ\nしく分\nわ\nかっ\nてもらおうと、つい大\nおとな\n人に説\nせつ\n明\nめい\nするときのように数\nすう\n学\nがく\n的\nてき\nな話\nはなし\nや専\nせん\n門\nもん\n的\nてき\nな話\nはなし\nをしていません\nか。子\nこ\n供\nども\nには難\nむずか\nしい話\nはなし\nをしてもしかたありません。言\nこと\n葉\nば\nで詳\nくわ\nしく説\nせつ\n明\nめい\nするよりも実\nじっ\n際\nさい\nに経\nけい\n験\nけん\nさせることが大\nたい\n切\nせつ\nなんです。例\nたと\nえば、月\nつき\nでの重\nおも\nさの感\nかん\nじ方\nかた\nを教\nおし\nえるときだったら、地\nち\n球\nきゅう\nで\n1 キログラムのものが月\nつき\nではどのくらいの重\nおも\nさに感\nかん\nじるか、持\nも\nった感\nかん\n覚\nかく\nで分\nわ\nかるようにする\nといいですよ。\n博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nは何\nなに\nについて話\nはな\nしていますか。\n１． 子\nこ\n供\nども\nが科\nか\n学\nがく\nを好\nす\nきな理\nり\n由\nゆう\n２． 子\nこ\n供\nども\nへの科\nか\n学\nがく\nの教\nおし\nえ方\nかた\n３． 子\nこ\n供\nども\nに科\nか\n学\nがく\nを学\nまな\nばせる理\nり\n由\nゆう\n４． 子\nこ\n供\nども\nにとって必\nひつ\n要\nよう\nな科\nか\n学\nがく\nの知\nち\n識\nしき\n問題4\n例\nホテルのテレビが壊\nこわ\nれています。何\nなん\nと言\nい\nいますか。\nＦ ： １．テレビがつかないんですが。\n \n ２．テレビをつけてもいいですか。\n \n ３．テレビをつけたほうがいいですよ。\n1 番\n約\nやく\n束\nそく\nの時\nじ\n間\nかん\nに少\nすこ\nし遅\nおく\nれました。友\nとも\n達\nだち\nに何\nなん\nと言\nい\nいますか。  \nＦ ： １．待\nま\nたせてごめん。\n \n ２．急\nいそ\nがせちゃってごめん。\n \n ３．ごめん、お先\nさき\nに。\n聴解スクリプト\n10\n\n2 番\n観\nかん\n光\nこう\nの案\nあん\n内\nない\nをしています。建\nたて\n物\nもの\nを見\nみ\nてもらいたいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．こちらでお目\nめ\nにかかります。\n \n ２．こちらをご覧\nらん\nください。\n \n ３．お見\nみ\nせくださいますか。\n3 番\n荷\nに\n物\nもつ\nを受\nう\nけ取\nと\nります。サインするところが分\nわ\nかりません。何\nなん\nと言\nい\nいますか。\nＭ ： １．どこにサインが書\nか\nいてありますか。\n \n ２．どこでサインを渡\nわた\nしましょうか。\n \n ３．どこにサインをすればいいですか。\n4 番\n今\nきょう\n日はあまりおなかがすいていません。ご飯\nはん\nを普\nふ\n通\nつう\nより少\nすく\nなくしてほしいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．ご飯\nはん\n、少\nすく\nなすぎるんですけど。\n \n ２．ご飯\nはん\n、あと少\nすこ\nしほしいです。\n \n ３．ご飯\nはん\n、少\nすく\nな目\nめ\nでお願\nねが\nいします。\n問題 nき\n分\nぶん\nを悪\nわる\nくさせずに席\nせき\nを空\nあ\nけていただくように頼\nたの\nまなきゃいけな\nいんだけど。うちの店\nみせ\nは若\nわか\nい店\nてん\n員\nいん\nが多\nおお\nいから、上\nじょう\n手\nず\nに伝\nつた\nえるのは難\nむずか\nしいかもしれないね。\n女\nおんな\nの店\nてん\n員\nいん\nは店\nみせ\nについて何\nなに\nが問\nもん\n題\nだい\nだと言\nい\nっていますか。\n6 番\n女\nおんな\nの学\nがく\n生\nせい\nと男\nおとこ\nの学\nがく\n生\nせい\nが授\nじゅ\n業\nぎょう\nの発\nはっ\n表\nぴょう\nで使\nつか\nう資\nし\n料\nりょう\nについて話\nはな\nしています。二\nふたり\n人はこのあとまず何\nなに\nをしますか。\nＦ ： ねえ、社\nしゃ\n会\nかい\n学\nがく\nの授\nじゅ\n業\nぎょう\nで一\nいっ\n緒\nしょ\nにやる発\nはっ\n表\nぴょう\nのことなんだけど。\nＭ ： うん。準\nじゅん\n備\nび\nも終\nお\nわったし、発\nはっ\n表\nぴょう\nを待\nま\nつだけだね。\nＦ ： 実\nじつ\nはね、昨\nきのう\n日、ゼミの先\nせん\n輩\nぱい\nに私\nわたし\nたちが準\nじゅん\n備\nび\nした、発\nはっ\n表\nぴょう\nで使\nつか\nう資\nし\n料\nりょう\nとか発\nはっ\n表\nぴょう\nの流\nなが\nれを見\nみ\nて\nもらったら、先\nせん\n輩\nぱい\nが問\nもん\n題\nだい\n点\nてん\nをいくつかあげてくれて。直\nなお\nしたほうがいいと思\nおも\nうんだ。\nＭ ： どこ？\nＦ ： うん。まずね、せっかく自\nじ\n分\nぶん\nたちで調\nちょう\n査\nさ\nして、面\nおも\n白\nしろ\nい結\nけっ\n果\nか\nが出\nで\nてるのに、数\nすう\n字\nじ\nが並\nなら\nんでるだ\nけだから、伝\nつた\nわりにくいって。\nＭ ： じゃ、グラフを加\nくわ\nえようか。\nＦ ： そうだね。それからもう一\nいっ\n点\nてん\n、私\nわたし\nたちの主\nしゅ\n張\nちょう\nが発\nはっ\n表\nぴょう\nの最\nさい\n後\nご\nにしかないから、途\nと\n中\nちゅう\nまで何\nなに\nが言\nい\nいたいのか分\nわ\nからないって。ねえ、発\nはっ\n表\nぴょう\nの流\nなが\nれ、変\nか\nえてみない？\nＭ ： うん、やってみよう。流\nなが\nれを変\nか\nえたら、調\nちょう\n査\nさ\n結\nけっ\n果\nか\nの見\nみ\nせ方\nかた\nも変\nか\nわってくるだろうから、グラ\nフのことは後\nあと\nにして、それからやろう。\nＦ ： うん。\n聴解スクリプト\n7\n\nＭ ： 先\nせん\n輩\nぱい\nにお礼\nれい\n言\nい\nっといてね。\n二\nふたり\n人はこのあとまず何\nなに\nをしますか。\n問題3\n例\n女\nおんな\nの人\nひと\nが友\nとも\n達\nだち\nのうちに来\nき\nて、話\nはな\nしています。\nＦ１ ： 田\nた\n中\nなか\nです。\nＦ２ ： あ、はあい。昨\nきのう\n日友\nとも\n達\nだち\nが泊\nと\nまりに来\nき\nてたんで、片\nかた\n付\nづ\nいてないけど、入\nはい\nって。\nＦ１ ： あ、でもここで。すぐ帰\nかえ\nるから。あのう、この前\nまえ\n借\nか\nりた本\nほん\nなんだけど、ちょっと破\nやぶ\nれちゃって。\nＦ２ ： え、本\nほん\n当\nとう\n？\nＦ１ ： うん、このページなんだけど。\nＦ２ ： あっ、うん、このくらいなら大\nだい\n丈\nじょう\n夫\nぶ\n。読\nよ\nめるし。\nＦ１ ： ほんと？　ごめん。これからは気\nき\nをつけるから。\nＦ２ ： うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１ ： ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nのうちへ何\nなに\nをしに来\nき\nましたか。\n１． 謝\nあやま\nりに来\nき\nた\n２． 本\nほん\nを借\nか\nりに来\nき\nた\n３． 泊\nと\nまりに来\nき\nた\n４． コーヒーを飲\nの\nみに来\nき\nた\n聴解スクリプト\n8\n\n1 番\nテレビでアナウンサーが話\nはな\nしています。\nＦ ： 皆\nみな\nさん、突\nとつ\n然\nぜん\nですが、私\nわたし\n、左\nひだり\n利\nき\nきなんです。マイクを持\nも\nつのも左\nひだり\n手\nて\n、はしを持\nも\nつのも左\nひだり\n手\nて\nです。今\nいま\n来\nき\nているこちらのお店\nみせ\n、文\nぶん\n房\nぼう\n具\nぐ\nなど、ちょっと見\nみ\nたところよくある普\nふ\n通\nつう\nのものが\n売\nう\nられていますが、大\nたい\n変\nへん\n人\nにん\n気\nき\nがあって、全\nぜん\n国\nこく\nからお客\nきゃく\nさんが集\nあつ\nまってくるそうです。すべ\nての商\nしょう\n品\nひん\nが左\nひだり\n利\nき\nきの人\nひと\nのためのものなんです。普\nふ\n段\nだん\nはあまり意\nい\n識\nしき\nしないかもしれませんが、\n普\nふ\n通\nつう\nのはさみ、包\nほう\n丁\nちょう\nなどは右\nみぎ\n手\nて\nで使\nつか\nうように作\nつく\nられています。こちらのお店\nみせ\nには、日\nにち\n常\nじょう\n使\nつか\nうものからパソコンのキーボードなどの電\nでん\n気\nき\n製\nせい\n品\nひん\n、ギターなどの楽\nがっ\n器\nき\nまであるんですよ。す\nごいですね。\nアナウンサーは主\nおも\nに何\nなに\nについて話\nはな\nしていますか。\n１． 左\nひだり\n利\nき\nき用\nよう\nの道\nどう\n具\nぐ\nの特\nとく\n徴\nちょう\n２． 左\nひだり\n利\nき\nきの人\nひと\nの苦\nく\n労\nろう\n３． この店\nみせ\nで扱\nあつか\nっている商\nしょう\n品\nひん\n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、指\nし\n導\nどう\n者\nしゃ\nになることも考\nかんが\nえました。でも、目\nもく\n標\nひょう\nを持\nも\nって頑\nがん\n張\nば\nる若\nわか\nい選\nせん\n手\nしゅ\nたちの試\nし\n合\nあい\nを\n見\nみ\nて、まだあきらめられない気\nき\n持\nも\nちが出\nで\nてきました。自\nじ\n分\nぶん\nもその場\nば\n所\nしょ\nに立\nた\nちたいと思\nおも\nい、選\nせん\n手\nしゅ\nを育\nそだ\nてるのはもう少\nすこ\nし先\nさき\nでもいいと思\nおも\nったんです。休\nやす\nんでいる間\nあいだ\nも応\nおう\n援\nえん\nしてくださった方\nかた\nたちのためにも、新\nあたら\nしい気\nき\n持\nも\nちでやっていきたいと思\nおも\nいます。\nこのスポーツ選\nせん\n手\nしゅ\nが伝\nつた\nえたいことは何\nなん\nですか。\n１． 選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむということ\n２． 選\nせん\n手\nしゅ\nをやめるということ\n３． 指\nし\n導\nどう\n者\nしゃ\nになるということ\n４． もう一\nいち\n度\nど\n選\nせん\n手\nしゅ\nとして活\nかつ\n動\nどう\nするということ\n聴解スクリプト\n9\n\n3 番\nテレビで博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nが話\nはな\nしています。\nＭ ： 子\nこ\n供\nども\nに科\nか\n学\nがく\nを好\nす\nきになってもらいたいご両\nりょう\n親\nしん\n、多\nおお\nいと思\nおも\nいます。でも、子\nこ\n供\nども\nに正\nただ\nしく分\nわ\nかっ\nてもらおうと、つい大\nおとな\n人に説\nせつ\n明\nめい\nするときのように数\nすう\n学\nがく\n的\nてき\nな話\nはなし\nや専\nせん\n門\nもん\n的\nてき\nな話\nはなし\nをしていません\nか。子\nこ\n供\nども\nには難\nむずか\nしい話\nはなし\nをしてもしかたありません。言\nこと\n葉\nば\nで詳\nくわ\nしく説\nせつ\n明\nめい\nするよりも実\nじっ\n際\nさい\nに経\nけい\n験\nけん\nさせることが大\nたい\n切\nせつ\nなんです。例\ っている商\nしょう\n品\nひん\n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、指\nし\n導\nどう\n者\nしゃ\nになることも考\nかんが\nえました。でも、目\nもく\n標\nひょう\nを持\nも\nって頑\nがん\n張\nば\nる若\nわか\nい選\nせん\n手\nしゅ\nたちの試\nし\n合\nあい\nを\n見\nみ\nて、まだあきらめられない気\nき\n持\nも\nちが出\nで\nてきました。自\nじ\n分\nぶん\nもその場\nば\n所\nしょ\nに立\nた\nちたいと思\nおも\nい、選\nせん\n手\nしゅ\nを育\nそだ\nてるのはもう少\nすこ\nし先\nさき\nでもいいと思\nおも\nったんです。休\nやす\nんでいる間\nあいだ\nも応\nおう\n援\nえん\nしてくださった方\nかた\nたちのためにも、新\nあたら\nしい気\nき\n持\nも\nちでやっていきたいと思\nおも\nいます。\nこのスポーツ選\nせん\n手\nしゅ\nが伝\nつた\nえたいことは何\nなん\nですか。\n１． 選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむということ\n２． 選\nせん\n手\nしゅ\nをやめるということ\n３． 指\nし\n導\nどう\n者\nしゃ\nになるということ\n４． もう一\nいち\n度\nど\n選\nせん\n手\nしゅ\nとして活\nかつ\n動\nどう\nするということ\n聴解スクリプト\n9\n\n3 番\nテレビで博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nが話\nはな\nしています。\nＭ ： 子\nこ\n供\nども\nに科\nか\n学\nがく\nを好\nす\nきになってもらいたいご両\nりょう\n親\nしん\n、多\nおお\nいと思\nおも\nいます。でも、子\nこ\n供\nども\nに正\nただ\nしく分\nわ\nかっ\nてもらおうと、つい大\nおとな\n人に説\nせつ\n明\nめい\nするときのように数\nすう\n学\nがく\n的\nてき\nな話\nはなし\nや専\nせん\n門\nもん\n的\nてき\nな話\nはなし\nをしていません\nか。子\nこ\n供\nども\nには難\nむずか\nしい話\nはなし\nをしてもしかたありません。言\nこと\n葉\nば\nで詳\nくわ\nしく説\nせつ\n明\nめい\nするよりも実\nじっ\n際\nさい\nに経\nけい\n験\nけん\nさせることが大\nたい\n切\nせつ\nなんです。例\nたと\nえば、月\nつき\nでの重\nおも\nさの感\nかん\nじ方\nかた\nを教\nおし\nえるときだったら、地\nち\n球\nきゅう\nで\n1 キログラムのものが月\nつき\nではどのくらいの重\nおも\nさに感\nかん\nじるか、持\nも\nった感\nかん\n覚\nかく\nで分\nわ\nかるようにする\nといいですよ。\n博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nは何\nなに\nについて話\nはな\nしていますか。\n１． 子\nこ\n供\nども\nが科\nか\n学\nがく\nを好\nす\nきな理\nり\n由\nゆう\n２． 子\nこ\n供\nども\nへの科\nか\n学\nがく\nの教\nおし\nえ方\nかた\n３． 子\nこ\n供\nども\nに科\nか\n学\nがく\nを学\nまな\nばせる理\nり\n由\nゆう\n４． 子\nこ\n供\nども\nにとって必\nひつ\n要\nよう\nな科\nか\n学\nがく\nの知\nち\n識\nしき\n問題4\n例\nホテルのテレビが壊\nこわ\nれています。何\nなん\nと言\nい\nいますか。\nＦ ： １．テレビがつかないんですが。\n \n ２．テレビをつけてもいいですか。\n \n ３．テレビをつけたほうがいいですよ。\n1 番\n約\nやく\n束\nそく\nの時\nじ\n間\nかん\nに少\nすこ\nし遅\nおく\nれました。友\nとも\n達\nだち\nに何\nなん\nと言\nい\nいますか。  \nＦ ： １．待\nま\nたせてごめん。\n \n ２．急\nいそ\nがせちゃってごめん。\n \n ３．ごめん、お先\nさき\nに。\n聴解スクリプト\n10\n\n2 番\n観\nかん\n光\nこう\nの案\nあん\n内\nない\nをしています。建\nたて\n物\nもの\nを見\nみ\nてもらいたいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．こちらでお目\nめ\nにかかります。\n \n ２．こちらをご覧\nらん\nください。\n \n ３．お見\nみ\nせくださいますか。\n3 番\n荷\nに\n物\nもつ\nを受\nう\nけ取\nと\nります。サインするところが分\nわ\nかりません。何\nなん\nと言\nい\nいますか。\nＭ ： １．どこにサインが書\nか\nいてありますか。\n \n ２．どこでサインを渡\nわた\nしましょうか。\n \n ３．どこにサインをすればいいですか。\n4 番\n今\nきょう\n日はあまりおなかがすいていません。ご飯\nはん\nを普\nふ\n通\nつう\nより少\nすく\nなくしてほしいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．ご飯\nはん\n、少\nすく\nなすぎるんですけど。\n \n ２．ご飯\nはん\n、あと少\nすこ\nしほしいです。\n \n ３．ご飯\nはん\n、少\nすく\nな目\nめ\nでお願\nねが\nいします。\n問題5\n例\nＭ ： すみません、今\nいま\n、時\nじ\n間\nかん\n、ありますか。\nＦ ： １．ええと、１０時\nじ\n２０分\nぷん\nです。\n \n ２．ええ。何\nなん\nですか。\n \n ３．時\nと\n計\nけい\nはあそこですよ。\n聴解スクリプト\n11\n\n1 番\nＭ ： 山\nやま\n田\nだ\nさん、作\nつく\nり直\nなお\nしてくれた資\nし\n料\nりょう\n、見\nみ\nやすくなってましたよ。  \nＦ ： １．ありがとうございます。よかったです。\n \n ２．分\nわ\nかりました。すぐに直\nなお\nします。\n \n ３．もっと簡\nかん\n単\nたん\nにするんですか。\n2 番\nＦ ： ねえ、ちょっと木\nき\n村\nむら\nさんに用\nよう\nがあるんだけど、見\nみ\nなかった？\nＭ ： １．じゃ、一\nいっ\n緒\nしょ\nに見\nみ\nよう。\n \n ２．特\nとく\nに用\nよう\nはないんだけど。\n \n ３．さあ。ほかの人\nひと\nに聞\nき\nいてみて。\n3 番\nＭ ： 昨\nきのう\n日貸\nか\nしてくれた本\nほん\n、読\nよ\nみ出\nだ\nしたら止\nと\nまらなくなっちゃったよ。\nＦ ： １．じゃ、全\nぜん\n部\nぶ\n読\nよ\nまなくてもいいよ。\n \n ２．けっこうおもしろかったでしょう。\n \n ３．本\nほん\n、なくなっちゃったの？\n4 番\nＦ ： どうぞお入\nはい\nりください。すぐお茶\nちゃ\n入\nい\nれますから。  \nＭ ： １．おかまいなく。\n \n ２．ごちそうさまでした。\n \n ３．どういたしまして。\n5 番\nＭ：　リーさん、あのう、リーさんの研\nけん\n究\nきゅう\nでお聞\nき\nきしたいことがあるんですが。  \nＦ ： １．あ、はい、どんなことでしょうか。\n \n ２．ああ、聞\nき\nいたことがあります。\n \n ３．いえ、質\nしつ\n問\nもん\nはありませんが。\n聴解スクリプト\n12\n\n6 番\nＭ ： 友\nとも\n達\nだち\nに赤\nあか\nちゃんが生\nう\nまれたんだけど、どんなものをあげたらいいと思\nおも\nう？  \nＦ ： １．うん、それがいいと思\nおも\nうよ。\n \n ２．プレゼントをあげたらどう？  \n \n ３．何\nなん\nでも喜\nよろこ\nんでくれるんじゃない？\n7 番\nＦ ： 吉\nよし\n田\nだ\nさん、吉\nよし\n田\nだ\nさんはどちらのご出\nしゅっ\n身\nしん\nですか。\nＭ ： １．東\nとう\n京\nきょう\nの貿\nぼう\n易\nえき\n会\nがい\n社\nしゃ\nで働\nはたら\nいています。\n \n ２．生\nう\nまれたのは東\nとう\n京\nきょう\nですが、京\nきょう\n都\nと\nで育\nそだ\nちました。  \n \n ３．これから東\nとう\n京\nきょう\nへ行\nい\nきます。\n8 番\nＦ ： トムさんは日\nに\n本\nほん\nに来\nき\nたばかりなのに、日\nに\n本\nほん\nのことよくご存\nぞん\nじですね。  \nＭ ： １．来\nく\nる前\nまえ\nにいろいろ調\nしら\nべたんです。\n \n ２．いえ、日\nに\n本\nほん\nには長\nなが\nく住\nす\nんでいませんよ。\n \ りに来\nき\nてたんで、片\nかた\n付\nづ\nいてないけど、入\nはい\nって。\nＦ１ ： あ、でもここで。すぐ帰\nかえ\nるから。あのう、この前\nまえ\n借\nか\nりた本\nほん\nなんだけど、ちょっと破\nやぶ\nれちゃって。\nＦ２ ： え、本\nほん\n当\nとう\n？\nＦ１ ： うん、このページなんだけど。\nＦ２ ： あっ、うん、このくらいなら大\nだい\n丈\nじょう\n夫\nぶ\n。読\nよ\nめるし。\nＦ１ ： ほんと？　ごめん。これからは気\nき\nをつけるから。\nＦ２ ： うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１ ： ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nのうちへ何\nなに\nをしに来\nき\nましたか。\n１． 謝\nあやま\nりに来\nき\nた\n２． 本\nほん\nを借\nか\nりに来\nき\nた\n３． 泊\nと\nまりに来\nき\nた\n４． コーヒーを飲\nの\nみに来\nき\nた\n聴解スクリプト\n8\n\n1 番\nテレビでアナウンサーが話\nはな\nしています。\nＦ ： 皆\nみな\nさん、突\nとつ\n然\nぜん\nですが、私\nわたし\n、左\nひだり\n利\nき\nきなんです。マイクを持\nも\nつのも左\nひだり\n手\nて\n、はしを持\nも\nつのも左\nひだり\n手\nて\nです。今\nいま\n来\nき\nているこちらのお店\nみせ\n、文\nぶん\n房\nぼう\n具\nぐ\nなど、ちょっと見\nみ\nたところよくある普\nふ\n通\nつう\nのものが\n売\nう\nられていますが、大\nたい\n変\nへん\n人\nにん\n気\nき\nがあって、全\nぜん\n国\nこく\nからお客\nきゃく\nさんが集\nあつ\nまってくるそうです。すべ\nての商\nしょう\n品\nひん\nが左\nひだり\n利\nき\nきの人\nひと\nのためのものなんです。普\nふ\n段\nだん\nはあまり意\nい\n識\nしき\nしないかもしれませんが、\n普\nふ\n通\nつう\nのはさみ、包\nほう\n丁\nちょう\nなどは右\nみぎ\n手\nて\nで使\nつか\nうように作\nつく\nられています。こちらのお店\nみせ\nには、日\nにち\n常\nじょう\n使\nつか\nうものからパソコンのキーボードなどの電\nでん\n気\nき\n製\nせい\n品\nひん\n、ギターなどの楽\nがっ\n器\nき\nまであるんですよ。す\nごいですね。\nアナウンサーは主\nおも\nに何\nなに\nについて話\nはな\nしていますか。\n１． 左\nひだり\n利\nき\nき用\nよう\nの道\nどう\n具\nぐ\nの特\nとく\n徴\nちょう\n２． 左\nひだり\n利\nき\nきの人\nひと\nの苦\nく\n労\nろう\n３． この店\nみせ\nで扱\nあつか\nっている商\nしょう\n品\nひん\n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、指\nし\n導\nどう\n者\nしゃ\nになることも考\nかんが\nえました。でも、目\nもく\n標\nひょう\nを持\nも\nって頑\nがん\n張\nば\nる若\nわか\nい選\nせん\n手\nしゅ\nたちの試\nし\n合\nあい\nを\n見\nみ\nて、まだあきらめられない気\nき\n持\nも\nちが出\nで\nてきました。自\nじ\n分\nぶん\nもその場\nば\n所\nしょ\nに立\nた\nちたいと思\nおも\nい、選\nせん\n手\nしゅ\nを育\nそだ\nてるのはもう少\nすこ\nし先\nさき\nでもいいと思\nおも\nったんです。休\nやす\nんでいる間\nあいだ\nも応\nおう\n援\nえん\nしてくださった方\nかた\nたちのためにも、新\nあたら\nしい気\nき\n持\nも\nちでやっていきたいと思\nおも\nいます。\nこのスポーツ選\nせん\n手\nしゅ\nが伝\nつた\nえたいことは何\nなん\nですか。\n１． 選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむということ\n２． 選\nせん\n手\nしゅ\nをやめるということ\n３． 指\nし\n導\nどう\n者\nしゃ\nになるということ\n４． もう一\nいち\n度\nど\n選\nせん\n手\nしゅ\nとして活\nかつ\n動\nどう\nするということ\n聴解スクリプト\n9\n\n3 番\nテレビで博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nが話\nはな\nしています。\nＭ ： 子\nこ\n供\nども\nに科\nか\n学\nがく\nを好\nす\nきになってもらいたいご両\nりょう\n親\nしん\n、多\nおお\nいと思\nおも\nいます。でも、子\nこ\n供\nども\nに正\nただ\nしく分\nわ\nかっ\nてもらおうと、つい大\nおとな\n人に説\nせつ\n明\nめい\nするときのように数\nすう\n学\nがく\n的\nてき\nな話\nはなし\nや専\nせん\n門\nもん\n的\nてき\nな話\nはなし\nをしていません\nか。子\nこ\n供\nども\nには難\nむずか\nしい話\nはなし\nをしてもしかたありません。言\nこと\n葉\nば\nで詳\nくわ\nしく説\nせつ\n明\nめい\nするよりも実\nじっ\n際\nさい\nに経\nけい\n験\nけん\nさせることが大\nたい\n切\nせつ\nなんです。例\nたと\nえば、月\nつき\nでの重\nおも\nさの感\nかん\nじ方\nかた\nを教\nおし\nえるときだったら、地\nち\n球\nきゅう\nで\n1 キログラムのものが月\nつき\nではどのくらいの重\nおも\nさに感\nかん\nじるか、持\nも\nった感\nかん\n覚\nかく\nで分\nわ\nかるようにする\nといいですよ。\n博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nは何\nなに\nについて話\nはな\nしていますか。\n１． 子\nこ\n供\nども\nが科\nか\n学\nがく\nを好\nす\nきな理\nり\n由\nゆう\n２． 子\nこ\n供\nども\nへの科\nか\n学\nがく\nの教\nおし\nえ方\nかた\n３． 子\nこ\n供\nども\nに科\nか\n学\nがく\nを学\nまな\nばせる理\nり\n由\nゆう\n４． 子\nこ\n供\nども\nにとって必\nひつ\n要\nよう\nな科\nか\n学\nがく\nの知\nち\n識\nしき\n問題4\n例\nホテルのテレビが壊\nこわ\nれています。何\nなん\nと言\nい\nいますか。\nＦ ： １．テレビがつかないんですが。\n \n ２．テレビをつけてもいいですか。\n \n ３．テレビをつけたほうがいいですよ。\n1 番\n約\nやく\n束\nそく\nの時\nじ\n間\nかん\nに少\nすこ\nし遅\nおく\nれました。友\nとも\n達\nだち\nに何\nなん\nと言\nい\nいますか。  \nＦ ： １．待\nま\nたせてごめん。\n \n ２．急\nいそ\nがせちゃってごめん。\n \n ３．ごめん、お先\nさき\nに。\n聴解スクリプト\n10\n\n2 番\n観\nかん\n光\nこう\nの案\nあん\n内\nない\nをしています。建\nたて\n物\nもの\nを見\nみ\nてもらいたいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．こちらでお目\nめ\nにかかります。\n \n ２．こちらをご覧\nらん\nください。\n \n ３．お見\nみ\nせくださいますか。\n3 番\n荷\nに\n物\nもつ\nを受\nう\nけ取\nと\nります。サインするところが分\nわ\nかりません。何\nなん\nと言\nい\nいますか。\nＭ ： １．どこにサインが書\nか\nいてありますか。\n \n ２．どこでサインを渡\nわた\nしましょうか。\n \n ３．どこにサインをすればいいですか。\n4 番\n今\nきょう\n日はあまりおなかがすいていません。ご飯\nはん\nを普\nふ\n通\nつう\nより少\nすく\nなくしてほしいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．ご飯\nはん\n、少\nすく\nなすぎるんですけど。\n \n ２．ご飯\nはん\n、あと少\nすこ\nしほしいです。\n \n ３．ご飯\nはん\n、少\nすく\nな目\nめ\nでお願\nねが\nいします。\n問題5\n例\nＭ ： すみません、今\nいま\n、時\nじ\n間\nかん\n、ありますか。\nＦ ： １．ええと、１０時\nじ\n２０分\nぷん\nです。\n \n ２．ええ。何\nなん\nですか。\n \n ３．時\nと\n計\nけい\nはあそこですよ。\n聴解スクリプト\n11\n\n1 番\nＭ ： 山\nやま\n田\nだ\nさん、作\nつく\nり直\nなお\nしてくれた資\nし\n料\nりょう\n、見\nみ\nやすくなってましたよ。  \nＦ ： １．ありがとうございます。よかったです。\n \n ２．分\nわ\nかりました。すぐに直\nなお\nします。\n \n ３．もっと簡\nかん\n単\nたん\nにするんですか。\n2 番\nＦ ： ねえ、ちょっと木\nき\n村\nむら\nさんに用\nよう\nがあるんだけど、見\nみ\nなかった？\nＭ ： １．じゃ、一\nいっ\n緒\nしょ\nに見\nみ\nよう。\n \n ２．特\nとく\nに用\nよう\nはないんだけど。\n \n ３．さあ。ほかの人\nひと\nに聞\nき\nいてみて。\n3 番\nＭ ： 昨\nきのう\n日貸\nか\nしてくれた本\nほん\n、読\nよ\nみ出\nだ\nしたら止\nと\nまらなくなっちゃったよ。\nＦ ： １．じゃ、全\nぜん\n部\nぶ\n読\nよ\nまなくてもいいよ。\n \n ２．けっこうおもしろかったでしょう。\n \n ３．本\nほん\n、なくなっちゃったの？\n4 番\nＦ ： どうぞお入\nはい\nりください。すぐお茶\nちゃ\n入\nい\nれますから。  \nＭ ： １．おかまいなく。\n \n ２．ごちそうさまでした。\n \n ３．どういたしまして。\n5 番\nＭ：　リーさん、あのう、リーさんの研\nけん\n究\nきゅう\nでお聞\nき\nきしたいことがあるんですが。  \nＦ ： １．あ、はい、どんなことでしょうか。\n \n ２．ああ、聞\nき\nいたことがあります。\n \n ３．いえ、質\nしつ\n問\nもん\nはありませんが。\n聴解スクリプト\n12\n\n6 番\nＭ ： 友\nとも\n達\nだち\nに赤\nあか\nちゃんが生\nう\nまれたんだけど、どんなものをあげたらいいと思\nおも\nう？  \nＦ ： １．うん、それがいいと思\nおも\nうよ。\n \n ２．プレゼントをあげたらどう？  \n \n ３．何\nなん\nでも喜\nよろこ\nんでくれるんじゃない？\n7 番\nＦ ： 吉\nよし\n田\nだ\nさん、吉\nよし\n田\nだ\nさんはどちらのご出\nしゅっ\n身\nしん\nですか。\nＭ ： １．東\nとう\n京\nきょう\nの貿\nぼう\n易\nえき\n会\nがい\n社\nしゃ\nで働\nはたら\nいています。\n \n ２．生\nう\nまれたのは東\nとう\n京\nきょう\nですが、京\nきょう\n都\nと\nで育\nそだ\nちました。  \n \n ３．これから東\nとう\n京\nきょう\nへ行\nい\nきます。\n8 番\nＦ ： トムさんは日\nに\n本\nほん\nに来\nき\nたばかりなのに、日\nに\n本\nほん\nのことよくご存\nぞん\nじですね。  \nＭ ： １．来\nく\nる前\nまえ\nにいろいろ調\nしら\nべたんです。\n \n ２．いえ、日\nに\n本\nほん\nには長\nなが\nく住\nす\nんでいませんよ。\n \n ３．来\nき\nたばかりですから、しかたないです。\n9 番\nＦ ： 寒\nさむ\nいね。今\nこん\n夜\nや\nは雪\nゆき\nが降\nふ\nってもおかしくないね。\nＭ ： １．降\nふ\nったらおかしい？\n \n ２．これは降\nふ\nるだろうね。\n \n ３．寒\nさむ\nいけど、降\nふ\nらないんだね。\n聴解スクリプト\n13\n"}];

let curVol = "all";
let curSec = "all";
const userAnswers = JSON.parse(localStorage.getItem("jlpt_n3_user_answers") || "{}");

function saveUserAnswer(qid, choice, isCorrect) {
  userAnswers[qid] = { choice, isCorrect, timestamp: Date.now() };
  localStorage.setItem("jlpt_n3_user_answers", JSON.stringify(userAnswers));
  updateStats();
}

function updateStats() {
  const qList = getFilteredQuestions();
  const total = qList.length;
  let solved = 0;
  let correct = 0;
  let wrong = 0;

  Object.values(userAnswers).forEach(item => {
    if (item.isCorrect) correct++;
    else wrong++;
  });
  
  qList.forEach(q => {
    if (userAnswers[q.id]) solved++;
  });

  const allWrong = Object.keys(userAnswers).filter(k => userAnswers[k] && !userAnswers[k].isCorrect).length;
  document.getElementById("wrongCount").innerText = allWrong;

  document.getElementById("totalPill").innerText = `선택 회차: ${total}문항`;
  document.getElementById("solvedPill").innerText = `풀이: ${solved}/${total}`;
  document.getElementById("scorePill").innerText = `정답: ${correct}`;
  document.getElementById("ratePill").innerText = `정답률: ${solved > 0 ? Math.round((correct / (correct + wrong)) * 100) : 0}%`;
}

function getFilteredQuestions() {
  return QUESTIONS.filter(q => {
    if (curVol !== "all" && q.vol !== parseInt(curVol)) return false;
    if (curSec === "review") {
      const u = userAnswers[q.id];
      return u && !u.isCorrect;
    }
    if (curSec !== "all" && q.section !== curSec) return false;
    return true;
  });
}

function renderQuestions() {
  const listEl = document.getElementById("qList");
  const filtered = getFilteredQuestions();
  
  if (filtered.length === 0) {
    listEl.innerHTML = `<div style="text-align: center; padding: 60px 20px; background: #fff; border-radius: 18px; border: 1px solid var(--line);">
      <div style="font-size: 32px; margin-bottom: 12px;">🎉</div>
      <div style="font-size: 17px; font-weight: 800; color: #1E293B;">조건에 해당하는 문항이 없습니다.</div>
      <div style="font-size: 14px; color: #64748B; margin-top: 6px;">오답 복습 모드라면 현재 틀린 문제가 없습니다!</div>
    </div>`;
    return;
  }

  listEl.innerHTML = filtered.map(q => {
    const userRec = userAnswers[q.id];
    const isSolved = !!userRec;
    const isUserCorrect = isSolved && userRec.isCorrect;

    // Choice buttons
    const optCount = q.options_count || 4;
    let choiceBtns = "";
    for (let c = 1; c <= optCount; c++) {
      let btnClass = "choice-btn";
      if (isSolved) {
        if (c === q.answer) btnClass += " selected-correct";
        else if (userRec.choice === c && !isUserCorrect) btnClass += " selected-wrong";
      }
      choiceBtns += `<button class="${btnClass}" onclick="handleSelect('${q.id}', ${c})">${c}</button>`;
    }

    // Audio block if listening
    let audioBlock = "";
    if (q.audio) {
      audioBlock = `
        <div class="audio-player-box">
          <div class="audio-meta">
            <span>🎧 청해 음원 (第${q.sub_q_num}問)</span>
            <div class="audio-speeds">
              <span style="font-size: 11.5px; color: #6366F1; margin-right: 4px;">배속:</span>
              <button class="btn-speed active" onclick="setSpeed(this, '${q.id}_audio', 1.0)">1.0x</button>
              <button class="btn-speed" onclick="setSpeed(this, '${q.id}_audio', 1.1)">1.1x</button>
              <button class="btn-speed" onclick="setSpeed(this, '${q.id}_audio', 1.25)">1.25x</button>
            </div>
          </div>
          <audio id="${q.id}_audio" controls preload="metadata" src="${q.audio}?v=20261020_audio2"></audio>
        </div>
      `;
    }

    // Result banner
    let resultBanner = "";
    if (isSolved) {
      if (isUserCorrect) {
        resultBanner = `<div class="result-banner correct"><span>✅ 정답입니다! (정답: ${q.answer}번)</span></div>`;
      } else {
        resultBanner = `<div class="result-banner wrong"><span>❌ 오답입니다. (정답: ${q.answer}번, 선택: ${userRec.choice}번)</span></div>`;
      }
    }

    return `
      <div class="question-card" id="card_${q.id}">
        <div class="card-header">
          <div class="badges-group">
            <span class="badge badge-vol">${q.vol_title}</span>
            <span class="badge badge-sec">${q.section_title} (${q.section_jp})</span>
            <span class="badge badge-num">문항 #${q.q_idx} (제${q.sub_q_num}문)</span>
          </div>
          <div style="font-size: 13px; font-weight: 800; color: #64748B;">
            ${q.options_count}지선다
          </div>
        </div>

        ${audioBlock}

        <div class="crop-wrapper">
          <img src="${q.image}?v=20261020_audit" alt="문항 이미지" loading="lazy">
        </div>

        <div class="choice-container">
          ${choiceBtns}
        </div>

        ${resultBanner}
      </div>
    `;
  }).join("");
}

function handleSelect(qid, choice) {
  const q = QUESTIONS.find(item => item.id === qid);
  if (!q) return;
  const isCorrect = (choice === q.answer);
  saveUserAnswer(qid, choice, isCorrect);
  renderQuestions();
}

function setSpeed(btn, audioId, speed) {
  const audio = document.getElementById(audioId);
  if (audio) {
    audio.playbackRate = speed;
    const parent = btn.parentElement;
    parent.querySelectorAll(".btn-speed").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  }
}

// Filter listeners
document.querySelectorAll(".btn-filter").forEach(btn => {
  btn.addEventListener("click", () => {
    const type = btn.getAttribute("data-filter-type");
    const val = btn.getAttribute("data-val");

    document.querySelectorAll(`.btn-filter[data-filter-type="${type}"]`).forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    if (type === "vol") curVol = val;
    else if (type === "sec") curSec = val;

    updateStats();
    renderQuestions();
  });
});

// Init
updateStats();
renderQuestions();

// [단일 오디오 배타적 재생 가드] 한 문항 재생 시 다른 모든 오디오 자동 일시정지 (중복 재생 원천 차단)
document.addEventListener('play', function(e) {
  if (e.target && e.target.tagName === 'AUDIO') {
    document.querySelectorAll('audio').forEach(function(audio) {
      if (audio !== e.target && !audio.paused) {
        audio.pause();
      }
    });
  }
}, true);
</script>
</body>
</html>
