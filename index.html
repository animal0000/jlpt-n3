し\n料\nりょう\nについて話\nはな\nしています。二\nふたり\n人はこのあとまず何\nなに\nをしますか。\nＦ ： ねえ、社\nしゃ\n会\nかい\n学\nがく\nの授\nじゅ\n業\nぎょう\nで一\nいっ\n緒\nしょ\nにやる発\nはっ\n表\nぴょう\nのことなんだけど。\nＭ ： うん。準\nじゅん\n備\nび\nも終\nお\nわったし、発\nはっ\n表\nぴょう\nを待\nま\nつだけだね。\nＦ ： 実\nじつ\nはね、昨\nきのう\n日、ゼミの先\nせん\n輩\nぱい\nに私\nわたし\nたちが準\nじゅん\n備\nび\nした、発\nはっ\n表\nぴょう\nで使\nつか\nう資\nし\n料\nりょう\nとか発\nはっ\n表\nぴょう\nの流\nなが\nれを見\nみ\nて\nもらったら、先\nせん\n輩\nぱい\nが問\nもん\n題\nだい\n点\nてん\nをいくつかあげてくれて。直\nなお\nしたほうがいいと思\nおも\nうんだ。\nＭ ： どこ？\nＦ ： うん。まずね、せっかく自\nじ\n分\nぶん\nたちで調\nちょう\n査\nさ\nして、面\nおも\n白\nしろ\nい結\nけっ\n果\nか\nが出\nで\nてるのに、数\nすう\n字\nじ\nが並\nなら\nんでるだ\nけだから、伝\nつた\nわりにくいって。\nＭ ： じゃ、グラフを加\nくわ\nえようか。\nＦ ： そうだね。それからもう一\nいっ\n点\nてん\n、私\nわたし\nたちの主\nしゅ\n張\nちょう\nが発\nはっ\n表\nぴょう\nの最\nさい\n後\nご\nにしかないから、途\nと\n中\nちゅう\nまで何\nなに\nが言\nい\nいたいのか分\nわ\nからないって。ねえ、発\nはっ\n表\nぴょう\nの流\nなが\nれ、変\nか\nえてみない？\nＭ ： うん、やってみよう。流\nなが\nれを変\nか\nえたら、調\nちょう\n査\nさ\n結\nけっ\n果\nか\nの見\nみ\nせ方\nかた\nも変\nか\nわってくるだろうから、グラ\nフのことは後\nあと\nにして、それからやろう。\nＦ ： うん。\n聴解スクリプト\n7\n\nＭ ： 先\nせん\n輩\nぱい\nにお礼\nれい\n言\nい\nっといてね。\n二\nふたり\n人はこのあとまず何\nなに\nをしますか。\n問題3\n例\n女\nおんな\nの人\nひと\nが友\nとも\n達\nだち\nのうちに来\nき\nて、話\nはな\nしています。\nＦ１ ： 田\nた\n中\nなか\nです。\nＦ２ ： あ、はあい。昨\nきのう\n日友\nとも\n達\nだち\nが泊\nと\nまりに来\nき\nてたんで、片\nかた\n付\nづ\nいてないけど、入\nはい\nって。\nＦ１ ： あ、でもここで。すぐ帰\nかえ\nるから。あのう、この前\nまえ\n借\nか\nりた本\nほん\nなんだけど、ちょっと破\nやぶ\nれちゃって。\nＦ２ ： え、本\nほん\n当\nとう\n？\nＦ１ ： うん、このページなんだけど。\nＦ２ ： あっ、うん、このくらいなら大\nだい\n丈\nじょう\n夫\nぶ\n。読\nよ\nめるし。\nＦ１ ： ほんと？　ごめん。これからは気\nき\nをつけるから。\nＦ２ ： うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１ ： ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nのうちへ何\nなに\nをしに来\nき\nましたか。\n１． 謝\nあやま\nりに来\nき\nた\n２． 本\nほん\nを借\nか\nりに来\nき\nた\n３． 泊\nと\nまりに来\nき\nた\n４． コーヒーを飲\nの\nみに来\nき\nた\n聴解スクリプト\n8\n\n1 番\nテレビでアナウンサーが話\nはな\nしています。\nＦ ： 皆\nみな\nさん、突\nとつ\n然\nぜん\nですが、私\nわたし\n、左\nひだり\n利\nき\nきなんです。マイクを持\nも\nつのも左\nひだり\n手\nて\n、はしを持\nも\nつのも左\nひだり\n手\nて\nです。今\nいま\n来\nき\nているこちらのお店\nみせ\n、文\nぶん\n房\nぼう\n具\nぐ\nなど、ちょっと見\nみ\nたところよくある普\nふ\n通\nつう\nのものが\n売\nう\nられていますが、大\nたい\n変\nへん\n人\nにん\n気\nき\nがあって、全\nぜん\n国\nこく\nからお客\nきゃく\nさんが集\nあつ\nまってくるそうです。すべ\nての商\nしょう\n品\nひん\nが左\nひだり\n利\nき\nきの人\nひと\nのためのものなんです。普\nふ\n段\nだん\nはあまり意\nい\n識\nしき\nしないかもしれませんが、\n普\nふ\n通\nつう\nのはさみ、包\nほう\n丁\nちょう\nなどは右\nみぎ\n手\nて\nで使\nつか\nうように作\nつく\nられています。こちらのお店\nみせ\nには、日\nにち\n常\nじょう\n使\nつか\nうものからパソコンのキーボードなどの電\nでん\n気\nき\n製\nせい\n品\nひん\n、ギターなどの楽\nがっ\n器\nき\nまであるんですよ。す\nごいですね。\nアナウンサーは主\nおも\nに何\nなに\nについて話\nはな\nしていますか。\n１． 左\nひだり\n利\nき\nき用\nよう\nの道\nどう\n具\nぐ\nの特\nとく\n徴\nちょう\n２． 左\nひだり\n利\nき\nきの人\nひと\nの苦\nく\n労\nろう\n３． この店\nみせ\nで扱\nあつか\nっている商\nしょう\n品\nひん\n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、指\nし\n導\nどう\n者\nしゃ\nになることも考\nかんが\nえました。でも、目\nもく\n標\nひょう\nを持\nも\nって頑\nがん\n張\nば\nる若\nわか\nい選\nせん\n手\nしゅ\nたちの試\nし\n合\nあい\nを\n見\nみ\nて、まだあきらめられない気\nき\n持\nも\nちが出\nで\nてきました。自\nじ\n分\nぶん\nもその場\nば\n所\nしょ\nに立\nた\nちたいと思\nおも\nい、選\nせん\n手\nしゅ\nを育\nそだ\nてるのはもう少\nすこ\nし先\nさき\nでもいいと思\nおも\nったんです。休\nやす\nんでいる間\nあいだ\nも応\nおう\n援\nえん\nしてくださった方\nかた\nたちのためにも、新\nあたら\nしい気\nき\n持\nも\nちでやっていきたいと思\nおも\nいます。\nこのスポーツ選\nせん\n手\nしゅ\nが伝\nつた\nえたいことは何\nなん\nですか。\n１． 選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむということ\n２． 選\nせん\n手\nしゅ\nをやめるということ\n３． 指\nし\n導\nどう\n者\nしゃ\nになるということ\n４． もう一\nいち\n度\nど\n選\nせん\n手\nしゅ\nとして活\nかつ\n動\nどう\nするということ\n聴解スクリプト\n9\n\n3 番\nテレビで博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nが話\nはな\nしています。\nＭ ： 子\nこ\n供\nども\nに科\nか\n学\nがく\nを好\nす\nきになってもらいたいご両\nりょう\n親\nしん\n、多\nおお\nいと思\nおも\nいます。でも、子\nこ\n供\nども\nに正\nただ\nしく分\nわ\nかっ\nてもらおうと、つい大\nおとな\n人に説\nせつ\n明\nめい\nするときのように数\nすう\n学\nがく\n的\nてき\nな話\nはなし\nや専\nせん\n門\nもん\n的\nてき\nな話\nはなし\nをしていません\nか。子\nこ\n供\nども\nには難\nむずか\nしい話\nはなし\nをしてもしかたありません。言\nこと\n葉\nば\nで詳\nくわ\nしく説\nせつ\n明\nめい\nするよりも実\nじっ\n際\nさい\nに経\nけい\n験\nけん\nさせることが大\nたい\n切\nせつ\nなんです。例\nたと\nえば、月\nつき\nでの重\nおも\nさの感\nかん\nじ方\nかた\nを教\nおし\nえるときだったら、地\nち\n球\nきゅう\nで\n1 キログラムのものが月\nつき\nではどのくらいの重\nおも\nさに感\nかん\nじるか、持\nも\nった感\nかん\n覚\nかく\nで分\nわ\nかるようにする\nといいですよ。\n博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nは何\nなに\nについて話\nはな\nしていますか。\n１． 子\nこ\n供\nども\nが科\nか\n学\nがく\nを好\nす\nきな理\nり\n由\nゆう\n２． 子\nこ\n供\nども\nへの科\nか\n学\nがく\nの教\nおし\nえ方\nかた\n３． 子\nこ\n供\nども\nに科\nか\n学\nがく\nを学\nまな\nばせる理\nり\n由\nゆう\n４． 子\nこ\n供\nども\nにとって必\nひつ\n要\nよう\nな科\nか\n学\nがく\nの知\nち\n識\nしき\n問題4\n例\nホテルのテレビが壊\nこわ\nれています。何\nなん\nと言\nい\nいますか。\nＦ ： １．テレビがつかないんですが。\n \n ２．テレビをつけてもいいですか。\n \n ３．テレビをつけたほうがいいですよ。\n1 番\n約\nやく\n束\nそく\nの時\nじ\n間\nかん\nに少\nすこ\nし遅\nおく\nれました。友\nとも\n達\nだち\nに何\nなん\nと言\nい\nいますか。  \nＦ ： １．待\nま\nたせてごめん。\n \n ２．急\nいそ\nがせちゃってごめん。\n \n ３．ごめん、お先\nさき\nに。\n聴解スクリプト\n10\n\n2 番\n観\nかん\n光\nこう\nの案\nあん\n内\nない\nをしています。建\nたて\n物\nもの\nを見\nみ\nてもらいたいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．こちらでお目\nめ\nにかかります。\n \n ２．こちらをご覧\nらん\nください。\n \n ３．お見\nみ\nせくださいますか。\n3 番\n荷\nに\n物\nもつ\nを受\nう\nけ取\nと\nります。サインするところが分\nわ\nかりません。何\nなん\nと言\nい\nいますか。\nＭ ： １．どこにサインが書\nか\nいてありますか。\n \n ２．どこでサインを渡\nわた\nしましょうか。\n \n ３．どこにサインをすればいいですか。\n4 番\n今\nきょう\n日はあまりおなかがすいていません。ご飯\nはん\nを普\nふ\n通\nつう\nより少\nすく\nなくしてほしいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．ご飯\nはん\n、少\nすく\nなすぎるんですけど。\n \n ２．ご飯\nはん\n、あと少\nすこ\nしほしいです。\n \n ３．ご飯\nはん\n、少\nすく\nな目\nめ\nでお願\nねが\nいします。\n問題5\n例\nＭ ： すみません、今\nいま\n、時\nじ\n間\nかん\n、ありますか。\nＦ ： １．ええと、１０時\nじ\n２０分\nぷん\nです。\n \n ２．ええ。何\nなん\nですか。\n \n ３．時\nと\n計\nけい\nはあそこですよ。\n聴解スクリプト\n11\n\n1 番\nＭ ： 山\nやま\n田\nだ\nさん、作\nつく\nり直\nなお\nしてくれた資\nし\n料\nりょう\n、見\nみ\nやすくなってましたよ。  \nＦ ： １．ありがとうございます。よかったです。\n \n ２．分\nわ\nかりました。すぐに直\nなお\nします。\n \n ３．もっと簡\nかん\n単\nたん\nにするんですか。\n2 番\nＦ ： ねえ、ちょっと木\nき\n村\nむら\nさんに用\nよう\nがあるんだけど、見\nみ\nなかった？\nＭ ： １．じゃ、一\nいっ\n緒\nしょ\nに見\nみ\nよう。\n \n ２．特\nとく\nに用\nよう\nはないんだけど。\n \n ３．さあ。ほかの人\nひと\nに聞\nき\nいてみて。\n3 番\nＭ ： 昨\nきのう\n日貸\nか\nしてくれた本\nほん\n、読\nよ\nみ出\nだ\nしたら止\nと\nまらなくなっちゃったよ。\nＦ ： １．じゃ、全\nぜん\n部\nぶ\n読\nよ\nまなくてもいいよ。\n \n ２．けっこうおもしろかったでしょう。\n \n ３．本\nほん\n、なくなっちゃったの？\n4 番\nＦ ： どうぞお入\nはい\nりください。すぐお茶\nちゃ\n入\nい\nれますから。  \nＭ ： １．おかまいなく。\n \n ２．ごちそうさまでした。\n \n ３．どういたしまして。\n5 番\nＭ：　リーさん、あのう、リーさんの研\nけん\n究\nきゅう\nでお聞\nき\nきしたいことがあるんですが。  \nＦ ： １．あ、はい、どんなことでしょうか。\n \n ２．ああ、聞\nき\nいたことがあります。\n \n ３．いえ、質\nしつ\n問\nもん\nはありませんが。\n聴解スクリプト\n12\n\n6 番\nＭ ： 友\nとも\n達\nだち\nに赤\nあか\nちゃんが生\nう\nまれたんだけど、どんなものをあげたらいいと思\nおも\nう？  \nＦ ： １．うん、それがいいと思\nおも\nうよ。\n \n ２．プレゼントをあげたらどう？  \n \n ３．何\nなん\nでも喜\nよろこ\nんでくれるんじゃない？\n7 \nわ\nからないって。ねえ、発\nはっ\n表\nぴょう\nの流\nなが\nれ、変\nか\nえてみない？\nＭ ： うん、やってみよう。流\nなが\nれを変\nか\nえたら、調\nちょう\n査\nさ\n結\nけっ\n果\nか\nの見\nみ\nせ方\nかた\nも変\nか\nわってくるだろうから、グラ\nフのことは後\nあと\nにして、それからやろう。\nＦ ： うん。\n聴解スクリプト\n7\n\nＭ ： 先\nせん\n輩\nぱい\nにお礼\nれい\n言\nい\nっといてね。\n二\nふたり\n人はこのあとまず何\nなに\nをしますか。\n問題3\n例\n女\nおんな\nの人\nひと\nが友\nとも\n達\nだち\nのうちに来\nき\nて、話\nはな\nしています。\nＦ１ ： 田\nた\n中\nなか\nです。\nＦ２ ： あ、はあい。昨\nきのう\n日友\nとも\n達\nだち\nが泊\nと\nまりに来\nき\nてたんで、片\nかた\n付\nづ\nいてないけど、入\nはい\nって。\nＦ１ ： あ、でもここで。すぐ帰\nかえ\nるから。あのう、この前\nまえ\n借\nか\nりた本\nほん\nなんだけど、ちょっと破\nやぶ\nれちゃって。\nＦ２ ： え、本\nほん\n当\nとう\n？\nＦ１ ： うん、このページなんだけど。\nＦ２ ： あっ、うん、このくらいなら大\nだい\n丈\nじょう\n夫\nぶ\n。読\nよ\nめるし。\nＦ１ ： ほんと？　ごめん。これからは気\nき\nをつけるから。\nＦ２ ： うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１ ： ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nのうちへ何\nなに\nをしに来\nき\nましたか。\n１． 謝\nあやま\nりに来\nき\nた\n２． 本\nほん\nを借\nか\nりに来\nき\nた\n３． 泊\nと\nまりに来\nき\nた\n４． コーヒーを飲\nの\nみに来\nき\nた\n聴解スクリプト\n8\n\n1 番\nテレビでアナウンサーが話\nはな\nしています。\nＦ ： 皆\nみな\nさん、突\nとつ\n然\nぜん\nですが、私\nわたし\n、左\nひだり\n利\nき\nきなんです。マイクを持\nも\nつのも左\nひだり\n手\nて\n、はしを持\nも\nつのも左\nひだり\n手\nて\nです。今\nいま\n来\nき\nているこちらのお店\nみせ\n、文\nぶん\n房\nぼう\n具\nぐ\nなど、ちょっと見\nみ\nたところよくある普\nふ\n通\nつう\nのものが\n売\nう\nられていますが、大\nたい\n変\nへん\n人\nにん\n気\nき\nがあって、全\nぜん\n国\nこく\nからお客\nきゃく\nさんが集\nあつ\nまってくるそうです。すべ\nての商\nしょう\n品\nひん\nが左\nひだり\n利\nき\nきの人\nひと\nのためのものなんです。普\nふ\n段\nだん\nはあまり意\nい\n識\nしき\nしないかもしれませんが、\n普\nふ\n通\nつう\nのはさみ、包\nほう\n丁\nちょう\nなどは右\nみぎ\n手\nて\nで使\nつか\nうように作\nつく\nられています。こちらのお店\nみせ\nには、日\nにち\n常\nじょう\n使\nつか\nうものからパソコンのキーボードなどの電\nでん\n気\nき\n製\nせい\n品\nひん\n、ギターなどの楽\nがっ\n器\nき\nまであるんですよ。す\nごいですね。\nアナウンサーは主\nおも\nに何\nなに\nについて話\nはな\nしていますか。\n１． 左\nひだり\n利\nき\nき用\nよう\nの道\nどう\n具\nぐ\nの特\nとく\n徴\nちょう\n２． 左\nひだり\n利\nき\nきの人\nひと\nの苦\nく\n労\nろう\n３． この店\nみせ\nで扱\nあつか\nっている商\nしょう\n品\nひん\n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、指\nし\n導\nどう\n者\nしゃ\nになることも考\nかんが\nえました。でも、目\nもく\n標\nひょう\nを持\nも\nって頑\nがん\n張\nば\nる若\nわか\nい選\nせん\n手\nしゅ\nたちの試\nし\n合\nあい\nを\n見\nみ\nて、まだあきらめられない気\nき\n持\nも\nちが出\nで\nてきました。自\nじ\n分\nぶん\nもその場\nば\n所\nしょ\nに立\nた\nちたいと思\nおも\nい、選\nせん\n手\nしゅ\nを育\nそだ\nてるのはもう少\nすこ\nし先\nさき\nでもいいと思\nおも\nったんです。休\nやす\nんでいる間\nあいだ\nも応\nおう\n援\nえん\nしてくださった方\nかた\nたちのためにも、新\nあたら\nしい気\nき\n持\nも\nちでやっていきたいと思\nおも\nいます。\nこのスポーツ選\nせん\n手\nしゅ\nが伝\nつた\nえたいことは何\nなん\nですか。\n１． 選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむということ\n２． 選\nせん\n手\nしゅ\nをやめるということ\n３． 指\nし\n導\nどう\n者\nしゃ\nになるということ\n４． もう一\nいち\n度\nど\n選\nせん\n手\nしゅ\nとして活\nかつ\n動\nどう\nするということ\n聴解スクリプト\n9\n\n3 番\nテレビで博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nが話\nはな\nしています。\nＭ ： 子\nこ\n供\nども\nに科\nか\n学\nがく\nを好\nす\nきになってもらいたいご両\nりょう\n親\nしん\n、多\nおお\nいと思\nおも\nいます。でも、子\nこ\n供\nども\nに正\nただ\nしく分\nわ\nかっ\nてもらおうと、つい大\nおとな\n人に説\nせつ\n明\nめい\nするときのように数\nすう\n学\nがく\n的\nてき\nな話\nはなし\nや専\nせん\n門\nもん\n的\nてき\nな話\nはなし\nをしていません\nか。子\nこ\n供\nども\nには難\nむずか\nしい話\nはなし\nをしてもしかたありません。言\nこと\n葉\nば\nで詳\nくわ\nしく説\nせつ\n明\nめい\nするよりも実\nじっ\n際\nさい\nに経\nけい\n験\nけん\nさせることが大\nたい\n切\nせつ\nなんです。例\nたと\nえば、月\nつき\nでの重\nおも\nさの感\nかん\nじ方\nかた\nを教\nおし\nえるときだったら、地\nち\n球\nきゅう\nで\n1 キログラムのものが月\nつき\nではどのくらいの重\nおも\nさに感\nかん\nじるか、持\nも\nった感\nかん\n覚\nかく\nで分\nわ\nかるようにする\nといいですよ。\n博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nは何\nなに\nについて話\nはな\nしていますか。\n１． 子\nこ\n供\nども\nが科\nか\n学\nがく\nを好\nす\nきな理\nり\n由\nゆう\n２． 子\nこ\n供\nども\nへの科\nか\n学\nがく\nの教\nおし\nえ方\nかた\n３． 子\nこ\n供\nども\nに科\nか\n学\nがく\nを学\nまな\nばせる理\nり\n由\nゆう\n４． 子\nこ\n供\nども\nにとって必\nひつ\n要\nよう\nな科\nか\n学\nがく\nの知\nち\n識\nしき\n問題4\n例\nホテルのテレビが壊\nこわ\nれています。何\nなん\nと言\nい\nいますか。\nＦ ： １．テレビがつかないんですが。\n \n ２．テレビをつけてもいいですか。\n \n ３．テレビをつけたほうがいいですよ。\n1 番\n約\nやく\n束\nそく\nの時\nじ\n間\nかん\nに少\nすこ\nし遅\nおく\nれました。友\nとも\n達\nだち\nに何\nなん\nと言\nい\nいますか。  \nＦ ： １．待\nま\nたせてごめん。\n \n ２．急\nいそ\nがせちゃってごめん。\n \n ３．ごめん、お先\nさき\nに。\n聴解スクリプト\n10\n\n2 番\n観\nかん\n光\nこう\nの案\nあん\n内\nない\nをしています。建\nたて\n物\nもの\nを見\nみ\nてもらいたいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．こちらでお目\nめ\nにかかります。\n \n ２．こちらをご覧\nらん\nください。\n \n ３．お見\nみ\nせくださいますか。\n3 番\n荷\nに\n物\nもつ\nを受\nう\nけ取\nと\nります。サインするところが分\nわ\nかりません。何\nなん\nと言\nい\nいますか。\nＭ ： １．どこにサインが書\nか\nいてありますか。\n \n ２．どこでサインを渡\nわた\nしましょうか。\n \n ３．どこにサインをすればいいですか。\n4 番\n今\n  "sub_q_num": 4, "image": "crops/vol2/listening_q04.png", "audio": "audio/vol2/listening_q04.mp3", "answer": 2, "options_count": 4, "script": "聴\nちょう\n解\nかい\nスクリプト\n（Ｍ：男性　Ｆ：女性）\n問題1\n例\nホテルで会\nかい\n社\nしゃ\n員\nいん\nの男\nおとこ\nの人\nひと\nと女\nおんな\nの人\nひと\nが話\nはな\nしています。女\nおんな\nの人\nひと\nは明\nあした\n日何\nなん\n時\nじ\nまでにホテルを出\nで\nますか。\nＭ ： では、明\nあした\n日は、9 時\nじ\n半\nはん\nに事\nじ\n務\nむ\n所\nしょ\nにいらしてください。\nＦ ： はい、ええと、このホテルから事\nじ\n務\nむ\n所\nしょ\nまで、タクシーでどのぐらいかかりますか。\nＭ ： そうですね、30 分\nぷん\nもあれば着\nつ\nきますね。\nＦ ： じゃ、9 時\nじ\nに出\nで\nればいいですね。\nＭ ： あ、朝\nあさ\nは道\nみち\nが込\nこ\nむかもしれません。15 分\nふん\nぐらい早\nはや\nめに出\nで\nられたほうがいいですね。\nＦ ： そうですか。じゃ、そうします。\n女\nおんな\nの人\nひと\nは明\nあした\n日何\nなん\n時\nじ\nまでにホテルを出\nで\nますか。\n1 番\n電\nでん\n話\nわ\nで妻\nつま\nと夫\nおっと\nが話\nはな\nしています。夫\nおっと\nはこれから何\nなに\nをしますか。\nＦ ： もしもし、今\nいま\n、用\nよう\n事\nじ\nが終\nお\nわったから帰\nかえ\nろうと思\nおも\nって駅\nえき\nに来\nき\nたんだけど、電\nでん\n車\nしゃ\nが動\nうご\nいてなくって。\nＭ ： えっ本\nほん\n当\nとう\n？\nＦ ： うん。少\nすこ\nし帰\nかえ\nる時\nじ\n間\nかん\nが遅\nおそ\nくなっちゃうと思\nおも\nう。そろそろ暗\nくら\nくなるし、洗\nせん\n濯\nたく\n物\nもの\n取\nと\nり込\nこ\nんどいて\nくれる？\nＭ ： 分\nわ\nかった。\nＦ ： それから、もうすぐ荷\nに\n物\nもつ\nが届\nとど\nくことになってるから、受\nう\nけ取\nと\nっといて。\nＭ ： ああ、それさっき届\nとど\nいたよ。晩\nばん\nご飯\nはん\nどうする？作\nつく\nっておこうか。\nＦ ： ありがとう。それは大\nだい\n丈\nじょう\n夫\nぶ\n。何\nなに\nかすぐ食\nた\nべられるもの買\nか\nって帰\nかえ\nるから。それより、庭\nにわ\nの花\nはな\nに\n水\nみず\nやっといてもらえない？いろいろ頼\nたの\nんで悪\nわる\nいんだけど。\nＭ ： 分\nわ\nかった。\n夫\nおっと\nはこれから何\nなに\nをしますか。\n聴解スクリプト\n1\n\n2 番\nクリーニング屋\nや\nで女\nおんな\nの人\nひと\nと店\nてん\n員\nいん\nが話\nはな\nしています。女\nおんな\nの人\nひと\nはワンピースをいつ取\nと\nりに来\nき\nますか。\nＦ ： すみません、このワンピースお願\nねが\nいします。いつできますか。\nＭ ： ええと今\nきょう\n日は水\nすい\n曜\nよう\n日\nび\nですね。土\nど\n曜\nよう\n日\nび\nにお渡\nわた\nしできます。\nＦ ： そうですか。その日\nひ\nに結\nけっ\n婚\nこん\n式\nしき\nがあるんで、その前\nぜん\n日\nじつ\nまでには取\nと\nりに来\nき\nたいんですが。\nＭ ： 急\nいそ\nぐようでしたら、500 円\nえん\n高\nたか\nくなってしまいますが、預\nあず\nかった翌\nよく\n日\nじつ\nにできるコースもありま\nすので、そちらにしていただけないでしょうか。\nＦ ： 分\nわ\nかりました。\nＭ ： あ、申\nもう\nし訳\nわけ\nありません。明\nあした\n日は定\nてい\n休\nきゅう\n日\nび\nなので。\nＦ ： じゃ、その次\nつぎ\nの日\nひ\nですね。\nＭ ： はい、よろしくお願\nねが\nいします。\n女\nおんな\nの人\nひと\nはワンピースをいつ取\nと\nりに来\nき\nますか。\n3 番\n会\nかい\n社\nしゃ\nで男\nおとこ\nの人\nひと\nと女\nおんな\nの人\nひ \nかえ\nりにならない方\nかた\nがけっこういらっしゃる\nのが気\nき\nになります。アルバイトの森\nもり\nさんが言\nい\nってたんですけど、せっかく来\nき\nてくださったお\n客\nきゃく\n様\nさま\nが席\nせき\nがなくて入\nはい\nれないっていうことが何\nなん\n回\nかい\nかあったそうです。\nＭ ： そういうときは、お客\nきゃく\n様\nさま\nの気\nき\n分\nぶん\nを悪\nわる\nくさせずに席\nせき\nを空\nあ\nけていただくように頼\nたの\nまなきゃいけな\nいんだけど。うちの店\nみせ\nは若\nわか\nい店\nてん\n員\nいん\nが多\nおお\nいから、上\nじょう\n手\nず\nに伝\nつた\nえるのは難\nむずか\nしいかもしれないね。\n女\nおんな\nの店\nてん\n員\nいん\nは店\nみせ\nについて何\nなに\nが問\nもん\n題\nだい\nだと言\nい\nっていますか。\n6 番\n女\nおんな\nの学\nがく\n生\nせい\nと男\nおとこ\nの学\nがく\n生\nせい\nが授\nじゅ\n業\nぎょう\nの発\nはっ\n表\nぴょう\nで使\nつか\nう資\nし\n料\nりょう\nについて話\nはな\nしています。二\nふたり\n人はこのあとまず何\nなに\nをしますか。\nＦ ： ねえ、社\nしゃ\n会\nかい\n学\nがく\nの授\nじゅ\n業\nぎょう\nで一\nいっ\n緒\nしょ\nにやる発\nはっ\n表\nぴょう\nのことなんだけど。\nＭ ： うん。準\nじゅん\n備\nび\nも終\nお\nわったし、発\nはっ\n表\nぴょう\nを待\nま\nつだけだね。\nＦ ： 実\nじつ\nはね、昨\nきのう\n日、ゼミの先\nせん\n輩\nぱい\nに私\nわたし\nたちが準\nじゅん\n備\nび\nした、発\nはっ\n表\nぴょう\nで使\nつか\nう資\nし\n料\nりょう\nとか発\nはっ\n表\nぴょう\nの流\nなが\nれを見\nみ\nて\nもらったら、先\nせん\n輩\nぱい\nが問\nもん\n題\nだい\n点\nてん\nをいくつかあげてくれて。直\nなお\nしたほうがいいと思\nおも\nうんだ。\nＭ ： どこ？\nＦ ： うん。まずね、せっかく自\nじ\n分\nぶん\nたちで調\nちょう\n査\nさ\nして、面\nおも\n白\nしろ\nい結\nけっ\n果\nか\nが出\nで\nてるのに、数\nすう\n字\nじ\nが並\nなら\nんでるだ\nけだから、伝\nつた\nわりにくいって。\nＭ ： じゃ、グラフを加\nくわ\nえようか。\nＦ ： そうだね。それからもう一\nいっ\n点\nてん\n、私\nわたし\nたちの主\nしゅ\n張\nちょう\nが発\nはっ\n表\nぴょう\nの最\nさい\n後\nご\nにしかないから、途\nと\n中\nちゅう\nまで何\nなに\nが言\nい\nいたいのか分\nわ\nからないって。ねえ、発\nはっ\n表\nぴょう\nの流\nなが\nれ、変\nか\nえてみない？\nＭ ： うん、やってみよう。流\nなが\nれを変\nか\nえたら、調\nちょう\n査\nさ\n結\nけっ\n果\nか\nの見\nみ\nせ方\nかた\nも変\nか\nわってくるだろうから、グラ\nフのことは後\nあと\nにして、それからやろう。\nＦ ： うん。\n聴解スクリプト\n7\n\nＭ ： 先\nせん\n輩\nぱい\nにお礼\nれい\n言\nい\nっといてね。\n二\nふたり\n人はこのあとまず何\nなに\nをしますか。\n問題3\n例\n女\nおんな\nの人\nひと\nが友\nとも\n達\nだち\nのうちに来\nき\nて、話\nはな\nしています。\nＦ１ ： 田\nた\n中\nなか\nです。\nＦ２ ： あ、はあい。昨\nきのう\n日友\nとも\n達\nだち\nが泊\nと\nまりに来\nき\nてたんで、片\nかた\n付\nづ\nいてないけど、入\nはい\nって。\nＦ１ ： あ、でもここで。すぐ帰\nかえ\nるから。あのう、この前\nまえ\n借\nか\nりた本\nほん\nなんだけど、ちょっと破\nやぶ\nれちゃって。\nＦ２ ： え、本\nほん\n当\nとう\n？\nＦ１ ： うん、このページなんだけど。\nＦ２ ： あっ、うん、このくらいなら大\nだい\n丈\nじょう\n夫\nぶ\n。読\nよ\nめるし。\nＦ１ ： ほんと？　ごめん。これからは気\nき\nをつけるから。\nＦ２ ： うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１ ： ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nのうちへ何\nなに\nをしに来\nき\nましたか。\n１． 謝\nあやま\nりに来\nき\nた\n２． 本\nほん\nを借\nか\nりに来\nき\nた\n３． 泊\nと\nまりに来\nき\nた\n４． コーヒーを飲\nの\nみに来\nき\nた\n聴解スクリプト\n8\n\n1 番\nテレビでアナウンサーが話\nはな\nしています。\nＦ ： 皆\nみな\nさん、突\nとつ\n然\nぜん\nですが、私\nわたし\n、左\nひだり\n利\nき\nきなんです。マイクを持\nも\nつのも左\nひだり\n手\nて\n、はしを持\nも\nつのも左\nひだり\n手\nて\nです。今\nいま\n来\nき\nているこちらのお店\nみせ\n、文\nぶん\n房\nぼう\n具\nぐ\nなど、ちょっと見\nみ\nたところよくある普\nふ\n通\nつう\nのものが\n売\nう\nられていますが、大\nたい\n変\nへん\n人\nにん\n気\nき\nがあって、全\nぜん\n国\nこく\nからお客\nきゃく\nさんが集\nあつ\nまってくるそうです。すべ\nての商\nしょう\n品\nひん\nが左\nひだり\n利\nき\nきの人\nひと\nのためのものなんです。普\nふ\n段\nだん\nはあまり意\nい\n識\nしき\nしないかもしれませんが、\n普\nふ\n通\nつう\nのはさみ、包\nほう\n丁\nちょう\nなどは右\nみぎ\n手\nて\nで使\nつか\nうように作\nつく\nられています。こちらのお店\nみせ\nには、日\nにち\n常\nじょう\n使\nつか\nうものからパソコンのキーボードなどの電\nでん\n気\nき\n製\nせい\n品\nひん\n、ギターなどの楽\nがっ\n器\nき\nまであるんですよ。す\nごいですね。\nアナウンサーは主\nおも\nに何\nなに\nについて話\nはな\nしていますか。\n１． 左\nひだり\n利\nき\nき用\nよう\nの道\nどう\n具\nぐ\nの特\nとく\n徴\nちょう\n２． 左\nひだり\n利\nき\nきの人\nひと\nの苦\nく\n労\nろう\n３． この店\nみせ\nで扱\nあつか\nっている商\nしょう\n品\nひん\n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、指\nし\n導\nどう\n者\nしゃ\nになることも考\nかんが\nえました。でも、目\nもく\n標\nひょう\nを持\nも\nって頑\nがん\n張\nば\nる若\nわか\nい選\nせん\n手\nしゅ\nたちの試\nし\n合\nあい\nを\n見\nみ\nて、まだあきらめられない気\nき\n持\nも\nちが出\nで\nてきました。自\nじ\n分\nぶん\nもその場\nば\n所\nしょ\nに立\nた\nちたいと思\nおも\nい、選\nせん\n手\nしゅ\nを育\nそだ\nてるのはもう少\nすこ\nし先\nさき\nでもいいと思\nおも\nったんです。休\nやす\nんでいる間\nあいだ\nも応\nおう\n援\nえん\nしてくださった方\nかた\nたちのためにも、新\nあたら\nしい気\nき\n持\nも\nちでやっていきたいと思\nおも\nいます。\nこのスポーツ選\nせん\n手\nしゅ\nが伝\nつた\nえたいことは何\nなん\nですか。\n１． 選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむということ\n２． 選\nせん\n手\nしゅ\nをやめるということ\n３． 指\nし\n導\nどう\n者\nしゃ\nになるということ\n４． もう一\nいち\n度\nど\n選\nせん\n手\nしゅ\nとして活\nかつ\n動\nどう\nするということ\n聴解スクリプト\n9\n\n3 番\nテレビで博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nが話\nはな\nしています。\nＭ ： 子\nこ\n供\nども\nに科\nか\n学\nがく\nを好\nす\nきになってもらいたいご両\nりょう\n親\nしん\n、多\nおお\nいと思\nおも\nいます。でも、子\nこ\n供\nども\nに正\nただ\nしく分\nわ\nかっ\nてもらおうと、つい大\nおとな\n人に説\nせつ\n明\nめい\nするときのように数\nすう\n学\nがく\n的\nてき\  ： 実\nじつ\nはね、昨\nきのう\n日、ゼミの先\nせん\n輩\nぱい\nに私\nわたし\nたちが準\nじゅん\n備\nび\nした、発\nはっ\n表\nぴょう\nで使\nつか\nう資\nし\n料\nりょう\nとか発\nはっ\n表\nぴょう\nの流\nなが\nれを見\nみ\nて\nもらったら、先\nせん\n輩\nぱい\nが問\nもん\n題\nだい\n点\nてん\nをいくつかあげてくれて。直\nなお\nしたほうがいいと思\nおも\nうんだ。\nＭ ： どこ？\nＦ ： うん。まずね、せっかく自\nじ\n分\nぶん\nたちで調\nちょう\n査\nさ\nして、面\nおも\n白\nしろ\nい結\nけっ\n果\nか\nが出\nで\nてるのに、数\nすう\n字\nじ\nが並\nなら\nんでるだ\nけだから、伝\nつた\nわりにくいって。\nＭ ： じゃ、グラフを加\nくわ\nえようか。\nＦ ： そうだね。それからもう一\nいっ\n点\nてん\n、私\nわたし\nたちの主\nしゅ\n張\nちょう\nが発\nはっ\n表\nぴょう\nの最\nさい\n後\nご\nにしかないから、途\nと\n中\nちゅう\nまで何\nなに\nが言\nい\nいたいのか分\nわ\nからないって。ねえ、発\nはっ\n表\nぴょう\nの流\nなが\nれ、変\nか\nえてみない？\nＭ ： うん、やってみよう。流\nなが\nれを変\nか\nえたら、調\nちょう\n査\nさ\n結\nけっ\n果\nか\nの見\nみ\nせ方\nかた\nも変\nか\nわってくるだろうから、グラ\nフのことは後\nあと\nにして、それからやろう。\nＦ ： うん。\n聴解スクリプト\n7\n\nＭ ： 先\nせん\n輩\nぱい\nにお礼\nれい\n言\nい\nっといてね。\n二\nふたり\n人はこのあとまず何\nなに\nをしますか。\n問題3\n例\n女\nおんな\nの人\nひと\nが友\nとも\n達\nだち\nのうちに来\nき\nて、話\nはな\nしています。\nＦ１ ： 田\nた\n中\nなか\nです。\nＦ２ ： あ、はあい。昨\nきのう\n日友\nとも\n達\nだち\nが泊\nと\nまりに来\nき\nてたんで、片\nかた\n付\nづ\nいてないけど、入\nはい\nって。\nＦ１ ： あ、でもここで。すぐ帰\nかえ\nるから。あのう、この前\nまえ\n借\nか\nりた本\nほん\nなんだけど、ちょっと破\nやぶ\nれちゃって。\nＦ２ ： え、本\nほん\n当\nとう\n？\nＦ１ ： うん、このページなんだけど。\nＦ２ ： あっ、うん、このくらいなら大\nだい\n丈\nじょう\n夫\nぶ\n。読\nよ\nめるし。\nＦ１ ： ほんと？　ごめん。これからは気\nき\nをつけるから。\nＦ２ ： うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１ ： ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nのうちへ何\nなに\nをしに来\nき\nましたか。\n１． 謝\nあやま\nりに来\nき\nた\n２． 本\nほん\nを借\nか\nりに来\nき\nた\n３． 泊\nと\nまりに来\nき\nた\n４． コーヒーを飲\nの\nみに来\nき\nた\n聴解スクリプト\n8\n\n1 番\nテレビでアナウンサーが話\nはな\nしています。\nＦ ： 皆\nみな\nさん、突\nとつ\n然\nぜん\nですが、私\nわたし\n、左\nひだり\n利\nき\nきなんです。マイクを持\nも\nつのも左\nひだり\n手\nて\n、はしを持\nも\nつのも左\nひだり\n手\nて\nです。今\nいま\n来\nき\nているこちらのお店\nみせ\n、文\nぶん\n房\nぼう\n具\nぐ\nなど、ちょっと見\nみ\nたところよくある普\nふ\n通\nつう\nのものが\n売\nう\nられていますが、大\nたい\n変\nへん\n人\nにん\n気\nき\nがあって、全\nぜん\n国\nこく\nからお客\nきゃく\nさんが集\nあつ\nまってくるそうです。すべ\nての商\nしょう\n品\nひん\nが左\nひだり\n利\nき\nきの人\nひと\nのためのものなんです。普\nふ\n段\nだん\nはあまり意\nい\n識\nしき\nしないかもしれませんが、\n普\nふ\n通\nつう\nのはさみ、包\nほう\n丁\nちょう\nなどは右\nみぎ\n手\nて\nで使\nつか\nうように作\nつく\nられています。こちらのお店\nみせ\nには、日\nにち\n常\nじょう\n使\nつか\nうものからパソコンのキーボードなどの電\nでん\n気\nき\n製\nせい\n品\nひん\n、ギターなどの楽\nがっ\n器\nき\nまであるんですよ。す\nごいですね。\nアナウンサーは主\nおも\nに何\nなに\nについて話\nはな\nしていますか。\n１． 左\nひだり\n利\nき\nき用\nよう\nの道\nどう\n具\nぐ\nの特\nとく\n徴\nちょう\n２． 左\nひだり\n利\nき\nきの人\nひと\nの苦\nく\n労\nろう\n３． この店\nみせ\nで扱\nあつか\nっている商\nしょう\n品\nひん\n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、指\nし\n導\nどう\n者\nしゃ\nになることも考\nかんが\nえました。でも、目\nもく\n標\nひょう\nを持\nも\nって頑\nがん\n張\nば\nる若\nわか\nい選\nせん\n手\nしゅ\nたちの試\nし\n合\nあい\nを\n見\nみ\nて、まだあきらめられない気\nき\n持\nも\nちが出\nで\nてきました。自\nじ\n分\nぶん\nもその場\nば\n所\nしょ\nに立\nた\nちたいと思\nおも\nい、選\nせん\n手\nしゅ\nを育\nそだ\nてるのはもう少\nすこ\nし先\nさき\nでもいいと思\nおも\nったんです。休\nやす\nんでいる間\nあいだ\nも応\nおう\n援\nえん\nしてくださった方\nかた\nたちのためにも、新\nあたら\nしい気\nき\n持\nも\nちでやっていきたいと思\nおも\nいます。\nこのスポーツ選\nせん\n手\nしゅ\nが伝\nつた\nえたいことは何\nなん\nですか。\n１． 選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむということ\n２． 選\nせん\n手\nしゅ\nをやめるということ\n３． 指\nし\n導\nどう\n者\nしゃ\nになるということ\n４． もう一\nいち\n度\nど\n選\nせん\n手\nしゅ\nとして活\nかつ\n動\nどう\nするということ\n聴解スクリプト\n9\n\n3 番\nテレビで博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nが話\nはな\nしています。\nＭ ： 子\nこ\n供\nども\nに科\nか\n学\nがく\nを好\nす\nきになってもらいたいご両\nりょう\n親\nしん\n、多\nおお\nいと思\nおも\nいます。でも、子\nこ\n供\nども\nに正\nただ\nしく分\nわ\nかっ\nてもらおうと、つい大\nおとな\n人に説\nせつ\n明\nめい\nするときのように数\nすう\n学\nがく\n的\nてき\nな話\nはなし\nや専\nせん\n門\nもん\n的\nてき\nな話\nはなし\nをしていません\nか。子\nこ\n供\nども\nには難\nむずか\nしい話\nはなし\nをしてもしかたありません。言\nこと\n葉\nば\nで詳\nくわ\nしく説\nせつ\n明\nめい\nするよりも実\nじっ\n際\nさい\nに経\nけい\n験\nけん\nさせることが大\nたい\n切\nせつ\nなんです。例\nたと\nえば、月\nつき\nでの重\nおも\nさの感\nかん\nじ方\nかた\nを教\nおし\nえるときだったら、地\nち\n球\nきゅう\nで\n1 キログラムのものが月\nつき\nではどのくらいの重\nおも\nさに感\nかん\nじるか、持\nも\nった感\nかん\n覚\nかく\nで分\nわ\nかるようにする\nといいですよ。\n博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nは何\nなに\nについて話\nはな\nしていますか。\n１． 子\nこ\n供\nども\nが科\nか\n学\nがく\nを好\nす\nきな理\nり\n由\nゆう\n２． 子\nこ\n供\nども\nへの科\nか\n学\nがく\nの教\nおし\nえ方\nかた\n３． 子\nこ\n供\nども\nに科\nか\n学\nがく\nを学\nまな\nばせる理\nり\n由\nゆう\n４． 子\nこ\n供\nども\nにとって必\nひつ\n要\nよう\nな科\nか\n学\nがく\nの知\nち\n識\nしき\n問題4\n例\nホテルのテレビが壊\nこわ\nれています。何\nなん\nと言\nい\nいますか。\nＦ ： １．テレビがつかないんですが。\n \n ２．テレビをつけてもいいですか。\n \n ３．テレビをつけたほうがいいですよ。\n1 番\n約\nやく\n束\nそく\nの時\nじ\n間\nかん\nに少\nすこ\nし遅\nおく\nれました。友\nとも\n達\nだち\nに何\nなん\nと言\nい\nいますか。  \nＦ ： １．待\nま\nたせてごめん。\n \n ２．急\nいそ\nがせちゃってごめん。\n \n ３．ごめん、お先\nさき\nに。\n聴解スクリプト\n10\n\n2 番\n観\nかん\n光\nこう\nの案\nあん\n内\nない\nをしています。建\nたて\n物\nもの\nを見\nみ\nてもらいたいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．こちらでお目\nめ\nにかかります。\n \n ２．こちらをご覧\nらん\nください。\n \n ３．お見\nみ\nせくださいますか。\n3 番\n荷\nに\n物\nもつ\nを受\nう\nけ取\nと\nります。サインするところが分\nわ\nかりません。何\nなん\nと言\nい\nいますか。\nＭ ： １．どこにサインが書\nか\nいてありますか。\n \n ２．どこでサインを渡\nわた\nしましょうか。\n \n ３．どこにサインをすればいいですか。\n4 番\n今\nきょう\n日はあまりおなかがすいていません。ご飯\nはん\nを普\nふ\n通\nつう\nより少\nすく\nなくしてほしいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．ご飯\nはん\n、少\nすく\nなすぎるんですけど。\n \n ２．ご飯\nはん\n、あと少\nすこ\nしほしいです。\n \n ３．ご飯\nはん\n、少\nすく\nな目\nめ\nでお願\nねが\nいします。\n問題5\n例\nＭ ： すみません、今\nいま\n、時\nじ\n間\nかん\n、ありますか。\nＦ ： １．ええと、１０時\nじ\n２０分\nぷん\nです。\n \n ２．ええ。何\nなん\nですか。\n \n ３．時\nと\n計\nけい\nはあそこですよ。\n聴解スクリプト\n11\n\n1 番\nＭ ： 山\nやま\n田\nだ\nさん、作\nつく\nり直\nなお\nしてくれた資\nし\n料\nりょう\n、見\nみ\nやすくなってましたよ。  \nＦ ： １．ありがとうございます。よかったです。\n \n ２．分\nわ\nかりました。すぐに直\nなお\nします。\n \n ３．もっと簡\nかん\n単\nたん\nにするんですか。\n2 番\nＦ ： ねえ、ちょっと木\nき\n村\nむら\nさんに用\nよう\nがあるんだけど、見\nみ\nなかった？\nＭ ： １．じゃ、一\nいっ\n緒\nしょ\nに見\nみ\nよう。\n \n ２．特\nとく\nに用\nよう\nはないんだけど。\n \n ３．さあ。ほかの人\nひと\nに聞\nき\nいてみて。\n3 番\nＭ ： 昨\nきのう\n日貸\nか\nしてくれた本\nほん\n、読\nよ\nみ出\nだ\nしたら止\nと\nまらなくなっちゃったよ。\nＦ ： １．じゃ、全\nぜん\n部\nぶ\n読\nよ\nまなくてもいいよ。\n \n ２．けっこうおもしろかったでしょう。\n \n ３．本\nほん\n、なくなっちゃったの？\n4 番\nＦ ： どうぞお入\nはい\nりください。すぐお茶\nちゃ\n入\nい\nれますから。  \nＭ ： １．おかまいなく。\n \n ２．ごちそうさまでした。\n \n ３．どういたしまして。\n5 番\nＭ：　リーさん、あのう、リーさんの研\nけん\n究\nきゅう\nでお聞\nき\nきしたいことがあるんですが。  \nＦ ： １．あ、はい、どんなことでしょうか。\n \n ２．ああ、聞\nき\nいたことがあります。\n \n ３．いえ、質\nしつ\n問\nもん\nはありませんが。\n聴解スクリプト\n12\n\n6 番\nＭ ： 友\nとも\n達\nだち\nに赤\nあか\nちゃんが生\nう\nまれたんだけど、どんなものをあげたらいいと思\nおも\nう？  \nＦ ： １．うん、それがいいと思\nおも\nうよ。\n \n ２．プレゼントをあげたらどう？  \n \n ３．何\nなん\nでも喜\nよろこ\nんでくれるんじゃない？\n7 番\nＦ ： 吉\nよし\n田\nだ\nさん、吉\nよし\n田\nだ\nさんはどちらのご出\nしゅっ\n身\nしん\nですか。\nＭ ： １．東\nとう\n京\nきょう\nの貿\nぼう\n易\nえき\n会\nがい\n社\nしゃ\nで働\nはたら\nいています。\n \n ２．生\nう\nまれたのは東\nとう\n京\nきょう\nですが、京\nきょう\n都\nと\nで育\nそだ\nちました。  \n \n ３．これから東 とね。ああ、私\nわたし\nも頑\nがん\n張\nば\nって働\nはたら\nかないと。去\nきょ\n年\nねん\n家\nいえ\n買\nか\nうのに貯\nちょ\n金\nきん\n全\nぜん\n部\nぶ\n使\nつか\nっちゃったからな。\nＭ ： 家\nいえ\n買\nか\nったんだから、すごいよ。僕\nぼく\nが家\nいえ\nを買\nか\nえるのは、いつになるか。\n男\nおとこ\nの人\nひと\nは何\nなん\nのために貯\nちょ\n金\nきん\nを始\nはじ\nめましたか。\n聴解スクリプト\n5\n\n3 番\n留\nる\n守\nす\n番\nばん\n電\nでん\n話\nわ\nのメッセージを聞\nき\nいています。女\nおんな\nの学\nがく\n生\nせい\nはどうして食\nしょく\n事\nじ\nに行\nい\nけないと言\nい\nっていますか。\nＦ ： 田\nた\n中\nなか\nです。今\nきょう\n日のランチの約\nやく\n束\nそく\nなんだけど、ごめん。昨\nきのう\n日の夜\nよる\n、うちの猫\nねこ\nが怪\nけ\n我\nが\nしてね、\n今\nきょう\n日母\nはは\nが病\nびょう\n院\nいん\nに連\nつ\nれてく予\nよ\n定\nてい\nだったんだけど、急\nきゅう\nな用\nよう\n事\nじ\nができたから私\nわたし\nに行\nい\nってくれって。\nごめんね。あ、それと、私\nわたし\n、今\nきょう\n日の夕\nゆう\n方\nがた\nはアルバイトがあるからクラブの話\nはな\nし合\nあ\nいに出\nで\nられ\nないって言\nい\nってたけど、バイトの日\nひ\nが変\nか\nわって、行\nい\nけることになったよ。じゃ、後\nあと\nでね。ほ\nんとごめんね。\n女\nおんな\nの学\nがく\n生\nせい\nはどうして食\nしょく\n事\nじ\nに行\nい\nけないと言\nい\nっていますか。\n4 番\n会\nかい\n社\nしゃ\nで男\nおとこ\nの人\nひと\nと外\nがい\n国\nこく\n人\nじん\nの女\nおんな\nの人\nひと\nが話\nはな\nしています。男\nおとこ\nの人\nひと\nはこれからどうやって女\nおんな\nの人\nひと\nの国\nくに\nの言\nこと\n葉\nば\nを勉\nべん\n強\nきょう\nすることにしましたか。\nＭ ： サラさん、今\nこん\n度\nど\nサラさんの国\nくに\nに2 か月\nげつ\n出\nしゅっ\n張\nちょう\nすることになったんだ。少\nすこ\nし言\nこと\n葉\nば\nを習\nなら\nいたいん\nだけど、だれか教\nおし\nえてくれる人\nひと\nいない？ 　サラさんは忙\nいそが\nしいよね。\nＦ ： うん、私\nわたし\nはちょっと。あ、友\nとも\n達\nだち\n、紹\nしょう\n介\nかい\nするよ。いい人\nひと\nがいる。\nＭ ： よかった。テレビの外\nがい\n国\nこく\n語\nご\n学\nがく\n習\nしゅう\nの番\nばん\n組\nぐみ\n見\nみ\nてやってみたけど、なんかよく分\nわ\nからなくて。\nＦ ： その友\nとも\n達\nだち\n、日\nに\n本\nほん\n語\nご\nはあまりできないんだけど、国\nくに\nで外\nがい\n国\nこく\n人\nじん\nに教\nおし\nえたこともあるよ。\nＭ ： え、日\nに\n本\nほん\n語\nご\nできないの？　この前\nまえ\n一\nいち\n度\nど\n、「インターネットで会\nかい\n話\nわ\nのレッスン」っていうの受\nう\nけ\nてみたんだけど、日\nに\n本\nほん\n語\nご\nの説\nせつ\n明\nめい\n少\nすく\nなくて困\nこま\nったんだよ。それはグループレッスンだったから、\n質\nしつ\n問\nもん\nもあまりできなくて。\nＦ ： どこか学\nがっ\n校\nこう\nは探\nさが\nしてみた？\nＭ ： インターネットで探\nさが\nしたけど、うちから通\nかよ\nえるところにはなかったんだ。うーん、やっぱり\n個\nこ\n人\nじん\nレッスンがいいから、その人\nひと\nに頼\nたの\nんでもらえる？\nＦ ： うん。分\nわ\nかった。私\nわたし\nも日\nに\n本\nほん\n語\nご\nを習\nなら\nったとき、日\nに\n本\nほん\n語\nご\nだけで教\nおそ\nわったからきっと大\nだい\n丈\nじょう\n夫\nぶ\n。\n男\nおとこ\nの人\nひと\nはこれからどうやって女\nおんな\nの人\nひと\nの国\nくに\nの言\nこと\n葉\nば\nを勉\nべん\n強\nきょう\nすることにしましたか。\n聴解スクリプト\n6\n\n5 番\nレストランで店\nてん\n長\nちょう\nと女\nおんな\nの店\nてん\n員\nいん\nが話\nはな\nしています。女\nおんな\nの店\nてん\n員\nいん\nは店\nみせ\nについて何\nなに\nが問\nもん\n題\nだい\nだと言\nい\nっていま\nすか。\nＭ ： 店\nみせ\nがオープンしてやっと1 か月\nげつ\n経\nた\nったけど、何\nなに\nか気\nき\nづいたことある？\nＦ ： そうですね。はじめは、朝\nあさ\n6 時\nじ\nっていう開\nかい\n店\nてん\nの時\nじ\n間\nかん\nはちょっと早\nはや\nいと思\nおも\nって、お客\nきゃく\n様\nさま\nがいらっ\nしゃるかどうか心\nしん\n配\nぱい\nだったんですが、近\nきん\n所\nじょ\nの方\nかた\nがよく朝\nちょう\n食\nしょく\nを食\nた\nべに来\nき\nてくださるので、驚\nおどろ\nきました。\nＭ ： 確\nたし\nかに予\nよ\n想\nそう\n以\nい\n上\nじょう\nだったね。\nＦ ： はい。それと、食\nしょく\n事\nじ\nがすんでいるのに、ずっとお帰\nかえ\nりにならない方\nかた\nがけっこういらっしゃる\nのが気\nき\nになります。アルバイトの森\nもり\nさんが言\nい\nってたんですけど、せっかく来\nき\nてくださったお\n客\nきゃく\n様\nさま\nが席\nせき\nがなくて入\nはい\nれないっていうことが何\nなん\n回\nかい\nかあったそうです。\nＭ ： そういうときは、お客\nきゃく\n様\nさま\nの気\nき\n分\nぶん\nを悪\nわる\nくさせずに席\nせき\nを空\nあ\nけていただくように頼\nたの\nまなきゃいけな\nいんだけど。うちの店\nみせ\nは若\nわか\nい店\nてん\n員\nいん\nが多\nおお\nいから、上\nじょう\n手\nず\nに伝\nつた\nえるのは難\nむずか\nしいかもしれないね。\n女\nおんな\nの店\nてん\n員\nいん\nは店\nみせ\nについて何\nなに\nが問\nもん\n題\nだい\nだと言\nい\nっていますか。\n6 番\n女\nおんな\nの学\nがく\n生\nせい\nと男\nおとこ\nの学\nがく\n生\nせい\nが授\nじゅ\n業\nぎょう\nの発\nはっ\n表\nぴょう\nで使\nつか\nう資\nし\n料\nりょう\nについて話\nはな\nしています。二\nふたり\n人はこのあとまず何\nなに\nをしますか。\nＦ ： ねえ、社\nしゃ\n会\nかい\n学\nがく\nの授\nじゅ\n業\nぎょう\nで一\nいっ\n緒\nしょ\nにやる発\nはっ\n表\nぴょう\nのことなんだけど。\nＭ ： うん。準\nじゅん\n備\nび\nも終\nお\nわったし、発\nはっ\n表\nぴょう\nを待\nま\nつだけだね。\nＦ ： 実\nじつ\nはね、昨\nきのう\n日、ゼミの先\nせん\n輩\nぱい\nに私\nわたし\nたちが準\nじゅん\n備\nび\nした、発\nはっ\n表\nぴょう\nで使\nつか\nう資\nし\n料\nりょう\nとか発\nはっ\n表\nぴょう\nの流\nなが\nれを見\nみ\nて\nもらったら、先\nせん\n輩\nぱい\nが問\nもん\n題\nだい\n点\nてん\nをいくつかあげてくれて。直\nなお\nしたほうがいいと思\nおも\nうんだ。\nＭ ： どこ？\nＦ ： うん。まずね、せっかく自\nじ\n分\nぶん\nたちで調\nちょう\n査\nさ\nして、面\nおも\n白\nしろ\nい結\nけっ\n果\nか\nが出\nで\nてるのに、数\nすう\n字\nじ\nが並\nなら\nんでるだ\nけだから、伝\nつた\nわりにくいって。\nＭ ： じゃ、グラフを加\nくわ\nえようか。\nＦ ： そうだね。それからもう一\nいっ\n点\nてん\n、私\nわたし\nたちの主\nしゅ\n張\nちょう\nが発\nはっ\n表\nぴょう\nの最\nさい\n後\nご\nにしかないから、途\nと\n中\nちゅう\nまで何\nなに\nが言\nい\nいたいのか分\nわ\nからないって。ねえ、発\nはっ\n表\nぴょう\nの流\nなが\nれ、変\nか\nえてみない？\nＭ ： うん、やってみよう。流\nなが\nれを変\nか\nえたら、調\nちょう\n査\nさ\n結\nけっ\n果\nか\nの見\nみ\nせ方\nかた\nも変\nか\nわってくるだろうから、グラ\nフのことは後\nあと\nにして、それからやろう。\nＦ ： うん。\n聴解スクリプト\n7\n\nＭ ： 先\nせん\n輩\nぱい\nにお礼\nれい\n言\nい\nっといてね。\n二\nふたり\n人はこのあとまず何\nなに\nをしますか。\n問題3\n例\n女\nおんな\nの人\nひと\nが友\nとも\n達\nだち\nのうちに来\nき\nて、話\nはな\nしています。\nＦ１ ： 田\nた\n中\nなか\nです。\nＦ２ ： あ、はあい。昨\nきのう\n日友\nとも\n達\nだち\nが泊\nと\nまりに来\nき\nてたんで、片\nかた\n付\nづ\nいてないけど、入\nはい\nって。\nＦ１ ： あ、でもここで。すぐ帰\nかえ\nるから。あのう、この前\nまえ\n借\nか\nりた本\nほん\nなんだけど、ちょっと破\nやぶ\nれちゃって。\nＦ２ ： え、本\nほん\n当\nとう\n？\nＦ１ ： うん、このページなんだけど。\nＦ２ ： あっ、うん、このくらいなら大\nだい\n丈\nじょう\n夫\nぶ\n。読\nよ\nめるし。\nＦ１ ： ほんと？　ごめん。これからは気\nき\nをつけるから。\nＦ２ ： うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１ ： ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nのうちへ何\nなに\nをしに来\nき\nましたか。\n１． 謝\nあやま\nりに来\nき\nた\n２． 本\nほん\nを借\nか\nりに来\nき\nた\n３． 泊\nと\nまりに来\nき\nた\n４． コーヒーを飲\nの\nみに来\nき\nた\n聴解スクリプト\n8\n\n1 番\nテレビでアナウンサーが話\nはな\nしています。\nＦ ： 皆\nみな\nさん、突\nとつ\n然\nぜん\nですが、私\nわたし\n、左\nひだり\n利\nき\nきなんです。マイクを持\nも\nつのも左\nひだり\n手\nて\n、はしを持\nも\nつのも左\nひだり\n手\nて\nです。今\nいま\n来\nき\nているこちらのお店\nみせ\n、文\nぶん\n房\nぼう\n具\nぐ\nなど、ちょっと見\nみ\nたところよくある普\nふ\n通\nつう\nのものが\n売\nう\nられていますが、大\nたい\n変\nへん\n人\nにん\n気\nき\nがあって、全\nぜん\n国\nこく\nからお客\nきゃく\nさんが集\nあつ\nまってくるそうです。すべ\nての商\nしょう\n品\nひん\nが左\nひだり\n利\nき\nきの人\nひと\nのためのものなんです。普\nふ\n段\nだん\nはあまり意\nい\n識\nしき\nしないかもしれませんが、\n普\nふ\n通\nつう\nのはさみ、包\nほう\n丁\nちょう\nなどは右\nみぎ\n手\nて\nで使\nつか\nうように作\nつく\nられています。こちらのお店\nみせ\nには、日\nにち\n常\nじょう\n使\nつか\nうものからパソコンのキーボードなどの電\nでん\n気\nき\n製\nせい\n品\nひん\n、ギターなどの楽\nがっ\n器\nき\nまであるんですよ。す\nごいですね。\nアナウンサーは主\nおも\nに何\nなに\nについて話\nはな\nしていますか。\n１． 左\nひだり\n利\nき\nき用\nよう\nの道\nどう\n具\nぐ\nの特\nとく\n徴\nちょう\n２． 左\nひだり\n利\nき\nきの人\nひと\nの苦\nく\n労\nろう\n３． この店\nみせ\nで扱\nあつか\nっている商\nしょう\n品\nひん\n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、指\nし\n導\nどう\n者\nしゃ\nになることも考\nかんが\nえました。でも、目\nもく\n標\nひょう\nを持\nも\nって頑\nがん\n張\nば\nる若\nわか\nい選\nせん\n手\nしゅ\nたちの試\nし\n合\nあい\nを\n見\nみ\nて、まだあきらめられない気\nき\n持\nも\nちが出\nで\nてきました。自\nじ\n分\nぶん\nもその場\nば\n所\nしょ\nに立\nた\nちたいと思\nおも\nい、選\nせん\n手\nしゅ\nを育\nそだ\nてるのはもう少\nすこ\nし先\nさき\nでもいいと思\nおも\nったんです。休\nやす\nんでいる間\nあいだ\nも応\nおう\n援\nえん\nしてくださった方\nかた\nたちのためにも、新\nあたら\nしい気\nき\n持\nも\nちでやっていきたいと思\nおも\nいます。\nこのスポーツ選\nせん\n手\nしゅ\nが伝\nつた\nえたいことは何\nなん\nですか。\n１． 選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむということ\n２． 選\nせん\n手\nしゅ\nをやめるということ\n３． 指\nし\n導\nどう\n者\nしゃ\nになるということ\n４． もう一\nいち\n度\nど\n選\nせん\n手\nしゅ\nとして活\nかつ\n動\nどう\nするということ\n聴解スクリプト\n9\n\n3 番\nテレビで博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nが話\nはな\nしています。\nＭ ： 子\nこ\n供\nども\nに科\nか\n学\nがく\nを好\nす\nきになってもらいたいご両\nりょう\n親\nしん\n、多\nおお\nいと思\nおも\nいます。でも、子\nこ\n供\nども\nに正\nただ\nしく分\nわ\nかっ\nてもらおうと、つい大\nおとな\n人に説\nせつ\n明\nめい\nするときのように数\nすう\n学\nがく\n的\nてき\nな話\nはなし\nや専\nせん\n門\nもん\n的\nてき\nな話\nはなし\nをしていません\nか。子\nこ\n供\nども\nには難\nむずか\nしい話\nはなし\nをしてもしかたありません。言\nこと\n葉\nば\nで詳\nくわ\nしく説\nせつ\n明\nめい\nするよりも実\nじっ\n際\nさい\nに経\nけい\n験\nけん\nさせることが大\nたい\n切\nせつ\nなんです。例\nたと\nえば、月\nつき\nでの重\nおも\nさの感\nかん\nじ方\nかた\nを教\nおし\nえるときだったら、地\nち\n球\nきゅう\nで\n1 キログラムのものが月\nつき\nではどのくらいの重\nおも\nさに感\nかん\nじるか、持\nも\nった感\nかん\n覚\nかく\nで分\nわ\nかるようにする\nといいですよ。\n博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nは何\nなに\nについて話\nはな\nしていますか。\n１． 子\nこ\n供\nども\nが科\nか\n学\nがく\nを好\nす\nきな理\nり\n由\nゆう\n２． 子\nこ\n供\nども\nへの科\nか\n学\nがく\nの教\nおし\nえ方\nかた\n３． 子\nこ\n供\nども\nに科\nか\n学\nがく\nを学\nまな\nばせる理\nり\n由\nゆう\n４． 子\nこ\n供\nども\nにとって必\nひつ\n要\nよう\nな科\nか\n学\nがく\nの知\nち\n識\nしき\n問題4\n例\nホテルのテレビが壊\nこわ\nれています。何\nなん\nと言\nい\nいますか。\nＦ ： １．テレビがつかないんですが。\n \n ２．テレビをつけてもいいですか。\n \n ３．テレビをつけたほうがいいですよ。\n1 番\n約\nやく\n束\nそく\nの時\nじ\n間\nかん\nに少\nすこ\nし遅\nおく\nれました。友\nとも\n達\nだち\nに何\nなん\nと言\nい\nいますか。  \nＦ ： １．待\nま\nたせてごめん。\n \n ２．急\nいそ\nがせちゃってごめん。\n \n ３．ごめん、お先\nさき\nに。\n聴解スクリプト\n10\n\n2 番\n観\nかん\n光\nこう\nの案\nあん\n内\nない\nをしています。建\nたて\n物\nもの\nを見\nみ\nてもらいたいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．こちらでお目\nめ\nにかかります。\n \n ２．こちらをご覧\nらん\nください。\n \n ３．お見\nみ\nせくださいますか。\n3 番\n荷\nに\n物\nもつ\nを受\nう\nけ取\nと\nります。サインするところが分\nわ\nかりません。何\nなん\nと言\nい\nいますか。\nＭ ： １．どこにサインが書\nか\nいてありますか。\n \n ２．どこでサインを渡\nわた\nしましょうか。\n \n ３．どこにサインをすればいいですか。\n4 番\n今\nきょう\n日はあまりおなかがすいていません。ご飯\nはん\nを普\nふ\n通\nつう\nより少\nすく\nなくしてほしいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．ご飯\nはん\n、少\nすく\nなすぎるんですけど。\n \n ２．ご飯\nはん\n、あと少\nすこ\nしほしいです。\n \n ３．ご飯\nはん\n、少\nすく\nな目\nめ\nでお願\nねが\nいします。\n問題5\n例\nＭ ： すみま わる\nくさせずに席\nせき\nを空\nあ\nけていただくように頼\nたの\nまなきゃいけな\nいんだけど。うちの店\nみせ\nは若\nわか\nい店\nてん\n員\nいん\nが多\nおお\nいから、上\nじょう\n手\nず\nに伝\nつた\nえるのは難\nむずか\nしいかもしれないね。\n女\nおんな\nの店\nてん\n員\nいん\nは店\nみせ\nについて何\nなに\nが問\nもん\n題\nだい\nだと言\nい\nっていますか。\n6 番\n女\nおんな\nの学\nがく\n生\nせい\nと男\nおとこ\nの学\nがく\n生\nせい\nが授\nじゅ\n業\nぎょう\nの発\nはっ\n表\nぴょう\nで使\nつか\nう資\nし\n料\nりょう\nについて話\nはな\nしています。二\nふたり\n人はこのあとまず何\nなに\nをしますか。\nＦ ： ねえ、社\nしゃ\n会\nかい\n学\nがく\nの授\nじゅ\n業\nぎょう\nで一\nいっ\n緒\nしょ\nにやる発\nはっ\n表\nぴょう\nのことなんだけど。\nＭ ： うん。準\nじゅん\n備\nび\nも終\nお\nわったし、発\nはっ\n表\nぴょう\nを待\nま\nつだけだね。\nＦ ： 実\nじつ\nはね、昨\nきのう\n日、ゼミの先\nせん\n輩\nぱい\nに私\nわたし\nたちが準\nじゅん\n備\nび\nした、発\nはっ\n表\nぴょう\nで使\nつか\nう資\nし\n料\nりょう\nとか発\nはっ\n表\nぴょう\nの流\nなが\nれを見\nみ\nて\nもらったら、先\nせん\n輩\nぱい\nが問\nもん\n題\nだい\n点\nてん\nをいくつかあげてくれて。直\nなお\nしたほうがいいと思\nおも\nうんだ。\nＭ ： どこ？\nＦ ： うん。まずね、せっかく自\nじ\n分\nぶん\nたちで調\nちょう\n査\nさ\nして、面\nおも\n白\nしろ\nい結\nけっ\n果\nか\nが出\nで\nてるのに、数\nすう\n字\nじ\nが並\nなら\nんでるだ\nけだから、伝\nつた\nわりにくいって。\nＭ ： じゃ、グラフを加\nくわ\nえようか。\nＦ ： そうだね。それからもう一\nいっ\n点\nてん\n、私\nわたし\nたちの主\nしゅ\n張\nちょう\nが発\nはっ\n表\nぴょう\nの最\nさい\n後\nご\nにしかないから、途\nと\n中\nちゅう\nまで何\nなに\nが言\nい\nいたいのか分\nわ\nからないって。ねえ、発\nはっ\n表\nぴょう\nの流\nなが\nれ、変\nか\nえてみない？\nＭ ： うん、やってみよう。流\nなが\nれを変\nか\nえたら、調\nちょう\n査\nさ\n結\nけっ\n果\nか\nの見\nみ\nせ方\nかた\nも変\nか\nわってくるだろうから、グラ\nフのことは後\nあと\nにして、それからやろう。\nＦ ： うん。\n聴解スクリプト\n7\n\nＭ ： 先\nせん\n輩\nぱい\nにお礼\nれい\n言\nい\nっといてね。\n二\nふたり\n人はこのあとまず何\nなに\nをしますか。\n問題3\n例\n女\nおんな\nの人\nひと\nが友\nとも\n達\nだち\nのうちに来\nき\nて、話\nはな\nしています。\nＦ１ ： 田\nた\n中\nなか\nです。\nＦ２ ： あ、はあい。昨\nきのう\n日友\nとも\n達\nだち\nが泊\nと\nまりに来\nき\nてたんで、片\nかた\n付\nづ\nいてないけど、入\nはい\nって。\nＦ１ ： あ、でもここで。すぐ帰\nかえ\nるから。あのう、この前\nまえ\n借\nか\nりた本\nほん\nなんだけど、ちょっと破\nやぶ\nれちゃって。\nＦ２ ： え、本\nほん\n当\nとう\n？\nＦ１ ： うん、このページなんだけど。\nＦ２ ： あっ、うん、このくらいなら大\nだい\n丈\nじょう\n夫\nぶ\n。読\nよ\nめるし。\nＦ１ ： ほんと？　ごめん。これからは気\nき\nをつけるから。\nＦ２ ： うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１ ： ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nのうちへ何\nなに\nをしに来\nき\nましたか。\n１． 謝\nあやま\nりに来\nき\nた\n２． 本\nほん\nを借\nか\nりに来\nき\nた\n３． 泊\nと\nまりに来\nき\nた\n４． コーヒーを飲\nの\nみに来\nき\nた\n聴解スクリプト\n8\n\n1 番\nテレビでアナウンサーが話\nはな\nしています。\nＦ ： 皆\nみな\nさん、突\nとつ\n然\nぜん\nですが、私\nわたし\n、左\nひだり\n利\nき\nきなんです。マイクを持\nも\nつのも左\nひだり\n手\nて\n、はしを持\nも\nつのも左\nひだり\n手\nて\nです。今\nいま\n来\nき\nているこちらのお店\nみせ\n、文\nぶん\n房\nぼう\n具\nぐ\nなど、ちょっと見\nみ\nたところよくある普\nふ\n通\nつう\nのものが\n売\nう\nられていますが、大\nたい\n変\nへん\n人\nにん\n気\nき\nがあって、全\nぜん\n国\nこく\nからお客\nきゃく\nさんが集\nあつ\nまってくるそうです。すべ\nての商\nしょう\n品\nひん\nが左\nひだり\n利\nき\nきの人\nひと\nのためのものなんです。普\nふ\n段\nだん\nはあまり意\nい\n識\nしき\nしないかもしれませんが、\n普\nふ\n通\nつう\nのはさみ、包\nほう\n丁\nちょう\nなどは右\nみぎ\n手\nて\nで使\nつか\nうように作\nつく\nられています。こちらのお店\nみせ\nには、日\nにち\n常\nじょう\n使\nつか\nうものからパソコンのキーボードなどの電\nでん\n気\nき\n製\nせい\n品\nひん\n、ギターなどの楽\nがっ\n器\nき\nまであるんですよ。す\nごいですね。\nアナウンサーは主\nおも\nに何\nなに\nについて話\nはな\nしていますか。\n１． 左\nひだり\n利\nき\nき用\nよう\nの道\nどう\n具\nぐ\nの特\nとく\n徴\nちょう\n２． 左\nひだり\n利\nき\nきの人\nひと\nの苦\nく\n労\nろう\n３． この店\nみせ\nで扱\nあつか\nっている商\nしょう\n品\nひん\n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、指\nし\n導\nどう\n者\nしゃ\nになることも考\nかんが\nえました。でも、目\nもく\n標\nひょう\nを持\nも\nって頑\nがん\n張\nば\nる若\nわか\nい選\nせん\n手\nしゅ\nたちの試\nし\n合\nあい\nを\n見\nみ\nて、まだあきらめられない気\nき\n持\nも\nちが出\nで\nてきました。自\nじ\n分\nぶん\nもその場\nば\n所\nしょ\nに立\nた\nちたいと思\nおも\nい、選\nせん\n手\nしゅ\nを育\nそだ\nてるのはもう少\nすこ\nし先\nさき\nでもいいと思\nおも\nったんです。休\nやす\nんでいる間\nあいだ\nも応\nおう\n援\nえん\nしてくださった方\nかた\nたちのためにも、新\nあたら\nしい気\nき\n持\nも\nちでやっていきたいと思\nおも\nいます。\nこのスポーツ選\nせん\n手\nしゅ\nが伝\nつた\nえたいことは何\nなん\nですか。\n１． 選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむということ\n２． 選\nせん\n手\nしゅ\nをやめるということ\n３． 指\nし\n導\nどう\n者\nしゃ\nになるということ\n４． もう一\nいち\n度\nど\n選\nせん\n手\nしゅ\nとして活\nかつ\n動\nどう\nするということ\n聴解スクリプト\n9\n\n3 番\nテレビで博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nが話\nはな\nしています。\nＭ ： 子\nこ\n供\nども\nに科\nか\n学\nがく\nを好\nす\nきになってもらいたいご両\nりょう\n親\nしん\n、多\nおお\nいと思\nおも\nいます。でも、子\nこ\n供\nども\nに正\nただ\nしく分\nわ\nかっ\nてもらおうと、つい大\nおとな\n人に説\nせつ\n明\nめい\nするときのように数\nすう\n学\nがく\n的\nてき\nな話\nはなし\nや専\nせん\n門\nもん\n的\nてき\nな話\nはなし\nをしていません\nか。子\nこ\n供\nども\nには難\nむずか\nしい話\nはなし\nをしてもしかたありません。言\nこと\n葉\nば\nで詳\nくわ\nしく説\nせつ\n明\nめい\nするよりも実\nじっ\n際\nさい\nに経\nけい\n験\nけん\nさせることが大\nたい\n切\nせつ\nなんです。例\nたと\nえば、月\nつき\nでの重\nおも\nさの感\nかん\nじ方\nかた\nを教\nおし\nえるときだったら、地\nち\n球\nきゅう\nで\n1 キログラムのものが月\nつき\nではどのくらいの重\nおも\nさに感\nかん\nじるか、持\nも\nった感\nかん\n覚\nかく\nで分\nわ\nかるようにする\nといいですよ。\n博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nは何\nなに\nについて話\nはな\nしていますか。\n１． 子\nこ\n供\nども\nが科\nか\n学\nがく\nを好\nす\nきな理\nり\n由\nゆう\n２． 子\nこ\n供\nども\nへの科\nか\n学\nがく\nの教\nおし\nえ方\nかた\n３． 子\nこ\n供\nども\nに科\nか\n学\nがく\nを学\nまな\nばせる理\nり\n由\nゆう\n４． 子\nこ\n供\nども\nにとって必\nひつ\n要\nよう\nな科\nか\n学\nがく\nの知\nち\n識\nしき\n問題4\n例\nホテルのテレビが壊\nこわ\nれています。何\nなん\nと言\nい\nいますか。\nＦ ： １．テレビがつかないんですが。\n \n ２．テレビをつけてもいいですか。\n \n ３．テレビをつけたほうがいいですよ。\n1 番\n約\nやく\n束\nそく\nの時\nじ\n間\nかん\nに少\nすこ\nし遅\nおく\nれました。友\nとも\n達\nだち\nに何\nなん\nと言\nい\nいますか。  \nＦ ： １．待\nま\nたせてごめん。\n \n ２．急\nいそ\nがせちゃってごめん。\n \n ３．ごめん、お先\nさき\nに。\n聴解スクリプト\n10\n\n2 番\n観\nかん\n光\nこう\nの案\nあん\n内\nない\nをしています。建\nたて\n物\nもの\nを見\nみ\nてもらいたいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．こちらでお目\nめ\nにかかります。\n \n ２．こちらをご覧\nらん\nください。\n \n ３．お見\nみ\nせくださいますか。\n3 番\n荷\nに\n物\nもつ\nを受\nう\nけ取\nと\nります。サインするところが分\nわ\nかりません。何\nなん\nと言\nい\nいますか。\nＭ ： １．どこにサインが書\nか\nいてありますか。\n \n ２．どこでサインを渡\nわた\nしましょうか。\n \n ３．どこにサインをすればいいですか。\n4 番\n今\nきょう\n日はあまりおなかがすいていません。ご飯\nはん\nを普\nふ\n通\nつう\nより少\nすく\nなくしてほしいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．ご飯\nはん\n、少\nすく\nなすぎるんですけど。\n \n ２．ご飯\nはん\n、あと少\nすこ\nしほしいです。\n \n ３．ご飯\nはん\n、少\nすく\nな目\nめ\nでお願\nねが\nいします。\n問題5\n例\nＭ ： すみません、今\nいま\n、時\nじ\n間\nかん\n、ありますか。\nＦ ： １．ええと、１０時\nじ\n２０分\nぷん\nです。\n \n ２．ええ。何\nなん\nですか。\n \n ３．時\nと\n計\nけい\nはあそこですよ。\n聴解スクリプト\n11\n\n1 番\nＭ ： 山\nやま\n田\nだ\nさん、作\nつく\nり直\nなお\nしてくれた資\nし\n料\nりょう\n、見\nみ\nやすくなってましたよ。  \nＦ ： １．ありがとうございます。よかったです。\n \n ２．分\nわ\nかりました。すぐに直\nなお\nします。\n \n ３．もっと簡\nかん\n単\nたん\nにするんですか。\n2 番\nＦ ： ねえ、ちょっと木\nき\n村\nむら\nさんに用\nよう\nがあるんだけど、見\nみ\nなかった？\nＭ ： １．じゃ、一\nいっ\n緒\nしょ\nに見\nみ\nよう。\n \n ２．特\nとく\nに用\nよう\nはないんだけど。\n \n ３．さあ。ほかの人\nひと\nに聞\nき\nいてみて。\n3 番\nＭ ： 昨\nきのう\n日貸\nか\nしてくれた本\nほん\n、読\nよ\nみ出\nだ\nしたら止\nと\nまらなくなっちゃったよ。\nＦ ： １．じゃ、全\nぜん\n部\nぶ\n読\nよ\nまなくてもいいよ。\n \n ２．けっこうおもしろかったでしょう。\n \n ３．本\nほん\n、なくなっちゃったの？\n4 番\nＦ ： どうぞお入\nはい\nりください。すぐお茶\nちゃ\n入\nい\nれますから。  \nＭ ： １．おかまいなく。\n \n ２．ごちそうさまでした。\n \n ３．どういたしまして。\n5 番\nＭ：　リ \n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、指\nし\n導\nどう\n者\nしゃ\nになることも考\nかんが\nえました。でも、目\nもく\n標\nひょう\nを持\nも\nって頑\nがん\n張\nば\nる若\nわか\nい選\nせん\n手\nしゅ\nたちの試\nし\n合\nあい\nを\n見\nみ\nて、まだあきらめられない気\nき\n持\nも\nちが出\nで\nてきました。自\nじ\n分\nぶん\nもその場\nば\n所\nしょ\nに立\nた\nちたいと思\nおも\nい、選\nせん\n手\nしゅ\nを育\nそだ\nてるのはもう少\nすこ\nし先\nさき\nでもいいと思\nおも\nったんです。休\nやす\nんでいる間\nあいだ\nも応\nおう\n援\nえん\nしてくださった方\nかた\nたちのためにも、新\nあたら\nしい気\nき\n持\nも\nちでやっていきたいと思\nおも\nいます。\nこのスポーツ選\nせん\n手\nしゅ\nが伝\nつた\nえたいことは何\nなん\nですか。\n１． 選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむということ\n２． 選\nせん\n手\nしゅ\nをやめるということ\n３． 指\nし\n導\nどう\n者\nしゃ\nになるということ\n４． もう一\nいち\n度\nど\n選\nせん\n手\nしゅ\nとして活\nかつ\n動\nどう\nするということ\n聴解スクリプト\n9\n\n3 番\nテレビで博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nが話\nはな\nしています。\nＭ ： 子\nこ\n供\nども\nに科\nか\n学\nがく\nを好\nす\nきになってもらいたいご両\nりょう\n親\nしん\n、多\nおお\nいと思\nおも\nいます。でも、子\nこ\n供\nども\nに正\nただ\nしく分\nわ\nかっ\nてもらおうと、つい大\nおとな\n人に説\nせつ\n明\nめい\nするときのように数\nすう\n学\nがく\n的\nてき\nな話\nはなし\nや専\nせん\n門\nもん\n的\nてき\nな話\nはなし\nをしていません\nか。子\nこ\n供\nども\nには難\nむずか\nしい話\nはなし\nをしてもしかたありません。言\nこと\n葉\nば\nで詳\nくわ\nしく説\nせつ\n明\nめい\nするよりも実\nじっ\n際\nさい\nに経\nけい\n験\nけん\nさせることが大\nたい\n切\nせつ\nなんです。例\nたと\nえば、月\nつき\nでの重\nおも\nさの感\nかん\nじ方\nかた\nを教\nおし\nえるときだったら、地\nち\n球\nきゅう\nで\n1 キログラムのものが月\nつき\nではどのくらいの重\nおも\nさに感\nかん\nじるか、持\nも\nった感\nかん\n覚\nかく\nで分\nわ\nかるようにする\nといいですよ。\n博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nは何\nなに\nについて話\nはな\nしていますか。\n１． 子\nこ\n供\nども\nが科\nか\n学\nがく\nを好\nす\nきな理\nり\n由\nゆう\n２． 子\nこ\n供\nども\nへの科\nか\n学\nがく\nの教\nおし\nえ方\nかた\n３． 子\nこ\n供\nども\nに科\nか\n学\nがく\nを学\nまな\nばせる理\nり\n由\nゆう\n４． 子\nこ\n供\nども\nにとって必\nひつ\n要\nよう\nな科\nか\n学\nがく\nの知\nち\n識\nしき\n問題4\n例\nホテルのテレビが壊\nこわ\nれています。何\nなん\nと言\nい\nいますか。\nＦ ： １．テレビがつかないんですが。\n \n ２．テレビをつけてもいいですか。\n \n ３．テレビをつけたほうがいいですよ。\n1 番\n約\nやく\n束\nそく\nの時\nじ\n間\nかん\nに少\nすこ\nし遅\nおく\nれました。友\nとも\n達\nだち\nに何\nなん\nと言\nい\nいますか。  \nＦ ： １．待\nま\nたせてごめん。\n \n ２．急\nいそ\nがせちゃってごめん。\n \n ３．ごめん、お先\nさき\nに。\n聴解スクリプト\n10\n\n2 番\n観\nかん\n光\nこう\nの案\nあん\n内\nない\nをしています。建\nたて\n物\nもの\nを見\nみ\nてもらいたいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．こちらでお目\nめ\nにかかります。\n \n ２．こちらをご覧\nらん\nください。\n \n ３．お見\nみ\nせくださいますか。\n3 番\n荷\nに\n物\nもつ\nを受\nう\nけ取\nと\nります。サインするところが分\nわ\nかりません。何\nなん\nと言\nい\nいますか。\nＭ ： １．どこにサインが書\nか\nいてありますか。\n \n ２．どこでサインを渡\nわた\nしましょうか。\n \n ３．どこにサインをすればいいですか。\n4 番\n今\nきょう\n日はあまりおなかがすいていません。ご飯\nはん\nを普\nふ\n通\nつう\nより少\nすく\nなくしてほしいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．ご飯\nはん\n、少\nすく\nなすぎるんですけど。\n \n ２．ご飯\nはん\n、あと少\nすこ\nしほしいです。\n \n ３．ご飯\nはん\n、少\nすく\nな目\nめ\nでお願\nねが\nいします。\n問題5\n例\nＭ ： すみません、今\nいま\n、時\nじ\n間\nかん\n、ありますか。\nＦ ： １．ええと、１０時\nじ\n２０分\nぷん\nです。\n \n ２．ええ。何\nなん\nですか。\n \n ３．時\nと\n計\nけい\nはあそこですよ。\n聴解スクリプト\n11\n\n1 番\nＭ ： 山\nやま\n田\nだ\nさん、作\nつく\nり直\nなお\nしてくれた資\nし\n料\nりょう\n、見\nみ\nやすくなってましたよ。  \nＦ ： １．ありがとうございます。よかったです。\n \n ２．分\nわ\nかりました。すぐに直\nなお\nします。\n \n ３．もっと簡\nかん\n単\nたん\nにするんですか。\n2 番\nＦ ： ねえ、ちょっと木\nき\n村\nむら\nさんに用\nよう\nがあるんだけど、見\nみ\nなかった？\nＭ ： １．じゃ、一\nいっ\n緒\nしょ\nに見\nみ\nよう。\n \n ２．特\nとく\nに用\nよう\nはないんだけど。\n \n ３．さあ。ほかの人\nひと\nに聞\nき\nいてみて。\n3 番\nＭ ： 昨\nきのう\n日貸\nか\nしてくれた本\nほん\n、読\nよ\nみ出\nだ\nしたら止\nと\nまらなくなっちゃったよ。\nＦ ： １．じゃ、全\nぜん\n部\nぶ\n読\nよ\nまなくてもいいよ。\n \n ２．けっこうおもしろかったでしょう。\n \n ３．本\nほん\n、なくなっちゃったの？\n4 番\nＦ ： どうぞお入\nはい\nりください。すぐお茶\nちゃ\n入\nい\nれますから。  \nＭ ： １．おかまいなく。\n \n ２．ごちそうさまでした。\n \n ３．どういたしまして。\n5 番\nＭ：　リーさん、あのう、リーさんの研\nけん\n究\nきゅう\nでお聞\nき\nきしたいことがあるんですが。  \nＦ ： １．あ、はい、どんなことでしょうか。\n \n ２．ああ、聞\nき\nいたことがあります。\n \n ３．いえ、質\nしつ\n問\nもん\nはありませんが。\n聴解スクリプト\n12\n\n6 番\nＭ ： 友\nとも\n達\nだち\nに赤\nあか\nちゃんが生\nう\nまれたんだけど、どんなものをあげたらいいと思\nおも\nう？  \nＦ ： １．うん、それがいいと思\nおも\nうよ。\n \n ２．プレゼントをあげたらどう？  \n \n ３．何\nなん\nでも喜\nよろこ\nんでくれるんじゃない？\n7 番\nＦ ： 吉\nよし\n田\nだ\nさん、吉\nよし\n田\nだ\nさんはどちらのご出\nしゅっ\n身\nしん\nですか。\nＭ ： １．東\nとう\n京\nきょう\nの貿\nぼう\n易\nえき\n会\nがい\n社\nしゃ\nで働\nはたら\nいています。\n \n ２．生\nう\nまれたのは東\nとう\n京\nきょう\nですが、京\nきょう\n都\nと\nで育\nそだ\nちました。  \n \n ３．これから東\nとう\n京\nきょう\nへ行\nい\nきます。\n8 番\nＦ ： トムさんは日\nに\n本\nほん\nに来\nき\nたばかりなのに、日\nに\n本\nほん\nのことよくご存\nぞん\nじですね。  \nＭ ： １．来\nく\nる前\nまえ\nにいろいろ調\nしら\nべたんです。\n \n ２．いえ、日\nに\n本\nほん\nには長\nなが\nく住\nす\nんでいませんよ。\n \n ３．来\nき\nたばかりですか n付\nづ\nいてないけど、入\nはい\nって。\nＦ１ ： あ、でもここで。すぐ帰\nかえ\nるから。あのう、この前\nまえ\n借\nか\nりた本\nほん\nなんだけど、ちょっと破\nやぶ\nれちゃって。\nＦ２ ： え、本\nほん\n当\nとう\n？\nＦ１ ： うん、このページなんだけど。\nＦ２ ： あっ、うん、このくらいなら大\nだい\n丈\nじょう\n夫\nぶ\n。読\nよ\nめるし。\nＦ１ ： ほんと？　ごめん。これからは気\nき\nをつけるから。\nＦ２ ： うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１ ： ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nのうちへ何\nなに\nをしに来\nき\nましたか。\n１． 謝\nあやま\nりに来\nき\nた\n２． 本\nほん\nを借\nか\nりに来\nき\nた\n３． 泊\nと\nまりに来\nき\nた\n４． コーヒーを飲\nの\nみに来\nき\nた\n聴解スクリプト\n8\n\n1 番\nテレビでアナウンサーが話\nはな\nしています。\nＦ ： 皆\nみな\nさん、突\nとつ\n然\nぜん\nですが、私\nわたし\n、左\nひだり\n利\nき\nきなんです。マイクを持\nも\nつのも左\nひだり\n手\nて\n、はしを持\nも\nつのも左\nひだり\n手\nて\nです。今\nいま\n来\nき\nているこちらのお店\nみせ\n、文\nぶん\n房\nぼう\n具\nぐ\nなど、ちょっと見\nみ\nたところよくある普\nふ\n通\nつう\nのものが\n売\nう\nられていますが、大\nたい\n変\nへん\n人\nにん\n気\nき\nがあって、全\nぜん\n国\nこく\nからお客\nきゃく\nさんが集\nあつ\nまってくるそうです。すべ\nての商\nしょう\n品\nひん\nが左\nひだり\n利\nき\nきの人\nひと\nのためのものなんです。普\nふ\n段\nだん\nはあまり意\nい\n識\nしき\nしないかもしれませんが、\n普\nふ\n通\nつう\nのはさみ、包\nほう\n丁\nちょう\nなどは右\nみぎ\n手\nて\nで使\nつか\nうように作\nつく\nられています。こちらのお店\nみせ\nには、日\nにち\n常\nじょう\n使\nつか\nうものからパソコンのキーボードなどの電\nでん\n気\nき\n製\nせい\n品\nひん\n、ギターなどの楽\nがっ\n器\nき\nまであるんですよ。す\nごいですね。\nアナウンサーは主\nおも\nに何\nなに\nについて話\nはな\nしていますか。\n１． 左\nひだり\n利\nき\nき用\nよう\nの道\nどう\n具\nぐ\nの特\nとく\n徴\nちょう\n２． 左\nひだり\n利\nき\nきの人\nひと\nの苦\nく\n労\nろう\n３． この店\nみせ\nで扱\nあつか\nっている商\nしょう\n品\nひん\n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、指\nし\n導\nどう\n者\nしゃ\nになることも考\nかんが\nえました。でも、目\nもく\n標\nひょう\nを持\nも\nって頑\nがん\n張\nば\nる若\nわか\nい選\nせん\n手\nしゅ\nたちの試\nし\n合\nあい\nを\n見\nみ\nて、まだあきらめられない気\nき\n持\nも\nちが出\nで\nてきました。自\nじ\n分\nぶん\nもその場\nば\n所\nしょ\nに立\nた\nちたいと思\nおも\nい、選\nせん\n手\nしゅ\nを育\nそだ\nてるのはもう少\nすこ\nし先\nさき\nでもいいと思\nおも\nったんです。休\nやす\nんでいる間\nあいだ\nも応\nおう\n援\nえん\nしてくださった方\nかた\nたちのためにも、新\nあたら\nしい気\nき\n持\nも\nちでやっていきたいと思\nおも\nいます。\nこのスポーツ選\nせん\n手\nしゅ\nが伝\nつた\nえたいことは何\nなん\nですか。\n１． 選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむということ\n２． 選\nせん\n手\nしゅ\nをやめるということ\n３． 指\nし\n導\nどう\n者\nしゃ\nになるということ\n４． もう一\nいち\n度\nど\n選\nせん\n手\nしゅ\nとして活\nかつ\n動\nどう\nするということ\n聴解スクリプト\n9\n\n3 番\nテレビで博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nが話\nはな\nしています。\nＭ ： 子\nこ\n供\nども\nに科\nか\n学\nがく\nを好\nす\nきになってもらいたいご両\nりょう\n親\nしん\n、多\nおお\nいと思\nおも\nいます。でも、子\nこ\n供\nども\nに正\nただ\nしく分\nわ\nかっ\nてもらおうと、つい大\nおとな\n人に説\nせつ\n明\nめい\nするときのように数\nすう\n学\nがく\n的\nてき\nな話\nはなし\nや専\nせん\n門\nもん\n的\nてき\nな話\nはなし\nをしていません\nか。子\nこ\n供\nども\nには難\nむずか\nしい話\nはなし\nをしてもしかたありません。言\nこと\n葉\nば\nで詳\nくわ\nしく説\nせつ\n明\nめい\nするよりも実\nじっ\n際\nさい\nに経\nけい\n験\nけん\nさせることが大\nたい\n切\nせつ\nなんです。例\nたと\nえば、月\nつき\nでの重\nおも\nさの感\nかん\nじ方\nかた\nを教\nおし\nえるときだったら、地\nち\n球\nきゅう\nで\n1 キログラムのものが月\nつき\nではどのくらいの重\nおも\nさに感\nかん\nじるか、持\nも\nった感\nかん\n覚\nかく\nで分\nわ\nかるようにする\nといいですよ。\n博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nは何\nなに\nについて話\nはな\nしていますか。\n１． 子\nこ\n供\nども\nが科\nか\n学\nがく\nを好\nす\nきな理\nり\n由\nゆう\n２． 子\nこ\n供\nども\nへの科\nか\n学\nがく\nの教\nおし\nえ方\nかた\n３． 子\nこ\n供\nども\nに科\nか\n学\nがく\nを学\nまな\nばせる理\nり\n由\nゆう\n４． 子\nこ\n供\nども\nにとって必\nひつ\n要\nよう\nな科\nか\n学\nがく\nの知\nち\n識\nしき\n問題4\n例\nホテルのテレビが壊\nこわ\nれています。何\nなん\nと言\nい\nいますか。\nＦ ： １．テレビがつかないんですが。\n \n ２．テレビをつけてもいいですか。\n \n ３．テレビをつけたほうがいいですよ。\n1 番\n約\nやく\n束\nそく\nの時\nじ\n間\nかん\nに少\nすこ\nし遅\nおく\nれました。友\nとも\n達\nだち\nに何\nなん\nと言\nい\nいますか。  \nＦ ： １．待\nま\nたせてごめん。\n \n ２．急\nいそ\nがせちゃってごめん。\n \n ３．ごめん、お先\nさき\nに。\n聴解スクリプト\n10\n\n2 番\n観\nかん\n光\nこう\nの案\nあん\n内\nない\nをしています。建\nたて\n物\nもの\nを見\nみ\nてもらいたいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．こちらでお目\nめ\nにかかります。\n \n ２．こちらをご覧\nらん\nください。\n \n ３．お見\nみ\nせくださいますか。\n3 番\n荷\nに\n物\nもつ\nを受\nう\nけ取\nと\nります。サインするところが分\nわ\nかりません。何\nなん\nと言\nい\nいますか。\nＭ ： １．どこにサインが書\nか\nいてありますか。\n \n ２．どこでサインを渡\nわた\nしましょうか。\n \n ３．どこにサインをすればいいですか。\n4 番\n今\nきょう\n日はあまりおなかがすいていません。ご飯\nはん\nを普\nふ\n通\nつう\nより少\nすく\nなくしてほしいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．ご飯\nはん\n、少\nすく\nなすぎるんですけど。\n \n ２．ご飯\nはん\n、あと少\nすこ\nしほしいです。\n \n ３．ご飯\nはん\n、少\nすく\nな目\nめ\nでお願\nねが\nいします。\n問題5\n例\nＭ ： すみません、今\nいま\n、時\nじ\n間\nかん\n、ありますか。\nＦ ： １．ええと、１０時\nじ\n２０分\nぷん\nです。\n \n ２．ええ。何\nなん\nですか。\n \n ３．時\nと\n計\nけい\nはあそこですよ。\n聴解スクリプト\n11\n\n1 番\nＭ ： 山\nやま\n田\nだ\nさん、作\nつく\nり直\nなお\nしてくれた資\nし\n料\nりょう\n、見\nみ\nやすくなってましたよ。  \ っていますか。\n6 番\n女\nおんな\nの学\nがく\n生\nせい\nと男\nおとこ\nの学\nがく\n生\nせい\nが授\nじゅ\n業\nぎょう\nの発\nはっ\n表\nぴょう\nで使\nつか\nう資\nし\n料\nりょう\nについて話\nはな\nしています。二\nふたり\n人はこのあとまず何\nなに\nをしますか。\nＦ ： ねえ、社\nしゃ\n会\nかい\n学\nがく\nの授\nじゅ\n業\nぎょう\nで一\nいっ\n緒\nしょ\nにやる発\nはっ\n表\nぴょう\nのことなんだけど。\nＭ ： うん。準\nじゅん\n備\nび\nも終\nお\nわったし、発\nはっ\n表\nぴょう\nを待\nま\nつだけだね。\nＦ ： 実\nじつ\nはね、昨\nきのう\n日、ゼミの先\nせん\n輩\nぱい\nに私\nわたし\nたちが準\nじゅん\n備\nび\nした、発\nはっ\n表\nぴょう\nで使\nつか\nう資\nし\n料\nりょう\nとか発\nはっ\n表\nぴょう\nの流\nなが\nれを見\nみ\nて\nもらったら、先\nせん\n輩\nぱい\nが問\nもん\n題\nだい\n点\nてん\nをいくつかあげてくれて。直\nなお\nしたほうがいいと思\nおも\nうんだ。\nＭ ： どこ？\nＦ ： うん。まずね、せっかく自\nじ\n分\nぶん\nたちで調\nちょう\n査\nさ\nして、面\nおも\n白\nしろ\nい結\nけっ\n果\nか\nが出\nで\nてるのに、数\nすう\n字\nじ\nが並\nなら\nんでるだ\nけだから、伝\nつた\nわりにくいって。\nＭ ： じゃ、グラフを加\nくわ\nえようか。\nＦ ： そうだね。それからもう一\nいっ\n点\nてん\n、私\nわたし\nたちの主\nしゅ\n張\nちょう\nが発\nはっ\n表\nぴょう\nの最\nさい\n後\nご\nにしかないから、途\nと\n中\nちゅう\nまで何\nなに\nが言\nい\nいたいのか分\nわ\nからないって。ねえ、発\nはっ\n表\nぴょう\nの流\nなが\nれ、変\nか\nえてみない？\nＭ ： うん、やってみよう。流\nなが\nれを変\nか\nえたら、調\nちょう\n査\nさ\n結\nけっ\n果\nか\nの見\nみ\nせ方\nかた\nも変\nか\nわってくるだろうから、グラ\nフのことは後\nあと\nにして、それからやろう。\nＦ ： うん。\n聴解スクリプト\n7\n\nＭ ： 先\nせん\n輩\nぱい\nにお礼\nれい\n言\nい\nっといてね。\n二\nふたり\n人はこのあとまず何\nなに\nをしますか。\n問題3\n例\n女\nおんな\nの人\nひと\nが友\nとも\n達\nだち\nのうちに来\nき\nて、話\nはな\nしています。\nＦ１ ： 田\nた\n中\nなか\nです。\nＦ２ ： あ、はあい。昨\nきのう\n日友\nとも\n達\nだち\nが泊\nと\nまりに来\nき\nてたんで、片\nかた\n付\nづ\nいてないけど、入\nはい\nって。\nＦ１ ： あ、でもここで。すぐ帰\nかえ\nるから。あのう、この前\nまえ\n借\nか\nりた本\nほん\nなんだけど、ちょっと破\nやぶ\nれちゃって。\nＦ２ ： え、本\nほん\n当\nとう\n？\nＦ１ ： うん、このページなんだけど。\nＦ２ ： あっ、うん、このくらいなら大\nだい\n丈\nじょう\n夫\nぶ\n。読\nよ\nめるし。\nＦ１ ： ほんと？　ごめん。これからは気\nき\nをつけるから。\nＦ２ ： うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１ ： ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nのうちへ何\nなに\nをしに来\nき\nましたか。\n１． 謝\nあやま\nりに来\nき\nた\n２． 本\nほん\nを借\nか\nりに来\nき\nた\n３． 泊\nと\nまりに来\nき\nた\n４． コーヒーを飲\nの\nみに来\nき\nた\n聴解スクリプト\n8\n\n1 番\nテレビでアナウンサーが話\nはな\nしています。\nＦ ： 皆\nみな\nさん、突\nとつ\n然\nぜん\nですが、私\nわたし\n、左\nひだり\n利\nき\nきなんです。マイクを持\nも\nつのも左\nひだり\n手\nて\n、はしを持\nも\nつのも左\nひだり\n手\nて\nです。今\nいま\n来\nき\nているこちらのお店\nみせ\n、文\nぶん\n房\nぼう\n具\nぐ\nなど、ちょっと見\nみ\nたところよくある普\nふ\n通\nつう\nのものが\n売\nう\nられていますが、大\nたい\n変\nへん\n人\nにん\n気\nき\nがあって、全\nぜん\n国\nこく\nからお客\nきゃく\nさんが集\nあつ\nまってくるそうです。すべ\nての商\nしょう\n品\nひん\nが左\nひだり\n利\nき\nきの人\nひと\nのためのものなんです。普\nふ\n段\nだん\nはあまり意\nい\n識\nしき\nしないかもしれませんが、\n普\nふ\n通\nつう\nのはさみ、包\nほう\n丁\nちょう\nなどは右\nみぎ\n手\nて\nで使\nつか\nうように作\nつく\nられています。こちらのお店\nみせ\nには、日\nにち\n常\nじょう\n使\nつか\nうものからパソコンのキーボードなどの電\nでん\n気\nき\n製\nせい\n品\nひん\n、ギターなどの楽\nがっ\n器\nき\nまであるんですよ。す\nごいですね。\nアナウンサーは主\nおも\nに何\nなに\nについて話\nはな\nしていますか。\n１． 左\nひだり\n利\nき\nき用\nよう\nの道\nどう\n具\nぐ\nの特\nとく\n徴\nちょう\n２． 左\nひだり\n利\nき\nきの人\nひと\nの苦\nく\n労\nろう\n３． この店\nみせ\nで扱\nあつか\nっている商\nしょう\n品\nひん\n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、指\nし\n導\nどう\n者\nしゃ\nになることも考\nかんが\nえました。でも、目\nもく\n標\nひょう\nを持\nも\nって頑\nがん\n張\nば\nる若\nわか\nい選\nせん\n手\nしゅ\nたちの試\nし\n合\nあい\nを\n見\nみ\nて、まだあきらめられない気\nき\n持\nも\nちが出\nで\nてきました。自\nじ\n分\nぶん\nもその場\nば\n所\nしょ\nに立\nた\nちたいと思\nおも\nい、選\nせん\n手\nしゅ\nを育\nそだ\nてるのはもう少\nすこ\nし先\nさき\nでもいいと思\nおも\nったんです。休\nやす\nんでいる間\nあいだ\nも応\nおう\n援\nえん\nしてくださった方\nかた\nたちのためにも、新\nあたら\nしい気\nき\n持\nも\nちでやっていきたいと思\nおも\nいます。\nこのスポーツ選\nせん\n手\nしゅ\nが伝\nつた\nえたいことは何\nなん\nですか。\n１． 選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむということ\n２． 選\nせん\n手\nしゅ\nをやめるということ\n３． 指\nし\n導\nどう\n者\nしゃ\nになるということ\n４． もう一\nいち\n度\nど\n選\nせん\n手\nしゅ\nとして活\nかつ\n動\nどう\nするということ\n聴解スクリプト\n9\n\n3 番\nテレビで博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nが話\nはな\nしています。\nＭ ： 子\nこ\n供\nども\nに科\nか\n学\nがく\nを好\nす\nきになってもらいたいご両\nりょう\n親\nしん\n、多\nおお\nいと思\nおも\nいます。でも、子\nこ\n供\nども\nに正\nただ\nしく分\nわ\nかっ\nてもらおうと、つい大\nおとな\n人に説\nせつ\n明\nめい\nするときのように数\nすう\n学\nがく\n的\nてき\nな話\nはなし\nや専\nせん\n門\nもん\n的\nてき\nな話\nはなし\nをしていません\nか。子\nこ\n供\nども\nには難\nむずか\nしい話\nはなし\nをしてもしかたありません。言\nこと\n葉\nば\nで詳\nくわ\nしく説\nせつ\n明\nめい\nするよりも実\nじっ\n際\nさい\nに経\nけい\n験\nけん\nさせることが大\nたい\n切\nせつ\nなんです。例\nたと\nえば、月\nつき\nでの重\nおも\nさの感\nかん\nじ方\nかた\nを教\nおし\nえるときだったら、地\nち\n球\nきゅう\nで\n1 キログラムのものが月\nつき\nではどのくらいの重\nおも\nさに感\nかん\nじるか、持\nも\nった感\nかん\n覚\nかく\nで分\nわ\nかるようにする\nといいですよ。\n博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nは何\nなに\nについて話\nはな\nしていますか。\n nＭ ： インターネットで探\nさが\nしたけど、うちから通\nかよ\nえるところにはなかったんだ。うーん、やっぱり\n個\nこ\n人\nじん\nレッスンがいいから、その人\nひと\nに頼\nたの\nんでもらえる？\nＦ ： うん。分\nわ\nかった。私\nわたし\nも日\nに\n本\nほん\n語\nご\nを習\nなら\nったとき、日\nに\n本\nほん\n語\nご\nだけで教\nおそ\nわったからきっと大\nだい\n丈\nじょう\n夫\nぶ\n。\n男\nおとこ\nの人\nひと\nはこれからどうやって女\nおんな\nの人\nひと\nの国\nくに\nの言\nこと\n葉\nば\nを勉\nべん\n強\nきょう\nすることにしましたか。\n聴解スクリプト\n6\n\n5 番\nレストランで店\nてん\n長\nちょう\nと女\nおんな\nの店\nてん\n員\nいん\nが話\nはな\nしています。女\nおんな\nの店\nてん\n員\nいん\nは店\nみせ\nについて何\nなに\nが問\nもん\n題\nだい\nだと言\nい\nっていま\nすか。\nＭ ： 店\nみせ\nがオープンしてやっと1 か月\nげつ\n経\nた\nったけど、何\nなに\nか気\nき\nづいたことある？\nＦ ： そうですね。はじめは、朝\nあさ\n6 時\nじ\nっていう開\nかい\n店\nてん\nの時\nじ\n間\nかん\nはちょっと早\nはや\nいと思\nおも\nって、お客\nきゃく\n様\nさま\nがいらっ\nしゃるかどうか心\nしん\n配\nぱい\nだったんですが、近\nきん\n所\nじょ\nの方\nかた\nがよく朝\nちょう\n食\nしょく\nを食\nた\nべに来\nき\nてくださるので、驚\nおどろ\nきました。\nＭ ： 確\nたし\nかに予\nよ\n想\nそう\n以\nい\n上\nじょう\nだったね。\nＦ ： はい。それと、食\nしょく\n事\nじ\nがすんでいるのに、ずっとお帰\nかえ\nりにならない方\nかた\nがけっこういらっしゃる\nのが気\nき\nになります。アルバイトの森\nもり\nさんが言\nい\nってたんですけど、せっかく来\nき\nてくださったお\n客\nきゃく\n様\nさま\nが席\nせき\nがなくて入\nはい\nれないっていうことが何\nなん\n回\nかい\nかあったそうです。\nＭ ： そういうときは、お客\nきゃく\n様\nさま\nの気\nき\n分\nぶん\nを悪\nわる\nくさせずに席\nせき\nを空\nあ\nけていただくように頼\nたの\nまなきゃいけな\nいんだけど。うちの店\nみせ\nは若\nわか\nい店\nてん\n員\nいん\nが多\nおお\nいから、上\nじょう\n手\nず\nに伝\nつた\nえるのは難\nむずか\nしいかもしれないね。\n女\nおんな\nの店\nてん\n員\nいん\nは店\nみせ\nについて何\nなに\nが問\nもん\n題\nだい\nだと言\nい\nっていますか。\n6 番\n女\nおんな\nの学\nがく\n生\nせい\nと男\nおとこ\nの学\nがく\n生\nせい\nが授\nじゅ\n業\nぎょう\nの発\nはっ\n表\nぴょう\nで使\nつか\nう資\nし\n料\nりょう\nについて話\nはな\nしています。二\nふたり\n人はこのあとまず何\nなに\nをしますか。\nＦ ： ねえ、社\nしゃ\n会\nかい\n学\nがく\nの授\nじゅ\n業\nぎょう\nで一\nいっ\n緒\nしょ\nにやる発\nはっ\n表\nぴょう\nのことなんだけど。\nＭ ： うん。準\nじゅん\n備\nび\nも終\nお\nわったし、発\nはっ\n表\nぴょう\nを待\nま\nつだけだね。\nＦ ： 実\nじつ\nはね、昨\nきのう\n日、ゼミの先\nせん\n輩\nぱい\nに私\nわたし\nたちが準\nじゅん\n備\nび\nした、発\nはっ\n表\nぴょう\nで使\nつか\nう資\nし\n料\nりょう\nとか発\nはっ\n表\nぴょう\nの流\nなが\nれを見\nみ\nて\nもらったら、先\nせん\n輩\nぱい\nが問\nもん\n題\nだい\n点\nてん\nをいくつかあげてくれて。直\nなお\nしたほうがいいと思\nおも\nうんだ。\nＭ ： どこ？\nＦ ： うん。まずね、せっかく自\nじ\n分\nぶん\nたちで調\nちょう\n査\nさ\nして、面\nおも\n白\nしろ\nい結\nけっ\n果\nか\nが出\nで\nてるのに、数\nすう\n字\nじ\nが並\nなら\nんでるだ\nけだから、伝\nつた\nわりにくいって。\nＭ ： じゃ、グラフを加\nくわ\nえようか。\nＦ ： そうだね。それからもう一\nいっ\n点\nてん\n、私\nわたし\nたちの主\nしゅ\n張\nちょう\nが発\nはっ\n表\nぴょう\nの最\nさい\n後\nご\nにしかないから、途\nと\n中\nちゅう\nまで何\nなに\nが言\nい\nいたいのか分\nわ\nからないって。ねえ、発\nはっ\n表\nぴょう\nの流\nなが\nれ、変\nか\nえてみない？\nＭ ： うん、やってみよう。流\nなが\nれを変\nか\nえたら、調\nちょう\n査\nさ\n結\nけっ\n果\nか\nの見\nみ\nせ方\nかた\nも変\nか\nわってくるだろうから、グラ\nフのことは後\nあと\nにして、それからやろう。\nＦ ： うん。\n聴解スクリプト\n7\n\nＭ ： 先\nせん\n輩\nぱい\nにお礼\nれい\n言\nい\nっといてね。\n二\nふたり\n人はこのあとまず何\nなに\nをしますか。\n問題3\n例\n女\nおんな\nの人\nひと\nが友\nとも\n達\nだち\nのうちに来\nき\nて、話\nはな\nしています。\nＦ１ ： 田\nた\n中\nなか\nです。\nＦ２ ： あ、はあい。昨\nきのう\n日友\nとも\n達\nだち\nが泊\nと\nまりに来\nき\nてたんで、片\nかた\n付\nづ\nいてないけど、入\nはい\nって。\nＦ１ ： あ、でもここで。すぐ帰\nかえ\nるから。あのう、この前\nまえ\n借\nか\nりた本\nほん\nなんだけど、ちょっと破\nやぶ\nれちゃって。\nＦ２ ： え、本\nほん\n当\nとう\n？\nＦ１ ： うん、このページなんだけど。\nＦ２ ： あっ、うん、このくらいなら大\nだい\n丈\nじょう\n夫\nぶ\n。読\nよ\nめるし。\nＦ１ ： ほんと？　ごめん。これからは気\nき\nをつけるから。\nＦ２ ： うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１ ： ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nのうちへ何\nなに\nをしに来\nき\nましたか。\n１． 謝\nあやま\nりに来\nき\nた\n２． 本\nほん\nを借\nか\nりに来\nき\nた\n３． 泊\nと\nまりに来\nき\nた\n４． コーヒーを飲\nの\nみに来\nき\nた\n聴解スクリプト\n8\n\n1 番\nテレビでアナウンサーが話\nはな\nしています。\nＦ ： 皆\nみな\nさん、突\nとつ\n然\nぜん\nですが、私\nわたし\n、左\nひだり\n利\nき\nきなんです。マイクを持\nも\nつのも左\nひだり\n手\nて\n、はしを持\nも\nつのも左\nひだり\n手\nて\nです。今\nいま\n来\nき\nているこちらのお店\nみせ\n、文\nぶん\n房\nぼう\n具\nぐ\nなど、ちょっと見\nみ\nたところよくある普\nふ\n通\nつう\nのものが\n売\nう\nられていますが、大\nたい\n変\nへん\n人\nにん\n気\nき\nがあって、全\nぜん\n国\nこく\nからお客\nきゃく\nさんが集\nあつ\nまってくるそうです。すべ\nての商\nしょう\n品\nひん\nが左\nひだり\n利\nき\nきの人\nひと\nのためのものなんです。普\nふ\n段\nだん\nはあまり意\nい\n識\nしき\nしないかもしれませんが、\n普\nふ\n通\nつう\nのはさみ、包\nほう\n丁\nちょう\nなどは右\nみぎ\n手\nて\nで使\nつか\nうように作\nつく\nられています。こちらのお店\nみせ\nには、日\nにち\n常\nじょう\n使\nつか\nうものからパソコンのキーボードなどの電\nでん\n気\nき\n製\nせい\n品\nひん\n、ギターなどの楽\nがっ\n器\nき\nまであるんですよ。す\nごいですね。\nアナウンサーは主\nおも\nに何\nなに\nについて話\nはな\nしていますか。\n１． 左\nひだり\n利\nき\nき用\nよう\nの道\nどう\n具\nぐ\nの特\nとく\n徴\nちょう\n２． 左\nひだり\n利\nき\nきの人\nひと\nの苦\nく\n労\nろう\n３． この店\nみせ\nで扱\nあつか\nっている商\nしょう\n品\nひん\n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、 んと？　ごめん。これからは気\nき\nをつけるから。\nＦ２ ： うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１ ： ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nのうちへ何\nなに\nをしに来\nき\nましたか。\n１． 謝\nあやま\nりに来\nき\nた\n２． 本\nほん\nを借\nか\nりに来\nき\nた\n３． 泊\nと\nまりに来\nき\nた\n４． コーヒーを飲\nの\nみに来\nき\nた\n聴解スクリプト\n8\n\n1 番\nテレビでアナウンサーが話\nはな\nしています。\nＦ ： 皆\nみな\nさん、突\nとつ\n然\nぜん\nですが、私\nわたし\n、左\nひだり\n利\nき\nきなんです。マイクを持\nも\nつのも左\nひだり\n手\nて\n、はしを持\nも\nつのも左\nひだり\n手\nて\nです。今\nいま\n来\nき\nているこちらのお店\nみせ\n、文\nぶん\n房\nぼう\n具\nぐ\nなど、ちょっと見\nみ\nたところよくある普\nふ\n通\nつう\nのものが\n売\nう\nられていますが、大\nたい\n変\nへん\n人\nにん\n気\nき\nがあって、全\nぜん\n国\nこく\nからお客\nきゃく\nさんが集\nあつ\nまってくるそうです。すべ\nての商\nしょう\n品\nひん\nが左\nひだり\n利\nき\nきの人\nひと\nのためのものなんです。普\nふ\n段\nだん\nはあまり意\nい\n識\nしき\nしないかもしれませんが、\n普\nふ\n通\nつう\nのはさみ、包\nほう\n丁\nちょう\nなどは右\nみぎ\n手\nて\nで使\nつか\nうように作\nつく\nられています。こちらのお店\nみせ\nには、日\nにち\n常\nじょう\n使\nつか\nうものからパソコンのキーボードなどの電\nでん\n気\nき\n製\nせい\n品\nひん\n、ギターなどの楽\nがっ\n器\nき\nまであるんですよ。す\nごいですね。\nアナウンサーは主\nおも\nに何\nなに\nについて話\nはな\nしていますか。\n１． 左\nひだり\n利\nき\nき用\nよう\nの道\nどう\n具\nぐ\nの特\nとく\n徴\nちょう\n２． 左\nひだり\n利\nき\nきの人\nひと\nの苦\nく\n労\nろう\n３． この店\nみせ\nで扱\nあつか\nっている商\nしょう\n品\nひん\n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、指\nし\n導\nどう\n者\nしゃ\nになることも考\nかんが\nえました。でも、目\nもく\n標\nひょう\nを持\nも\nって頑\nがん\n張\nば\nる若\nわか\nい選\nせん\n手\nしゅ\nたちの試\nし\n合\nあい\nを\n見\nみ\nて、まだあきらめられない気\nき\n持\nも\nちが出\nで\nてきました。自\nじ\n分\nぶん\nもその場\nば\n所\nしょ\nに立\nた\nちたいと思\nおも\nい、選\nせん\n手\nしゅ\nを育\nそだ\nてるのはもう少\nすこ\nし先\nさき\nでもいいと思\nおも\nったんです。休\nやす\nんでいる間\nあいだ\nも応\nおう\n援\nえん\nしてくださった方\nかた\nたちのためにも、新\nあたら\nしい気\nき\n持\nも\nちでやっていきたいと思\nおも\nいます。\nこのスポーツ選\nせん\n手\nしゅ\nが伝\nつた\nえたいことは何\nなん\nですか。\n１． 選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむということ\n２． 選\nせん\n手\nしゅ\nをやめるということ\n３． 指\nし\n導\nどう\n者\nしゃ\nになるということ\n４． もう一\nいち\n度\nど\n選\nせん\n手\nしゅ\nとして活\nかつ\n動\nどう\nするということ\n聴解スクリプト\n9\n\n3 番\nテレビで博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nが話\nはな\nしています。\nＭ ： 子\nこ\n供\nども\nに科\nか\n学\nがく\nを好\nす\nきになってもらいたいご両\nりょう\n親\nしん\n、多\nおお\nいと思\nおも\nいます。でも、子\nこ\n供\nども\nに正\nただ\nしく分\nわ\nかっ\nてもらおうと、つい大\nおとな\n人に説\nせつ\n明\nめい\nするときのように数\nすう\n学\nがく\n的\nてき\nな話\nはなし\nや専\nせん\n門\nもん\n的\nてき\nな話\nはなし\nをしていません\nか。子\nこ\n供\nども\nには難\nむずか\nしい話\nはなし\nをしてもしかたありません。言\nこと\n葉\nば\nで詳\nくわ\nしく説\nせつ\n明\nめい\nするよりも実\nじっ\n際\nさい\nに経\nけい\n験\nけん\nさせることが大\nたい\n切\nせつ\nなんです。例\nたと\nえば、月\nつき\nでの重\nおも\nさの感\nかん\nじ方\nかた\nを教\nおし\nえるときだったら、地\nち\n球\nきゅう\nで\n1 キログラムのものが月\nつき\nではどのくらいの重\nおも\nさに感\nかん\nじるか、持\nも\nった感\nかん\n覚\nかく\nで分\nわ\nかるようにする\nといいですよ。\n博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nは何\nなに\nについて話\nはな\nしていますか。\n１． 子\nこ\n供\nども\nが科\nか\n学\nがく\nを好\nす\nきな理\nり\n由\nゆう\n２． 子\nこ\n供\nども\nへの科\nか\n学\nがく\nの教\nおし\nえ方\nかた\n３． 子\nこ\n供\nども\nに科\nか\n学\nがく\nを学\nまな\nばせる理\nり\n由\nゆう\n４． 子\nこ\n供\nども\nにとって必\nひつ\n要\nよう\nな科\nか\n学\nがく\nの知\nち\n識\nしき\n問題4\n例\nホテルのテレビが壊\nこわ\nれています。何\nなん\nと言\nい\nいますか。\nＦ ： １．テレビがつかないんですが。\n \n ２．テレビをつけてもいいですか。\n \n ３．テレビをつけたほうがいいですよ。\n1 番\n約\nやく\n束\nそく\nの時\nじ\n間\nかん\nに少\nすこ\nし遅\nおく\nれました。友\nとも\n達\nだち\nに何\nなん\nと言\nい\nいますか。  \nＦ ： １．待\nま\nたせてごめん。\n \n ２．急\nいそ\nがせちゃってごめん。\n \n ３．ごめん、お先\nさき\nに。\n聴解スクリプト\n10\n\n2 番\n観\nかん\n光\nこう\nの案\nあん\n内\nない\nをしています。建\nたて\n物\nもの\nを見\nみ\nてもらいたいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．こちらでお目\nめ\nにかかります。\n \n ２．こちらをご覧\nらん\nください。\n \n ３．お見\nみ\nせくださいますか。\n3 番\n荷\nに\n物\nもつ\nを受\nう\nけ取\nと\nります。サインするところが分\nわ\nかりません。何\nなん\nと言\nい\nいますか。\nＭ ： １．どこにサインが書\nか\nいてありますか。\n \n ２．どこでサインを渡\nわた\nしましょうか。\n \n ３．どこにサインをすればいいですか。\n4 番\n今\nきょう\n日はあまりおなかがすいていません。ご飯\nはん\nを普\nふ\n通\nつう\nより少\nすく\nなくしてほしいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．ご飯\nはん\n、少\nすく\nなすぎるんですけど。\n \n ２．ご飯\nはん\n、あと少\nすこ\nしほしいです。\n \n ３．ご飯\nはん\n、少\nすく\nな目\nめ\nでお願\nねが\nいします。\n問題5\n例\nＭ ： すみません、今\nいま\n、時\nじ\n間\nかん\n、ありますか。\nＦ ： １．ええと、１０時\nじ\n２０分\nぷん\nです。\n \n ２．ええ。何\nなん\nですか。\n \n ３．時\nと\n計\nけい\nはあそこですよ。\n聴解スクリプト\n11\n\n1 番\nＭ ： 山\nやま\n田\nだ\nさん、作\nつく\nり直\nなお\nしてくれた資\nし\n料\nりょう\n、見\nみ\nやすくなってましたよ。  \nＦ ： １．ありがとうございます。よかったです。\n \n ２．分\nわ\nかりました。すぐに直\nなお\nします。\n \n ３．もっと簡\nかん\n単\nたん\nにするんですか。\n2 番\nＦ ： ねえ、ちょっと木\nき\n村\nむら\nさんに用\nよう\nがあるんだけど、見\nみ\nなかった？\nＭ ： １．じゃ、一\nいっ\n緒\nしょ\nに見\nみ\nよう。\n \n ２．特\nとく\nに用\nよう nあした\n日何\nなん\n時\nじ\nまでにホテルを出\nで\nますか。\n1 番\n電\nでん\n話\nわ\nで妻\nつま\nと夫\nおっと\nが話\nはな\nしています。夫\nおっと\nはこれから何\nなに\nをしますか。\nＦ ： もしもし、今\nいま\n、用\nよう\n事\nじ\nが終\nお\nわったから帰\nかえ\nろうと思\nおも\nって駅\nえき\nに来\nき\nたんだけど、電\nでん\n車\nしゃ\nが動\nうご\nいてなくって。\nＭ ： えっ本\nほん\n当\nとう\n？\nＦ ： うん。少\nすこ\nし帰\nかえ\nる時\nじ\n間\nかん\nが遅\nおそ\nくなっちゃうと思\nおも\nう。そろそろ暗\nくら\nくなるし、洗\nせん\n濯\nたく\n物\nもの\n取\nと\nり込\nこ\nんどいて\nくれる？\nＭ ： 分\nわ\nかった。\nＦ ： それから、もうすぐ荷\nに\n物\nもつ\nが届\nとど\nくことになってるから、受\nう\nけ取\nと\nっといて。\nＭ ： ああ、それさっき届\nとど\nいたよ。晩\nばん\nご飯\nはん\nどうする？作\nつく\nっておこうか。\nＦ ： ありがとう。それは大\nだい\n丈\nじょう\n夫\nぶ\n。何\nなに\nかすぐ食\nた\nべられるもの買\nか\nって帰\nかえ\nるから。それより、庭\nにわ\nの花\nはな\nに\n水\nみず\nやっといてもらえない？いろいろ頼\nたの\nんで悪\nわる\nいんだけど。\nＭ ： 分\nわ\nかった。\n夫\nおっと\nはこれから何\nなに\nをしますか。\n聴解スクリプト\n1\n\n2 番\nクリーニング屋\nや\nで女\nおんな\nの人\nひと\nと店\nてん\n員\nいん\nが話\nはな\nしています。女\nおんな\nの人\nひと\nはワンピースをいつ取\nと\nりに来\nき\nますか。\nＦ ： すみません、このワンピースお願\nねが\nいします。いつできますか。\nＭ ： ええと今\nきょう\n日は水\nすい\n曜\nよう\n日\nび\nですね。土\nど\n曜\nよう\n日\nび\nにお渡\nわた\nしできます。\nＦ ： そうですか。その日\nひ\nに結\nけっ\n婚\nこん\n式\nしき\nがあるんで、その前\nぜん\n日\nじつ\nまでには取\nと\nりに来\nき\nたいんですが。\nＭ ： 急\nいそ\nぐようでしたら、500 円\nえん\n高\nたか\nくなってしまいますが、預\nあず\nかった翌\nよく\n日\nじつ\nにできるコースもありま\nすので、そちらにしていただけないでしょうか。\nＦ ： 分\nわ\nかりました。\nＭ ： あ、申\nもう\nし訳\nわけ\nありません。明\nあした\n日は定\nてい\n休\nきゅう\n日\nび\nなので。\nＦ ： じゃ、その次\nつぎ\nの日\nひ\nですね。\nＭ ： はい、よろしくお願\nねが\nいします。\n女\nおんな\nの人\nひと\nはワンピースをいつ取\nと\nりに来\nき\nますか。\n3 番\n会\nかい\n社\nしゃ\nで男\nおとこ\nの人\nひと\nと女\nおんな\nの人\nひと\nが歓\nかん\n迎\nげい\n会\nかい\nについて話\nはな\nしています。女\nおんな\nの人\nひと\nはこのあとまず何\nなに\nをしますか。\nＭ ： 再\nさ\n来\nらい\n週\nしゅう\nの新\nしん\n入\nにゅう\n社\nしゃ\n員\nいん\nの歓\nかん\n迎\nげい\n会\nかい\n、僕\nぼく\nが準\nじゅん\n備\nび\nすることになってたでしょう。ちょっと手\nて\n伝\nつだ\nってほ\nしいんだけど。\nＦ ： うん、いいよ。\nＭ ： 営\nえい\n業\nぎょう\n課\nか\n全\nぜん\n員\nいん\nに出\nで\nられるかどうかを聞\nき\nいてくれる？　もう店\nみせ\nは決\nき\nまってて、大\nだい\n体\nたい\nの人\nにん\n数\nずう\nは伝\nつた\nえ\nてあるんだけど、そろそろ最\nさい\n終\nしゅう\n的\nてき\nな人\nにん\n数\nずう\nをお店\nみせ\nに連\nれん\n絡\nらく\nしなきゃならないんだ。\nＦ ： 分\nわ\nかった。\nＭ ： 全\nぜん\n員\nいん\nに聞\nき\nいたら、店\nみせ\nに電\nでん\n話\nわ\nして、人\nにん\n数\nずう\nを連\nれん\n絡\nらく\nしておいてくれる？　その店\nみせ\n、今\nきょう\n日は休\nやす\nみだから、\n明\nあした\n日以\nい\n降\nこう\nでいいよ。それから、メンバ で一\nいっ\n緒\nしょ\nにやる発\nはっ\n表\nぴょう\nのことなんだけど。\nＭ ： うん。準\nじゅん\n備\nび\nも終\nお\nわったし、発\nはっ\n表\nぴょう\nを待\nま\nつだけだね。\nＦ ： 実\nじつ\nはね、昨\nきのう\n日、ゼミの先\nせん\n輩\nぱい\nに私\nわたし\nたちが準\nじゅん\n備\nび\nした、発\nはっ\n表\nぴょう\nで使\nつか\nう資\nし\n料\nりょう\nとか発\nはっ\n表\nぴょう\nの流\nなが\nれを見\nみ\nて\nもらったら、先\nせん\n輩\nぱい\nが問\nもん\n題\nだい\n点\nてん\nをいくつかあげてくれて。直\nなお\nしたほうがいいと思\nおも\nうんだ。\nＭ ： どこ？\nＦ ： うん。まずね、せっかく自\nじ\n分\nぶん\nたちで調\nちょう\n査\nさ\nして、面\nおも\n白\nしろ\nい結\nけっ\n果\nか\nが出\nで\nてるのに、数\nすう\n字\nじ\nが並\nなら\nんでるだ\nけだから、伝\nつた\nわりにくいって。\nＭ ： じゃ、グラフを加\nくわ\nえようか。\nＦ ： そうだね。それからもう一\nいっ\n点\nてん\n、私\nわたし\nたちの主\nしゅ\n張\nちょう\nが発\nはっ\n表\nぴょう\nの最\nさい\n後\nご\nにしかないから、途\nと\n中\nちゅう\nまで何\nなに\nが言\nい\nいたいのか分\nわ\nからないって。ねえ、発\nはっ\n表\nぴょう\nの流\nなが\nれ、変\nか\nえてみない？\nＭ ： うん、やってみよう。流\nなが\nれを変\nか\nえたら、調\nちょう\n査\nさ\n結\nけっ\n果\nか\nの見\nみ\nせ方\nかた\nも変\nか\nわってくるだろうから、グラ\nフのことは後\nあと\nにして、それからやろう。\nＦ ： うん。\n聴解スクリプト\n7\n\nＭ ： 先\nせん\n輩\nぱい\nにお礼\nれい\n言\nい\nっといてね。\n二\nふたり\n人はこのあとまず何\nなに\nをしますか。\n問題3\n例\n女\nおんな\nの人\nひと\nが友\nとも\n達\nだち\nのうちに来\nき\nて、話\nはな\nしています。\nＦ１ ： 田\nた\n中\nなか\nです。\nＦ２ ： あ、はあい。昨\nきのう\n日友\nとも\n達\nだち\nが泊\nと\nまりに来\nき\nてたんで、片\nかた\n付\nづ\nいてないけど、入\nはい\nって。\nＦ１ ： あ、でもここで。すぐ帰\nかえ\nるから。あのう、この前\nまえ\n借\nか\nりた本\nほん\nなんだけど、ちょっと破\nやぶ\nれちゃって。\nＦ２ ： え、本\nほん\n当\nとう\n？\nＦ１ ： うん、このページなんだけど。\nＦ２ ： あっ、うん、このくらいなら大\nだい\n丈\nじょう\n夫\nぶ\n。読\nよ\nめるし。\nＦ１ ： ほんと？　ごめん。これからは気\nき\nをつけるから。\nＦ２ ： うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１ ： ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nのうちへ何\nなに\nをしに来\nき\nましたか。\n１． 謝\nあやま\nりに来\nき\nた\n２． 本\nほん\nを借\nか\nりに来\nき\nた\n３． 泊\nと\nまりに来\nき\nた\n４． コーヒーを飲\nの\nみに来\nき\nた\n聴解スクリプト\n8\n\n1 番\nテレビでアナウンサーが話\nはな\nしています。\nＦ ： 皆\nみな\nさん、突\nとつ\n然\nぜん\nですが、私\nわたし\n、左\nひだり\n利\nき\nきなんです。マイクを持\nも\nつのも左\nひだり\n手\nて\n、はしを持\nも\nつのも左\nひだり\n手\nて\nです。今\nいま\n来\nき\nているこちらのお店\nみせ\n、文\nぶん\n房\nぼう\n具\nぐ\nなど、ちょっと見\nみ\nたところよくある普\nふ\n通\nつう\nのものが\n売\nう\nられていますが、大\nたい\n変\nへん\n人\nにん\n気\nき\nがあって、全\nぜん\n国\nこく\nからお客\nきゃく\nさんが集\nあつ\nまってくるそうです。すべ\nての商\nしょう\n品\nひん\nが左\nひだり\n利\nき\nきの人\nひと\nのためのものなんです。普\nふ\n段\nだん\nはあまり意\nい\n識\nしき\nしないかもしれませんが、\n普\nふ\n通\nつう\nのはさみ、包\nほう\n丁\nちょう\nなどは右\nみぎ\n手\nて\nで使\nつか\nうように作\nつく\nられています。こちらのお店\nみせ\nには、日\nにち\n常\nじょう\n使\nつか\nうものからパソコンのキーボードなどの電\nでん\n気\nき\n製\nせい\n品\nひん\n、ギターなどの楽\nがっ\n器\nき\nまであるんですよ。す\nごいですね。\nアナウンサーは主\nおも\nに何\nなに\nについて話\nはな\nしていますか。\n１． 左\nひだり\n利\nき\nき用\nよう\nの道\nどう\n具\nぐ\nの特\nとく\n徴\nちょう\n２． 左\nひだり\n利\nき\nきの人\nひと\nの苦\nく\n労\nろう\n３． この店\nみせ\nで扱\nあつか\nっている商\nしょう\n品\nひん\n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、指\nし\n導\nどう\n者\nしゃ\nになることも考\nかんが\nえました。でも、目\nもく\n標\nひょう\nを持\nも\nって頑\nがん\n張\nば\nる若\nわか\nい選\nせん\n手\nしゅ\nたちの試\nし\n合\nあい\nを\n見\nみ\nて、まだあきらめられない気\nき\n持\nも\nちが出\nで\nてきました。自\nじ\n分\nぶん\nもその場\nば\n所\nしょ\nに立\nた\nちたいと思\nおも\nい、選\nせん\n手\nしゅ\nを育\nそだ\nてるのはもう少\nすこ\nし先\nさき\nでもいいと思\nおも\nったんです。休\nやす\nんでいる間\nあいだ\nも応\nおう\n援\nえん\nしてくださった方\nかた\nたちのためにも、新\nあたら\nしい気\nき\n持\nも\nちでやっていきたいと思\nおも\nいます。\nこのスポーツ選\nせん\n手\nしゅ\nが伝\nつた\nえたいことは何\nなん\nですか。\n１． 選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむということ\n２． 選\nせん\n手\nしゅ\nをやめるということ\n３． 指\nし\n導\nどう\n者\nしゃ\nになるということ\n４． もう一\nいち\n度\nど\n選\nせん\n手\nしゅ\nとして活\nかつ\n動\nどう\nするということ\n聴解スクリプト\n9\n\n3 番\nテレビで博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nが話\nはな\nしています。\nＭ ： 子\nこ\n供\nども\nに科\nか\n学\nがく\nを好\nす\nきになってもらいたいご両\nりょう\n親\nしん\n、多\nおお\nいと思\nおも\nいます。でも、子\nこ\n供\nども\nに正\nただ\nしく分\nわ\nかっ\nてもらおうと、つい大\nおとな\n人に説\nせつ\n明\nめい\nするときのように数\nすう\n学\nがく\n的\nてき\nな話\nはなし\nや専\nせん\n門\nもん\n的\nてき\nな話\nはなし\nをしていません\nか。子\nこ\n供\nども\nには難\nむずか\nしい話\nはなし\nをしてもしかたありません。言\nこと\n葉\nば\nで詳\nくわ\nしく説\nせつ\n明\nめい\nするよりも実\nじっ\n際\nさい\nに経\nけい\n験\nけん\nさせることが大\nたい\n切\nせつ\nなんです。例\nたと\nえば、月\nつき\nでの重\nおも\nさの感\nかん\nじ方\nかた\nを教\nおし\nえるときだったら、地\nち\n球\nきゅう\nで\n1 キログラムのものが月\nつき\nではどのくらいの重\nおも\nさに感\nかん\nじるか、持\nも\nった感\nかん\n覚\nかく\nで分\nわ\nかるようにする\nといいですよ。\n博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nは何\nなに\nについて話\nはな\nしていますか。\n１． 子\nこ\n供\nども\nが科\nか\n学\nがく\nを好\nす\nきな理\nり\n由\nゆう\n２． 子\nこ\n供\nども\nへの科\nか\n学\nがく\nの教\nおし\nえ方\nかた\n３． 子\nこ\n供\nども\nに科\nか\n学\nがく\nを学\nまな\nばせる理\nり\n由\nゆう\n４． 子\nこ\n供\nども\nにとって必\nひつ\n要\nよう\nな科\nか\n学\nがく\nの知\nち\n い\n丈\nじょう\n夫\nぶ\n。\n男\nおとこ\nの人\nひと\nはこれからどうやって女\nおんな\nの人\nひと\nの国\nくに\nの言\nこと\n葉\nば\nを勉\nべん\n強\nきょう\nすることにしましたか。\n聴解スクリプト\n6\n\n5 番\nレストランで店\nてん\n長\nちょう\nと女\nおんな\nの店\nてん\n員\nいん\nが話\nはな\nしています。女\nおんな\nの店\nてん\n員\nいん\nは店\nみせ\nについて何\nなに\nが問\nもん\n題\nだい\nだと言\nい\nっていま\nすか。\nＭ ： 店\nみせ\nがオープンしてやっと1 か月\nげつ\n経\nた\nったけど、何\nなに\nか気\nき\nづいたことある？\nＦ ： そうですね。はじめは、朝\nあさ\n6 時\nじ\nっていう開\nかい\n店\nてん\nの時\nじ\n間\nかん\nはちょっと早\nはや\nいと思\nおも\nって、お客\nきゃく\n様\nさま\nがいらっ\nしゃるかどうか心\nしん\n配\nぱい\nだったんですが、近\nきん\n所\nじょ\nの方\nかた\nがよく朝\nちょう\n食\nしょく\nを食\nた\nべに来\nき\nてくださるので、驚\nおどろ\nきました。\nＭ ： 確\nたし\nかに予\nよ\n想\nそう\n以\nい\n上\nじょう\nだったね。\nＦ ： はい。それと、食\nしょく\n事\nじ\nがすんでいるのに、ずっとお帰\nかえ\nりにならない方\nかた\nがけっこういらっしゃる\nのが気\nき\nになります。アルバイトの森\nもり\nさんが言\nい\nってたんですけど、せっかく来\nき\nてくださったお\n客\nきゃく\n様\nさま\nが席\nせき\nがなくて入\nはい\nれないっていうことが何\nなん\n回\nかい\nかあったそうです。\nＭ ： そういうときは、お客\nきゃく\n様\nさま\nの気\nき\n分\nぶん\nを悪\nわる\nくさせずに席\nせき\nを空\nあ\nけていただくように頼\nたの\nまなきゃいけな\nいんだけど。うちの店\nみせ\nは若\nわか\nい店\nてん\n員\nいん\nが多\nおお\nいから、上\nじょう\n手\nず\nに伝\nつた\nえるのは難\nむずか\nしいかもしれないね。\n女\nおんな\nの店\nてん\n員\nいん\nは店\nみせ\nについて何\nなに\nが問\nもん\n題\nだい\nだと言\nい\nっていますか。\n6 番\n女\nおんな\nの学\nがく\n生\nせい\nと男\nおとこ\nの学\nがく\n生\nせい\nが授\nじゅ\n業\nぎょう\nの発\nはっ\n表\nぴょう\nで使\nつか\nう資\nし\n料\nりょう\nについて話\nはな\nしています。二\nふたり\n人はこのあとまず何\nなに\nをしますか。\nＦ ： ねえ、社\nしゃ\n会\nかい\n学\nがく\nの授\nじゅ\n業\nぎょう\nで一\nいっ\n緒\nしょ\nにやる発\nはっ\n表\nぴょう\nのことなんだけど。\nＭ ： うん。準\nじゅん\n備\nび\nも終\nお\nわったし、発\nはっ\n表\nぴょう\nを待\nま\nつだけだね。\nＦ ： 実\nじつ\nはね、昨\nきのう\n日、ゼミの先\nせん\n輩\nぱい\nに私\nわたし\nたちが準\nじゅん\n備\nび\nした、発\nはっ\n表\nぴょう\nで使\nつか\nう資\nし\n料\nりょう\nとか発\nはっ\n表\nぴょう\nの流\nなが\nれを見\nみ\nて\nもらったら、先\nせん\n輩\nぱい\nが問\nもん\n題\nだい\n点\nてん\nをいくつかあげてくれて。直\nなお\nしたほうがいいと思\nおも\nうんだ。\nＭ ： どこ？\nＦ ： うん。まずね、せっかく自\nじ\n分\nぶん\nたちで調\nちょう\n査\nさ\nして、面\nおも\n白\nしろ\nい結\nけっ\n果\nか\nが出\nで\nてるのに、数\nすう\n字\nじ\nが並\nなら\nんでるだ\nけだから、伝\nつた\nわりにくいって。\nＭ ： じゃ、グラフを加\nくわ\nえようか。\nＦ ： そうだね。それからもう一\nいっ\n点\nてん\n、私\nわたし\nたちの主\nしゅ\n張\nちょう\nが発\nはっ\n表\nぴょう\nの最\nさい\n後\nご\nにしかないから、途\nと\n中\nちゅう\nまで何\nなに\nが言\nい\nいたいのか分\nわ\nからないって。ねえ、発\nはっ\n表\nぴょう\nの流\nなが\nれ、変\nか\nえてみない？\nＭ ： うん、やってみよう。流\nなが\nれを変\nか\nえたら、調\nちょう\n査\nさ\n結\nけっ\n果\nか\nの見\nみ\nせ方\nかた\nも変\nか\nわってくるだろうから、グラ\nフのことは後\nあと\nにして、それからやろう。\nＦ ： うん。\n聴解スクリプト\n7\n\nＭ ： 先\nせん\n輩\nぱい\nにお礼\nれい\n言\nい\nっといてね。\n二\nふたり\n人はこのあとまず何\nなに\nをしますか。\n問題3\n例\n女\nおんな\nの人\nひと\nが友\nとも\n達\nだち\nのうちに来\nき\nて、話\nはな\nしています。\nＦ１ ： 田\nた\n中\nなか\nです。\nＦ２ ： あ、はあい。昨\nきのう\n日友\nとも\n達\nだち\nが泊\nと\nまりに来\nき\nてたんで、片\nかた\n付\nづ\nいてないけど、入\nはい\nって。\nＦ１ ： あ、でもここで。すぐ帰\nかえ\nるから。あのう、この前\nまえ\n借\nか\nりた本\nほん\nなんだけど、ちょっと破\nやぶ\nれちゃって。\nＦ２ ： え、本\nほん\n当\nとう\n？\nＦ１ ： うん、このページなんだけど。\nＦ２ ： あっ、うん、このくらいなら大\nだい\n丈\nじょう\n夫\nぶ\n。読\nよ\nめるし。\nＦ１ ： ほんと？　ごめん。これからは気\nき\nをつけるから。\nＦ２ ： うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１ ： ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nのうちへ何\nなに\nをしに来\nき\nましたか。\n１． 謝\nあやま\nりに来\nき\nた\n２． 本\nほん\nを借\nか\nりに来\nき\nた\n３． 泊\nと\nまりに来\nき\nた\n４． コーヒーを飲\nの\nみに来\nき\nた\n聴解スクリプト\n8\n\n1 番\nテレビでアナウンサーが話\nはな\nしています。\nＦ ： 皆\nみな\nさん、突\nとつ\n然\nぜん\nですが、私\nわたし\n、左\nひだり\n利\nき\nきなんです。マイクを持\nも\nつのも左\nひだり\n手\nて\n、はしを持\nも\nつのも左\nひだり\n手\nて\nです。今\nいま\n来\nき\nているこちらのお店\nみせ\n、文\nぶん\n房\nぼう\n具\nぐ\nなど、ちょっと見\nみ\nたところよくある普\nふ\n通\nつう\nのものが\n売\nう\nられていますが、大\nたい\n変\nへん\n人\nにん\n気\nき\nがあって、全\nぜん\n国\nこく\nからお客\nきゃく\nさんが集\nあつ\nまってくるそうです。すべ\nての商\nしょう\n品\nひん\nが左\nひだり\n利\nき\nきの人\nひと\nのためのものなんです。普\nふ\n段\nだん\nはあまり意\nい\n識\nしき\nしないかもしれませんが、\n普\nふ\n通\nつう\nのはさみ、包\nほう\n丁\nちょう\nなどは右\nみぎ\n手\nて\nで使\nつか\nうように作\nつく\nられています。こちらのお店\nみせ\nには、日\nにち\n常\nじょう\n使\nつか\nうものからパソコンのキーボードなどの電\nでん\n気\nき\n製\nせい\n品\nひん\n、ギターなどの楽\nがっ\n器\nき\nまであるんですよ。す\nごいですね。\nアナウンサーは主\nおも\nに何\nなに\nについて話\nはな\nしていますか。\n１． 左\nひだり\n利\nき\nき用\nよう\nの道\nどう\n具\nぐ\nの特\nとく\n徴\nちょう\n２． 左\nひだり\n利\nき\nきの人\nひと\nの苦\nく\n労\nろう\n３． この店\nみせ\nで扱\nあつか\nっている商\nしょう\n品\nひん\n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、指\nし\n導\nどう\n者\nしゃ\nになることも考\nかんが\nえました。でも、目\nもく\n標\nひょう\nを持\nも\nって頑\nがん\n張\nば\nる若\nわか\nい選\nせん\n手\nしゅ\nたちの試\nし\n合\nあい\nを\n見\nみ\nて、まだあきらめられない気\nき\n持\nも\nちが出\nで\nてきました。自\nじ\n分\nぶん\nもその場\nば\n所\nしょ\nに立\nた\nちたいと思\n nき\nた\n４． コーヒーを飲\nの\nみに来\nき\nた\n聴解スクリプト\n8\n\n1 番\nテレビでアナウンサーが話\nはな\nしています。\nＦ ： 皆\nみな\nさん、突\nとつ\n然\nぜん\nですが、私\nわたし\n、左\nひだり\n利\nき\nきなんです。マイクを持\nも\nつのも左\nひだり\n手\nて\n、はしを持\nも\nつのも左\nひだり\n手\nて\nです。今\nいま\n来\nき\nているこちらのお店\nみせ\n、文\nぶん\n房\nぼう\n具\nぐ\nなど、ちょっと見\nみ\nたところよくある普\nふ\n通\nつう\nのものが\n売\nう\nられていますが、大\nたい\n変\nへん\n人\nにん\n気\nき\nがあって、全\nぜん\n国\nこく\nからお客\nきゃく\nさんが集\nあつ\nまってくるそうです。すべ\nての商\nしょう\n品\nひん\nが左\nひだり\n利\nき\nきの人\nひと\nのためのものなんです。普\nふ\n段\nだん\nはあまり意\nい\n識\nしき\nしないかもしれませんが、\n普\nふ\n通\nつう\nのはさみ、包\nほう\n丁\nちょう\nなどは右\nみぎ\n手\nて\nで使\nつか\nうように作\nつく\nられています。こちらのお店\nみせ\nには、日\nにち\n常\nじょう\n使\nつか\nうものからパソコンのキーボードなどの電\nでん\n気\nき\n製\nせい\n品\nひん\n、ギターなどの楽\nがっ\n器\nき\nまであるんですよ。す\nごいですね。\nアナウンサーは主\nおも\nに何\nなに\nについて話\nはな\nしていますか。\n１． 左\nひだり\n利\nき\nき用\nよう\nの道\nどう\n具\nぐ\nの特\nとく\n徴\nちょう\n２． 左\nひだり\n利\nき\nきの人\nひと\nの苦\nく\n労\nろう\n３． この店\nみせ\nで扱\nあつか\nっている商\nしょう\n品\nひん\n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、指\nし\n導\nどう\n者\nしゃ\nになることも考\nかんが\nえました。でも、目\nもく\n標\nひょう\nを持\nも\nって頑\nがん\n張\nば\nる若\nわか\nい選\nせん\n手\nしゅ\nたちの試\nし\n合\nあい\nを\n見\nみ\nて、まだあきらめられない気\nき\n持\nも\nちが出\nで\nてきました。自\nじ\n分\nぶん\nもその場\nば\n所\nしょ\nに立\nた\nちたいと思\nおも\nい、選\nせん\n手\nしゅ\nを育\nそだ\nてるのはもう少\nすこ\nし先\nさき\nでもいいと思\nおも\nったんです。休\nやす\nんでいる間\nあいだ\nも応\nおう\n援\nえん\nしてくださった方\nかた\nたちのためにも、新\nあたら\nしい気\nき\n持\nも\nちでやっていきたいと思\nおも\nいます。\nこのスポーツ選\nせん\n手\nしゅ\nが伝\nつた\nえたいことは何\nなん\nですか。\n１． 選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむということ\n２． 選\nせん\n手\nしゅ\nをやめるということ\n３． 指\nし\n導\nどう\n者\nしゃ\nになるということ\n４． もう一\nいち\n度\nど\n選\nせん\n手\nしゅ\nとして活\nかつ\n動\nどう\nするということ\n聴解スクリプト\n9\n\n3 番\nテレビで博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nが話\nはな\nしています。\nＭ ： 子\nこ\n供\nども\nに科\nか\n学\nがく\nを好\nす\nきになってもらいたいご両\nりょう\n親\nしん\n、多\nおお\nいと思\nおも\nいます。でも、子\nこ\n供\nども\nに正\nただ\nしく分\nわ\nかっ\nてもらおうと、つい大\nおとな\n人に説\nせつ\n明\nめい\nするときのように数\nすう\n学\nがく\n的\nてき\nな話\nはなし\nや専\nせん\n門\nもん\n的\nてき\nな話\nはなし\nをしていません\nか。子\nこ\n供\nども\nには難\nむずか\nしい話\nはなし\nをしてもしかたありません。言\nこと\n葉\nば\nで詳\nくわ\nしく説\nせつ\n明\nめい\nするよりも実\nじっ\n際\nさい\nに経\nけい\n験\nけん\nさせることが大\nたい\n切\nせつ\nなんです。例\nたと\nえば、月\nつき\nでの重\nおも\nさの感\nかん\nじ方\nかた\nを教\nおし\nえるときだったら、地\nち\n球\nきゅう\nで\n1 キログラムのものが月\nつき\nではどのくらいの重\nおも\nさに感\nかん\nじるか、持\nも\nった感\nかん\n覚\nかく\nで分\nわ\nかるようにする\nといいですよ。\n博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nは何\nなに\nについて話\nはな\nしていますか。\n１． 子\nこ\n供\nども\nが科\nか\n学\nがく\nを好\nす\nきな理\nり\n由\nゆう\n２． 子\nこ\n供\nども\nへの科\nか\n学\nがく\nの教\nおし\nえ方\nかた\n３． 子\nこ\n供\nども\nに科\nか\n学\nがく\nを学\nまな\nばせる理\nり\n由\nゆう\n４． 子\nこ\n供\nども\nにとって必\nひつ\n要\nよう\nな科\nか\n学\nがく\nの知\nち\n識\nしき\n問題4\n例\nホテルのテレビが壊\nこわ\nれています。何\nなん\nと言\nい\nいますか。\nＦ ： １．テレビがつかないんですが。\n \n ２．テレビをつけてもいいですか。\n \n ３．テレビをつけたほうがいいですよ。\n1 番\n約\nやく\n束\nそく\nの時\nじ\n間\nかん\nに少\nすこ\nし遅\nおく\nれました。友\nとも\n達\nだち\nに何\nなん\nと言\nい\nいますか。  \nＦ ： １．待\nま\nたせてごめん。\n \n ２．急\nいそ\nがせちゃってごめん。\n \n ３．ごめん、お先\nさき\nに。\n聴解スクリプト\n10\n\n2 番\n観\nかん\n光\nこう\nの案\nあん\n内\nない\nをしています。建\nたて\n物\nもの\nを見\nみ\nてもらいたいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．こちらでお目\nめ\nにかかります。\n \n ２．こちらをご覧\nらん\nください。\n \n ３．お見\nみ\nせくださいますか。\n3 番\n荷\nに\n物\nもつ\nを受\nう\nけ取\nと\nります。サインするところが分\nわ\nかりません。何\nなん\nと言\nい\nいますか。\nＭ ： １．どこにサインが書\nか\nいてありますか。\n \n ２．どこでサインを渡\nわた\nしましょうか。\n \n ３．どこにサインをすればいいですか。\n4 番\n今\nきょう\n日はあまりおなかがすいていません。ご飯\nはん\nを普\nふ\n通\nつう\nより少\nすく\nなくしてほしいです。何\nなん\nと言\nい\nいますか。\nＦ ： １．ご飯\nはん\n、少\nすく\nなすぎるんですけど。\n \n ２．ご飯\nはん\n、あと少\nすこ\nしほしいです。\n \n ３．ご飯\nはん\n、少\nすく\nな目\nめ\nでお願\nねが\nいします。\n問題5\n例\nＭ ： すみません、今\nいま\n、時\nじ\n間\nかん\n、ありますか。\nＦ ： １．ええと、１０時\nじ\n２０分\nぷん\nです。\n \n ２．ええ。何\nなん\nですか。\n \n ３．時\nと\n計\nけい\nはあそこですよ。\n聴解スクリプト\n11\n\n1 番\nＭ ： 山\nやま\n田\nだ\nさん、作\nつく\nり直\nなお\nしてくれた資\nし\n料\nりょう\n、見\nみ\nやすくなってましたよ。  \nＦ ： １．ありがとうございます。よかったです。\n \n ２．分\nわ\nかりました。すぐに直\nなお\nします。\n \n ３．もっと簡\nかん\n単\nたん\nにするんですか。\n2 番\nＦ ： ねえ、ちょっと木\nき\n村\nむら\nさんに用\nよう\nがあるんだけど、見\nみ\nなかった？\nＭ ： １．じゃ、一\nいっ\n緒\nしょ\nに見\nみ\nよう。\n \n ２．特\nとく\nに用\nよう\nはないんだけど。\n \n ３．さあ。ほかの人\nひと\nに聞\nき\nいてみて。\n3 番\nＭ ： 昨\nきのう\n日貸\nか\nしてくれた本\nほん\n、読\nよ\nみ出\nだ\nしたら止\nと\nまらなくなっちゃったよ。\nＦ ： １．じゃ、全\nぜん\n部\nぶ\n読\nよ\nまなくてもいいよ。\n \n ２．けっこうおもしろかったでしょう。\n \n ３．本\nほん\n、なくなっちゃったの？\n4 \nりょう\nとか発\nはっ\n表\nぴょう\nの流\nなが\nれを見\nみ\nて\nもらったら、先\nせん\n輩\nぱい\nが問\nもん\n題\nだい\n点\nてん\nをいくつかあげてくれて。直\nなお\nしたほうがいいと思\nおも\nうんだ。\nＭ ： どこ？\nＦ ： うん。まずね、せっかく自\nじ\n分\nぶん\nたちで調\nちょう\n査\nさ\nして、面\nおも\n白\nしろ\nい結\nけっ\n果\nか\nが出\nで\nてるのに、数\nすう\n字\nじ\nが並\nなら\nんでるだ\nけだから、伝\nつた\nわりにくいって。\nＭ ： じゃ、グラフを加\nくわ\nえようか。\nＦ ： そうだね。それからもう一\nいっ\n点\nてん\n、私\nわたし\nたちの主\nしゅ\n張\nちょう\nが発\nはっ\n表\nぴょう\nの最\nさい\n後\nご\nにしかないから、途\nと\n中\nちゅう\nまで何\nなに\nが言\nい\nいたいのか分\nわ\nからないって。ねえ、発\nはっ\n表\nぴょう\nの流\nなが\nれ、変\nか\nえてみない？\nＭ ： うん、やってみよう。流\nなが\nれを変\nか\nえたら、調\nちょう\n査\nさ\n結\nけっ\n果\nか\nの見\nみ\nせ方\nかた\nも変\nか\nわってくるだろうから、グラ\nフのことは後\nあと\nにして、それからやろう。\nＦ ： うん。\n聴解スクリプト\n7\n\nＭ ： 先\nせん\n輩\nぱい\nにお礼\nれい\n言\nい\nっといてね。\n二\nふたり\n人はこのあとまず何\nなに\nをしますか。\n問題3\n例\n女\nおんな\nの人\nひと\nが友\nとも\n達\nだち\nのうちに来\nき\nて、話\nはな\nしています。\nＦ１ ： 田\nた\n中\nなか\nです。\nＦ２ ： あ、はあい。昨\nきのう\n日友\nとも\n達\nだち\nが泊\nと\nまりに来\nき\nてたんで、片\nかた\n付\nづ\nいてないけど、入\nはい\nって。\nＦ１ ： あ、でもここで。すぐ帰\nかえ\nるから。あのう、この前\nまえ\n借\nか\nりた本\nほん\nなんだけど、ちょっと破\nやぶ\nれちゃって。\nＦ２ ： え、本\nほん\n当\nとう\n？\nＦ１ ： うん、このページなんだけど。\nＦ２ ： あっ、うん、このくらいなら大\nだい\n丈\nじょう\n夫\nぶ\n。読\nよ\nめるし。\nＦ１ ： ほんと？　ごめん。これからは気\nき\nをつけるから。\nＦ２ ： うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１ ： ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nのうちへ何\nなに\nをしに来\nき\nましたか。\n１． 謝\nあやま\nりに来\nき\nた\n２． 本\nほん\nを借\nか\nりに来\nき\nた\n３． 泊\nと\nまりに来\nき\nた\n４． コーヒーを飲\nの\nみに来\nき\nた\n聴解スクリプト\n8\n\n1 番\nテレビでアナウンサーが話\nはな\nしています。\nＦ ： 皆\nみな\nさん、突\nとつ\n然\nぜん\nですが、私\nわたし\n、左\nひだり\n利\nき\nきなんです。マイクを持\nも\nつのも左\nひだり\n手\nて\n、はしを持\nも\nつのも左\nひだり\n手\nて\nです。今\nいま\n来\nき\nているこちらのお店\nみせ\n、文\nぶん\n房\nぼう\n具\nぐ\nなど、ちょっと見\nみ\nたところよくある普\nふ\n通\nつう\nのものが\n売\nう\nられていますが、大\nたい\n変\nへん\n人\nにん\n気\nき\nがあって、全\nぜん\n国\nこく\nからお客\nきゃく\nさんが集\nあつ\nまってくるそうです。すべ\nての商\nしょう\n品\nひん\nが左\nひだり\n利\nき\nきの人\nひと\nのためのものなんです。普\nふ\n段\nだん\nはあまり意\nい\n識\nしき\nしないかもしれませんが、\n普\nふ\n通\nつう\nのはさみ、包\nほう\n丁\nちょう\nなどは右\nみぎ\n手\nて\nで使\nつか\nうように作\nつく\nられています。こちらのお店\nみせ\nには、日\nにち\n常\nじょう\n使\nつか\nうものからパソコンのキーボードなどの電\nでん\n気\nき\n製\nせい\n品\nひん\n、ギターなどの楽\nがっ\n器\nき\nまであるんですよ。す\nごいですね。\nアナウンサーは主\nおも\nに何\nなに\nについて話\nはな\nしていますか。\n１． 左\nひだり\n利\nき\nき用\nよう\nの道\nどう\n具\nぐ\nの特\nとく\n徴\nちょう\n２． 左\nひだり\n利\nき\nきの人\nひと\nの苦\nく\n労\nろう\n３． この店\nみせ\nで扱\nあつか\nっている商\nしょう\n品\nひん\n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、指\nし\n導\nどう\n者\nしゃ\nになることも考\nかんが\nえました。でも、目\nもく\n標\nひょう\nを持\nも\nって頑\nがん\n張\nば\nる若\nわか\nい選\nせん\n手\nしゅ\nたちの試\nし\n合\nあい\nを\n見\nみ\nて、まだあきらめられない気\nき\n持\nも\nちが出\nで\nてきました。自\nじ\n分\nぶん\nもその場\nば\n所\nしょ\nに立\nた\nちたいと思\nおも\nい、選\nせん\n手\nしゅ\nを育\nそだ\nてるのはもう少\nすこ\nし先\nさき\nでもいいと思\nおも\nったんです。休\nやす\nんでいる間\nあいだ\nも応\nおう\n援\nえん\nしてくださった方\nかた\nたちのためにも、新\nあたら\nしい気\nき\n持\nも\nちでやっていきたいと思\nおも\nいます。\nこのスポーツ選\nせん\n手\nしゅ\nが伝\nつた\nえたいことは何\nなん\nですか。\n１． 選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむということ\n２． 選\nせん\n手\nしゅ\nをやめるということ\n３． 指\nし\n導\nどう\n者\nしゃ\nになるということ\n４． もう一\nいち\n度\nど\n選\nせん\n手\nしゅ\nとして活\nかつ\n動\nどう\nするということ\n聴解スクリプト\n9\n\n3 番\nテレビで博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nが話\nはな\nしています。\nＭ ： 子\nこ\n供\nども\nに科\nか\n学\nがく\nを好\nす\nきになってもらいたいご両\nりょう\n親\nしん\n、多\nおお\nいと思\nおも\nいます。でも、子\nこ\n供\nども\nに正\nただ\nしく分\nわ\nかっ\nてもらおうと、つい大\nおとな\n人に説\nせつ\n明\nめい\nするときのように数\nすう\n学\nがく\n的\nてき\nな話\nはなし\nや専\nせん\n門\nもん\n的\nてき\nな話\nはなし\nをしていません\nか。子\nこ\n供\nども\nには難\nむずか\nしい話\nはなし\nをしてもしかたありません。言\nこと\n葉\nば\nで詳\nくわ\nしく説\nせつ\n明\nめい\nするよりも実\nじっ\n際\nさい\nに経\nけい\n験\nけん\nさせることが大\nたい\n切\nせつ\nなんです。例\nたと\nえば、月\nつき\nでの重\nおも\nさの感\nかん\nじ方\nかた\nを教\nおし\nえるときだったら、地\nち\n球\nきゅう\nで\n1 キログラムのものが月\nつき\nではどのくらいの重\nおも\nさに感\nかん\nじるか、持\nも\nった感\nかん\n覚\nかく\nで分\nわ\nかるようにする\nといいですよ。\n博\nはく\n物\nぶつ\n館\nかん\nの人\nひと\nは何\nなに\nについて話\nはな\nしていますか。\n１． 子\nこ\n供\nども\nが科\nか\n学\nがく\nを好\nす\nきな理\nり\n由\nゆう\n２． 子\nこ\n供\nども\nへの科\nか\n学\nがく\nの教\nおし\nえ方\nかた\n３． 子\nこ\n供\nども\nに科\nか\n学\nがく\nを学\nまな\nばせる理\nり\n由\nゆう\n４． 子\nこ\n供\nども\nにとって必\nひつ\n要\nよう\nな科\nか\n学\nがく\nの知\nち\n識\nしき\n問題4\n例\nホテルのテレビが壊\nこわ\nれています。何\nなん\nと言\nい\nいますか。\nＦ ： １．テレビがつかないんですが。\n \n ２．テレビをつけてもいいですか。\n \n ３．テレビをつけたほうがいいですよ。\n1 番\n約\nやく\n束\nそく\nの時\nじ\n間\nかん\nに少\nすこ\nし遅\nおく\nれました。友\nとも\n達\nだち\nに何\nなん\nと言\nい\nい \nいん\nは店\nみせ\nについて何\nなに\nが問\nもん\n題\nだい\nだと言\nい\nっていま\nすか。\nＭ ： 店\nみせ\nがオープンしてやっと1 か月\nげつ\n経\nた\nったけど、何\nなに\nか気\nき\nづいたことある？\nＦ ： そうですね。はじめは、朝\nあさ\n6 時\nじ\nっていう開\nかい\n店\nてん\nの時\nじ\n間\nかん\nはちょっと早\nはや\nいと思\nおも\nって、お客\nきゃく\n様\nさま\nがいらっ\nしゃるかどうか心\nしん\n配\nぱい\nだったんですが、近\nきん\n所\nじょ\nの方\nかた\nがよく朝\nちょう\n食\nしょく\nを食\nた\nべに来\nき\nてくださるので、驚\nおどろ\nきました。\nＭ ： 確\nたし\nかに予\nよ\n想\nそう\n以\nい\n上\nじょう\nだったね。\nＦ ： はい。それと、食\nしょく\n事\nじ\nがすんでいるのに、ずっとお帰\nかえ\nりにならない方\nかた\nがけっこういらっしゃる\nのが気\nき\nになります。アルバイトの森\nもり\nさんが言\nい\nってたんですけど、せっかく来\nき\nてくださったお\n客\nきゃく\n様\nさま\nが席\nせき\nがなくて入\nはい\nれないっていうことが何\nなん\n回\nかい\nかあったそうです。\nＭ ： そういうときは、お客\nきゃく\n様\nさま\nの気\nき\n分\nぶん\nを悪\nわる\nくさせずに席\nせき\nを空\nあ\nけていただくように頼\nたの\nまなきゃいけな\nいんだけど。うちの店\nみせ\nは若\nわか\nい店\nてん\n員\nいん\nが多\nおお\nいから、上\nじょう\n手\nず\nに伝\nつた\nえるのは難\nむずか\nしいかもしれないね。\n女\nおんな\nの店\nてん\n員\nいん\nは店\nみせ\nについて何\nなに\nが問\nもん\n題\nだい\nだと言\nい\nっていますか。\n6 番\n女\nおんな\nの学\nがく\n生\nせい\nと男\nおとこ\nの学\nがく\n生\nせい\nが授\nじゅ\n業\nぎょう\nの発\nはっ\n表\nぴょう\nで使\nつか\nう資\nし\n料\nりょう\nについて話\nはな\nしています。二\nふたり\n人はこのあとまず何\nなに\nをしますか。\nＦ ： ねえ、社\nしゃ\n会\nかい\n学\nがく\nの授\nじゅ\n業\nぎょう\nで一\nいっ\n緒\nしょ\nにやる発\nはっ\n表\nぴょう\nのことなんだけど。\nＭ ： うん。準\nじゅん\n備\nび\nも終\nお\nわったし、発\nはっ\n表\nぴょう\nを待\nま\nつだけだね。\nＦ ： 実\nじつ\nはね、昨\nきのう\n日、ゼミの先\nせん\n輩\nぱい\nに私\nわたし\nたちが準\nじゅん\n備\nび\nした、発\nはっ\n表\nぴょう\nで使\nつか\nう資\nし\n料\nりょう\nとか発\nはっ\n表\nぴょう\nの流\nなが\nれを見\nみ\nて\nもらったら、先\nせん\n輩\nぱい\nが問\nもん\n題\nだい\n点\nてん\nをいくつかあげてくれて。直\nなお\nしたほうがいいと思\nおも\nうんだ。\nＭ ： どこ？\nＦ ： うん。まずね、せっかく自\nじ\n分\nぶん\nたちで調\nちょう\n査\nさ\nして、面\nおも\n白\nしろ\nい結\nけっ\n果\nか\nが出\nで\nてるのに、数\nすう\n字\nじ\nが並\nなら\nんでるだ\nけだから、伝\nつた\nわりにくいって。\nＭ ： じゃ、グラフを加\nくわ\nえようか。\nＦ ： そうだね。それからもう一\nいっ\n点\nてん\n、私\nわたし\nたちの主\nしゅ\n張\nちょう\nが発\nはっ\n表\nぴょう\nの最\nさい\n後\nご\nにしかないから、途\nと\n中\nちゅう\nまで何\nなに\nが言\nい\nいたいのか分\nわ\nからないって。ねえ、発\nはっ\n表\nぴょう\nの流\nなが\nれ、変\nか\nえてみない？\nＭ ： うん、やってみよう。流\nなが\nれを変\nか\nえたら、調\nちょう\n査\nさ\n結\nけっ\n果\nか\nの見\nみ\nせ方\nかた\nも変\nか\nわってくるだろうから、グラ\nフのことは後\nあと\nにして、それからやろう。\nＦ ： うん。\n聴解スクリプト\n7\n\nＭ ： 先\nせん\n輩\nぱい\nにお礼\nれい\n言\nい\nっといてね。\n二\nふたり\n人はこのあとまず何\nなに\nをしますか。\n問題3\n例\n女\nおんな\nの人\nひと\nが友\nとも\n達\nだち\nのうちに来\nき\nて、話\nはな\nしています。\nＦ１ ： 田\nた\n中\nなか\nです。\nＦ２ ： あ、はあい。昨\nきのう\n日友\nとも\n達\nだち\nが泊\nと\nまりに来\nき\nてたんで、片\nかた\n付\nづ\nいてないけど、入\nはい\nって。\nＦ１ ： あ、でもここで。すぐ帰\nかえ\nるから。あのう、この前\nまえ\n借\nか\nりた本\nほん\nなんだけど、ちょっと破\nやぶ\nれちゃって。\nＦ２ ： え、本\nほん\n当\nとう\n？\nＦ１ ： うん、このページなんだけど。\nＦ２ ： あっ、うん、このくらいなら大\nだい\n丈\nじょう\n夫\nぶ\n。読\nよ\nめるし。\nＦ１ ： ほんと？　ごめん。これからは気\nき\nをつけるから。\nＦ２ ： うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１ ： ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nのうちへ何\nなに\nをしに来\nき\nましたか。\n１． 謝\nあやま\nりに来\nき\nた\n２． 本\nほん\nを借\nか\nりに来\nき\nた\n３． 泊\nと\nまりに来\nき\nた\n４． コーヒーを飲\nの\nみに来\nき\nた\n聴解スクリプト\n8\n\n1 番\nテレビでアナウンサーが話\nはな\nしています。\nＦ ： 皆\nみな\nさん、突\nとつ\n然\nぜん\nですが、私\nわたし\n、左\nひだり\n利\nき\nきなんです。マイクを持\nも\nつのも左\nひだり\n手\nて\n、はしを持\nも\nつのも左\nひだり\n手\nて\nです。今\nいま\n来\nき\nているこちらのお店\nみせ\n、文\nぶん\n房\nぼう\n具\nぐ\nなど、ちょっと見\nみ\nたところよくある普\nふ\n通\nつう\nのものが\n売\nう\nられていますが、大\nたい\n変\nへん\n人\nにん\n気\nき\nがあって、全\nぜん\n国\nこく\nからお客\nきゃく\nさんが集\nあつ\nまってくるそうです。すべ\nての商\nしょう\n品\nひん\nが左\nひだり\n利\nき\nきの人\nひと\nのためのものなんです。普\nふ\n段\nだん\nはあまり意\nい\n識\nしき\nしないかもしれませんが、\n普\nふ\n通\nつう\nのはさみ、包\nほう\n丁\nちょう\nなどは右\nみぎ\n手\nて\nで使\nつか\nうように作\nつく\nられています。こちらのお店\nみせ\nには、日\nにち\n常\nじょう\n使\nつか\nうものからパソコンのキーボードなどの電\nでん\n気\nき\n製\nせい\n品\nひん\n、ギターなどの楽\nがっ\n器\nき\nまであるんですよ。す\nごいですね。\nアナウンサーは主\nおも\nに何\nなに\nについて話\nはな\nしていますか。\n１． 左\nひだり\n利\nき\nき用\nよう\nの道\nどう\n具\nぐ\nの特\nとく\n徴\nちょう\n２． 左\nひだり\n利\nき\nきの人\nひと\nの苦\nく\n労\nろう\n３． この店\nみせ\nで扱\nあつか\nっている商\nしょう\n品\nひん\n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、指\nし\n導\nどう\n者\nしゃ\nになることも考\nかんが\nえました。でも、目\nもく\n標\nひょう\nを持\nも\nって頑\nがん\n張\nば\nる若\nわか\nい選\nせん\n手\nしゅ\nたちの試\nし\n合\nあい\nを\n見\nみ\nて、まだあきらめられない気\nき\n持\nも\nちが出\nで\nてきました。自\nじ\n分\nぶん\nもその場\nば\n所\nしょ\nに立\nた\nちたいと思\nおも\nい、選\nせん\n手\nしゅ\nを育\nそだ\nてるのはもう少\nすこ\nし先\nさき\nでもいいと思\nおも\nったんです。休\nやす\nんでいる間\nあいだ\nも応\nおう\n援\nえん\nしてくださった方\nかた\nたちのためにも、新\nあたら\nしい気\nき\n持\nも\nちでやっていきたいと思\nおも\nいます。\nこのスポーツ選\nせん\n手\nしゅ\nが伝\nつた\nえたいことは何\nなん\
