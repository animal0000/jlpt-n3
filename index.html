nつき\n届\nとど\nけてもらってるから、注\nちゅう\n文\nもん\nしなくていいのよ。\nＭ：はい。\nＦ：じゃあ、これで注\nちゅう\n文\nもん\nよろしくね。     \nＭ：はい、分\nわ\nかりました。\n男\nおとこ\nの人\nひと\nは何\nなに\nを注\nちゅう\n文\nもん\nしますか。\n54\n聴解スクリプト\n54\n\n２番\n女\nおんな\nの人\nひと\nと母\nはは\n親\nおや\nが話\nはな\nしています。女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nに何\nなに\nをプレゼントしますか。\nＦ１：お母\nかあ\nさん、友\nとも\n達\nだち\nに赤\nあか\nちゃんが生\nう\nまれたんだけど、お祝\nいわ\nい何\nなに\nがいいと思\nおも\nう？\nＦ２：そうね。よく贈\nおく\nるのは、着\nき\nるものとか、おもちゃだけどね。\nＦ１：そうだよね。私\nわたし\nも服\nふく\nがいいなって思\nおも\nうんだけど。\nＦ２：ただ、みんな赤\nあか\nちゃんの服\nふく\nやおもちゃをあげるでしょう。だから、友\nとも\n達\nだち\nに使\nつか\nってもらえるも\nのをあげるのもいいんじゃない？\nＦ１：えっ。服\nふく\nとか？\nＦ２：服\nふく\nもいいけど、赤\nあか\nちゃんが生\nう\nまれると、着\nき\n替\nが\nえとかタオルとかいろいろ持\nも\nち歩\nある\nくものが多\nおお\nく\nなるでしょ。だから、たくさん入\nはい\nるバッグなんかどう？あなたが生\nう\nまれたとき、もらって\nうれしかったわ。\nＦ１：そっか。じゃあ、私\nわたし\nもそうしよう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nに何\nなに\nをプレゼントしますか。\n３番\n友\nとも\n達\nだち\nから留\nる\n守\nす\n番\nばん\n電\nでん\n話\nわ\nにメッセージが入\nはい\nっていました。このメッセージを聞\nき\nいたあと、まず何\nなに\nをしま\nすか。\nＦ：もしもし、まさ子\nこ\nです。急\nきゅう\nなんだけど、明\nあした\n日の夜\nよる\n、ご飯\nはん\n一\nいっ\n緒\nしょ\nにどう？駅\nえき\nの近\nちか\nくにおいしいお\n店\nみせ\nを見\nみ\nつけたから、そこで。そのお店\nみせ\n、けっこう混\nこ\nむから予\nよ\n約\nやく\nしたいし。来\nこ\nられるかどうか、\nなるべく早\nはや\nく教\nおし\nえてくれる？できたら、ご飯\nはん\n食\nた\nべながら今\nこん\n度\nど\n一\nいっ\n緒\nしょ\nに行\nい\nく旅\nりょ\n行\nこう\nの計\nけい\n画\nかく\n立\nた\nてない？\n飛\nひ\n行\nこう\n機\nき\nの予\nよ\n約\nやく\nは早\nはや\nいほうがいいしね。じゃあね。\nこのメッセージを聞\nき\nいたあと、まず何\nなに\nをしますか。\n４番\n母\nはは\n親\nおや\nと息\nむすこ\n子が話\nはな\nしています。息\nむすこ\n子はこのあと、まず何\nなに\nをしますか。\nＦ：あ、太\nた\n郎\nろう\n、今\nいま\nから出\nで\nかけるの？　　　　　　　　　　　　　　　　　　　　　　　　　　　\nＭ：うん。駅\nえき\n前\nまえ\nの映\nえい\n画\nが\n館\nかん\nで友\nとも\n達\nだち\nと映\nえい\n画\nが\n見\nみ\nてくる。\nＦ：あ、そう。それなら、駅\nえき\n前\nまえ\nの郵\nゆう\n便\nびん\n局\nきょく\nに寄\nよ\nって、この荷\nに\n物\nもつ\n、出\nだ\nしてってくれない？\nＭ：えー。ちょっと本\nほん\n屋\nや\nに寄\nよ\nろうと思\nおも\nってたのにな。まあ、映\nえい\n画\nが\nのあとにするか。じゃあ、出\nだ\nして\n55\n55\n聴解スクリプト\n\nきてあげるよ。\nＦ：ありがとう。急\nいそ\nぎだから、映\nえい\n画\nが\nの前\nまえ\nに行\nい\nってね。はい、お金\nかね\n。\nＭ：え、こんなにかかるの？\nＦ：余\nあま\nった分\nぶん\nは、ご飯\nはん\n代\nだい\nにでも使\nつか\nいなさい。\nＭ：やった。\n息\nむすこ\n子はこのあと、まず何\nなに\nをしますか。\n５番\n家\nうち\nの玄\nげん\n関\nかん\nで男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nとホストファミリーのお母\nかあ\nさんが話\nはな\nしています。留\nりゅう\n学\nがく\n生\nせい\nはこれから何\nなに\nを\nしますか。\nＭ：雨\nあめ\n降\nふ\nりそうですね。傘\nかさ\n、持\nも\nってったほうがいいですか。\nＦ：今\nきょう\n日は天\nてん\n気\nき\nがよくなるって言\nい\nってたから、大\nだい\n丈\nじょう\n夫\nぶ\nよ。\nＭ：はい。\nＦ：あれ？リビングのエアコンは消\nけ\nしたよね。\nＭ：ええ、消\nけ\nしてありました。\nＦ：ああ、そう。あっ、いけない。台\nだい\n所\nどころ\nの電\nでん\n気\nき\n、つけたままだった。ごめんね、ちょっと消\nけ\nして\nきてくれる？\nＭ：はい。\nＦ：台\nだい\n所\nどころ\nの小\nちい\nさい窓\nまど\nは開\nあ\nいてるけど、閉\nし\nめなくていいわよ。\nＭ：分\nわ\nかりました。\n留\nりゅう\n学\nがく\n生\nせい\nはこれから何\nなに\nをしますか。\n６番\n会\nかい\n社\nしゃ\nで男\nおとこ\nの人\nひと\nと女\nおんな\nの人\nひと\nが話\nはな\nしています。女\nおんな\nの人\nひと\nはこれから、まず何\nなに\nをしますか。\nＭ：鈴\nすず\n木\nき\nさん、今\nことし\n年の新\nしん\n入\nにゅう\n社\nしゃ\n員\nいん\n歓\nかん\n迎\nげい\n会\nかい\nのことなんだけどね。今\nことし\n年は週\nしゅう\n末\nまつ\nに日\nひ\n帰\nがえ\nりで、どこかに行\nい\nくのはどうだろう。\nＦ：日\nひ\n帰\nがえ\nり旅\nりょ\n行\nこう\nですか。いいかもしれませんね。\nＭ：じゃ、今\nことし\n年はそういうことで、準\nじゅん\n備\nび\nしてくれる？まずは、どこへ行\nい\nきたいか、みんなに聞\nき\nい\nてみて。\nＦ：そうですね。アンケートでもとりましょうか。\n56\n聴解スクリプト\n56\n\nＭ：あ、いや、やっぱり、そんな時\nじ\n間\nかん\nもないし。鈴\nすず\n木\nき\nさんがよさそうな場\nば\n所\nしょ\nを決\nき\nめてください。イ\nンターネットとかで探\nさが\nしてくれる？\nＦ：はい。\nＭ：で、そこで何\nなに\nをするかだな。食\nしょく\n事\nじ\nしただけで終\nお\nわるのは、ちょっとな。\nＦ：そうですね。\nＭ：ま、それは場\nば\n所\nしょ\nが決\nき\nまってから、考\nかんが\nえよう。調\nしら\nべたら、教\nおし\nえてくれる？\nＦ：分\nわ\nかりました。\n女\nおんな\nの人\nひと\nはこれから、まず何\nなに\nをしますか。\n問題２\n例\n女\nおんな\nの人\nひと\nと男\nおとこ\nの人\nひと\nがスーパーで話\nはな\nしています。男\nおとこ\nの人\nひと\nはどうして自\nじ\n分\nぶん\nで料\nりょう\n理\nり\nをしませんか。\nＦ：あら、田\nた\n中\nなか\n君\nくん\n、お買\nか\nい物\nもの\n？\nＭ：うん、夕\nゆう\n飯\nはん\nを買\nか\nいにね。\nＦ：お弁\nべん\n当\nとう\n？自\nじ\n分\nぶん\nで作\nつく\nらないの？時\nじ\n間\nかん\nないか。\nＭ：いや、そうじゃないんだ。\nＦ：じゃあ、作\nつく\nればいいのに。\nＭ：作\nつく\nるのは嫌\nきら\nいじゃないんだ。でも、一\nひとり\n人だと。\nＦ：材\nざい\n料\nりょう\nが余\nあま\nっちゃう？\nＭ：それはいいんだけど、一\nいっ\n生\nしょう\n懸\nけん\n命\nめい\n作\nつく\nっても一\nひとり\n人で食\nた\nべるだけじゃ、なんか寂\nさび\nしくて。\nＦ：それもそうか。\n男\nおとこ\nの人\nひと\nはどうして自\nじ\n分\nぶん\nで料\nりょう\n理\nり\nをしませんか。\n１番\n会\nかい\n社\nしゃ\nで女\nおんな\nの人\nひと\nと男\nおとこ\nの人\nひと\nが話\nはな\nしています。二\nふたり\n人はいつ相\nそう\n談\nだん\nしますか。\nＦ：あのう、新\nあたら\nしい商\nしょう\n品\nひん\nについて相\nそう\n談\nだん\nしたいんですが、いつにしましょうか。\nＭ：あ、そうですね。\nＦ：今\nきょう\n日が金\nきん\n曜\nよう\n日\nび\nでしょ？今\nきょう\n日はもうあまり時\nじ\n間\nかん\nがないから、じゃあ、来\nらい\n週\nしゅう\nの月\nげつ\n曜\nよう\n日\nび\nはどうですか。\n57\n57\n聴解スクリプト\n\nＭ：あ、来\nらい\n週\nしゅう\nの月\nげつ\n曜\nよう\n日\nび\nと火\nか\n曜\nよう\n日\nび\nは出\nしゅっ\n張\nちょう\nなんです。木\nもく\n曜\nよう\n日\nび\nなら、時\nじ\n間\nかん\n、とれますけど。\nＦ：そう、木\nもく\n曜\nよう\n日\nび\nは私\nわたし\nがちょっと忙\nいそが\nしいんで。あのう、出\nしゅっ\n張\nちょう\nから帰\nかえ\nった次\nつぎ\nの日\nひ\nって、忙\nいそが\nしい\nですか。\nＭ：うーん、あ、はい、大\nだい\n丈\nじょう\n夫\nぶ\nです。じゃあ、その日\nひ\nにしましょう。午\nご\n後\nご\n、時\nじ\n間\nかん\n空\nあ\nけておきます。\n二\nふたり\n人はいつ相\nそう\n談\nだん\nしますか。\n２番\n女\nおんな\nの人\nひと\nと男\nおとこ\nの人\nひと\nが料\nりょう\n理\nり\n教\nきょう\n室\nしつ\nについて話\nはな\nしています。女\nおんな\nの人\nひと\nはどうしてこの教\nきょう\n室\nしつ\nに興\nきょう\n味\nみ\nを持\nも\nちましたか。\nＦ：佐\nさ\n藤\nとう\nさん、料\nりょう\n理\nり\n教\nきょう\n室\nしつ\nに行\nい\nってるそうですね。楽\nたの\nしいですか。\nＭ：ええ。いろんな国\nくに\nの料\nりょう\n理\nり\nを作\nつく\nるんですよ。\nＦ：へえ、面\nおも\n白\nしろ\nそう。私\nわたし\n、日\nに\n本\nほん\n料\nりょう\n理\nり\nは習\nなら\nったことがあるので、他\nほか\nの国\nくに\nの料\nりょう\n理\nり\nを作\nつく\nってみたいと\n思\nおも\nっていたんです。あの、その教\nきょう\n室\nしつ\nは、いつ、やってるんですか。\nＭ：月\nつき\nに１回\nかい\n、最\nさい\n初\nしょ\nの土\nど\n曜\nよう\n日\nび\nの午\nご\n後\nご\nです。先\nせん\n生\nせい\nの話\nはなし\nを聞\nき\nいたあと、小\nちい\nさなグループに分\nわ\nかれて料\nりょう\n理\nり\nを作\nつく\nります。\nＦ：そうですか。\nＭ  ：料\nりょう\n金\nきん\nはちょっと高\nたか\nいんですが、人\nにん\n気\nき\nがあるんですよ。あの、よかったら連\nれん\n絡\nらく\n先\nさき\nを教\nおし\nえましょ\nうか。\nＦ：あ、ありがとうございます。\n女\nおんな\nの人\nひと\nはどうしてこの教\nきょう\n室\nしつ\nに興\nきょう\n味\nみ\nを持\nも\nちましたか。\n３番\n女\nおんな\nの学\nがく\n生\nせい\nと男\nおとこ\nの学\nがく\n生\nせい\nが話\nはな\nしています。男\nおとこ\nの学\nがく\n生\nせい\nはどうしてアルバイトを変\nか\nえましたか。\nＦ：今\nいま\nからアルバイト？\nＭ：うん、実\nじつ\nは、今\nきょう\n日からコンビニでアルバイトすることにしたんだ。\nＦ：え？自\nじ\n動\nどう\n車\nしゃ\n工\nこう\n場\nじょう\nのアルバイトは？朝\nあさ\n早\nはや\nくからだったし、大\nたい\n変\nへん\nだったの？\nＭ：いや、早\nはや\n起\nお\nきは平\nへい\n気\nき\nなんだ。それに、時\nじ\n給\nきゅう\nもまあまあよかったし。\nＦ：じゃあ、何\nなん\nで？\nＭ：うーん、ものを作\nつく\nる仕\nし\n事\nごと\nも楽\nたの\nしかったけど、学\nがく\n生\nせい\nのうちに、いろいろな仕\nし\n事\nごと\nをやってみたくてね。\nＦ：そっか。頑\nがん\n張\nば\nって。\n58\n聴解スクリプト\n58\n\n男\nおとこ\nの学\nがく\n生\nせい\nはどうしてアルバイトを変\nか\nえましたか。\n４番\n図\nと\n書\nしょ\n館\nかん\nで男\nおとこ\nの学\nがく\n生\nせい\nと係\nかか\nりの人\nひと\nが話\nはな\nしています。図\nと\n書\nしょ\n館\nかん\nのパソコンコーナーで何\nなに\nをしてはいけませ\nんか。\nＭ：すみません。パソコンを使\nつか\nいたいんですが。\nＦ：はい、どうぞ。\nＭ：あのう、インターネットは使\nつか\nえますか。\nＦ：ええ、利\nり\n用\nよう\nできます。でも、メールはご遠\nえん\n慮\nりょ\nください。\nＭ：分\nわ\nかりました。あと、プリンターは。\nＦ：あ、プリンターはお使\nつか\nいになれますが、有\nゆう\n料\nりょう\nです。\nＭ：あ、そうですか。それから、ＤＶＤは見\nみ\nられますか。\nＦ：はい、大\nだい\n丈\nじょう\n夫\nぶ\nですよ。\n図\nと\n書\nしょ\n館\nかん\nのパソコンコーナーで何\nなに\nをしてはいけませんか。\n５番\n大\nだい\n学\nがく\nで男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nが係\nかか\nりの人\nひと\nにホームステイについて聞\nき\nいています。男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nはどうして\nホームステイに参\nさん\n加\nか\nできませんか。\nＭ：すみません、このホームステイに申\nもう\nし込\nこ\nみをしたいんですが。締\nし\nめ切\nき\nりまだですよね？\nＦ：はい、まだ間\nま\nに合\nあ\nいますよ。参\nさん\n加\nか\nは初\nはじ\nめてですか。\nＭ：いえ、２回\nかい\n目\nめ\nです。２回\nかい\n目\nめ\nでも大\nだい\n丈\nじょう\n夫\nぶ\nですか。\nＦ：はい、大\nだい\n丈\nじょう\n夫\nぶ\nです。えー、日\nに\n本\nほん\nに来\nき\nてどのぐらいになりますか。\nＭ：10 か月\nげつ\nを過\nす\nぎたところです。あと、１か月\nげつ\nで帰\nき\n国\nこく\nする予\nよ\n定\nてい\nです。\nＦ：そうですか。んー、実\nじつ\nは、このホームステイは、来\nらい\n日\nにち\nしてから半\nはん\n年\nとし\n以\nい\n内\nない\nの留\nりゅう\n学\nがく\n生\nせい\nしか申\nもう\nし込\nこ\nみができないことになっているんですよ。\nＭ：え、そうなんですか。\n男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nはどうしてホームステイに参\nさん\n加\nか\nできませんか。\n６番\nテレビで男\nおとこ\nの人\nひと\nが自\nじ\n分\nぶん\nの仕\nし\n事\nごと\nについて話\nはな\nしています。男\nおとこ\nの人\nひと\nは何\nなに\nがうれしいと言\nい\nっていますか。\n59\n59\n聴解スクリプト\n\nＭ：私\nわたし\nは新\nあたら\nしく町\nまち\nにできたスーパーの社\nしゃ\n員\nいん\nです。でも、店\nみせ\nの中\nなか\nでは働\nはたら\nいていません。毎\nまい\n日\nにち\n、車\nくるま\nで、新\nしん\n鮮\nせん\nな肉\nにく\nや魚\nさかな\nなど、店\nみせ\nの商\nしょう\n品\nひん\nを、遠\nとお\nくの村\nむら\nまで売\nう\nりに行\nい\nっています。一\nいち\n日\nにち\nに五\nいつ\nつぐらい\nの村\nむら\nに行\nい\nきます。お客\nきゃく\nさんは、多\nおお\nい日\nひ\nも少\nすく\nない日\nひ\nもありますが、私\nわたし\nの車\nくるま\nが来\nく\nるのを楽\nたの\nしみ\nに待\nま\nっていてくださいます。皆\nみな\nさんに喜\nよろこ\nんでもらえるのが、やっぱり、私\nわたし\nには一\nいち\n番\nばん\nうれしい\nです。\n男\nおとこ\nの人\nひと\nは何\nなに\nがうれしいと言\nい\nっていますか。\n問題３\n例\n女\nおんな\nの人\nひと\nが友\nとも\n達\nだち\nの家\nうち\nに来\nき\nて話\nはな\nしています。\nＦ１：田\nた\n中\nなか\nです。\nＦ２：あ、はあい。昨\nきのう\n日友\nとも\n達\nだち\nが泊\nと\nまりに来\nき\nてたんで、片\nかた\n付\nづ\nいてないけど、入\nはい\nって。\nＦ１：あ、でもここで。すぐ帰\nかえ\nるから。あのう、この前\nまえ\n借\nか\nりた本\nほん\nなんだけど、ちょっと破\nやぶ\nれちゃって。\nＦ２：え、本\nほん\n当\nとう\n？\nＦ１：うん、このページなんだけど。\nＦ２：あっ、うん、このくらいなら大\nだい\n丈\nじょう\n夫\nぶ\n、読\nよ\nめるし。\nＦ１：ほんと？ごめん。これからは気\nき\nをつけるから。\nＦ２：うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１：ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nの家\nうち\nへ何\nなに\nをしに来\nき\nましたか。\n　１．謝\nあやま\nりに来\nき\nた\n　２．本\nほん\nを借\nか\nりに来\nき\nた\n　３．泊\nと\nまりに来\nき\nた\n　４．コーヒーを飲\nの\nみに来\nき\nた\n１番\n留\nる\n守\nす\n番\nばん\n電\nでん\n話\nわ\nのメッセージを聞\nき\nいています。\nＭ：もしもし、田\nた\n中\nなか\nですけど。あのう、明\nあした\n日映\nえい\n画\nが\nに行\nい\nくことになってたよね。でも、急\nきゅう\nに出\nしゅっ\n張\nちょう\n60\n聴解スクリプト\n60\n\nが入\nはい\nっちゃって。それで、悪\nわる\nいんだけど、来\nらい\n週\nしゅう\nにしてもらってもいいかな。僕\nぼく\nから誘\nさそ\nったの\nにごめん。映\nえい\n画\nが\nのあと、食\nしょく\n事\nじ\nごちそうするから。じゃ、また電\nでん\n話\nわ\nするよ。ほんと、ごめんね。\n田\nた\n中\nなか\nさんが一\nいち\n番\nばん\n言\nい\nいたいことは何\nなん\nですか。\n　１．出\nしゅっ\n張\nちょう\nに行\nい\nくこと\n　２．映\nえい\n画\nが\nに行\nい\nく日\nひ\nを変\nか\nえてほしいこと \n　３．食\nしょく\n事\nじ\nをごちそうすること\n　４．また電\nでん\n話\nわ\nすること\n２番\n男\nおとこ\nの学\nがく\n生\nせい\nと女\nおんな\nの学\nがく\n生\nせい\nが話\nはな\nしています。\nＭ：今\nこん\n度\nど\nの日\nにち\n曜\nよう\n日\nび\n、みんなで海\nうみ\nに行\nい\nこうって話\nはなし\nがあるんだけど。\nＦ：海\nうみ\n？いいね。楽\nたの\nしそう。\nＭ：うん。海\nうみ\nで花\nはな\n火\nび\nもするよ。どう？来\nこ\nられそう？\nＦ：面\nおも\n白\nしろ\nそう。でも、今\nこん\n度\nど\nの日\nにち\n曜\nよう\n日\nび\nだよね。月\nげつ\n曜\nよう\nにテストがあるんだ。テストがなかったら行\nい\nきた\nいんだけど。\nＭ：土\nど\n曜\nよう\n日\nび\nに頑\nがん\n張\nば\nったら大\nだい\n丈\nじょう\n夫\nぶ\nだよ。\nＦ：うーん。苦\nにが\n手\nて\nな科\nか\n目\nもく\nだから一\nいち\n日\nにち\nじゃきついかも。また今\nこん\n度\nど\n誘\nさそ\nって。\n女\nおんな\nの学\nがく\n生\nせい\nは日\nにち\n曜\nよう\n日\nび\nに海\nうみ\nへ行\nい\nくことについてどう思\nおも\nっていますか。\n　１．楽\nたの\nしそうだから、行\nい\nくつもりだ\n　２．楽\nたの\nしそうだが、行\nい\nかない\n　３．興\nきょう\n味\nみ\nがないから、行\nい\nかない\n　４．興\nきょう\n味\nみ\nはないが、行\nい\nくつもりだ\n３番\n女\nおんな\nの人\nひと\nが男\nおとこ\nの人\nひと\nに旅\nりょ\n行\nこう\nの感\nかん\n想\nそう\nを聞\nき\nいています。\nＦ：週\nしゅう\n末\nまつ\n、旅\nりょ\n行\nこう\nに行\nい\nってきたんだって？\nＭ：両\nりょう\n親\nしん\nを温\nおん\n泉\nせん\nに連\nつ\nれて行\nい\nったんだ。桜\nさくら\nのきれいな季\nき\n節\nせつ\nだしね。\nＦ：偉\nえら\nいね。ご両\nりょう\n親\nしん\nも喜\nよろこ\nんだでしょう。\nＭ：うん。でも、向\nむ\nこうはもう暖\nあたた\nかくて、桜\nさくら\nはほとんど終\nお\nわってたし、休\nきゅう\n日\nじつ\nだから渋\nじゅう\n滞\nたい\nしてて。\nＦ：そっか。\n61\n61\n聴解スクリプト\n\nＭ：温\nおん\n泉\nせん\nに入\nはい\nれば疲\nつか\nれが取\nと\nれると思\nおも\nってたんだけど、僕\nぼく\nはずっと運\nうん\n転\nてん\nだったからね。\nＦ：ふうん、大\nたい\n変\nへん\nだったね。\nＭ：でもまあ、両\nりょう\n親\nしん\nは久\nひさ\nしぶりにゆっくりできてよかったって言\nい\nってくれたから。\nＦ：じゃ、それが一\nいち\n番\nばん\nじゃない。\nＭ：まあね。\n男\nおとこ\nの人\nひと\nは旅\nりょ\n行\nこう\nについてどう思\nおも\nっていますか。\n　１．桜\nさくら\nがきれいで、よかった\n　２．温\nおん\n泉\nせん\nで疲\nつか\nれが取\nと\nれて、よかった\n　３．両\nりょう\n 新\nあたら\nしい商\nしょう\n品\nひん\nについて相\nそう\n談\nだん\nしたいんですが、いつにしましょうか。\nＭ：あ、そうですね。\nＦ：今\nきょう\n日が金\nきん\n曜\nよう\n日\nび\nでしょ？今\nきょう\n日はもうあまり時\nじ\n間\nかん\nがないから、じゃあ、来\nらい\n週\nしゅう\nの月\nげつ\n曜\nよう\n日\nび\nはどうですか。\n57\n57\n聴解スクリプト\n\nＭ：あ、来\nらい\n週\nしゅう\nの月\nげつ\n曜\nよう\n日\nび\nと火\nか\n曜\nよう\n日\nび\nは出\nしゅっ\n張\nちょう\nなんです。木\nもく\n曜\nよう\n日\nび\nなら、時\nじ\n間\nかん\n、とれますけど。\nＦ：そう、木\nもく\n曜\nよう\n日\nび\nは私\nわたし\nがちょっと忙\nいそが\nしいんで。あのう、出\nしゅっ\n張\nちょう\nから帰\nかえ\nった次\nつぎ\nの日\nひ\nって、忙\nいそが\nしい\nですか。\nＭ：うーん、あ、はい、大\nだい\n丈\nじょう\n夫\nぶ\nです。じゃあ、その日\nひ\nにしましょう。午\nご\n後\nご\n、時\nじ\n間\nかん\n空\nあ\nけておきます。\n二\nふたり\n人はいつ相\nそう\n談\nだん\nしますか。\n２番\n女\nおんな\nの人\nひと\nと男\nおとこ\nの人\nひと\nが料\nりょう\n理\nり\n教\nきょう\n室\nしつ\nについて話\nはな\nしています。女\nおんな\nの人\nひと\nはどうしてこの教\nきょう\n室\nしつ\nに興\nきょう\n味\nみ\nを持\nも\nちましたか。\nＦ：佐\nさ\n藤\nとう\nさん、料\nりょう\n理\nり\n教\nきょう\n室\nしつ\nに行\nい\nってるそうですね。楽\nたの\nしいですか。\nＭ：ええ。いろんな国\nくに\nの料\nりょう\n理\nり\nを作\nつく\nるんですよ。\nＦ：へえ、面\nおも\n白\nしろ\nそう。私\nわたし\n、日\nに\n本\nほん\n料\nりょう\n理\nり\nは習\nなら\nったことがあるので、他\nほか\nの国\nくに\nの料\nりょう\n理\nり\nを作\nつく\nってみたいと\n思\nおも\nっていたんです。あの、その教\nきょう\n室\nしつ\nは、いつ、やってるんですか。\nＭ：月\nつき\nに１回\nかい\n、最\nさい\n初\nしょ\nの土\nど\n曜\nよう\n日\nび\nの午\nご\n後\nご\nです。先\nせん\n生\nせい\nの話\nはなし\nを聞\nき\nいたあと、小\nちい\nさなグループに分\nわ\nかれて料\nりょう\n理\nり\nを作\nつく\nります。\nＦ：そうですか。\nＭ  ：料\nりょう\n金\nきん\nはちょっと高\nたか\nいんですが、人\nにん\n気\nき\nがあるんですよ。あの、よかったら連\nれん\n絡\nらく\n先\nさき\nを教\nおし\nえましょ\nうか。\nＦ：あ、ありがとうございます。\n女\nおんな\nの人\nひと\nはどうしてこの教\nきょう\n室\nしつ\nに興\nきょう\n味\nみ\nを持\nも\nちましたか。\n３番\n女\nおんな\nの学\nがく\n生\nせい\nと男\nおとこ\nの学\nがく\n生\nせい\nが話\nはな\nしています。男\nおとこ\nの学\nがく\n生\nせい\nはどうしてアルバイトを変\nか\nえましたか。\nＦ：今\nいま\nからアルバイト？\nＭ：うん、実\nじつ\nは、今\nきょう\n日からコンビニでアルバイトすることにしたんだ。\nＦ：え？自\nじ\n動\nどう\n車\nしゃ\n工\nこう\n場\nじょう\nのアルバイトは？朝\nあさ\n早\nはや\nくからだったし、大\nたい\n変\nへん\nだったの？\nＭ：いや、早\nはや\n起\nお\nきは平\nへい\n気\nき\nなんだ。それに、時\nじ\n給\nきゅう\nもまあまあよかったし。\nＦ：じゃあ、何\nなん\nで？\nＭ：うーん、ものを作\nつく\nる仕\nし\n事\nごと\nも楽\nたの\nしかったけど、学\nがく\n生\nせい\nのうちに、いろいろな仕\nし\n事\nごと\nをやってみたくてね。\nＦ：そっか。頑\nがん\n張\nば\nって。\n58\n聴解スクリプト\n58\n\n男\nおとこ\nの学\nがく\n生\nせい\nはどうしてアルバイトを変\nか\nえましたか。\n４番\n図\nと\n書\nしょ\n館\nかん\nで男\nおとこ\nの学\nがく\n生\nせい\nと係\nかか\nりの人\nひと\nが話\nはな\nしています。図\nと\n書\nしょ\n館\nかん\nのパソコンコーナーで何\nなに\nをしてはいけませ\nんか。\nＭ：すみません。パソコンを使\nつか\nいたいんですが。\nＦ：はい、どうぞ。\nＭ：あのう、インターネットは使\nつか\nえますか。\nＦ：ええ、利\nり\n用\nよう\nできます。でも、メールはご遠\nえん\n慮\nりょ\nください。\nＭ：分\nわ\nかりました。あと、プリンターは。\nＦ：あ、プリンターはお使\nつか\nいになれますが、有\nゆう\n料\nりょう\nです。\nＭ：あ、そうですか。それから、ＤＶＤは見\nみ\nられますか。\nＦ：はい、大\nだい\n丈\nじょう\n夫\nぶ\nですよ。\n図\nと\n書\nしょ\n館\nかん\nのパソコンコーナーで何\nなに\nをしてはいけませんか。\n５番\n大\nだい\n学\nがく\nで男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nが係\nかか\nりの人\nひと\nにホームステイについて聞\nき\nいています。男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nはどうして\nホームステイに参\nさん\n加\nか\nできませんか。\nＭ：すみません、このホームステイに申\nもう\nし込\nこ\nみをしたいんですが。締\nし\nめ切\nき\nりまだですよね？\nＦ：はい、まだ間\nま\nに合\nあ\nいますよ。参\nさん\n加\nか\nは初\nはじ\nめてですか。\nＭ：いえ、２回\nかい\n目\nめ\nです。２回\nかい\n目\nめ\nでも大\nだい\n丈\nじょう\n夫\nぶ\nですか。\nＦ：はい、大\nだい\n丈\nじょう\n夫\nぶ\nです。えー、日\nに\n本\nほん\nに来\nき\nてどのぐらいになりますか。\nＭ：10 か月\nげつ\nを過\nす\nぎたところです。あと、１か月\nげつ\nで帰\nき\n国\nこく\nする予\nよ\n定\nてい\nです。\nＦ：そうですか。んー、実\nじつ\nは、このホームステイは、来\nらい\n日\nにち\nしてから半\nはん\n年\nとし\n以\nい\n内\nない\nの留\nりゅう\n学\nがく\n生\nせい\nしか申\nもう\nし込\nこ\nみができないことになっているんですよ。\nＭ：え、そうなんですか。\n男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nはどうしてホームステイに参\nさん\n加\nか\nできませんか。\n６番\nテレビで男\nおとこ\nの人\nひと\nが自\nじ\n分\nぶん\nの仕\nし\n事\nごと\nについて話\nはな\nしています。男\nおとこ\nの人\nひと\nは何\nなに\nがうれしいと言\nい\nっていますか。\n59\n59\n聴解スクリプト\n\nＭ：私\nわたし\nは新\nあたら\nしく町\nまち\nにできたスーパーの社\nしゃ\n員\nいん\nです。でも、店\nみせ\nの中\nなか\nでは働\nはたら\nいていません。毎\nまい\n日\nにち\n、車\nくるま\nで、新\nしん\n鮮\nせん\nな肉\nにく\nや魚\nさかな\nなど、店\nみせ\nの商\nしょう\n品\nひん\nを、遠\nとお\nくの村\nむら\nまで売\nう\nりに行\nい\nっています。一\nいち\n日\nにち\nに五\nいつ\nつぐらい\nの村\nむら\nに行\nい\nきます。お客\nきゃく\nさんは、多\nおお\nい日\nひ\nも少\nすく\nない日\nひ\nもありますが、私\nわたし\nの車\nくるま\nが来\nく\nるのを楽\nたの\nしみ\nに待\nま\nっていてくださいます。皆\nみな\nさんに喜\nよろこ\nんでもらえるのが、やっぱり、私\nわたし\nには一\nいち\n番\nばん\nうれしい\nです。\n男\nおとこ\nの人\nひと\nは何\nなに\nがうれしいと言\nい\nっていますか。\n問題３\n例\n女\nおんな\nの人\nひと\nが友\nとも\n達\nだち\nの家\nうち\nに来\nき\nて話\nはな\nしています。\nＦ１：田\nた\n中\nなか\nです。\nＦ２：あ、はあい。昨\nきのう\n日友\nとも\n達\nだち\nが泊\nと\nまりに来\nき\nてたんで、片\nかた\n付\nづ\nいてないけど、入\nはい\nって。\nＦ１：あ、でもここで。すぐ帰\nかえ\nるから。あのう、この前\nまえ\n借\nか\nりた本\nほん\nなんだけど、ちょっと破\nやぶ\nれちゃって。\nＦ２：え、本\nほん\n当\nとう\n？\nＦ１：うん、このページなんだけど。\nＦ２：あっ、うん、このくらいなら大\nだい\n丈\nじょう\n夫\nぶ\n、読\nよ\nめるし。\nＦ１：ほんと？ごめん。これからは気\nき\nをつけるから。\nＦ２：うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１：ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nの家\nうち\nへ何\nなに\nをしに来\nき\nましたか。\n　１．謝\nあやま\nりに来\nき\nた\n　２．本\nほん\nを借\nか\nりに来\nき\nた\n　３．泊\nと\nまりに来\nき\nた\n　４．コーヒーを飲\nの\nみに来\nき\nた\n１番\n留\nる\n守\nす\n番\nばん\n電\nでん\n話\nわ\nのメッセージを聞\nき\nいています。\nＭ：もしもし、田\nた\n中\nなか\nですけど。あのう、明\nあした\n日映\nえい\n画\nが\nに行\nい\nくことになってたよね。でも、急\nきゅう\nに出\nしゅっ\n張\nちょう\n60\n聴解スクリプト\n60\n\nが入\nはい\nっちゃって。それで、悪\nわる\nいんだけど、来\nらい\n週\nしゅう\nにしてもらってもいいかな。僕\nぼく\nから誘\nさそ\nったの\nにごめん。映\nえい\n画\nが\nのあと、食\nしょく\n事\nじ\nごちそうするから。じゃ、また電\nでん\n話\nわ\nするよ。ほんと、ごめんね。\n田\nた\n中\nなか\nさんが一\nいち\n番\nばん\n言\nい\nいたいことは何\nなん\nですか。\n　１．出\nしゅっ\n張\nちょう\nに行\nい\nくこと\n　２．映\nえい\n画\nが\nに行\nい\nく日\nひ\nを変\nか\nえてほしいこと \n　３．食\nしょく\n事\nじ\nをごちそうすること\n　４．また電\nでん\n話\nわ\nすること\n２番\n男\nおとこ\nの学\nがく\n生\nせい\nと女\nおんな\nの学\nがく\n生\nせい\nが話\nはな\nしています。\nＭ：今\nこん\n度\nど\nの日\nにち\n曜\nよう\n日\nび\n、みんなで海\nうみ\nに行\nい\nこうって話\nはなし\nがあるんだけど。\nＦ：海\nうみ\n？いいね。楽\nたの\nしそう。\nＭ：うん。海\nうみ\nで花\nはな\n火\nび\nもするよ。どう？来\nこ\nられそう？\nＦ：面\nおも\n白\nしろ\nそう。でも、今\nこん\n度\nど\nの日\nにち\n曜\nよう\n日\nび\nだよね。月\nげつ\n曜\nよう\nにテストがあるんだ。テストがなかったら行\nい\nきた\nいんだけど。\nＭ：土\nど\n曜\nよう\n日\nび\nに頑\nがん\n張\nば\nったら大\nだい\n丈\nじょう\n夫\nぶ\nだよ。\nＦ：うーん。苦\nにが\n手\nて\nな科\nか\n目\nもく\nだから一\nいち\n日\nにち\nじゃきついかも。また今\nこん\n度\nど\n誘\nさそ\nって。\n女\nおんな\nの学\nがく\n生\nせい\nは日\nにち\n曜\nよう\n日\nび\nに海\nうみ\nへ行\nい\nくことについてどう思\nおも\nっていますか。\n　１．楽\nたの\nしそうだから、行\nい\nくつもりだ\n　２．楽\nたの\nしそうだが、行\nい\nかない\n　３．興\nきょう\n味\nみ\nがないから、行\nい\nかない\n　４．興\nきょう\n味\nみ\nはないが、行\nい\nくつもりだ\n３番\n女\nおんな\nの人\nひと\nが男\nおとこ\nの人\nひと\nに旅\nりょ\n行\nこう\nの感\nかん\n想\nそう\nを聞\nき\nいています。\nＦ：週\nしゅう\n末\nまつ\n、旅\nりょ\n行\nこう\nに行\nい\nってきたんだって？\nＭ：両\nりょう\n親\nしん\nを温\nおん\n泉\nせん\nに連\nつ\nれて行\nい\nったんだ。桜\nさくら\nのきれいな季\nき\n節\nせつ\nだしね。\nＦ：偉\nえら\nいね。ご両\nりょう\n親\nしん\nも喜\nよろこ\nんだでしょう。\nＭ：うん。でも、向\nむ\nこうはもう暖\nあたた\nかくて、桜\nさくら\nはほとんど終\nお\nわってたし、休\nきゅう\n日\nじつ\nだから渋\nじゅう\n滞\nたい\nしてて。\nＦ：そっか。\n61\n61\n聴解スクリプト\n\nＭ：温\nおん\n泉\nせん\nに入\nはい\nれば疲\nつか\nれが取\nと\nれると思\nおも\nってたんだけど、僕\nぼく\nはずっと運\nうん\n転\nてん\nだったからね。\nＦ：ふうん、大\nたい\n変\nへん\nだったね。\nＭ：でもまあ、両\nりょう\n親\nしん\nは久\nひさ\nしぶりにゆっくりできてよかったって言\nい\nってくれたから。\nＦ：じゃ、それが一\nいち\n番\nばん\nじゃない。\nＭ：まあね。\n男\nおとこ\nの人\nひと\nは旅\nりょ\n行\nこう\nについてどう思\nおも\nっていますか。\n　１．桜\nさくら\nがきれいで、よかった\n　２．温\nおん\n泉\nせん\nで疲\nつか\nれが取\nと\nれて、よかった\n　３．両\nりょう\n親\nしん\nが疲\nつか\nれたので、よくなかった\n　４．両\nりょう\n親\nしん\nが満\nまん\n足\nぞく\nして、よかった\n問題４\n例\nホテルのテレビが壊\nこわ\nれています。何\nなん\nと言\nい\nいますか。\nＦ：１．テレビがつかないんですが。\n　　２．テレビをつけてもいいですか。\n　　３．テレビをつけたほうがいいですよ。\n１番\n先\nせん\n輩\nぱい\nが忙\nいそが\nしそうなので、手\nて\n伝\nつだ\nいたいです。先\nせん\n輩\nぱい\nに何\nなん\nと言\nい\nいますか。\nＦ：１．あの、手\nて\n伝\nつだ\nってくれませんか。\n　　２．あの、手\nて\n伝\nつだ\nいましょうか。\n　　３．あの、手\nて\n伝\nつだ\nいませんか。\n２番\n試\nし\n験\nけん\nに合\nごう\n格\nかく\nしたので、先\nせん\n生\nせい\nに伝\nつた\nえたいです。先\nせん\n生\nせい\nに何\nなん\nと言\nい\nいますか。\nＭ：１．今\nこん\n回\nかい\nはおめでとうございます。\n　　２．今\nこん\n度\nど\n、合\nごう\n格\nかく\nなさいました。\n62\n聴解スクリプト\n62\n\n　　３．おかげさまで、試\nし\n験\nけん\nに受\nう\nかりました。\n３番\n友\nとも\n達\nだち\nと食\nしょく\n事\nじ\nをしています。しょうゆを使\nつか\nいたいです。友\nとも\n達\nだち\nに何\nなん\nと言\nい\nいますか。\nＦ：１．しょうゆ、取\nと\nろうか。\n　　２．しょうゆ、取\nと\nってくれない？\n　　３．しょうゆ、取\nと\nってもいいよ。\n４番\n会\nかい\n社\nしゃ\nでお客\nきゃく\nさんを部\nへ\n屋\nや\nに案\nあん\n内\nない\nしました。何\nなん\nと言\nい\nいますか。\nＭ：１．どうぞおかけください。\n　　２．座\nすわ\nらせていただきます。\n　　３．席\nせき\nをお取\nと\nりしましょうか。\n　\n問題５\n例\nＭ：すみません、今\nいま\n、時\nじ\n間\nかん\n、ありますか。\nＦ：１．ええと、10 時\nじ\n20 分\nぷん\nです。\n　　２．ええ。何\nなん\nですか。\n　　３．時\nと\n計\nけい\nはあそこですよ。\n１番\nＭ：リンさん、明\nあした\n日のアルバイト、３時\nじ\nに来\nき\nてほしいんですが。\nＦ：１．いつでも来\nき\nてください。\n　　２．都\nつ\n合\nごう\nはどうですか。\n　　３．はい、大\nだい\n丈\nじょう\n夫\nぶ\nです。\n63\n63\n聴解スクリプト\n\n２番\nＦ：田\nた\n中\nなか\nさん、明\nあ\nす\n日の旅\nりょ\n行\nこう\nは８時\nじ\n出\nしゅっ\n発\nぱつ\nですよ。遅\nおく\nれないようにね。\nＭ：１．気\nき\nをつけます。\n　　２．そうしてください。\n　　３．よく気\nき\nがつきます。\n３番\nＦ：あれ、雨\nあめ\nですか。そんなに濡\nぬ\nれちゃって。\nＭ：１．じゃあ、傘\nかさ\nはいりませんね。\n　　２．いつ降\nふ\nるんでしょう。\n　　３．急\nきゅう\nに降\nふ\nってきたんです。\n４番\nＦ：暑\nあつ\nいので、ちょっと窓\nまど\nを開\nあ\nけてもよろしいでしょうか。\nＭ：１．じゃあ、閉\nし\nめましょう。\n　　２．ええ、かまいませんよ。\n　　３．いえ、どういたしまして。\n５番\nＦ：お客\nきゃく\n様\nさま\n、こちらで召\nめ\nし上\nあ\nがりますか、お持\nも\nち帰\nかえ\nりになりますか。\nＭ：１．はい、大\nだい\n丈\nじょう\n夫\nぶ\nです。\n　　２．ここで食\nた\nべます。\n　　３．いいえ、持\nも\nちますよ。\n６番\nＭ：バス、なかなか来\nこ\nないですね。\nＦ：１．道\nみち\nが混\nこ\nんでるんでしょうか。\n　　２．バスにしてよかったですね。\n　　３．随\nずい\n分\nぶん\n早\nはや\nそうですね。\n64\n聴解スクリプト\n64\n\n７番\nＭ：あの映\nえい\n画\nが\n、もうやってないんだって。\nＦ：１．じゃ、明\nあした\n日見\nみ\nに行\nい\nこうよ。\n　　２．うん、まだやってないみたい。\n　　３．えっ、終\nお\nわっちゃったんだ。\n８番\nＭ：このプリント、クラスのみんなに配\nくば\nっといてもらえますか。\nＦ：１．あっ、取\nと\nってあります。\n　　２．はい、やっておきます。\n　　３．すぐもらえると思\nおも\nいます。\n65\n65\n聴解スクリプト\n"}, {"id": "v1_listening_17", "vol": 1, "vol_title": "2012년 제1집 (Vol.1)", "section": "listening", "section_title": "청해", "section_jp": "聴解", "q_idx": 89, "sub_q_num": 17, "image": "crops/vol1/listening_q17.png", "audio": "audio/vol1/listening_q17.mp3", "answer": 3, "options_count": 4, "script": "聴\nちょう\n解\nかい\nスクリプト\n（Ｍ：男性　Ｆ：女性）\n問題１\n例\nホテルで会\nかい\n社\nしゃ\n員\nいん\nの男\nおとこ\nの人\nひと\nと女\nおんな\nの人\nひと\nが話\nはな\nしています。女\nおんな\nの人\nひと\nは明\nあした\n日何\nなん\n時\nじ\nまでにホテルを出\nで\nますか。\nＭ：では、明\nあした\n日は、９時\nじ\n半\nはん\nに事\nじ\n務\nむ\n所\nしょ\nにいらしてください。\nＦ：はい、ええと、このホテルから事\nじ\n務\nむ\n所\nしょ\nまで、タクシーでどのぐらいかかりますか。\nＭ：そうですね、30 分\nぷん\nもあれば着\nつ\nきますね。\nＦ：じゃあ、９時\nじ\nに出\nで\nればいいですね。\nＭ：あ、朝\nあさ\nは道\nみち\nが混\nこ\nむかもしれません。15 分\nふん\nぐらい早\nはや\nめに出\nで\nられたほうがいいですね。\nＦ：そうですか。じゃあ、そうします。\n女\nおんな\nの人\nひと\nは明\nあした\n日何\nなん\n時\nじ\nまでにホテルを出\nで\nますか。\n１番\n会\nかい\n社\nしゃ\nで男\nおとこ\nの人\nひと\nと女\nおんな\nの人\nひと\nがメモを見\nみ\nながら話\nはな\nしています。男\nおとこ\nの人\nひと\nは何\nなに\nを注\nちゅう\n文\nもん\nしますか。\nＭ：必\nひつ\n要\nよう\nな文\nぶん\n房\nぼう\n具\nぐ\n、書\nか\nき出\nだ\nしてみたんですけど、見\nみ\nてもらえますか。\nＦ：うん。ええと、のりとボールペン。あ、ボールペンはいいわ。もう私\nわたし\nの方\nほう\nで注\nちゅう\n文\nもん\nして、今\nきょう\n日\n届\nとど\nくことになってるから。\nＭ：はい。\nＦ：それから、ノートと封\nふう\n筒\nとう\n、あれ、封\nふう\n筒\nとう\nはまだけっこう残\nのこ\nってたようだけど。\nＭ：まだあるんですが、今\nきょう\n日の午\nご\n後\nご\n大\nたい\n量\nりょう\nに使\nつか\nうので、注\nちゅう\n文\nもん\nしといたほうがいいと思\nおも\nったんですけど。\nＦ：じゃあ、必\nひつ\n要\nよう\nね。それから、コピー用\nよう\n紙\nし\nはね、毎\nまい\n月\nつき\n届\nとど\nけてもらってるから、注\nちゅう\n文\nもん\nしなくていいのよ。\nＭ：はい。\nＦ：じゃあ、これで注\nちゅう\n文\nもん\nよろしくね。     \nＭ：はい、分\nわ\nかりました。\n男\nおとこ\nの人\nひと\nは何\nなに\nを注\nちゅう\n文\nもん\nしますか。\n54\n聴解スクリプト\n54\n\n２番\n女\nおんな\nの人\nひと\nと母\nはは\n親\nおや\nが話\nはな\nしています。女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nに何\nなに\nをプレゼントしますか。\nＦ１：お母\nかあ\nさん、友\nとも\n達\nだち\nに赤\nあか\nちゃんが生\nう\nまれたんだけど、お祝\nいわ\nい何\nなに\nがいいと思\nおも\nう？\nＦ２：そうね。よく贈\nおく\nるのは、着\nき\nるものとか、おもちゃだ おいしいお\n店\nみせ\nを見\nみ\nつけたから、そこで。そのお店\nみせ\n、けっこう混\nこ\nむから予\nよ\n約\nやく\nしたいし。来\nこ\nられるかどうか、\nなるべく早\nはや\nく教\nおし\nえてくれる？できたら、ご飯\nはん\n食\nた\nべながら今\nこん\n度\nど\n一\nいっ\n緒\nしょ\nに行\nい\nく旅\nりょ\n行\nこう\nの計\nけい\n画\nかく\n立\nた\nてない？\n飛\nひ\n行\nこう\n機\nき\nの予\nよ\n約\nやく\nは早\nはや\nいほうがいいしね。じゃあね。\nこのメッセージを聞\nき\nいたあと、まず何\nなに\nをしますか。\n４番\n母\nはは\n親\nおや\nと息\nむすこ\n子が話\nはな\nしています。息\nむすこ\n子はこのあと、まず何\nなに\nをしますか。\nＦ：あ、太\nた\n郎\nろう\n、今\nいま\nから出\nで\nかけるの？　　　　　　　　　　　　　　　　　　　　　　　　　　　\nＭ：うん。駅\nえき\n前\nまえ\nの映\nえい\n画\nが\n館\nかん\nで友\nとも\n達\nだち\nと映\nえい\n画\nが\n見\nみ\nてくる。\nＦ：あ、そう。それなら、駅\nえき\n前\nまえ\nの郵\nゆう\n便\nびん\n局\nきょく\nに寄\nよ\nって、この荷\nに\n物\nもつ\n、出\nだ\nしてってくれない？\nＭ：えー。ちょっと本\nほん\n屋\nや\nに寄\nよ\nろうと思\nおも\nってたのにな。まあ、映\nえい\n画\nが\nのあとにするか。じゃあ、出\nだ\nして\n55\n55\n聴解スクリプト\n\nきてあげるよ。\nＦ：ありがとう。急\nいそ\nぎだから、映\nえい\n画\nが\nの前\nまえ\nに行\nい\nってね。はい、お金\nかね\n。\nＭ：え、こんなにかかるの？\nＦ：余\nあま\nった分\nぶん\nは、ご飯\nはん\n代\nだい\nにでも使\nつか\nいなさい。\nＭ：やった。\n息\nむすこ\n子はこのあと、まず何\nなに\nをしますか。\n５番\n家\nうち\nの玄\nげん\n関\nかん\nで男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nとホストファミリーのお母\nかあ\nさんが話\nはな\nしています。留\nりゅう\n学\nがく\n生\nせい\nはこれから何\nなに\nを\nしますか。\nＭ：雨\nあめ\n降\nふ\nりそうですね。傘\nかさ\n、持\nも\nってったほうがいいですか。\nＦ：今\nきょう\n日は天\nてん\n気\nき\nがよくなるって言\nい\nってたから、大\nだい\n丈\nじょう\n夫\nぶ\nよ。\nＭ：はい。\nＦ：あれ？リビングのエアコンは消\nけ\nしたよね。\nＭ：ええ、消\nけ\nしてありました。\nＦ：ああ、そう。あっ、いけない。台\nだい\n所\nどころ\nの電\nでん\n気\nき\n、つけたままだった。ごめんね、ちょっと消\nけ\nして\nきてくれる？\nＭ：はい。\nＦ：台\nだい\n所\nどころ\nの小\nちい\nさい窓\nまど\nは開\nあ\nいてるけど、閉\nし\nめなくていいわよ。\nＭ：分\nわ\nかりました。\n留\nりゅう\n学\nがく\n生\nせい\nはこれから何\nなに\nをしますか。\n６番\n会\nかい\n社\nしゃ\nで男\nおとこ\nの人\nひと\nと女\nおんな\nの人\nひと\nが話\nはな\nしています。女\nおんな\nの人\nひと\nはこれから、まず何\nなに\nをしますか。\nＭ：鈴\nすず\n木\nき\nさん、今\nことし\n年の新\nしん\n入\nにゅう\n社\nしゃ\n員\nいん\n歓\nかん\n迎\nげい\n会\nかい\nのことなんだけどね。今\nことし\n年は週\nしゅう\n末\nまつ\nに日\nひ\n帰\nがえ\nりで、どこかに行\nい\nくのはどうだろう。\nＦ：日\nひ\n帰\nがえ\nり旅\nりょ\n行\nこう\nですか。いいかもしれませんね。\nＭ：じゃ、今\nことし\n年はそういうことで、準\nじゅん\n備\nび\nしてくれる？まずは、どこへ行\nい\nきたいか、みんなに聞\nき\nい\nてみて。\nＦ：そうですね。アンケートでもとりましょうか。\n56\n聴解スクリプト\n56\n\nＭ：あ、いや、やっぱり、そんな時\nじ\n間\nかん\nもないし。鈴\nすず\n木\nき\nさんがよさそうな場\nば\n所\nしょ\nを決\nき\nめてください。イ\nンターネットとかで探\nさが\nしてくれる？\nＦ：はい。\nＭ：で、そこで何\nなに\nをするかだな。食\nしょく\n事 \nＭ  ：料\nりょう\n金\nきん\nはちょっと高\nたか\nいんですが、人\nにん\n気\nき\nがあるんですよ。あの、よかったら連\nれん\n絡\nらく\n先\nさき\nを教\nおし\nえましょ\nうか。\nＦ：あ、ありがとうございます。\n女\nおんな\nの人\nひと\nはどうしてこの教\nきょう\n室\nしつ\nに興\nきょう\n味\nみ\nを持\nも\nちましたか。\n３番\n女\nおんな\nの学\nがく\n生\nせい\nと男\nおとこ\nの学\nがく\n生\nせい\nが話\nはな\nしています。男\nおとこ\nの学\nがく\n生\nせい\nはどうしてアルバイトを変\nか\nえましたか。\nＦ：今\nいま\nからアルバイト？\nＭ：うん、実\nじつ\nは、今\nきょう\n日からコンビニでアルバイトすることにしたんだ。\nＦ：え？自\nじ\n動\nどう\n車\nしゃ\n工\nこう\n場\nじょう\nのアルバイトは？朝\nあさ\n早\nはや\nくからだったし、大\nたい\n変\nへん\nだったの？\nＭ：いや、早\nはや\n起\nお\nきは平\nへい\n気\nき\nなんだ。それに、時\nじ\n給\nきゅう\nもまあまあよかったし。\nＦ：じゃあ、何\nなん\nで？\nＭ：うーん、ものを作\nつく\nる仕\nし\n事\nごと\nも楽\nたの\nしかったけど、学\nがく\n生\nせい\nのうちに、いろいろな仕\nし\n事\nごと\nをやってみたくてね。\nＦ：そっか。頑\nがん\n張\nば\nって。\n58\n聴解スクリプト\n58\n\n男\nおとこ\nの学\nがく\n生\nせい\nはどうしてアルバイトを変\nか\nえましたか。\n４番\n図\nと\n書\nしょ\n館\nかん\nで男\nおとこ\nの学\nがく\n生\nせい\nと係\nかか\nりの人\nひと\nが話\nはな\nしています。図\nと\n書\nしょ\n館\nかん\nのパソコンコーナーで何\nなに\nをしてはいけませ\nんか。\nＭ：すみません。パソコンを使\nつか\nいたいんですが。\nＦ：はい、どうぞ。\nＭ：あのう、インターネットは使\nつか\nえますか。\nＦ：ええ、利\nり\n用\nよう\nできます。でも、メールはご遠\nえん\n慮\nりょ\nください。\nＭ：分\nわ\nかりました。あと、プリンターは。\nＦ：あ、プリンターはお使\nつか\nいになれますが、有\nゆう\n料\nりょう\nです。\nＭ：あ、そうですか。それから、ＤＶＤは見\nみ\nられますか。\nＦ：はい、大\nだい\n丈\nじょう\n夫\nぶ\nですよ。\n図\nと\n書\nしょ\n館\nかん\nのパソコンコーナーで何\nなに\nをしてはいけませんか。\n５番\n大\nだい\n学\nがく\nで男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nが係\nかか\nりの人\nひと\nにホームステイについて聞\nき\nいています。男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nはどうして\nホームステイに参\nさん\n加\nか\nできませんか。\nＭ：すみません、このホームステイに申\nもう\nし込\nこ\nみをしたいんですが。締\nし\nめ切\nき\nりまだですよね？\nＦ：はい、まだ間\nま\nに合\nあ\nいますよ。参\nさん\n加\nか\nは初\nはじ\nめてですか。\nＭ：いえ、２回\nかい\n目\nめ\nです。２回\nかい\n目\nめ\nでも大\nだい\n丈\nじょう\n夫\nぶ\nですか。\nＦ：はい、大\nだい\n丈\nじょう\n夫\nぶ\nです。えー、日\nに\n本\nほん\nに来\nき\nてどのぐらいになりますか。\nＭ：10 か月\nげつ\nを過\nす\nぎたところです。あと、１か月\nげつ\nで帰\nき\n国\nこく\nする予\nよ\n定\nてい\nです。\nＦ：そうですか。んー、実\nじつ\nは、このホームステイは、来\nらい\n日\nにち\nしてから半\nはん\n年\nとし\n以\nい\n内\nない\nの留\nりゅう\n学\nがく\n生\nせい\nしか申\nもう\nし込\nこ\nみができないことになっているんですよ。\nＭ：え、そうなんですか。\n男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nはどうしてホームステイに参\nさん\n加\nか\nできませんか。\n６番\nテレビで男\nおとこ\nの人\nひと\nが自\nじ\n分\nぶん\nの仕\nし\n事\nごと\nについて話\nはな\nしています。男\nおとこ\nの人\nひと\nは何\nなに\nがうれしいと言\nい\nっていますか。\n59\n59\n聴解スクリプト\n\nＭ nですか。\n　　３．時\nと\n計\nけい\nはあそこですよ。\n１番\nＭ：リンさん、明\nあした\n日のアルバイト、３時\nじ\nに来\nき\nてほしいんですが。\nＦ：１．いつでも来\nき\nてください。\n　　２．都\nつ\n合\nごう\nはどうですか。\n　　３．はい、大\nだい\n丈\nじょう\n夫\nぶ\nです。\n63\n63\n聴解スクリプト\n\n２番\nＦ：田\nた\n中\nなか\nさん、明\nあ\nす\n日の旅\nりょ\n行\nこう\nは８時\nじ\n出\nしゅっ\n発\nぱつ\nですよ。遅\nおく\nれないようにね。\nＭ：１．気\nき\nをつけます。\n　　２．そうしてください。\n　　３．よく気\nき\nがつきます。\n３番\nＦ：あれ、雨\nあめ\nですか。そんなに濡\nぬ\nれちゃって。\nＭ：１．じゃあ、傘\nかさ\nはいりませんね。\n　　２．いつ降\nふ\nるんでしょう。\n　　３．急\nきゅう\nに降\nふ\nってきたんです。\n４番\nＦ：暑\nあつ\nいので、ちょっと窓\nまど\nを開\nあ\nけてもよろしいでしょうか。\nＭ：１．じゃあ、閉\nし\nめましょう。\n　　２．ええ、かまいませんよ。\n　　３．いえ、どういたしまして。\n５番\nＦ：お客\nきゃく\n様\nさま\n、こちらで召\nめ\nし上\nあ\nがりますか、お持\nも\nち帰\nかえ\nりになりますか。\nＭ：１．はい、大\nだい\n丈\nじょう\n夫\nぶ\nです。\n　　２．ここで食\nた\nべます。\n　　３．いいえ、持\nも\nちますよ。\n６番\nＭ：バス、なかなか来\nこ\nないですね。\nＦ：１．道\nみち\nが混\nこ\nんでるんでしょうか。\n　　２．バスにしてよかったですね。\n　　３．随\nずい\n分\nぶん\n早\nはや\nそうですね。\n64\n聴解スクリプト\n64\n\n７番\nＭ：あの映\nえい\n画\nが\n、もうやってないんだって。\nＦ：１．じゃ、明\nあした\n日見\nみ\nに行\nい\nこうよ。\n　　２．うん、まだやってないみたい。\n　　３．えっ、終\nお\nわっちゃったんだ。\n８番\nＭ：このプリント、クラスのみんなに配\nくば\nっといてもらえますか。\nＦ：１．あっ、取\nと\nってあります。\n　　２．はい、やっておきます。\n　　３．すぐもらえると思\nおも\nいます。\n65\n65\n聴解スクリプト\n"}, {"id": "v1_listening_19", "vol": 1, "vol_title": "2012년 제1집 (Vol.1)", "section": "listening", "section_title": "청해", "section_jp": "聴解", "q_idx": 91, "sub_q_num": 19, "image": "crops/vol1/listening_q19.png", "audio": "audio/vol1/listening_q19.mp3", "answer": 1, "options_count": 4, "script": "聴\nちょう\n解\nかい\nスクリプト\n（Ｍ：男性　Ｆ：女性）\n問題１\n例\nホテルで会\nかい\n社\nしゃ\n員\nいん\nの男\nおとこ\nの人\nひと\nと女\nおんな\nの人\nひと\nが話\nはな\nしています。女\nおんな\nの人\nひと\nは明\nあした\n日何\nなん\n時\nじ\nまでにホテルを出\nで\nますか。\nＭ：では、明\nあした\n日は、９時\nじ\n半\nはん\nに事\nじ\n務\nむ\n所\nしょ\nにいらしてください。\nＦ：はい、ええと、このホテルから事\nじ\n務\nむ\n所\nしょ\nまで、タクシーでどのぐらいかかりますか。\nＭ：そうですね、30 分\nぷん\nもあれば着\nつ\nきますね。\nＦ：じゃあ、９時\nじ\nに出\nで\nればいいですね。\nＭ：あ、朝\nあさ\nは道\nみち\nが混\nこ\nむかもしれません。15 分\nふん\nぐらい早\nはや\nめに出\nで\nられたほうがいいですね。\nＦ：そうですか。じゃあ、そうします。\n女\nおんな\nの人\nひと\nは明\nあした\n日何\nなん\n時\nじ\nまでにホテルを出\nで\nますか。\n１番\n会\nかい\n社\nしゃ\nで男\nおとこ\nの人\nひと\nと女\nおんな\nの人\nひと\nがメモを見\nみ\nながら話\nはな\nしています。男\nおとこ\nの人\nひと\nは何\nなに\nを注\nちゅう\n文\nもん\nしますか。\nＭ：必\nひつ\n要\nよう\nな文\nぶん\n房\nぼう\n具\nぐ\n、書\nか\nき出\nだ\nしてみたんですけど、見\nみ\nてもらえますか。\nＦ：うん。ええと、のりとボールペン。あ、ボールペンはいいわ。もう私\nわたし\nの方\nほう\nで注\nちゅう\n文\nもん\nして、今\nきょう\n日\n届\nとど\nくことになってるから。\nＭ：はい。\nＦ：それから、ノートと封\nふう\n筒\nとう\n、あれ、封\nふう\n筒\nとう\nはまだけっこう残\nのこ\nってたようだけど。\nＭ：まだあるんですが、今\nきょう\n日の午\nご\n後\nご\n大\nたい\n量\nりょう\nに使\nつか\nうので、注\nちゅう\n文\nもん\nしといたほうがいいと思\nおも\nったんですけど。\nＦ：じゃあ、必\nひつ\n要\nよう\nね。それから、コピー用\nよう\n紙\nし\nはね、毎\nまい\n月\nつき\n届\nとど\nけてもらってるから、注\nちゅう\n文\nもん\nしなくていいのよ。\nＭ：はい。\nＦ：じゃあ、これで注\nちゅう\n文\nもん\nよろしくね。     \nＭ：はい、分\nわ\nかりました。\n男\nおとこ\nの人\nひと\nは何\nなに\nを注\nちゅう\n文\nもん\nしますか。\n54\n聴解スクリプト\n54\n\n２番\n女\nおんな\nの人\nひと\nと母\nはは\n親\nおや\nが話\nはな\nしています。女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nに何\nなに\nをプレゼントしますか。\nＦ１：お母\nかあ\nさん、友\nとも\n達\nだち\nに赤\nあか\nちゃんが生\nう\nまれたんだけど、お祝\nいわ\nい何\nなに\nがいいと思\nおも\nう？\nＦ２：そうね。よく贈\nおく\nるのは、着\nき\nるものとか、おもちゃだけどね。\nＦ１：そうだよね。私\nわたし\nも服\nふく\nがいいなって思\nおも\nうんだけど。\nＦ２：ただ、みんな赤\nあか\nちゃんの服\nふく\nやおもちゃをあげるでしょう。だから、友\nとも\n達\nだち\nに使\nつか\nってもらえるも\nのをあげるのもいいんじゃない？\nＦ１：えっ。服\nふく\nとか？\nＦ２：服\nふく\nもいいけど、赤\nあか\nちゃんが生\nう\nまれると、着\nき\n替\nが\nえとかタオルとかいろいろ持\nも\nち歩\nある\nくものが多\nおお\nく\nなるでしょ。だから、たくさん入\nはい\nるバッグなんかどう？あなたが生\nう\nまれたとき、もらって\nうれしかったわ。\nＦ１：そっか。じゃあ、私\nわたし\nもそうしよう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nに何\nなに\nをプレゼントしますか。\n３番\n友\nとも\n達\nだち\nから留\nる\n守\nす\n番\nばん\n電\nでん\n話\nわ\nにメッセージが入\nはい\nっていました。このメッセージを聞\nき\nいたあと、まず何\nなに\nをしま\nすか。\nＦ：もしもし、まさ子\nこ\nです。急\nきゅう\nなんだけど、明\nあした\n日の夜\nよる\n、ご飯\nはん\n一\nいっ\n緒\nしょ\nにどう？駅\nえき\nの近\nちか\nくにおいしいお\n店\nみせ\nを見\nみ\nつけたから、そこで。そのお店\nみせ\n、けっこう混\nこ\nむから予\nよ\n約\nやく\nしたいし。来\nこ\nられるかどうか、\nなるべく早\nはや\nく教\nおし\nえてくれる？できたら、ご飯\nはん\n食\nた\nべながら今\nこん\n度\nど\n一\nいっ\n緒\nしょ\nに行\nい\nく旅\nりょ\n行\nこう\nの計\nけい\n画\nかく\n立\nた\nてない？\n飛\nひ\n行\nこう\n機\nき\nの予\nよ\n約\nやく\nは早\nはや\nいほうがいいしね。じゃあね。\nこのメッセージを聞\nき\nいたあと、まず何\nなに\nをしますか。\n４番\n母\nはは\n親\nおや\nと息\nむすこ\n子が話\nはな\nしています。息\nむすこ\n子はこのあと、まず何\nなに\nをしますか。\nＦ：あ、太\nた\n郎\nろう\n、今\nいま\nから出\nで\nかけるの？　　　　　　　　　　　　　　　　　　　　　　　　　　　\nＭ：うん。駅\nえき\n前\nまえ\nの映\nえい\n画\nが\n館\nかん\nで友\nとも\n達\nだち\nと映\nえい\n画\nが\n見\nみ\nてくる。\nＦ：あ、そう。それなら、駅\nえき\n前\nまえ\nの郵\nゆう\n便\nびん\n局\nきょく\nに寄\nよ\nって、この荷\nに\n物\nもつ\n、出\nだ\nしてってくれない？\nＭ：えー。ちょっと本\nほん\n屋\nや\nに寄\nよ\nろうと思\nおも\nってたのにな。まあ、映\nえい\n画\nが\nのあとにするか。じゃあ、出\nだ\nして\n55\n55\n聴解スクリプト\n\nきてあげるよ。\nＦ：ありがとう。急\nいそ\nぎだから、映\nえい\n画\nが\nの前\nまえ\nに行\nい\nってね。はい、お金\nかね\n。\nＭ：え、こんなにかかるの？\nＦ：余\nあま\nった分\nぶん\nは、ご飯\nはん\n代\nだい\nにでも使\nつか\nいなさい。\nＭ：やった。\n息\nむすこ\n子はこのあと、まず何\nなに\nをしますか。\n５番\n家\nうち\nの玄\nげん\n関\nかん\nで男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nとホストファミリーのお母\nかあ\nさんが話\nはな\nしています。留\nりゅう\n学\nがく\n生\nせい\nはこれから何\nなに\nを\nしますか。\nＭ：雨\nあめ\n降\nふ\nりそうですね。傘\nかさ\n、持\nも\nってったほうがいいですか。\nＦ：今\nきょう\n日は天\nてん\n気\nき\nがよくなるって言\nい\nってたから、大\nだい\n丈\nじょう\n夫\nぶ\nよ。\nＭ：はい。\nＦ：あれ？リビングのエアコンは消\nけ\nしたよね。\nＭ：ええ、消\nけ\nしてありました。\nＦ：ああ、そう。あっ、いけない。台\nだい\n所\nどころ\nの電\nでん\n気\nき\n、つけたままだった。ごめんね、ちょっと消\nけ\nして\nきてくれる？\nＭ：はい。\nＦ：台\nだい\n所\nどころ\nの小\nちい\nさい窓\nまど\nは開\nあ\nいてるけど、閉\nし\nめなくていいわよ。\nＭ：分\nわ\nかりました。\n留\nりゅう\n学\nがく\n生\nせい\nはこれから何\nなに\nをしますか。\n６番\n会\nかい\n社\nしゃ\nで男\nおとこ\nの人\nひと\nと女\nおんな\nの人\nひと\nが話\nはな\nしています。女\nおんな\nの人\nひと\nはこれから、まず何\nなに\nをしますか。\nＭ：鈴\nすず\n木\nき\nさん、今\nことし\n年の新\nしん\n入\nにゅう\n社\nしゃ\n員\nいん\n歓\nかん\n迎\nげい\n会\nかい\nのことなんだけどね。今\nことし\n年は週\nしゅう\n末\nまつ\nに日\nひ\n帰\nがえ\nりで、どこかに行\nい\nくのはどうだろう。\nＦ：日\nひ\n帰\nがえ\nり旅\nりょ\n行\nこう\nですか。いいかもしれませんね。\nＭ：じゃ、今\nことし\n年はそういうことで、準\nじゅん\n備\nび\nしてくれる？まずは、どこへ行\nい\nきたいか、みんなに聞\nき\nい\nてみて。\nＦ：そうですね。アンケートでもとりましょうか。\n56\n聴解スクリプト\n56\n\nＭ：あ、いや、やっぱり、そんな時\nじ\n間\nかん\nもないし。鈴\nすず\n木\nき\nさんがよさそうな場\nば\n所\nしょ\nを決\nき\nめてください。イ\nンターネットとかで探\nさが\nしてくれる？\nＦ：はい。\nＭ：で、そこで何\nなに\nをするかだな。食\nしょく\n事\nじ\nしただけで終\nお\nわるのは、ちょっとな。\nＦ：そうですね。\nＭ：ま、それは場\nば\n所\nしょ\nが決\nき\nまってから、考\nかんが\nえよう。調\nしら\nべたら、教\nおし\nえてくれる？\nＦ：分\nわ\nかりました。\n女\nおんな\nの人\nひと\nはこれから、まず何\nなに\nをしますか。\n問題２\n例\n女\nおんな\nの人\nひと\nと男\nおとこ\nの人\nひと\nがスーパーで話\nはな\nしています。男\nおとこ\nの人\nひと\nはどうして自\nじ\n分\nぶん\nで料\nりょう\n理\nり\nをしませんか。\nＦ：あら、田\nた\n中\nなか\n君\nくん\n、お買\nか\nい物\nもの\n？\nＭ：うん、夕\nゆう\n飯\nはん\nを買\nか\nいにね。\nＦ：お弁\nべん\n当\nとう\n？自\nじ\n分\nぶん\nで作\nつく\nらないの？時\nじ\n間\nかん\nないか。\nＭ：いや、そうじゃないんだ。\nＦ：じゃあ、作\nつく\nればいいのに。\nＭ：作\nつく\nるのは嫌\nきら\nいじゃないんだ。でも、一\nひとり\n人だと。\nＦ：材\nざい\n料\nりょう\nが余\nあま\nっちゃう？\nＭ：それはいいんだけど、一\nいっ\n生\nしょう\n懸\nけん\n命\nめい\n作\nつく\nっても一\nひとり\n人で食\nた\nべるだけじゃ、なんか寂\nさび\nしくて。\nＦ：それもそうか。\n男\nおとこ\nの人\nひと\nはどうして自\nじ\n分\nぶん\nで料\nりょう\n理\nり\nをしませんか。\n１番\n会\nかい\n社\nしゃ\nで女\nおんな\nの人\nひと\nと男\nおとこ\nの人\nひと\nが話\nはな\nしています。二\nふたり\n人はいつ相\nそう\n談\nだん\nしますか。\nＦ：あのう、新\nあたら\nしい商\nしょう\n品\nひん\nについて相\nそう\n談\nだん\nしたいんですが、いつにしましょうか。\nＭ：あ、そうですね。\nＦ：今\nきょう\n日が金\nきん\n曜\nよう\n日\nび\nでしょ？今\nきょう\n日はもうあまり時\nじ\n間\nかん\nがないから、じゃあ、来\nらい\n週\nしゅう\nの月\nげつ\n曜\nよう\n日\nび\nはどうですか。\n57\n57\n聴解スクリプト\n\nＭ：あ、来\nらい\n週\nしゅう\nの月\nげつ\n曜\nよう\n日\nび\nと火\nか\n曜\nよう\n日\nび\nは出\nしゅっ\n張\nちょう\nなんです。木\nもく\n曜\nよう\n日\nび\nなら、時\nじ\n間\nかん\n、とれますけど。\nＦ：そう、木\nもく\n曜\nよう\n日\nび\nは私\nわたし\nがちょっと忙\nいそが\nしいんで。あのう、出\nしゅっ\n張\nちょう\nから帰\nかえ\nった次\nつぎ\nの日\nひ\nって、忙\nいそが\nしい\nですか。\nＭ：うーん、あ、はい、大\nだい\n丈\nじょう\n夫\nぶ\nです。じゃあ、その日\nひ\nにしましょう。午\nご\n後\nご\n、時\nじ\n間\nかん\n空\nあ\nけておきます。\n二\nふたり\n人はいつ相\nそう\n談\nだん\nしますか。\n２番\n女\nおんな\nの人\nひと\nと男\nおとこ\nの人\nひと\nが料\nりょう\n理\nり\n教\nきょう\n室\nしつ\nについて話\nはな\nしています。女\nおんな\nの人\nひと\nはどうしてこの教\nきょう\n室\nしつ\nに興\nきょう\n味\nみ\nを持\nも\nちましたか。\nＦ：佐\nさ\n藤\nとう\nさん、料\nりょう\n理\nり\n教\nきょう\n室\nしつ\nに行\nい\nってるそうですね。楽\nたの\nしいですか。\nＭ：ええ。いろんな国\nくに\nの料\nりょう\n理\nり\nを作\nつく\nるんですよ。\nＦ：へえ、面\nおも\n白\nしろ\nそう。私\nわたし\n、日\nに\n本\nほん\n料\nりょう\n理\nり\nは習\nなら\nったことがあるので、他\nほか\nの国\nくに\nの料\nりょう\n理\nり\nを作\nつく\nってみたいと\n思\nおも\nっていたんです。あの、その教\nきょう\n室\nしつ\nは、いつ、やってるんですか。\nＭ：月\nつき\nに１回\nかい\n、最\nさい\n初\nしょ\nの土\nど\n曜\nよう\n日\nび\nの午\nご\n後\nご\nです。先\nせん\n生\nせい\nの話\nはなし\nを聞\nき\nいたあと、小\nちい\nさなグループに分\nわ\nかれて料\nりょう\n理\nり\nを作\nつく\nります。\nＦ：そうですか。\nＭ  ：料\nりょう\n金\nきん\nはちょっと高\nたか\nいんですが、人\nにん\n気\nき\nがあるんですよ。あの、よかったら連\nれん\n絡\nらく\n先\nさき\nを教\nおし\nえましょ\nうか。\nＦ：あ、ありがとうございます。\n女\nおんな\nの人\nひと\nはどうしてこの教\nきょう\n室\nしつ\nに興\nきょう\n味\nみ\nを持\nも\nちましたか。\n３番\n女\nおんな\nの学\nがく\n生\nせい\nと男\nおとこ\nの学\nがく\n生\nせい\nが話\nはな\nしています。男\nおとこ\nの学\nがく\n生\nせい\nはどうしてアルバイトを変\nか\nえましたか。\nＦ：今\nいま\nからアルバイト？\nＭ：うん、実\nじつ\nは、今\nきょう\n日からコンビニでアルバイトすることにしたんだ。\nＦ：え？自\nじ\n動\nどう\n車\nしゃ\n工\nこう\n場\nじょう\nのアルバイトは？朝\nあさ\n早\nはや\nくからだったし、大\nたい\n変\nへん\nだったの？\nＭ：いや、早\nはや\n起\nお\nきは平\nへい\n気\nき\nなんだ。それに、時\nじ\n給\nきゅう\nもまあまあよかったし。\nＦ：じゃあ、何\nなん\nで？\nＭ：うーん、ものを作\nつく\nる仕\nし\n事\nごと\nも楽\nたの\nしかったけど、学\nがく\n生\nせい\nのうちに、いろいろな仕\nし\n事\nごと\nをやってみたくてね。\nＦ：そっか。頑\nがん\n張\nば\nって。\n58\n聴解スクリプト\n58\n\n男\nおとこ\nの学\nがく\n生\nせい\nはどうしてアルバイトを変\nか\nえましたか。\n４番\n図\nと\n書\nしょ\n館\nかん\nで男\nおとこ\nの学\nがく\n生\nせい\nと係\nかか\nりの人\nひと\nが話\nはな\nしています。図\nと\n書\nしょ\n館\nかん\nのパソコンコーナーで何\nなに\nをしてはいけませ\nんか。\nＭ：すみません。パソコンを使\nつか\nいたいんですが。\nＦ：はい、どうぞ。\nＭ：あのう、インターネットは使\nつか\nえますか。\nＦ：ええ、利\nり\n用\nよう\nできます。でも、メールはご遠\nえん\n慮\nりょ\nください。\nＭ：分\nわ\nかりました。あと、プリンターは。\nＦ：あ、プリンターはお使\nつか\nいになれますが、有\nゆう\n料\nりょう\nです。\nＭ：あ、そうですか。それから、ＤＶＤは見\nみ\nられますか。\nＦ：はい、大\nだい\n丈\nじょう\n夫\nぶ\nですよ。\n図\nと\n書\nしょ\n館\nかん\nのパソコンコーナーで何\nなに\nをしてはいけませんか。\n５番\n大\nだい\n学\nがく\nで男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nが係\nかか\nりの人\nひと\nにホームステイについて聞\nき\nいています。男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nはどうして\nホームステイに参\nさん\n加\nか\nできませんか。\nＭ：すみません、このホームステイに申\nもう\nし込\nこ\nみをしたいんですが。締\nし\nめ切\nき\nりまだですよね？\nＦ：はい、まだ間\nま\nに合\nあ\nいますよ。参\nさん\n加\nか\nは初\nはじ\nめてですか。\nＭ：いえ、２回\nかい\n目\nめ\nです。２回\nかい\n目\nめ\nでも大\nだい\n丈\nじょう\n夫\nぶ\nですか。\nＦ：はい、大\nだい\n丈\nじょう\n夫\nぶ\nです。えー、日\nに\n本\nほん\nに来\nき\nてどのぐらいになりますか。\nＭ：10 か月\nげつ\nを過\nす\nぎたところです。あと、１か月\nげつ\nで帰\nき\n国\nこく\nする予\nよ\n定\nてい\nです。\nＦ：そうですか。んー、実\nじつ\nは、このホームステイは、来\nらい\n日\nにち\nしてから半\nはん\n年\nとし\n以\nい\n内\nない\nの留\nりゅう\n学\nがく\n生\nせい\nしか申\nもう\nし込\nこ\nみができないことになっているんですよ。\nＭ：え、そうなんですか。\n男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nはどうしてホームステイに参\nさん\n加\nか\nできませんか。\n６番\nテレビで男\nおとこ\nの人\nひと\nが自\nじ\n分\nぶん\nの仕\nし\n事\nごと\nについて話\nはな\nしています。男\nおとこ\nの人\nひと\nは何\nなに\nがうれしいと言\nい\nっていますか。\n59\n59\n聴解スクリプト\n\nＭ：私\nわたし\nは新\nあたら\nしく町\nまち\nにできたスーパーの社\nしゃ\n員\nいん\nです。でも、店\nみせ\nの中\nなか\nでは働\nはたら\nいていません。毎\nまい\n日\nにち\n、車\nくるま\nで、新\nしん\n鮮\nせん\nな肉\nにく\nや魚\nさかな\nなど、店\nみせ\nの商\nしょう\n品\nひん\nを、遠\nとお\nくの村\nむら\nまで売\nう\nりに行\nい\nっています。一\nいち\n日\nにち\nに五\nいつ\nつぐらい\nの村\nむら\nに行\nい\nきます。お客\nきゃく\nさんは、多\nおお\nい日\nひ\nも少\nすく\nない日\nひ\nもありますが、私\nわたし\nの車\nくるま\nが来\nく\nるのを楽\nたの\nしみ\nに待\nま\nっていてくださいます。皆\nみな\nさんに喜\nよろこ\nんでもらえるのが、やっぱり、私\nわたし\nには一\nいち\n番\nばん\nうれしい\nです。\n男\nおとこ\nの人\nひと\nは何\nなに\nがうれしいと言\nい\nっていますか。\n問題３\n例\n女\nおんな\nの人\nひと\nが友\nとも\n達\nだち\nの家\nうち\nに来\nき\nて話\nはな\nしています。\nＦ１：田\nた\n中\nなか\nです。\nＦ２：あ、はあい。昨\nきのう\n日友\nとも\n達\nだち\nが泊 nはは\n親\nおや\nが話\nはな\nしています。女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nに何\nなに\nをプレゼントしますか。\nＦ１：お母\nかあ\nさん、友\nとも\n達\nだち\nに赤\nあか\nちゃんが生\nう\nまれたんだけど、お祝\nいわ\nい何\nなに\nがいいと思\nおも\nう？\nＦ２：そうね。よく贈\nおく\nるのは、着\nき\nるものとか、おもちゃだけどね。\nＦ１：そうだよね。私\nわたし\nも服\nふく\nがいいなって思\nおも\nうんだけど。\nＦ２：ただ、みんな赤\nあか\nちゃんの服\nふく\nやおもちゃをあげるでしょう。だから、友\nとも\n達\nだち\nに使\nつか\nってもらえるも\nのをあげるのもいいんじゃない？\nＦ１：えっ。服\nふく\nとか？\nＦ２：服\nふく\nもいいけど、赤\nあか\nちゃんが生\nう\nまれると、着\nき\n替\nが\nえとかタオルとかいろいろ持\nも\nち歩\nある\nくものが多\nおお\nく\nなるでしょ。だから、たくさん入\nはい\nるバッグなんかどう？あなたが生\nう\nまれたとき、もらって\nうれしかったわ。\nＦ１：そっか。じゃあ、私\nわたし\nもそうしよう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nに何\nなに\nをプレゼントしますか。\n３番\n友\nとも\n達\nだち\nから留\nる\n守\nす\n番\nばん\n電\nでん\n話\nわ\nにメッセージが入\nはい\nっていました。このメッセージを聞\nき\nいたあと、まず何\nなに\nをしま\nすか。\nＦ：もしもし、まさ子\nこ\nです。急\nきゅう\nなんだけど、明\nあした\n日の夜\nよる\n、ご飯\nはん\n一\nいっ\n緒\nしょ\nにどう？駅\nえき\nの近\nちか\nくにおいしいお\n店\nみせ\nを見\nみ\nつけたから、そこで。そのお店\nみせ\n、けっこう混\nこ\nむから予\nよ\n約\nやく\nしたいし。来\nこ\nられるかどうか、\nなるべく早\nはや\nく教\nおし\nえてくれる？できたら、ご飯\nはん\n食\nた\nべながら今\nこん\n度\nど\n一\nいっ\n緒\nしょ\nに行\nい\nく旅\nりょ\n行\nこう\nの計\nけい\n画\nかく\n立\nた\nてない？\n飛\nひ\n行\nこう\n機\nき\nの予\nよ\n約\nやく\nは早\nはや\nいほうがいいしね。じゃあね。\nこのメッセージを聞\nき\nいたあと、まず何\nなに\nをしますか。\n４番\n母\nはは\n親\nおや\nと息\nむすこ\n子が話\nはな\nしています。息\nむすこ\n子はこのあと、まず何\nなに\nをしますか。\nＦ：あ、太\nた\n郎\nろう\n、今\nいま\nから出\nで\nかけるの？　　　　　　　　　　　　　　　　　　　　　　　　　　　\nＭ：うん。駅\nえき\n前\nまえ\nの映\nえい\n画\nが\n館\nかん\nで友\nとも\n達\nだち\nと映\nえい\n画\nが\n見\nみ\nてくる。\nＦ：あ、そう。それなら、駅\nえき\n前\nまえ\nの郵\nゆう\n便\nびん\n局\nきょく\nに寄\nよ\nって、この荷\nに\n物\nもつ\n、出\nだ\nしてってくれない？\nＭ：えー。ちょっと本\nほん\n屋\nや\nに寄\nよ\nろうと思\nおも\nってたのにな。まあ、映\nえい\n画\nが\nのあとにするか。じゃあ、出\nだ\nして\n55\n55\n聴解スクリプト\n\nきてあげるよ。\nＦ：ありがとう。急\nいそ\nぎだから、映\nえい\n画\nが\nの前\nまえ\nに行\nい\nってね。はい、お金\nかね\n。\nＭ：え、こんなにかかるの？\nＦ：余\nあま\nった分\nぶん\nは、ご飯\nはん\n代\nだい\nにでも使\nつか\nいなさい。\nＭ：やった。\n息\nむすこ\n子はこのあと、まず何\nなに\nをしますか。\n５番\n家\nうち\nの玄\nげん\n関\nかん\nで男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nとホストファミリーのお母\nかあ\nさんが話\nはな\nしています。留\nりゅう\n学\nがく\n生\nせい\nはこれから何\nなに\nを\nしますか。\nＭ：雨\nあめ\n降\nふ\nりそうですね。傘\nかさ\n、持\nも\nってったほうがいいですか。\nＦ：今\nきょう\n日は天\nてん\n気\nき\nがよくなるって言\nい\nってたから、大\nだい\n丈\nじょう\n夫\nぶ\nよ。\nＭ：はい。\nＦ：あれ？リビングのエアコンは消\nけ\nしたよね。\nＭ：ええ \nい\nてみて。\nＦ：そうですね。アンケートでもとりましょうか。\n56\n聴解スクリプト\n56\n\nＭ：あ、いや、やっぱり、そんな時\nじ\n間\nかん\nもないし。鈴\nすず\n木\nき\nさんがよさそうな場\nば\n所\nしょ\nを決\nき\nめてください。イ\nンターネットとかで探\nさが\nしてくれる？\nＦ：はい。\nＭ：で、そこで何\nなに\nをするかだな。食\nしょく\n事\nじ\nしただけで終\nお\nわるのは、ちょっとな。\nＦ：そうですね。\nＭ：ま、それは場\nば\n所\nしょ\nが決\nき\nまってから、考\nかんが\nえよう。調\nしら\nべたら、教\nおし\nえてくれる？\nＦ：分\nわ\nかりました。\n女\nおんな\nの人\nひと\nはこれから、まず何\nなに\nをしますか。\n問題２\n例\n女\nおんな\nの人\nひと\nと男\nおとこ\nの人\nひと\nがスーパーで話\nはな\nしています。男\nおとこ\nの人\nひと\nはどうして自\nじ\n分\nぶん\nで料\nりょう\n理\nり\nをしませんか。\nＦ：あら、田\nた\n中\nなか\n君\nくん\n、お買\nか\nい物\nもの\n？\nＭ：うん、夕\nゆう\n飯\nはん\nを買\nか\nいにね。\nＦ：お弁\nべん\n当\nとう\n？自\nじ\n分\nぶん\nで作\nつく\nらないの？時\nじ\n間\nかん\nないか。\nＭ：いや、そうじゃないんだ。\nＦ：じゃあ、作\nつく\nればいいのに。\nＭ：作\nつく\nるのは嫌\nきら\nいじゃないんだ。でも、一\nひとり\n人だと。\nＦ：材\nざい\n料\nりょう\nが余\nあま\nっちゃう？\nＭ：それはいいんだけど、一\nいっ\n生\nしょう\n懸\nけん\n命\nめい\n作\nつく\nっても一\nひとり\n人で食\nた\nべるだけじゃ、なんか寂\nさび\nしくて。\nＦ：それもそうか。\n男\nおとこ\nの人\nひと\nはどうして自\nじ\n分\nぶん\nで料\nりょう\n理\nり\nをしませんか。\n１番\n会\nかい\n社\nしゃ\nで女\nおんな\nの人\nひと\nと男\nおとこ\nの人\nひと\nが話\nはな\nしています。二\nふたり\n人はいつ相\nそう\n談\nだん\nしますか。\nＦ：あのう、新\nあたら\nしい商\nしょう\n品\nひん\nについて相\nそう\n談\nだん\nしたいんですが、いつにしましょうか。\nＭ：あ、そうですね。\nＦ：今\nきょう\n日が金\nきん\n曜\nよう\n日\nび\nでしょ？今\nきょう\n日はもうあまり時\nじ\n間\nかん\nがないから、じゃあ、来\nらい\n週\nしゅう\nの月\nげつ\n曜\nよう\n日\nび\nはどうですか。\n57\n57\n聴解スクリプト\n\nＭ：あ、来\nらい\n週\nしゅう\nの月\nげつ\n曜\nよう\n日\nび\nと火\nか\n曜\nよう\n日\nび\nは出\nしゅっ\n張\nちょう\nなんです。木\nもく\n曜\nよう\n日\nび\nなら、時\nじ\n間\nかん\n、とれますけど。\nＦ：そう、木\nもく\n曜\nよう\n日\nび\nは私\nわたし\nがちょっと忙\nいそが\nしいんで。あのう、出\nしゅっ\n張\nちょう\nから帰\nかえ\nった次\nつぎ\nの日\nひ\nって、忙\nいそが\nしい\nですか。\nＭ：うーん、あ、はい、大\nだい\n丈\nじょう\n夫\nぶ\nです。じゃあ、その日\nひ\nにしましょう。午\nご\n後\nご\n、時\nじ\n間\nかん\n空\nあ\nけておきます。\n二\nふたり\n人はいつ相\nそう\n談\nだん\nしますか。\n２番\n女\nおんな\nの人\nひと\nと男\nおとこ\nの人\nひと\nが料\nりょう\n理\nり\n教\nきょう\n室\nしつ\nについて話\nはな\nしています。女\nおんな\nの人\nひと\nはどうしてこの教\nきょう\n室\nしつ\nに興\nきょう\n味\nみ\nを持\nも\nちましたか。\nＦ：佐\nさ\n藤\nとう\nさん、料\nりょう\n理\nり\n教\nきょう\n室\nしつ\nに行\nい\nってるそうですね。楽\nたの\nしいですか。\nＭ：ええ。いろんな国\nくに\nの料\nりょう\n理\nり\nを作\nつく\nるんですよ。\nＦ：へえ、面\nおも\n白\nしろ\nそう。私\nわたし\n、日\nに\n本\nほん\n料\nりょう\n理\nり\nは習\nなら\nったことがあるので、他\nほか\nの国\nくに\nの料\nりょう\n理\nり\nを作\nつく\nってみたいと\n思\nおも\nっていたんです。あの、その教\nきょう\n室\nしつ\nは、いつ、やってるんですか。\nＭ：月\nつき\nに１回\nかい\n、最\nさい\n初\nしょ\nの土\nど\n曜\nよう\n日\nび\nの午\nご\n後\nご\nです。先\nせん\n生\nせい\nの話\nはなし\nを聞\nき\nいたあと、小\nちい\nさなグループに分\nわ\nかれて料\nりょう\n理\nり\nを作\nつく\nります。\nＦ：そうですか。\nＭ  ：料\nりょう\n金\nきん\nはちょっと高\nたか\nいんですが、人\nにん\n気\nき\nがあるんですよ。あの、よかったら連\nれん\n絡\nらく\n先\nさき\nを教\nおし\nえましょ\nうか。\nＦ：あ、ありがとうございます。\n女\nおんな\nの人\nひと\nはどうしてこの教\nきょう\n室\nしつ\nに興\nきょう\n味\nみ\nを持\nも\nちましたか。\n３番\n女\nおんな\nの学\nがく\n生\nせい\nと男\nおとこ\nの学\nがく\n生\nせい\nが話\nはな\nしています。男\nおとこ\nの学\nがく\n生\nせい\nはどうしてアルバイトを変\nか\nえましたか。\nＦ：今\nいま\nからアルバイト？\nＭ：うん、実\nじつ\nは、今\nきょう\n日からコンビニでアルバイトすることにしたんだ。\nＦ：え？自\nじ\n動\nどう\n車\nしゃ\n工\nこう\n場\nじょう\nのアルバイトは？朝\nあさ\n早\nはや\nくからだったし、大\nたい\n変\nへん\nだったの？\nＭ：いや、早\nはや\n起\nお\nきは平\nへい\n気\nき\nなんだ。それに、時\nじ\n給\nきゅう\nもまあまあよかったし。\nＦ：じゃあ、何\nなん\nで？\nＭ：うーん、ものを作\nつく\nる仕\nし\n事\nごと\nも楽\nたの\nしかったけど、学\nがく\n生\nせい\nのうちに、いろいろな仕\nし\n事\nごと\nをやってみたくてね。\nＦ：そっか。頑\nがん\n張\nば\nって。\n58\n聴解スクリプト\n58\n\n男\nおとこ\nの学\nがく\n生\nせい\nはどうしてアルバイトを変\nか\nえましたか。\n４番\n図\nと\n書\nしょ\n館\nかん\nで男\nおとこ\nの学\nがく\n生\nせい\nと係\nかか\nりの人\nひと\nが話\nはな\nしています。図\nと\n書\nしょ\n館\nかん\nのパソコンコーナーで何\nなに\nをしてはいけませ\nんか。\nＭ：すみません。パソコンを使\nつか\nいたいんですが。\nＦ：はい、どうぞ。\nＭ：あのう、インターネットは使\nつか\nえますか。\nＦ：ええ、利\nり\n用\nよう\nできます。でも、メールはご遠\nえん\n慮\nりょ\nください。\nＭ：分\nわ\nかりました。あと、プリンターは。\nＦ：あ、プリンターはお使\nつか\nいになれますが、有\nゆう\n料\nりょう\nです。\nＭ：あ、そうですか。それから、ＤＶＤは見\nみ\nられますか。\nＦ：はい、大\nだい\n丈\nじょう\n夫\nぶ\nですよ。\n図\nと\n書\nしょ\n館\nかん\nのパソコンコーナーで何\nなに\nをしてはいけませんか。\n５番\n大\nだい\n学\nがく\nで男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nが係\nかか\nりの人\nひと\nにホームステイについて聞\nき\nいています。男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nはどうして\nホームステイに参\nさん\n加\nか\nできませんか。\nＭ：すみません、このホームステイに申\nもう\nし込\nこ\nみをしたいんですが。締\nし\nめ切\nき\nりまだですよね？\nＦ：はい、まだ間\nま\nに合\nあ\nいますよ。参\nさん\n加\nか\nは初\nはじ\nめてですか。\nＭ：いえ、２回\nかい\n目\nめ\nです。２回\nかい\n目\nめ\nでも大\nだい\n丈\nじょう\n夫\nぶ\nですか。\nＦ：はい、大\nだい\n丈\nじょう\n夫\nぶ\nです。えー、日\nに\n本\nほん\nに来\nき\nてどのぐらいになりますか。\nＭ：10 か月\nげつ\nを過\nす\nぎたところです。あと、１か月\nげつ\nで帰\nき\n国\nこく\nする予\nよ\n定\nてい\nです。\nＦ：そうですか。んー、実\nじつ\nは、このホームステイは、来\nらい\n日\nにち\nしてから半\nはん\n年\nとし\n以\nい\n内\nない\nの留\nりゅう\n学\nがく\n生\nせい\nしか申\nもう\nし込\nこ\nみができないことになっているんですよ。\nＭ：え、そうなんですか。\n男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nはどうしてホームステイに参\nさん\n加\nか\nできませんか。\n６番\nテレビで男\nおとこ\nの人\nひと\nが自\nじ\n分\nぶん\nの仕\nし\n事\nごと\nについて話\nはな\nしています。男\nおとこ\nの人\nひと\nは何\nなに\nがうれしいと言\nい\nっていますか。\n59\n59\n聴解スクリプト\n\nＭ：私\nわたし\nは新\nあたら\nしく町\nまち\nにできたスーパーの社\nしゃ\n員\nいん\nです。でも、店\nみせ\nの中\nなか\nでは働\nはたら\nいていません。毎\nまい\n日\nにち\n、車\nくるま\nで、新\nしん\n鮮\nせん\nな肉\nにく\nや魚\nさかな\nなど、店\nみせ\nの商\nしょう\n品\nひん\nを、遠\nとお\nくの村\nむら\nまで売\nう\nりに行\nい\nっています。一\nいち\n日\nにち\nに五\nいつ\nつぐらい\nの村\nむら\nに行\nい\nきます。お客\nきゃく\nさんは、多\nおお\nい日\nひ\nも少\nすく\nない日\nひ\nもありますが、私\nわたし\nの車\nくるま\nが来\nく\nるのを楽\nたの\nしみ\nに待\nま\nっていてくださいます。皆\nみな\nさんに喜\nよろこ\nんでもらえるのが、やっぱり、私\nわたし\nには一\nいち\n番\nばん\nうれしい\nです。\n男\nおとこ\nの人\nひと\nは何\nなに\nがうれしいと言\nい\nっていますか。\n問題３\n例\n女\nおんな\nの人\nひと\nが友\nとも\n達\nだち\nの家\nうち\nに来\nき\nて話\nはな\nしています。\nＦ１：田\nた\n中\nなか\nです。\nＦ２：あ、はあい。昨\nきのう\n日友\nとも\n達\nだち\nが泊\nと\nまりに来\nき\nてたんで、片\nかた\n付\nづ\nいてないけど、入\nはい\nって。\nＦ１：あ、でもここで。すぐ帰\nかえ\nるから。あのう、この前\nまえ\n借\nか\nりた本\nほん\nなんだけど、ちょっと破\nやぶ\nれちゃって。\nＦ２：え、本\nほん\n当\nとう\n？\nＦ１：うん、このページなんだけど。\nＦ２：あっ、うん、このくらいなら大\nだい\n丈\nじょう\n夫\nぶ\n、読\nよ\nめるし。\nＦ１：ほんと？ごめん。これからは気\nき\nをつけるから。\nＦ２：うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１：ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nの家\nうち\nへ何\nなに\nをしに来\nき\nましたか。\n　１．謝\nあやま\nりに来\nき\nた\n　２．本\nほん\nを借\nか\nりに来\nき\nた\n　３．泊\nと\nまりに来\nき\nた\n　４．コーヒーを飲\nの\nみに来\nき\nた\n１番\n留\nる\n守\nす\n番\nばん\n電\nでん\n話\nわ\nのメッセージを聞\nき\nいています。\nＭ：もしもし、田\nた\n中\nなか\nですけど。あのう、明\nあした\n日映\nえい\n画\nが\nに行\nい\nくことになってたよね。でも、急\nきゅう\nに出\nしゅっ\n張\nちょう\n60\n聴解スクリプト\n60\n\nが入\nはい\nっちゃって。それで、悪\nわる\nいんだけど、来\nらい\n週\nしゅう\nにしてもらってもいいかな。僕\nぼく\nから誘\nさそ\nったの\nにごめん。映\nえい\n画\nが\nのあと、食\nしょく\n事\nじ\nごちそうするから。じゃ、また電\nでん\n話\nわ\nするよ。ほんと、ごめんね。\n田\nた\n中\nなか\nさんが一\nいち\n番\nばん\n言\nい\nいたいことは何\nなん\nですか。\n　１．出\nしゅっ\n張\nちょう\nに行\nい\nくこと\n　２．映\nえい\n画\nが\nに行\nい\nく日\nひ\nを変\nか\nえてほしいこと \n　３．食\nしょく\n事\nじ\nをごちそうすること\n　４．また電\nでん\n話\nわ\nすること\n２番\n男\nおとこ\nの学\nがく\n生\nせい\nと女\nおんな\nの学\nがく\n生\nせい\nが話\nはな\nしています。\nＭ：今\nこん\n度\nど\nの日\nにち\n曜\nよう\n日\nび\n、みんなで海\nうみ\nに行\nい\nこうって話\nはなし\nがあるんだけど。\nＦ：海\nうみ\n？いいね。楽\nたの\nしそう。\nＭ：うん。海\nうみ\nで花\nはな\n火\nび\nもするよ。どう？来\nこ\nられそう？\nＦ：面\nおも\n白\nしろ\nそう。でも、今\nこん\n度\nど\nの日\nにち\n曜\nよう\n日\nび\nだよね。月\nげつ\n曜\nよう\nにテストがあるんだ。テストがなかったら行\nい\nきた\nいんだけど。\nＭ：土\nど\n曜\nよう\n日\nび\nに頑\nがん\n張\nば\nったら大\nだい\n丈\nじょう\n夫\nぶ\nだよ。\nＦ：うーん。苦\nにが\n手\nて\nな科\nか\n目\nもく\nだから一\nいち\n日\nにち\nじゃきついかも。また今\nこん\n度\nど\n誘\nさそ\nって。\n女\nおんな\nの学\nがく\n生\nせい\nは日\nにち\n曜\nよう\n日\nび\nに海\nうみ\nへ行\nい\nくことについてどう思\nおも\nっていますか。\n　１．楽\nたの\nしそうだから、行\nい\nくつもりだ\n　２．楽\nたの\nしそうだが、行\nい\nかない\n　３．興\nきょう\n味\nみ\nがないから、行\nい\nかない\n　４．興\nきょう\n味\nみ\nはないが、行\nい\nくつもりだ\n３番\n女\nおんな\nの人\nひと\nが男\nおとこ\nの人\nひと\nに旅\nりょ\n行\nこう\nの感\nかん\n想\nそう\nを聞\nき\nいています。\nＦ：週\nしゅう\n末\nまつ\n、旅\nりょ\n行\nこう\nに行\nい\nってきたんだって？\nＭ：両\nりょう\n親\nしん\nを温\nおん\n泉\nせん\nに連\nつ\nれて行\nい\nったんだ。桜\nさくら\nのきれいな季\nき\n節\nせつ\nだしね。\nＦ：偉\nえら\nいね。ご両\nりょう\n親\nしん\nも喜\nよろこ\nんだでしょう。\nＭ：うん。でも、向\nむ\nこうはもう暖\nあたた\nかくて、桜\nさくら\nはほとんど終\nお\nわってたし、休\nきゅう\n日\nじつ\nだから渋\nじゅう\n滞\nたい\nしてて。\nＦ：そっか。\n61\n61\n聴解スクリプト\n\nＭ：温\nおん\n泉\nせん\nに入\nはい\nれば疲\nつか\nれが取\nと\nれると思\nおも\nってたんだけど、僕\nぼく\nはずっと運\nうん\n転\nてん\nだったからね。\nＦ：ふうん、大\nたい\n変\nへん\nだったね。\nＭ：でもまあ、両\nりょう\n親\nしん\nは久\nひさ\nしぶりにゆっくりできてよかったって言\nい\nってくれたから。\nＦ：じゃ、それが一\nいち\n番\nばん\nじゃない。\nＭ：まあね。\n男\nおとこ\nの人\nひと\nは旅\nりょ\n行\nこう\nについてどう思\nおも\nっていますか。\n　１．桜\nさくら\nがきれいで、よかった\n　２．温\nおん\n泉\nせん\nで疲\nつか\nれが取\nと\nれて、よかった\n　３．両\nりょう\n親\nしん\nが疲\nつか\nれたので、よくなかった\n　４．両\nりょう\n親\nしん\nが満\nまん\n足\nぞく\nして、よかった\n問題４\n例\nホテルのテレビが壊\nこわ\nれています。何\nなん\nと言\nい\nいますか。\nＦ：１．テレビがつかないんですが。\n　　２．テレビをつけてもいいですか。\n　　３．テレビをつけたほうがいいですよ。\n１番\n先\nせん\n輩\nぱい\nが忙\nいそが\nしそうなので、手\nて\n伝\nつだ\nいたいです。先\nせん\n輩\nぱい\nに何\nなん\nと言\nい\nいますか。\nＦ：１．あの、手\nて\n伝\nつだ\nってくれませんか。\n　　２．あの、手\nて\n伝\nつだ\nいましょうか。\n　　３．あの、手\nて\n伝\nつだ\nいませんか。\n２番\n試\nし\n験\nけん\nに合\nごう\n格\nかく\nしたので、先\nせん\n生\nせい\nに伝\nつた\nえたいです。先\nせん\n生\nせい\nに何\nなん\nと言\nい\nいますか。\nＭ：１．今\nこん\n回\nかい\nはおめでとうございます。\n　　２．今\nこん\n度\nど\n、合\nごう\n格\nかく\nなさいました。\n62\n聴解スクリプト\n62\n\n　　３．おかげさまで、試\nし\n験\nけん\nに受\nう\nかりました。\n３番\n友\nとも\n達\nだち\nと食\nしょく\n事\nじ\nをしています。しょうゆを使\nつか\nいたいです。友\nとも\n達\nだち\nに何\nなん\nと言\nい\nいますか。\nＦ：１．しょうゆ、取\nと\nろうか。\n　　２．しょうゆ、取\nと\nってくれない？\n　　３．しょうゆ、取\nと\nってもいいよ。\n４番\n会\nかい\n社\nしゃ\nでお客\nきゃく\nさんを部\nへ\n屋\nや\nに案\n nつき\n届\nとど\nけてもらってるから、注\nちゅう\n文\nもん\nしなくていいのよ。\nＭ：はい。\nＦ：じゃあ、これで注\nちゅう\n文\nもん\nよろしくね。     \nＭ：はい、分\nわ\nかりました。\n男\nおとこ\nの人\nひと\nは何\nなに\nを注\nちゅう\n文\nもん\nしますか。\n54\n聴解スクリプト\n54\n\n２番\n女\nおんな\nの人\nひと\nと母\nはは\n親\nおや\nが話\nはな\nしています。女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nに何\nなに\nをプレゼントしますか。\nＦ１：お母\nかあ\nさん、友\nとも\n達\nだち\nに赤\nあか\nちゃんが生\nう\nまれたんだけど、お祝\nいわ\nい何\nなに\nがいいと思\nおも\nう？\nＦ２：そうね。よく贈\nおく\nるのは、着\nき\nるものとか、おもちゃだけどね。\nＦ１：そうだよね。私\nわたし\nも服\nふく\nがいいなって思\nおも\nうんだけど。\nＦ２：ただ、みんな赤\nあか\nちゃんの服\nふく\nやおもちゃをあげるでしょう。だから、友\nとも\n達\nだち\nに使\nつか\nってもらえるも\nのをあげるのもいいんじゃない？\nＦ１：えっ。服\nふく\nとか？\nＦ２：服\nふく\nもいいけど、赤\nあか\nちゃんが生\nう\nまれると、着\nき\n替\nが\nえとかタオルとかいろいろ持\nも\nち歩\nある\nくものが多\nおお\nく\nなるでしょ。だから、たくさん入\nはい\nるバッグなんかどう？あなたが生\nう\nまれたとき、もらって\nうれしかったわ。\nＦ１：そっか。じゃあ、私\nわたし\nもそうしよう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nに何\nなに\nをプレゼントしますか。\n３番\n友\nとも\n達\nだち\nから留\nる\n守\nす\n番\nばん\n電\nでん\n話\nわ\nにメッセージが入\nはい\nっていました。このメッセージを聞\nき\nいたあと、まず何\nなに\nをしま\nすか。\nＦ：もしもし、まさ子\nこ\nです。急\nきゅう\nなんだけど、明\nあした\n日の夜\nよる\n、ご飯\nはん\n一\nいっ\n緒\nしょ\nにどう？駅\nえき\nの近\nちか\nくにおいしいお\n店\nみせ\nを見\nみ\nつけたから、そこで。そのお店\nみせ\n、けっこう混\nこ\nむから予\nよ\n約\nやく\nしたいし。来\nこ\nられるかどうか、\nなるべく早\nはや\nく教\nおし\nえてくれる？できたら、ご飯\nはん\n食\nた\nべながら今\nこん\n度\nど\n一\nいっ\n緒\nしょ\nに行\nい\nく旅\nりょ\n行\nこう\nの計\nけい\n画\nかく\n立\nた\nてない？\n飛\nひ\n行\nこう\n機\nき\nの予\nよ\n約\nやく\nは早\nはや\nいほうがいいしね。じゃあね。\nこのメッセージを聞\nき\nいたあと、まず何\nなに\nをしますか。\n４番\n母\nはは\n親\nおや\nと息\nむすこ\n子が話\nはな\nしています。息\nむすこ\n子はこのあと、まず何\nなに\nをしますか。\nＦ：あ、太\nた\n郎\nろう\n、今\nいま\nから出\nで\nかけるの？　　　　　　　　　　　　　　　　　　　　　　　　　　　\nＭ：うん。駅\nえき\n前\nまえ\nの映\nえい\n画\nが\n館\nかん\nで友\nとも\n達\nだち\nと映\nえい\n画\nが\n見\nみ\nてくる。\nＦ：あ、そう。それなら、駅\nえき\n前\nまえ\nの郵\nゆう\n便\nびん\n局\nきょく\nに寄\nよ\nって、この荷\nに\n物\nもつ\n、出\nだ\nしてってくれない？\nＭ：えー。ちょっと本\nほん\n屋\nや\nに寄\nよ\nろうと思\nおも\nってたのにな。まあ、映\nえい\n画\nが\nのあとにするか。じゃあ、出\nだ\nして\n55\n55\n聴解スクリプト\n\nきてあげるよ。\nＦ：ありがとう。急\nいそ\nぎだから、映\nえい\n画\nが\nの前\nまえ\nに行\nい\nってね。はい、お金\nかね\n。\nＭ：え、こんなにかかるの？\nＦ：余\nあま\nった分\nぶん\nは、ご飯\nはん\n代\nだい\nにでも使\nつか\nいなさい。\nＭ：やった。\n息\nむすこ\n子はこのあと、まず何\nなに\nをしますか。\n５番\n家\nうち\nの玄\nげん\n関\nかん\nで男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nとホストファミリーのお母\nかあ\nさんが話\nはな\nしています。留\nりゅう\n学\nがく\n生\nせい\nはこれから何\nなに\nを\nしますか。\nＭ：雨\nあめ\n降\nふ\nりそうですね。傘\nかさ\n、持\nも\nってったほうがいいですか。\nＦ：今\nきょう\n日は天\nてん\n気\nき\nがよくなるって言\nい\nってたから、大\nだい\n丈\nじょう\n夫\nぶ\nよ。\nＭ：はい。\nＦ：あれ？リビングのエアコンは消\nけ\nしたよね。\nＭ：ええ、消\nけ\nしてありました。\nＦ：ああ、そう。あっ、いけない。台\nだい\n所\nどころ\nの電\nでん\n気\nき\n、つけたままだった。ごめんね、ちょっと消\nけ\nして\nきてくれる？\nＭ：はい。\nＦ：台\nだい\n所\nどころ\nの小\nちい\nさい窓\nまど\nは開\nあ\nいてるけど、閉\nし\nめなくていいわよ。\nＭ：分\nわ\nかりました。\n留\nりゅう\n学\nがく\n生\nせい\nはこれから何\nなに\nをしますか。\n６番\n会\nかい\n社\nしゃ\nで男\nおとこ\nの人\nひと\nと女\nおんな\nの人\nひと\nが話\nはな\nしています。女\nおんな\nの人\nひと\nはこれから、まず何\nなに\nをしますか。\nＭ：鈴\nすず\n木\nき\nさん、今\nことし\n年の新\nしん\n入\nにゅう\n社\nしゃ\n員\nいん\n歓\nかん\n迎\nげい\n会\nかい\nのことなんだけどね。今\nことし\n年は週\nしゅう\n末\nまつ\nに日\nひ\n帰\nがえ\nりで、どこかに行\nい\nくのはどうだろう。\nＦ：日\nひ\n帰\nがえ\nり旅\nりょ\n行\nこう\nですか。いいかもしれませんね。\nＭ：じゃ、今\nことし\n年はそういうことで、準\nじゅん\n備\nび\nしてくれる？まずは、どこへ行\nい\nきたいか、みんなに聞\nき\nい\nてみて。\nＦ：そうですね。アンケートでもとりましょうか。\n56\n聴解スクリプト\n56\n\nＭ：あ、いや、やっぱり、そんな時\nじ\n間\nかん\nもないし。鈴\nすず\n木\nき\nさんがよさそうな場\nば\n所\nしょ\nを決\nき\nめてください。イ\nンターネットとかで探\nさが\nしてくれる？\nＦ：はい。\nＭ：で、そこで何\nなに\nをするかだな。食\nしょく\n事\nじ\nしただけで終\nお\nわるのは、ちょっとな。\nＦ：そうですね。\nＭ：ま、それは場\nば\n所\nしょ\nが決\nき\nまってから、考\nかんが\nえよう。調\nしら\nべたら、教\nおし\nえてくれる？\nＦ：分\nわ\nかりました。\n女\nおんな\nの人\nひと\nはこれから、まず何\nなに\nをしますか。\n問題２\n例\n女\nおんな\nの人\nひと\nと男\nおとこ\nの人\nひと\nがスーパーで話\nはな\nしています。男\nおとこ\nの人\nひと\nはどうして自\nじ\n分\nぶん\nで料\nりょう\n理\nり\nをしませんか。\nＦ：あら、田\nた\n中\nなか\n君\nくん\n、お買\nか\nい物\nもの\n？\nＭ：うん、夕\nゆう\n飯\nはん\nを買\nか\nいにね。\nＦ：お弁\nべん\n当\nとう\n？自\nじ\n分\nぶん\nで作\nつく\nらないの？時\nじ\n間\nかん\nないか。\nＭ：いや、そうじゃないんだ。\nＦ：じゃあ、作\nつく\nればいいのに。\nＭ：作\nつく\nるのは嫌\nきら\nいじゃないんだ。でも、一\nひとり\n人だと。\nＦ：材\nざい\n料\nりょう\nが余\nあま\nっちゃう？\nＭ：それはいいんだけど、一\nいっ\n生\nしょう\n懸\nけん\n命\nめい\n作\nつく\nっても一\nひとり\n人で食\nた\nべるだけじゃ、なんか寂\nさび\nしくて。\nＦ：それもそうか。\n男\nおとこ\nの人\nひと\nはどうして自\nじ\n分\nぶん\nで料\nりょう\n理\nり\nをしませんか。\n１番\n会\nかい\n社\nしゃ\nで女\nおんな\nの人\nひと\nと男\nおとこ\nの人\nひと\nが話\nはな\nしています。二\nふたり\n人はいつ相\nそう\n談\nだん\nしますか。\nＦ：あのう、新\nあたら\nしい商\nしょう\n品\nひん\nについて相\nそう\n談\nだん\nしたいんですが、いつにしましょうか。\nＭ：あ、そうですね。\nＦ：今\nきょう\n日が金\nきん\n曜\nよう\n日\nび\nでしょ？今\nきょう\n日はもうあまり時\nじ\n間\nかん\nがないから、じゃあ、来\nらい\n週\nしゅう\nの月\nげつ\n曜\nよう\n日\nび\nはどうですか。\n57\n57\n聴解スクリプト\n\nＭ：あ、来\nらい\n週\nしゅう\nの月\nげつ\n曜\nよう\n日\nび\nと火\nか\n曜\nよう\n日\nび\nは出\nしゅっ\n張\nちょう\nなんです。木\nもく\n曜\nよう\n日\nび\nなら、時\nじ\n間\nかん\n、とれますけど。\nＦ：そう、木\nもく\n曜\nよう\n日\nび\nは私\nわたし\nがちょっと忙\nいそが\nしいんで。あのう、出\nしゅっ\n張\nちょう\nから帰\nかえ\nった次\nつぎ\nの日\nひ\nって、忙\nいそが\nしい\nですか。\nＭ：うーん、あ、はい、大\nだい\n丈\nじょう\n夫\nぶ\nです。じゃあ、その日\nひ\nにしましょう。午\nご\n後\nご\n、時\nじ\n間\nかん\n空\nあ\nけておきます。\n二\nふたり\n人はいつ相\nそう\n談\nだん\nしますか。\n２番\n女\nおんな\nの人\nひと\nと男\nおとこ\nの人\nひと\nが料\nりょう\n理\nり\n教\nきょう\n室\nしつ\nについて話\nはな\nしています。女\nおんな\nの人\nひと\nはどうしてこの教\nきょう\n室\nしつ\nに興\nきょう\n味\nみ\nを持\nも\nちましたか。\nＦ：佐\nさ\n藤\nとう\nさん、料\nりょう\n理\nり\n教\nきょう\n室\nしつ\nに行\nい\nってるそうですね。楽\nたの\nしいですか。\nＭ：ええ。いろんな国\nくに\nの料\nりょう\n理\nり\nを作\nつく\nるんですよ。\nＦ：へえ、面\nおも\n白\nしろ\nそう。私\nわたし\n、日\nに\n本\nほん\n料\nりょう\n理\nり\nは習\nなら\nったことがあるので、他\nほか\nの国\nくに\nの料\nりょう\n理\nり\nを作\nつく\nってみたいと\n思\nおも\nっていたんです。あの、その教\nきょう\n室\nしつ\nは、いつ、やってるんですか。\nＭ：月\nつき\nに１回\nかい\n、最\nさい\n初\nしょ\nの土\nど\n曜\nよう\n日\nび\nの午\nご\n後\nご\nです。先\nせん\n生\nせい\nの話\nはなし\nを聞\nき\nいたあと、小\nちい\nさなグループに分\nわ\nかれて料\nりょう\n理\nり\nを作\nつく\nります。\nＦ：そうですか。\nＭ  ：料\nりょう\n金\nきん\nはちょっと高\nたか\nいんですが、人\nにん\n気\nき\nがあるんですよ。あの、よかったら連\nれん\n絡\nらく\n先\nさき\nを教\nおし\nえましょ\nうか。\nＦ：あ、ありがとうございます。\n女\nおんな\nの人\nひと\nはどうしてこの教\nきょう\n室\nしつ\nに興\nきょう\n味\nみ\nを持\nも\nちましたか。\n３番\n女\nおんな\nの学\nがく\n生\nせい\nと男\nおとこ\nの学\nがく\n生\nせい\nが話\nはな\nしています。男\nおとこ\nの学\nがく\n生\nせい\nはどうしてアルバイトを変\nか\nえましたか。\nＦ：今\nいま\nからアルバイト？\nＭ：うん、実\nじつ\nは、今\nきょう\n日からコンビニでアルバイトすることにしたんだ。\nＦ：え？自\nじ\n動\nどう\n車\nしゃ\n工\nこう\n場\nじょう\nのアルバイトは？朝\nあさ\n早\nはや\nくからだったし、大\nたい\n変\nへん\nだったの？\nＭ：いや、早\nはや\n起\nお\nきは平\nへい\n気\nき\nなんだ。それに、時\nじ\n給\nきゅう\nもまあまあよかったし。\nＦ：じゃあ、何\nなん\nで？\nＭ：うーん、ものを作\nつく\nる仕\nし\n事\nごと\nも楽\nたの\nしかったけど、学\nがく\n生\nせい\nのうちに、いろいろな仕\nし\n事\nごと\nをやってみたくてね。\nＦ：そっか。頑\nがん\n張\nば\nって。\n58\n聴解スクリプト\n58\n\n男\nおとこ\nの学\nがく\n生\nせい\nはどうしてアルバイトを変\nか\nえましたか。\n４番\n図\nと\n書\nしょ\n館\nかん\nで男\nおとこ\nの学\nがく\n生\nせい\nと係\nかか\nりの人\nひと\nが話\nはな\nしています。図\nと\n書\nしょ\n館\nかん\nのパソコンコーナーで何\nなに\nをしてはいけませ\nんか。\nＭ：すみません。パソコンを使\nつか\nいたいんですが。\nＦ：はい、どうぞ。\nＭ：あのう、インターネットは使\nつか\nえますか。\nＦ：ええ、利\nり\n用\nよう\nできます。でも、メールはご遠\nえん\n慮\nりょ\nください。\nＭ：分\nわ\nかりました。あと、プリンターは。\nＦ：あ、プリンターはお使\nつか\nいになれますが、有\nゆう\n料\nりょう\nです。\nＭ：あ、そうですか。それから、ＤＶＤは見\nみ\nられますか。\nＦ：はい、大\nだい\n丈\nじょう\n夫\nぶ\nですよ。\n図\nと\n書\nしょ\n館\nかん\nのパソコンコーナーで何\nなに\nをしてはいけませんか。\n５番\n大\nだい\n学\nがく\nで男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nが係\nかか\nりの人\nひと\nにホームステイについて聞\nき\nいています。男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nはどうして\nホームステイに参\nさん\n加\nか\nできませんか。\nＭ：すみません、このホームステイに申\nもう\nし込\nこ\nみをしたいんですが。締\nし\nめ切\nき\nりまだですよね？\nＦ：はい、まだ間\nま\nに合\nあ\nいますよ。参\nさん\n加\nか\nは初\nはじ\nめてですか。\nＭ：いえ、２回\nかい\n目\nめ\nです。２回\nかい\n目\nめ\nでも大\nだい\n丈\nじょう\n夫\nぶ\nですか。\nＦ：はい、大\nだい\n丈\nじょう\n夫\nぶ\nです。えー、日\nに\n本\nほん\nに来\nき\nてどのぐらいになりますか。\nＭ：10 か月\nげつ\nを過\nす\nぎたところです。あと、１か月\nげつ\nで帰\nき\n国\nこく\nする予\nよ\n定\nてい\nです。\nＦ：そうですか。んー、実\nじつ\nは、このホームステイは、来\nらい\n日\nにち\nしてから半\nはん\n年\nとし\n以\nい\n内\nない\nの留\nりゅう\n学\nがく\n生\nせい\nしか申\nもう\nし込\nこ\nみができないことになっているんですよ。\nＭ：え、そうなんですか。\n男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nはどうしてホームステイに参\nさん\n加\nか\nできませんか。\n６番\nテレビで男\nおとこ\nの人\nひと\nが自\nじ\n分\nぶん\nの仕\nし\n事\nごと\nについて話\nはな\nしています。男\nおとこ\nの人\nひと\nは何\nなに\nがうれしいと言\nい\nっていますか。\n59\n59\n聴解スクリプト\n\nＭ：私\nわたし\nは新\nあたら\nしく町\nまち\nにできたスーパーの社\nしゃ\n員\nいん\nです。でも、店\nみせ\nの中\nなか\nでは働\nはたら\nいていません。毎\nまい\n日\nにち\n、車\nくるま\nで、新\nしん\n鮮\nせん\nな肉\nにく\nや魚\nさかな\nなど、店\nみせ\nの商\nしょう\n品\nひん\nを、遠\nとお\nくの村\nむら\nまで売\nう\nりに行\nい\nっています。一\nいち\n日\nにち\nに五\nいつ\nつぐらい\nの村\nむら\nに行\nい\nきます。お客\nきゃく\nさんは、多\nおお\nい日\nひ\nも少\nすく\nない日\nひ\nもありますが、私\nわたし\nの車\nくるま\nが来\nく\nるのを楽\nたの\nしみ\nに待\nま\nっていてくださいます。皆\nみな\nさんに喜\nよろこ\nんでもらえるのが、やっぱり、私\nわたし\nには一\nいち\n番\nばん\nうれしい\nです。\n男\nおとこ\nの人\nひと\nは何\nなに\nがうれしいと言\nい\nっていますか。\n問題３\n例\n女\nおんな\nの人\nひと\nが友\nとも\n達\nだち\nの家\nうち\nに来\nき\nて話\nはな\nしています。\nＦ１：田\nた\n中\nなか\nです。\nＦ２：あ、はあい。昨\nきのう\n日友\nとも\n達\nだち\nが泊\nと\nまりに来\nき\nてたんで、片\nかた\n付\nづ\nいてないけど、入\nはい\nって。\nＦ１：あ、でもここで。すぐ帰\nかえ\nるから。あのう、この前\nまえ\n借\nか\nりた本\nほん\nなんだけど、ちょっと破\nやぶ\nれちゃって。\nＦ２：え、本\nほん\n当\nとう\n？\nＦ１：うん、このページなんだけど。\nＦ２：あっ、うん、このくらいなら大\nだい\n丈\nじょう\n夫\nぶ\n、読\nよ\nめるし。\nＦ１：ほんと？ごめん。これからは気\nき\nをつけるから。\nＦ２：うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１：ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nの家\nうち\nへ何\nなに\nをしに来\nき\nましたか。\n　１．謝\nあやま\nりに来\nき\nた\n　２．本\nほん\nを借\nか\nりに来\nき\nた\n　３．泊\nと\nまりに来\nき\nた\n　４．コーヒーを飲\nの\nみに来\nき\nた\n１番\n留\nる\n守\nす\n番\nばん\n電\nでん\n話\nわ\nのメッセージを聞\nき\nいています。\nＭ：もしもし、田\nた\n中\nなか\nですけど。あのう、明\nあした\n日映\nえい\n画\nが\nに行\nい\nくことになってたよね。でも、急\nきゅう\nに出\nしゅっ\n張\nちょう\n60\n聴解スクリプト\n60\n\nが入\nはい\nっちゃって。それで、悪\nわる\nいんだけど、来\nらい\n週\nしゅう\nにしてもらってもいいかな。僕\nぼく\nから誘\nさそ\nったの\nにごめん。映\nえい\n画\nが\nのあと、食\nしょく\n事\nじ\nごちそうするから。じゃ、また電\nでん\n話\nわ\nするよ。ほんと、ごめんね。\n田\nた\n中\nなか\nさんが一\nいち\n番\nばん\n言\nい\nいたいことは何\nなん\nですか。\n　１．出\nしゅっ\n張\nちょう\nに行\nい\nくこと\n　２．映\nえい\n画\nが\nに行\nい\nく日\nひ\nを変\nか\nえてほしいこと \n　３．食\nしょく\n事\nじ\nをごちそうすること\n　４．また電\nでん\n話\nわ\nすること\n２番\n男\nおとこ\nの学\nがく\n生\nせい\nと女\nおんな\nの学\nがく\n生\nせい\nが話\nはな\nしています。\nＭ：今\nこん\n度\nど\nの日\nにち\n曜\nよう\n日\nび\n、みんなで海\nうみ\nに行\nい\nこうって話\nはなし\nがあるんだけど。\nＦ：海\nうみ\n？いいね。楽\nたの\nしそう。\nＭ：うん。海\nうみ\nで花\nはな\n火\nび\nもするよ。どう？来\nこ\nられそう？\nＦ：面\nおも\n白\nしろ\nそう。でも、今\nこん\n度\nど\nの日\nにち\n曜\nよう\n日\nび\nだよね。月\nげつ\n曜\nよう\nにテストがあるんだ。テストがなかったら行\nい\nきた\nいんだけど。\nＭ：土\nど\n曜\nよう\n日\nび\nに頑\nがん\n張\nば\nったら大\nだい\n丈\nじょう\n夫\nぶ\nだよ。\nＦ：うーん。苦\nにが\n手\nて\nな科\nか\n目\nもく\nだから一\nいち\n日\nにち\nじゃきついかも。また今\nこん\n度\nど\n誘\nさそ\nって。\n女\nおんな\nの学\nがく\n生\nせい\nは日\nにち\n曜\nよう\n日\nび\nに海\nうみ\nへ行\nい\nくことについてどう思\nおも\nっていますか。\n　１．楽\nたの\nしそうだから、行\nい\nくつもりだ\n　２．楽\nたの\nしそうだが、行\nい\nかない\n　３．興\nきょう\n味\nみ\nがないから、行\nい\nかない\n　４．興\nきょう\n味\nみ\nはないが、行\nい\nくつもりだ\n３番\n女\nおんな\nの人\nひと\nが男\nおとこ\nの人\nひと\nに旅\nりょ\n行\nこう\nの感\nかん\n想\nそう\nを聞\nき\nいています。\nＦ：週\nしゅう\n末\nまつ\n、旅\nりょ\n行\nこう\nに行\nい\nってきたんだって？\nＭ：両\nりょう\n親\nしん\nを温\nおん\n泉\nせん\nに連\nつ\nれて行\nい\nったんだ。桜\nさくら\nのきれいな季\nき\n節\nせつ\nだしね。\nＦ：偉\nえら\nいね。ご両\nりょう\n親\nしん\nも喜\nよろこ\nんだでしょう。\nＭ：うん。でも、向\nむ\nこうはもう暖\nあたた\nかくて、桜\nさくら\nはほとんど終\nお\nわってたし、休\nきゅう\n日\nじつ\nだから渋\nじゅう\n滞\nたい\nしてて。\nＦ：そっか。\n61\n61\n聴解スクリプト\n\nＭ：温\nおん\n泉\nせん\nに入\nはい\nれば疲\nつか\nれが取\nと\nれると思\nおも\nってたんだけど、僕\nぼく\nはずっと運\nうん\n転\nてん\nだったからね。\nＦ：ふうん、大\nたい\n変\nへん\nだったね。\nＭ：でもまあ、両\nりょう\n親\nしん\nは久\nひさ\nしぶりにゆっくりできてよかったって言\nい\nってくれたから。\nＦ：じゃ、それが一\nいち\n番\nばん\nじゃない。\nＭ：まあね。\n男\nおとこ\nの人\nひと\nは旅\nりょ\n行\nこう\nについてどう思\nおも\nっていますか。\n　１．桜\nさくら\nがきれいで、よかった\n　２．温\nおん\n泉\nせん\nで疲\nつか\nれが取\nと\nれて、よかった\n　３．両\nりょう\n え、こんなにかかるの？\nＦ：余\nあま\nった分\nぶん\nは、ご飯\nはん\n代\nだい\nにでも使\nつか\nいなさい。\nＭ：やった。\n息\nむすこ\n子はこのあと、まず何\nなに\nをしますか。\n５番\n家\nうち\nの玄\nげん\n関\nかん\nで男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nとホストファミリーのお母\nかあ\nさんが話\nはな\nしています。留\nりゅう\n学\nがく\n生\nせい\nはこれから何\nなに\nを\nしますか。\nＭ：雨\nあめ\n降\nふ\nりそうですね。傘\nかさ\n、持\nも\nってったほうがいいですか。\nＦ：今\nきょう\n日は天\nてん\n気\nき\nがよくなるって言\nい\nってたから、大\nだい\n丈\nじょう\n夫\nぶ\nよ。\nＭ：はい。\nＦ：あれ？リビングのエアコンは消\nけ\nしたよね。\nＭ：ええ、消\nけ\nしてありました。\nＦ：ああ、そう。あっ、いけない。台\nだい\n所\nどころ\nの電\nでん\n気\nき\n、つけたままだった。ごめんね、ちょっと消\nけ\nして\nきてくれる？\nＭ：はい。\nＦ：台\nだい\n所\nどころ\nの小\nちい\nさい窓\nまど\nは開\nあ\nいてるけど、閉\nし\nめなくていいわよ。\nＭ：分\nわ\nかりました。\n留\nりゅう\n学\nがく\n生\nせい\nはこれから何\nなに\nをしますか。\n６番\n会\nかい\n社\nしゃ\nで男\nおとこ\nの人\nひと\nと女\nおんな\nの人\nひと\nが話\nはな\nしています。女\nおんな\nの人\nひと\nはこれから、まず何\nなに\nをしますか。\nＭ：鈴\nすず\n木\nき\nさん、今\nことし\n年の新\nしん\n入\nにゅう\n社\nしゃ\n員\nいん\n歓\nかん\n迎\nげい\n会\nかい\nのことなんだけどね。今\nことし\n年は週\nしゅう\n末\nまつ\nに日\nひ\n帰\nがえ\nりで、どこかに行\nい\nくのはどうだろう。\nＦ：日\nひ\n帰\nがえ\nり旅\nりょ\n行\nこう\nですか。いいかもしれませんね。\nＭ：じゃ、今\nことし\n年はそういうことで、準\nじゅん\n備\nび\nしてくれる？まずは、どこへ行\nい\nきたいか、みんなに聞\nき\nい\nてみて。\nＦ：そうですね。アンケートでもとりましょうか。\n56\n聴解スクリプト\n56\n\nＭ：あ、いや、やっぱり、そんな時\nじ\n間\nかん\nもないし。鈴\nすず\n木\nき\nさんがよさそうな場\nば\n所\nしょ\nを決\nき\nめてください。イ\nンターネットとかで探\nさが\nしてくれる？\nＦ：はい。\nＭ：で、そこで何\nなに\nをするかだな。食\nしょく\n事\nじ\nしただけで終\nお\nわるのは、ちょっとな。\nＦ：そうですね。\nＭ：ま、それは場\nば\n所\nしょ\nが決\nき\nまってから、考\nかんが\nえよう。調\nしら\nべたら、教\nおし\nえてくれる？\nＦ：分\nわ\nかりました。\n女\nおんな\nの人\nひと\nはこれから、まず何\nなに\nをしますか。\n問題２\n例\n女\nおんな\nの人\nひと\nと男\nおとこ\nの人\nひと\nがスーパーで話\nはな\nしています。男\nおとこ\nの人\nひと\nはどうして自\nじ\n分\nぶん\nで料\nりょう\n理\nり\nをしませんか。\nＦ：あら、田\nた\n中\nなか\n君\nくん\n、お買\nか\nい物\nもの\n？\nＭ：うん、夕\nゆう\n飯\nはん\nを買\nか\nいにね。\nＦ：お弁\nべん\n当\nとう\n？自\nじ\n分\nぶん\nで作\nつく\nらないの？時\nじ\n間\nかん\nないか。\nＭ：いや、そうじゃないんだ。\nＦ：じゃあ、作\nつく\nればいいのに。\nＭ：作\nつく\nるのは嫌\nきら\nいじゃないんだ。でも、一\nひとり\n人だと。\nＦ：材\nざい\n料\nりょう\nが余\nあま\nっちゃう？\nＭ：それはいいんだけど、一\nいっ\n生\nしょう\n懸\nけん\n命\nめい\n作\nつく\nっても一\nひとり\n人で食\nた\nべるだけじゃ、なんか寂\nさび\nしくて。\nＦ：それもそうか。\n男\nおとこ\nの人\nひと\nはどうして自\nじ\n分\nぶん\nで料\nりょう\n理\nり\nをしませんか。\n１番\n会\nかい\n社\nしゃ\nで女\nおんな\nの人\nひと\nと男\nおとこ\nの人\nひと\nが話\nはな\nしています。二\nふたり\n人はいつ相\nそう\n談\nだん\nしますか。\nＦ：あのう、新\nあたら\nしい商\nしょう\n品\nひん\nについて相\nそう\n談\nだん\nしたいんですが、いつにしましょうか。\nＭ：あ、そうですね。\nＦ：今\nきょう\n日が金\nきん\n曜\nよう\n日\nび\nでしょ？今\nきょう\n日はもうあまり時\nじ\n間\nかん\nがないから、じゃあ、来\nらい\n週\nしゅう\nの月\nげつ\n曜\nよう\n日\nび\nはどうですか。\n57\n57\n聴解スクリプト\n\nＭ：あ、来\nらい\n週\nしゅう\nの月\nげつ\n曜\nよう\n日\nび\nと火\nか\n曜\nよう\n日\nび\nは出\nしゅっ\n張\nちょう\nなんです。木\nもく\n曜\nよう\n日\nび\nなら、時\nじ\n間\nかん\n、とれますけど。\nＦ：そう、木\nもく\n曜\nよう\n日\nび\nは私\nわたし\nがちょっと忙\nいそが\nしいんで。あのう、出\nしゅっ\n張\nちょう\nから帰\nかえ\nった次\nつぎ\nの日\nひ\nって、忙\nいそが\nしい\nですか。\nＭ：うーん、あ、はい、大\nだい\n丈\nじょう\n夫\nぶ\nです。じゃあ、その日\nひ\nにしましょう。午\nご\n後\nご\n、時\nじ\n間\nかん\n空\nあ\nけておきます。\n二\nふたり\n人はいつ相\nそう\n談\nだん\nしますか。\n２番\n女\nおんな\nの人\nひと\nと男\nおとこ\nの人\nひと\nが料\nりょう\n理\nり\n教\nきょう\n室\nしつ\nについて話\nはな\nしています。女\nおんな\nの人\nひと\nはどうしてこの教\nきょう\n室\nしつ\nに興\nきょう\n味\nみ\nを持\nも\nちましたか。\nＦ：佐\nさ\n藤\nとう\nさん、料\nりょう\n理\nり\n教\nきょう\n室\nしつ\nに行\nい\nってるそうですね。楽\nたの\nしいですか。\nＭ：ええ。いろんな国\nくに\nの料\nりょう\n理\nり\nを作\nつく\nるんですよ。\nＦ：へえ、面\nおも\n白\nしろ\nそう。私\nわたし\n、日\nに\n本\nほん\n料\nりょう\n理\nり\nは習\nなら\nったことがあるので、他\nほか\nの国\nくに\nの料\nりょう\n理\nり\nを作\nつく\nってみたいと\n思\nおも\nっていたんです。あの、その教\nきょう\n室\nしつ\nは、いつ、やってるんですか。\nＭ：月\nつき\nに１回\nかい\n、最\nさい\n初\nしょ\nの土\nど\n曜\nよう\n日\nび\nの午\nご\n後\nご\nです。先\nせん\n生\nせい\nの話\nはなし\nを聞\nき\nいたあと、小\nちい\nさなグループに分\nわ\nかれて料\nりょう\n理\nり\nを作\nつく\nります。\nＦ：そうですか。\nＭ  ：料\nりょう\n金\nきん\nはちょっと高\nたか\nいんですが、人\nにん\n気\nき\nがあるんですよ。あの、よかったら連\nれん\n絡\nらく\n先\nさき\nを教\nおし\nえましょ\nうか。\nＦ：あ、ありがとうございます。\n女\nおんな\nの人\nひと\nはどうしてこの教\nきょう\n室\nしつ\nに興\nきょう\n味\nみ\nを持\nも\nちましたか。\n３番\n女\nおんな\nの学\nがく\n生\nせい\nと男\nおとこ\nの学\nがく\n生\nせい\nが話\nはな\nしています。男\nおとこ\nの学\nがく\n生\nせい\nはどうしてアルバイトを変\nか\nえましたか。\nＦ：今\nいま\nからアルバイト？\nＭ：うん、実\nじつ\nは、今\nきょう\n日からコンビニでアルバイトすることにしたんだ。\nＦ：え？自\nじ\n動\nどう\n車\nしゃ\n工\nこう\n場\nじょう\nのアルバイトは？朝\nあさ\n早\nはや\nくからだったし、大\nたい\n変\nへん\nだったの？\nＭ：いや、早\nはや\n起\nお\nきは平\nへい\n気\nき\nなんだ。それに、時\nじ\n給\nきゅう\nもまあまあよかったし。\nＦ：じゃあ、何\nなん\nで？\nＭ：うーん、ものを作\nつく\nる仕\nし\n事\nごと\nも楽\nたの\nしかったけど、学\nがく\n生\nせい\nのうちに、いろいろな仕\nし\n事\nごと\nをやってみたくてね。\nＦ：そっか。頑\nがん\n張\nば\nって。\n58\n聴解スクリプト\n58\n\n男\nおとこ\nの学\nがく\n生\nせい\nはどうしてアルバイトを変\nか\nえましたか。\n４番\n図\nと\n書\nしょ\n館\nかん\nで男\nおとこ\nの学\nがく\n生\nせい\nと係\nかか\nりの人\nひと\nが話\nはな\nしています。図\nと\n書\nしょ\n館\nかん\nのパソコンコーナーで何\nなに\nをしてはいけませ\nんか。\nＭ：すみません。パソコンを使\nつか\nいたいんですが。\nＦ：はい、どうぞ。\nＭ：あのう、インターネットは使\nつか\nえますか。\nＦ：ええ、利\nり\n用\nよう\nできます。でも、メールはご遠\nえん\n慮\nりょ\nください。\nＭ：分\nわ\nかりました。あと、プリンターは。\nＦ：あ、プリンターはお使\nつか\nいになれますが、有\nゆう\n料\nりょう\nです。\nＭ：あ、そうですか。それから、ＤＶＤは見\nみ\nられますか。\nＦ：はい、大\nだい\n丈\nじょう\n夫\nぶ\nですよ。\n図\nと\n書\nしょ\n館\nかん\nのパソコンコーナーで何\nなに\nをしてはいけませんか。\n５番\n大\nだい\n学\nがく\nで男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nが係\nかか\nりの人\nひと\nにホームステイについて聞\nき\nいています。男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nはどうして\nホームステイに参\nさん\n加\nか\nできませんか。\nＭ：すみません、このホームステイに申\nもう\nし込\nこ\nみをしたいんですが。締\nし\nめ切\nき\nりまだですよね？\nＦ：はい、まだ間\nま\nに合\nあ\nいますよ。参\nさん\n加\nか\nは初\nはじ\nめてですか。\nＭ：いえ、２回\nかい\n目\nめ\nです。２回\nかい\n目\nめ\nでも大\nだい\n丈\nじょう\n夫\nぶ\nですか。\nＦ：はい、大\nだい\n丈\nじょう\n夫\nぶ\nです。えー、日\nに\n本\nほん\nに来\nき\nてどのぐらいになりますか。\nＭ：10 か月\nげつ\nを過\nす\nぎたところです。あと、１か月\nげつ\nで帰\nき\n国\nこく\nする予\nよ\n定\nてい\nです。\nＦ：そうですか。んー、実\nじつ\nは、このホームステイは、来\nらい\n日\nにち\nしてから半\nはん\n年\nとし\n以\nい\n内\nない\nの留\nりゅう\n学\nがく\n生\nせい\nしか申\nもう\nし込\nこ\nみができないことになっているんですよ。\nＭ：え、そうなんですか。\n男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nはどうしてホームステイに参\nさん\n加\nか\nできませんか。\n６番\nテレビで男\nおとこ\nの人\nひと\nが自\nじ\n分\nぶん\nの仕\nし\n事\nごと\nについて話\nはな\nしています。男\nおとこ\nの人\nひと\nは何\nなに\nがうれしいと言\nい\nっていますか。\n59\n59\n聴解スクリプト\n\nＭ：私\nわたし\nは新\nあたら\nしく町\nまち\nにできたスーパーの社\nしゃ\n員\nいん\nです。でも、店\nみせ\nの中\nなか\nでは働\nはたら\nいていません。毎\nまい\n日\nにち\n、車\nくるま\nで、新\nしん\n鮮\nせん\nな肉\nにく\nや魚\nさかな\nなど、店\nみせ\nの商\nしょう\n品\nひん\nを、遠\nとお\nくの村\nむら\nまで売\nう\nりに行\nい\nっています。一\nいち\n日\nにち\nに五\nいつ\nつぐらい\nの村\nむら\nに行\nい\nきます。お客\nきゃく\nさんは、多\nおお\nい日\nひ\nも少\nすく\nない日\nひ\nもありますが、私\nわたし\nの車\nくるま\nが来\nく\nるのを楽\nたの\nしみ\nに待\nま\nっていてくださいます。皆\nみな\nさんに喜\nよろこ\nんでもらえるのが、やっぱり、私\nわたし\nには一\nいち\n番\nばん\nうれしい\nです。\n男\nおとこ\nの人\nひと\nは何\nなに\nがうれしいと言\nい\nっていますか。\n問題３\n例\n女\nおんな\nの人\nひと\nが友\nとも\n達\nだち\nの家\nうち\nに来\nき\nて話\nはな\nしています。\nＦ１：田\nた\n中\nなか\nです。\nＦ２：あ、はあい。昨\nきのう\n日友\nとも\n達\nだち\nが泊\nと\nまりに来\nき\nてたんで、片\nかた\n付\nづ\nいてないけど、入\nはい\nって。\nＦ１：あ、でもここで。すぐ帰\nかえ\nるから。あのう、この前\nまえ\n借\nか\nりた本\nほん\nなんだけど、ちょっと破\nやぶ\nれちゃって。\nＦ２：え、本\nほん\n当\nとう\n？\nＦ１：うん、このページなんだけど。\nＦ２：あっ、うん、このくらいなら大\nだい\n丈\nじょう\n夫\nぶ\n、読\nよ\nめるし。\nＦ１：ほんと？ごめん。これからは気\nき\nをつけるから。\nＦ２：うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１：ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nの家\nうち\nへ何\nなに\nをしに来\nき\nましたか。\n　１．謝\nあやま\nりに来\nき\nた\n　２．本\nほん\nを借\nか\nりに来\nき\nた\n　３．泊\nと\nまりに来\nき\nた\n　４．コーヒーを飲\nの\nみに来\nき\nた\n１番\n留\nる\n守\nす\n番\nばん\n電\nでん\n話\nわ\nのメッセージを聞\nき\nいています。\nＭ：もしもし、田\nた\n中\nなか\nですけど。あのう、明\nあした\n日映\nえい\n画\nが\nに行\nい\nくことになってたよね。でも、急\nきゅう\nに出\nしゅっ\n張\nちょう\n60\n聴解スクリプト\n60\n\nが入\nはい\nっちゃって。それで、悪\nわる\nいんだけど、来\nらい\n週\nしゅう\nにしてもらってもいいかな。僕\nぼく\nから誘\nさそ\nったの\nにごめん。映\nえい\n画\nが\nのあと、食\nしょく\n事\nじ\nごちそうするから。じゃ、また電\nでん\n話\nわ\nするよ。ほんと、ごめんね。\n田\nた\n中\nなか\nさんが一\nいち\n番\nばん\n言\nい\nいたいことは何\nなん\nですか。\n　１．出\nしゅっ\n張\nちょう\nに行\nい\nくこと\n　２．映\nえい\n画\nが\nに行\nい\nく日\nひ\nを変\nか\nえてほしいこと \n　３．食\nしょく\n事\nじ\nをごちそうすること\n　４．また電\nでん\n話\nわ\nすること\n２番\n男\nおとこ\nの学\nがく\n生\nせい\nと女\nおんな\nの学\nがく\n生\nせい\nが話\nはな\nしています。\nＭ：今\nこん\n度\nど\nの日\nにち\n曜\nよう\n日\nび\n、みんなで海\nうみ\nに行\nい\nこうって話\nはなし\nがあるんだけど。\nＦ：海\nうみ\n？いいね。楽\nたの\nしそう。\nＭ：うん。海\nうみ\nで花\nはな\n火\nび\nもするよ。どう？来\nこ\nられそう？\nＦ：面\nおも\n白\nしろ\nそう。でも、今\nこん\n度\nど\nの日\nにち\n曜\nよう\n日\nび\nだよね。月\nげつ\n曜\nよう\nにテストがあるんだ。テストがなかったら行\nい\nきた\nいんだけど。\nＭ：土\nど\n曜\nよう\n日\nび\nに頑\nがん\n張\nば\nったら大\nだい\n丈\nじょう\n夫\nぶ\nだよ。\nＦ：うーん。苦\nにが\n手\nて\nな科\nか\n目\nもく\nだから一\nいち\n日\nにち\nじゃきついかも。また今\nこん\n度\nど\n誘\nさそ\nって。\n女\nおんな\nの学\nがく\n生\nせい\nは日\nにち\n曜\nよう\n日\nび\nに海\nうみ\nへ行\nい\nくことについてどう思\nおも\nっていますか。\n　１．楽\nたの\nしそうだから、行\nい\nくつもりだ\n　２．楽\nたの\nしそうだが、行\nい\nかない\n　３．興\nきょう\n味\nみ\nがないから、行\nい\nかない\n　４．興\nきょう\n味\nみ\nはないが、行\nい\nくつもりだ\n３番\n女\nおんな\nの人\nひと\nが男\nおとこ\nの人\nひと\nに旅\nりょ\n行\nこう\nの感\nかん\n想\nそう\nを聞\nき\nいています。\nＦ：週\nしゅう\n末\nまつ\n、旅\nりょ\n行\nこう\nに行\nい\nってきたんだって？\nＭ：両\nりょう\n親\nしん\nを温\nおん\n泉\nせん\nに連\nつ\nれて行\nい\nったんだ。桜\nさくら\nのきれいな季\nき\n節\nせつ\nだしね。\nＦ：偉\nえら\nいね。ご両\nりょう\n親\nしん\nも喜\nよろこ\nんだでしょう。\nＭ：うん。でも、向\nむ\nこうはもう暖\nあたた\nかくて、桜\nさくら\nはほとんど終\nお\nわってたし、休\nきゅう\n日\nじつ\nだから渋\nじゅう\n滞\nたい\nしてて。\nＦ：そっか。\n61\n61\n聴解スクリプト\n\nＭ：温\nおん\n泉\nせん\nに入\nはい\nれば疲\nつか\nれが取\nと\nれると思\nおも\nってたんだけど、僕\nぼく\nはずっと運\nうん\n転\nてん\nだったからね。\nＦ：ふうん、大\nたい\n変\nへん\nだったね。\nＭ：でもまあ、両\nりょう\n親\nしん\nは久\nひさ\ 。\n64\n聴解スクリプト\n64\n\n７番\nＭ：あの映\nえい\n画\nが\n、もうやってないんだって。\nＦ：１．じゃ、明\nあした\n日見\nみ\nに行\nい\nこうよ。\n　　２．うん、まだやってないみたい。\n　　３．えっ、終\nお\nわっちゃったんだ。\n８番\nＭ：このプリント、クラスのみんなに配\nくば\nっといてもらえますか。\nＦ：１．あっ、取\nと\nってあります。\n　　２．はい、やっておきます。\n　　３．すぐもらえると思\nおも\nいます。\n65\n65\n聴解スクリプト\n"}, {"id": "v1_listening_27", "vol": 1, "vol_title": "2012년 제1집 (Vol.1)", "section": "listening", "section_title": "청해", "section_jp": "聴解", "q_idx": 99, "sub_q_num": 27, "image": "crops/vol1/listening_q27.png", "audio": "audio/vol1/listening_q27.mp3", "answer": 2, "options_count": 3, "script": "聴\nちょう\n解\nかい\nスクリプト\n（Ｍ：男性　Ｆ：女性）\n問題１\n例\nホテルで会\nかい\n社\nしゃ\n員\nいん\nの男\nおとこ\nの人\nひと\nと女\nおんな\nの人\nひと\nが話\nはな\nしています。女\nおんな\nの人\nひと\nは明\nあした\n日何\nなん\n時\nじ\nまでにホテルを出\nで\nますか。\nＭ：では、明\nあした\n日は、９時\nじ\n半\nはん\nに事\nじ\n務\nむ\n所\nしょ\nにいらしてください。\nＦ：はい、ええと、このホテルから事\nじ\n務\nむ\n所\nしょ\nまで、タクシーでどのぐらいかかりますか。\nＭ：そうですね、30 分\nぷん\nもあれば着\nつ\nきますね。\nＦ：じゃあ、９時\nじ\nに出\nで\nればいいですね。\nＭ：あ、朝\nあさ\nは道\nみち\nが混\nこ\nむかもしれません。15 分\nふん\nぐらい早\nはや\nめに出\nで\nられたほうがいいですね。\nＦ：そうですか。じゃあ、そうします。\n女\nおんな\nの人\nひと\nは明\nあした\n日何\nなん\n時\nじ\nまでにホテルを出\nで\nますか。\n１番\n会\nかい\n社\nしゃ\nで男\nおとこ\nの人\nひと\nと女\nおんな\nの人\nひと\nがメモを見\nみ\nながら話\nはな\nしています。男\nおとこ\nの人\nひと\nは何\nなに\nを注\nちゅう\n文\nもん\nしますか。\nＭ：必\nひつ\n要\nよう\nな文\nぶん\n房\nぼう\n具\nぐ\n、書\nか\nき出\nだ\nしてみたんですけど、見\nみ\nてもらえますか。\nＦ：うん。ええと、のりとボールペン。あ、ボールペンはいいわ。もう私\nわたし\nの方\nほう\nで注\nちゅう\n文\nもん\nして、今\nきょう\n日\n届\nとど\nくことになってるから。\nＭ：はい。\nＦ：それから、ノートと封\nふう\n筒\nとう\n、あれ、封\nふう\n筒\nとう\nはまだけっこう残\nのこ\nってたようだけど。\nＭ：まだあるんですが、今\nきょう\n日の午\nご\n後\nご\n大\nたい\n量\nりょう\nに使\nつか\nうので、注\nちゅう\n文\nもん\nしといたほうがいいと思\nおも\nったんですけど。\nＦ：じゃあ、必\nひつ\n要\nよう\nね。それから、コピー用\nよう\n紙\nし\nはね、毎\nまい\n月\nつき\n届\nとど\nけてもらってるから、注\nちゅう\n文\nもん\nしなくていいのよ。\nＭ：はい。\nＦ：じゃあ、これで注\nちゅう\n文\nもん\nよろしくね。     \nＭ：はい、分\nわ\nかりました。\n男\nおとこ\nの人\nひと\nは何\nなに\nを注\nちゅう\n文\nもん\nしますか。\n54\n聴解スクリプト\n54\n\n２番\n女\nおんな\nの人\nひと\nと母\nはは\n親\nおや\nが話\nはな\nしています。女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nに何\nなに\nをプレゼントしますか。\nＦ１：お母\nかあ\nさん、友\nとも\n達\nだち\nに赤\nあか\nちゃんが生\nう\nまれたんだけど、お祝\nいわ\nい何\nなに\nがいいと思\nおも\nう？\nＦ２：そうね。よく贈\nおく\nるのは、着\nき\nるものとか、おもちゃだ 人\nひと\nと男\nおとこ\nの人\nひと\nが料\nりょう\n理\nり\n教\nきょう\n室\nしつ\nについて話\nはな\nしています。女\nおんな\nの人\nひと\nはどうしてこの教\nきょう\n室\nしつ\nに興\nきょう\n味\nみ\nを持\nも\nちましたか。\nＦ：佐\nさ\n藤\nとう\nさん、料\nりょう\n理\nり\n教\nきょう\n室\nしつ\nに行\nい\nってるそうですね。楽\nたの\nしいですか。\nＭ：ええ。いろんな国\nくに\nの料\nりょう\n理\nり\nを作\nつく\nるんですよ。\nＦ：へえ、面\nおも\n白\nしろ\nそう。私\nわたし\n、日\nに\n本\nほん\n料\nりょう\n理\nり\nは習\nなら\nったことがあるので、他\nほか\nの国\nくに\nの料\nりょう\n理\nり\nを作\nつく\nってみたいと\n思\nおも\nっていたんです。あの、その教\nきょう\n室\nしつ\nは、いつ、やってるんですか。\nＭ：月\nつき\nに１回\nかい\n、最\nさい\n初\nしょ\nの土\nど\n曜\nよう\n日\nび\nの午\nご\n後\nご\nです。先\nせん\n生\nせい\nの話\nはなし\nを聞\nき\nいたあと、小\nちい\nさなグループに分\nわ\nかれて料\nりょう\n理\nり\nを作\nつく\nります。\nＦ：そうですか。\nＭ  ：料\nりょう\n金\nきん\nはちょっと高\nたか\nいんですが、人\nにん\n気\nき\nがあるんですよ。あの、よかったら連\nれん\n絡\nらく\n先\nさき\nを教\nおし\nえましょ\nうか。\nＦ：あ、ありがとうございます。\n女\nおんな\nの人\nひと\nはどうしてこの教\nきょう\n室\nしつ\nに興\nきょう\n味\nみ\nを持\nも\nちましたか。\n３番\n女\nおんな\nの学\nがく\n生\nせい\nと男\nおとこ\nの学\nがく\n生\nせい\nが話\nはな\nしています。男\nおとこ\nの学\nがく\n生\nせい\nはどうしてアルバイトを変\nか\nえましたか。\nＦ：今\nいま\nからアルバイト？\nＭ：うん、実\nじつ\nは、今\nきょう\n日からコンビニでアルバイトすることにしたんだ。\nＦ：え？自\nじ\n動\nどう\n車\nしゃ\n工\nこう\n場\nじょう\nのアルバイトは？朝\nあさ\n早\nはや\nくからだったし、大\nたい\n変\nへん\nだったの？\nＭ：いや、早\nはや\n起\nお\nきは平\nへい\n気\nき\nなんだ。それに、時\nじ\n給\nきゅう\nもまあまあよかったし。\nＦ：じゃあ、何\nなん\nで？\nＭ：うーん、ものを作\nつく\nる仕\nし\n事\nごと\nも楽\nたの\nしかったけど、学\nがく\n生\nせい\nのうちに、いろいろな仕\nし\n事\nごと\nをやってみたくてね。\nＦ：そっか。頑\nがん\n張\nば\nって。\n58\n聴解スクリプト\n58\n\n男\nおとこ\nの学\nがく\n生\nせい\nはどうしてアルバイトを変\nか\nえましたか。\n４番\n図\nと\n書\nしょ\n館\nかん\nで男\nおとこ\nの学\nがく\n生\nせい\nと係\nかか\nりの人\nひと\nが話\nはな\nしています。図\nと\n書\nしょ\n館\nかん\nのパソコンコーナーで何\nなに\nをしてはいけませ\nんか。\nＭ：すみません。パソコンを使\nつか\nいたいんですが。\nＦ：はい、どうぞ。\nＭ：あのう、インターネットは使\nつか\nえますか。\nＦ：ええ、利\nり\n用\nよう\nできます。でも、メールはご遠\nえん\n慮\nりょ\nください。\nＭ：分\nわ\nかりました。あと、プリンターは。\nＦ：あ、プリンターはお使\nつか\nいになれますが、有\nゆう\n料\nりょう\nです。\nＭ：あ、そうですか。それから、ＤＶＤは見\nみ\nられますか。\nＦ：はい、大\nだい\n丈\nじょう\n夫\nぶ\nですよ。\n図\nと\n書\nしょ\n館\nかん\nのパソコンコーナーで何\nなに\nをしてはいけませんか。\n５番\n大\nだい\n学\nがく\nで男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nが係\nかか\nりの人\nひと\nにホームステイについて聞\nき\nいています。男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nはどうして\nホームステイに参\nさん\n加\nか\nできませんか。\nＭ：すみません、このホームステイに申\nもう\nし込\nこ\nみをしたいんですが。締\nし\nめ切\nき\nりまだですよね？\nＦ：はい、まだ間\nま\nに合\nあ\nいますよ。参\nさん\n加\nか\nは初\nはじ\nめてですか。\nＭ：いえ、２回\nかい\n目\nめ\nです。２回\nかい\n目\nめ\nでも大\nだい\n丈\nじょう\n夫\nぶ\nですか。\nＦ：はい、大\nだい\n丈\nじょう\n夫\nぶ\nです。えー、日\nに\n本\nほん\nに来\nき\nてどのぐらいになりますか。\nＭ：10 か月\nげつ\nを過\nす\nぎたところです。あと、１か月\nげつ\nで帰\nき\n国\nこく\nする予\nよ\n定\nてい\nです。\nＦ：そうですか。んー、実\nじつ\nは、このホームステイは、来\nらい\n日\nにち\nしてから半\nはん\n年\nとし\n以\nい\n内\nない\nの留\nりゅう\n学\nがく\n生\nせい\nしか申\nもう\nし込\nこ\nみができないことになっているんですよ。\nＭ：え、そうなんですか。\n男\nおとこ\nの留\nりゅう\n学\nがく\n生\nせい\nはどうしてホームステイに参\nさん\n加\nか\nできませんか。\n６番\nテレビで男\nおとこ\nの人\nひと\nが自\nじ\n分\nぶん\nの仕\nし\n事\nごと\nについて話\nはな\nしています。男\nおとこ\nの人\nひと\nは何\nなに\nがうれしいと言\nい\nっていますか。\n59\n59\n聴解スクリプト\n\nＭ：私\nわたし\nは新\nあたら\nしく町\nまち\nにできたスーパーの社\nしゃ\n員\nいん\nです。でも、店\nみせ\nの中\nなか\nでは働\nはたら\nいていません。毎\nまい\n日\nにち\n、車\nくるま\nで、新\nしん\n鮮\nせん\nな肉\nにく\nや魚\nさかな\nなど、店\nみせ\nの商\nしょう\n品\nひん\nを、遠\nとお\nくの村\nむら\nまで売\nう\nりに行\nい\nっています。一\nいち\n日\nにち\nに五\nいつ\nつぐらい\nの村\nむら\nに行\nい\nきます。お客\nきゃく\nさんは、多\nおお\nい日\nひ\nも少\nすく\nない日\nひ\nもありますが、私\nわたし\nの車\nくるま\nが来\nく\nるのを楽\nたの\nしみ\nに待\nま\nっていてくださいます。皆\nみな\nさんに喜\nよろこ\nんでもらえるのが、やっぱり、私\nわたし\nには一\nいち\n番\nばん\nうれしい\nです。\n男\nおとこ\nの人\nひと\nは何\nなに\nがうれしいと言\nい\nっていますか。\n問題３\n例\n女\nおんな\nの人\nひと\nが友\nとも\n達\nだち\nの家\nうち\nに来\nき\nて話\nはな\nしています。\nＦ１：田\nた\n中\nなか\nです。\nＦ２：あ、はあい。昨\nきのう\n日友\nとも\n達\nだち\nが泊\nと\nまりに来\nき\nてたんで、片\nかた\n付\nづ\nいてないけど、入\nはい\nって。\nＦ１：あ、でもここで。すぐ帰\nかえ\nるから。あのう、この前\nまえ\n借\nか\nりた本\nほん\nなんだけど、ちょっと破\nやぶ\nれちゃって。\nＦ２：え、本\nほん\n当\nとう\n？\nＦ１：うん、このページなんだけど。\nＦ２：あっ、うん、このくらいなら大\nだい\n丈\nじょう\n夫\nぶ\n、読\nよ\nめるし。\nＦ１：ほんと？ごめん。これからは気\nき\nをつけるから。\nＦ２：うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１：ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nの家\nうち\nへ何\nなに\nをしに来\nき\nましたか。\n　１．謝\nあやま\nりに来\nき\nた\n　２．本\nほん\nを借\nか\nりに来\nき\nた\n　３．泊\nと\nまりに来\nき\nた\n　４．コーヒーを飲\nの\nみに来\nき\nた\n１番\n留\nる\n守\nす\n番\nばん\n電\nでん\n話\nわ\nのメッセージを聞\nき\nいています。\nＭ：もしもし、田\nた\n中\nなか\nですけど。あのう、明\nあした\n日映\nえい\n画\nが\nに行\nい\nくことになってたよね。でも、急\nきゅう\nに出\nしゅっ\n張\nちょう\n60\n聴解スクリプト\n60\n\nが入\nはい\nっちゃって。それで、悪\nわる\nいんだけど、来\nらい\n週\nしゅう\nにしてもらってもいいかな。僕\nぼく\nから誘\nさそ\nったの\nにごめん。映\nえい\n画\nが\nのあと、食\nしょく\n事\nじ\nごちそうするから。じゃ、また電\nでん\n話\nわ\nするよ。ほんと、ごめんね。\n田\nた\n中\nなか\nさんが一\nいち\n番\nばん\n言\nい\nいたいことは何\nなん\nですか。\n　１．出\nしゅっ\n張\nちょう\nに行\nい\nくこと\n　２．映\nえい\n画\nが\nに行\nい\nく日\nひ\nを変\nか\nえてほしいこと \n　３．食\nしょく\n事\nじ\nをごちそうすること\n　４．また電\nでん\n話\nわ\nすること\n２番\n男\nおとこ\nの学\nがく\n生\nせい\nと女\nおんな\nの学\nがく\n生\nせい\nが話\nはな\nしています。\nＭ：今\nこん\n度\nど\nの日\nにち\n曜\nよう\n日\nび\n、みんなで海\nうみ\nに行\nい\nこうって話\nはなし\nがあるんだけど。\nＦ：海\nうみ\n？いいね。楽\nたの\nしそう。\nＭ：うん。海\nうみ\nで花\nはな\n火\nび\nもするよ。どう？来\nこ\nられそう？\nＦ：面\nおも\n白\nしろ\nそう。でも、今\nこん\n度\nど\nの日\nにち\n曜\nよう\n日\nび\nだよね。月\nげつ\n曜\nよう\nにテストがあるんだ。テストがなかったら行\nい\nきた\nいんだけど。\nＭ：土\nど\n曜\nよう\n日\nび\nに頑\nがん\n張\nば\nったら大\nだい\n丈\nじょう\n夫\nぶ\nだよ。\nＦ：うーん。苦\nにが\n手\nて\nな科\nか\n目\nもく\nだから一\nいち\n日\nにち\nじゃきついかも。また今\nこん\n度\nど\n誘\nさそ\nって。\n女\nおんな\nの学\nがく\n生\nせい\nは日\nにち\n曜\nよう\n日\nび\nに海\nうみ\nへ行\nい\nくことについてどう思\nおも\nっていますか。\n　１．楽\nたの\nしそうだから、行\nい\nくつもりだ\n　２．楽\nたの\nしそうだが、行\nい\nかない\n　３．興\nきょう\n味\nみ\nがないから、行\nい\nかない\n　４．興\nきょう\n味\nみ\nはないが、行\nい\nくつもりだ\n３番\n女\nおんな\nの人\nひと\nが男\nおとこ\nの人\nひと\nに旅\nりょ\n行\nこう\nの感\nかん\n想\nそう\nを聞\nき\nいています。\nＦ：週\nしゅう\n末\nまつ\n、旅\nりょ\n行\nこう\nに行\nい\nってきたんだって？\nＭ：両\nりょう\n親\nしん\nを温\nおん\n泉\nせん\nに連\nつ\nれて行\nい\nったんだ。桜\nさくら\nのきれいな季\nき\n節\nせつ\nだしね。\nＦ：偉\nえら\nいね。ご両\nりょう\n親\nしん\nも喜\nよろこ\nんだでしょう。\nＭ：うん。でも、向\nむ\nこうはもう暖\nあたた\nかくて、桜\nさくら\nはほとんど終\nお\nわってたし、休\nきゅう\n日\nじつ\nだから渋\nじゅう\n滞\nたい\nしてて。\nＦ：そっか。\n61\n61\n聴解スクリプト\n\nＭ：温\nおん\n泉\nせん\nに入\nはい\nれば疲\nつか\nれが取\nと\nれると思\nおも\nってたんだけど、僕\nぼく\nはずっと運\nうん\n転\nてん\nだったからね。\nＦ：ふうん、大\nたい\n変\nへん\nだったね。\nＭ：でもまあ、両\nりょう\n親\nしん\nは久\nひさ\nしぶりにゆっくりできてよかったって言\nい\nってくれたから。\nＦ：じゃ、それが一\nいち\n番\nばん\nじゃない。\nＭ：まあね。\n男\nおとこ\nの人\nひと\nは旅\nりょ\n行\nこう\nについてどう思\nおも\nっていますか。\n　１．桜\nさくら\nがきれいで、よかった\n　２．温\nおん\n泉\nせん\nで疲\nつか\nれが取\nと\nれて、よかった\n　３．両\nりょう\n親\nしん\nが疲\nつか\nれたので、よくなかった\n　４．両\nりょう\n親\nしん\nが満\nまん\n足\nぞく\nして、よかった\n問題４\n例\nホテルのテレビが壊\nこわ\nれています。何\nなん\nと言\nい\nいますか。\nＦ：１．テレビがつかないんですが。\n　　２．テレビをつけてもいいですか。\n　　３．テレビをつけたほうがいいですよ。\n１番\n先\nせん\n輩\nぱい\nが忙\nいそが\nしそうなので、手\nて\n伝\nつだ\nいたいです。先\nせん\n輩\nぱい\nに何\nなん\nと言\nい\nいますか。\nＦ：１．あの、手\nて\n伝\nつだ\nってくれませんか。\n　　２．あの、手\nて\n伝\nつだ\nいましょうか。\n　　３．あの、手\nて\n伝\nつだ\nいませんか。\n２番\n試\nし\n験\nけん\nに合\nごう\n格\nかく\nしたので、先\nせん\n生\nせい\nに伝\nつた\nえたいです。先\nせん\n生\nせい\nに何\nなん\nと言\nい\nいますか。\nＭ：１．今\nこん\n回\nかい\nはおめでとうございます。\n　　２．今\nこん\n度\nど\n、合\nごう\n格\nかく\nなさいました。\n62\n聴解スクリプト\n62\n\n　　３．おかげさまで、試\nし\n験\nけん\nに受\nう\nかりました。\n３番\n友\nとも\n達\nだち\nと食\nしょく\n事\nじ\nをしています。しょうゆを使\nつか\nいたいです。友\nとも\n達\nだち\nに何\nなん\nと言\nい\nいますか。\nＦ：１．しょうゆ、取\nと\nろうか。\n　　２．しょうゆ、取\nと\nってくれない？\n　　３．しょうゆ、取\nと\nってもいいよ。\n４番\n会\nかい\n社\nしゃ\nでお客\nきゃく\nさんを部\nへ\n屋\nや\nに案\nあん\n内\nない\nしました。何\nなん\nと言\nい\nいますか。\nＭ：１．どうぞおかけください。\n　　２．座\nすわ\nらせていただきます。\n　　３．席\nせき\nをお取\nと\nりしましょうか。\n　\n問題５\n例\nＭ：すみません、今\nいま\n、時\nじ\n間\nかん\n、ありますか。\nＦ：１．ええと、10 時\nじ\n20 分\nぷん\nです。\n　　２．ええ。何\nなん\nですか。\n　　３．時\nと\n計\nけい\nはあそこですよ。\n１番\nＭ：リンさん、明\nあした\n日のアルバイト、３時\nじ\nに来\nき\nてほしいんですが。\nＦ：１．いつでも来\nき\nてください。\n　　２．都\nつ\n合\nごう\nはどうですか。\n　　３．はい、大\nだい\n丈\nじょう\n夫\nぶ\nです。\n63\n63\n聴解スクリプト\n\n２番\nＦ：田\nた\n中\nなか\nさん、明\nあ\nす\n日の旅\nりょ\n行\nこう\nは８時\nじ\n出\nしゅっ\n発\nぱつ\nですよ。遅\nおく\nれないようにね。\nＭ：１．気\nき\nをつけます。\n　　２．そうしてください。\n　　３．よく気\nき\nがつきます。\n３番\nＦ：あれ、雨\nあめ\nですか。そんなに濡\nぬ\nれちゃって。\nＭ：１．じゃあ、傘\nかさ\nはいりませんね。\n　　２．いつ降\nふ\nるんでしょう。\n　　３．急\nきゅう\nに降\nふ\nってきたんです。\n４番\nＦ：暑\nあつ\nいので、ちょっと窓\nまど\nを開\nあ\nけてもよろしいでしょうか。\nＭ：１．じゃあ、閉\nし\nめましょう。\n　　２．ええ、かまいませんよ。\n　　３．いえ、どういたしまして。\n５番\nＦ：お客\nきゃく\n様\nさま\n、こちらで召\nめ\nし上\nあ\nがりますか、お持\nも\nち帰\nかえ\nりになりますか。\nＭ：１．はい、大\nだい\n丈\nじょう\n夫\nぶ\nです。\n　　２．ここで食\nた\nべます。\n　　３．いいえ、持\nも\nちますよ。\n６番\nＭ：バス、なかなか来\nこ\nないですね。\nＦ：１．道\nみち\nが混\nこ\nんでるんでしょうか。\n　　２．バスにしてよかったですね。\n　　３．随\nずい\n分\nぶん\n早\nはや\nそうですね。\n64\n聴解スクリプト\n64\n\n７番\nＭ：あの映\nえい\n画\nが\n、もうやってないんだって。\nＦ：１．じゃ、明\nあした\n日見\nみ\nに行\nい\nこうよ。\n　　２．うん、まだやってないみたい。\n　　３．えっ、終\nお\nわっちゃったんだ。\n８番\nＭ：このプリント、クラスのみんなに配\nくば\nっといてもらえますか。\nＦ：１．あっ、取\nと\nってあります。\n　　２．はい、やっておきます。\n　　３．すぐもらえると思\nおも\nいます。\n65\n65\n聴解スクリプト\n"}, {"id": "v2_vocab_01", "vol": 2, "vol_title": "2018년 제2집 (Vol.2)", "section": "vocab", "section_title": "언어지식 (문자·어휘)", "section_jp": "文字・語彙", "q_idx": 1, "sub_q_num": 1, "image": "crops/vol2/vocab_q01.png", "audio": null, "answer": 4, "options_count": 4, "script": null}, {"id": "v2_vocab_02", "vol": 2, "vol_title": "2018년 제2집 (Vol.2)", dio": null, "answer": 2, "options_count": 4, "script": null}, {"id": "v2_listening_01", "vol": 2, "vol_title": "2018년 제2집 (Vol.2)", "section": "listening", "section_title": "청해", "section_jp": "聴解", "q_idx": 75, "sub_q_num": 1, "image": "crops/vol2/listening_q01.png", "audio": "audio/vol2/listening_q01.mp3", "answer": 2, "options_count": 4, "script": "聴\nちょう\n解\nかい\nスクリプト\n（Ｍ：男性　Ｆ：女性）\n問題1\n例\nホテルで会\nかい\n社\nしゃ\n員\nいん\nの男\nおとこ\nの人\nひと\nと女\nおんな\nの人\nひと\nが話\nはな\nしています。女\nおんな\nの人\nひと\nは明\nあした\n日何\nなん\n時\nじ\nまでにホテルを出\nで\nますか。\nＭ ： では、明\nあした\n日は、9 時\nじ\n半\nはん\nに事\nじ\n務\nむ\n所\nしょ\nにいらしてください。\nＦ ： はい、ええと、このホテルから事\nじ\n務\nむ\n所\nしょ\nまで、タクシーでどのぐらいかかりますか。\nＭ ： そうですね、30 分\nぷん\nもあれば着\nつ\nきますね。\nＦ ： じゃ、9 時\nじ\nに出\nで\nればいいですね。\nＭ ： あ、朝\nあさ\nは道\nみち\nが込\nこ\nむかもしれません。15 分\nふん\nぐらい早\nはや\nめに出\nで\nられたほうがいいですね。\nＦ ： そうですか。じゃ、そうします。\n女\nおんな\nの人\nひと\nは明\nあした\n日何\nなん\n時\nじ\nまでにホテルを出\nで\nますか。\n1 番\n電\nでん\n話\nわ\nで妻\nつま\nと夫\nおっと\nが話\nはな\nしています。夫\nおっと\nはこれから何\nなに\nをしますか。\nＦ ： もしもし、今\nいま\n、用\nよう\n事\nじ\nが終\nお\nわったから帰\nかえ\nろうと思\nおも\nって駅\nえき\nに来\nき\nたんだけど、電\nでん\n車\nしゃ\nが動\nうご\nいてなくって。\nＭ ： えっ本\nほん\n当\nとう\n？\nＦ ： うん。少\nすこ\nし帰\nかえ\nる時\nじ\n間\nかん\nが遅\nおそ\nくなっちゃうと思\nおも\nう。そろそろ暗\nくら\nくなるし、洗\nせん\n濯\nたく\n物\nもの\n取\nと\nり込\nこ\nんどいて\nくれる？\nＭ ： 分\nわ\nかった。\nＦ ： それから、もうすぐ荷\nに\n物\nもつ\nが届\nとど\nくことになってるから、受\nう\nけ取\nと\nっといて。\nＭ ： ああ、それさっき届\nとど\nいたよ。晩\nばん\nご飯\nはん\nどうする？作\nつく\nっておこうか。\nＦ ： ありがとう。それは大\nだい\n丈\nじょう\n夫\nぶ\n。何\nなに\nかすぐ食\nた\nべられるもの買\nか\nって帰\nかえ\nるから。それより、庭\nにわ\nの花\nはな\nに\n水\nみず\nやっといてもらえない？いろいろ頼\nたの\nんで悪\nわる\nいんだけど。\nＭ ： 分\nわ\nかった。\n夫\nおっと\nはこれから何\nなに\nをしますか。\n聴解スクリプト\n1\n\n2 番\nクリーニング屋\nや\nで女\nおんな\nの人\nひと\nと店\nてん\n員\nいん\nが話\nはな\nしています。女\nおんな\nの人\nひと\nはワンピースをいつ取\nと\nりに来\nき\nますか。\nＦ ： すみません、このワンピースお願\nねが\nいします。いつできますか。\nＭ ： ええと今\nきょう\n日は水\nすい\n曜\nよう\n日\nび\nですね。土\nど\n曜\nよう\n日\nび\nにお渡\nわた\nしできます。\nＦ ： そうですか。その日\nひ\nに結\nけっ\n婚\nこん\n式\nしき\nがあるんで、その前\nぜん\n日\nじつ\nまでには取\nと\nりに来\nき\nたいんですが。\nＭ ： 急\nいそ\nぐようでしたら、500 円\nえん\n高\nたか\nくなってしまいますが、預\nあず\nかった翌\nよく\n日\nじつ\nにできるコースもありま\nすので、そちらにしていただけないでしょうか。\nＦ ： 分\nわ\nかりました。\nＭ ： ゃく\n様\nさま\nがいらっ\nしゃるかどうか心\nしん\n配\nぱい\nだったんですが、近\nきん\n所\nじょ\nの方\nかた\nがよく朝\nちょう\n食\nしょく\nを食\nた\nべに来\nき\nてくださるので、驚\nおどろ\nきました。\nＭ ： 確\nたし\nかに予\nよ\n想\nそう\n以\nい\n上\nじょう\nだったね。\nＦ ： はい。それと、食\nしょく\n事\nじ\nがすんでいるのに、ずっとお帰\nかえ\nりにならない方\nかた\nがけっこういらっしゃる\nのが気\nき\nになります。アルバイトの森\nもり\nさんが言\nい\nってたんですけど、せっかく来\nき\nてくださったお\n客\nきゃく\n様\nさま\nが席\nせき\nがなくて入\nはい\nれないっていうことが何\nなん\n回\nかい\nかあったそうです。\nＭ ： そういうときは、お客\nきゃく\n様\nさま\nの気\nき\n分\nぶん\nを悪\nわる\nくさせずに席\nせき\nを空\nあ\nけていただくように頼\nたの\nまなきゃいけな\nいんだけど。うちの店\nみせ\nは若\nわか\nい店\nてん\n員\nいん\nが多\nおお\nいから、上\nじょう\n手\nず\nに伝\nつた\nえるのは難\nむずか\nしいかもしれないね。\n女\nおんな\nの店\nてん\n員\nいん\nは店\nみせ\nについて何\nなに\nが問\nもん\n題\nだい\nだと言\nい\nっていますか。\n6 番\n女\nおんな\nの学\nがく\n生\nせい\nと男\nおとこ\nの学\nがく\n生\nせい\nが授\nじゅ\n業\nぎょう\nの発\nはっ\n表\nぴょう\nで使\nつか\nう資\nし\n料\nりょう\nについて話\nはな\nしています。二\nふたり\n人はこのあとまず何\nなに\nをしますか。\nＦ ： ねえ、社\nしゃ\n会\nかい\n学\nがく\nの授\nじゅ\n業\nぎょう\nで一\nいっ\n緒\nしょ\nにやる発\nはっ\n表\nぴょう\nのことなんだけど。\nＭ ： うん。準\nじゅん\n備\nび\nも終\nお\nわったし、発\nはっ\n表\nぴょう\nを待\nま\nつだけだね。\nＦ ： 実\nじつ\nはね、昨\nきのう\n日、ゼミの先\nせん\n輩\nぱい\nに私\nわたし\nたちが準\nじゅん\n備\nび\nした、発\nはっ\n表\nぴょう\nで使\nつか\nう資\nし\n料\nりょう\nとか発\nはっ\n表\nぴょう\nの流\nなが\nれを見\nみ\nて\nもらったら、先\nせん\n輩\nぱい\nが問\nもん\n題\nだい\n点\nてん\nをいくつかあげてくれて。直\nなお\nしたほうがいいと思\nおも\nうんだ。\nＭ ： どこ？\nＦ ： うん。まずね、せっかく自\nじ\n分\nぶん\nたちで調\nちょう\n査\nさ\nして、面\nおも\n白\nしろ\nい結\nけっ\n果\nか\nが出\nで\nてるのに、数\nすう\n字\nじ\nが並\nなら\nんでるだ\nけだから、伝\nつた\nわりにくいって。\nＭ ： じゃ、グラフを加\nくわ\nえようか。\nＦ ： そうだね。それからもう一\nいっ\n点\nてん\n、私\nわたし\nたちの主\nしゅ\n張\nちょう\nが発\nはっ\n表\nぴょう\nの最\nさい\n後\nご\nにしかないから、途\nと\n中\nちゅう\nまで何\nなに\nが言\nい\nいたいのか分\nわ\nからないって。ねえ、発\nはっ\n表\nぴょう\nの流\nなが\nれ、変\nか\nえてみない？\nＭ ： うん、やってみよう。流\nなが\nれを変\nか\nえたら、調\nちょう\n査\nさ\n結\nけっ\n果\nか\nの見\nみ\nせ方\nかた\nも変\nか\nわってくるだろうから、グラ\nフのことは後\nあと\nにして、それからやろう。\nＦ ： うん。\n聴解スクリプト\n7\n\nＭ ： 先\nせん\n輩\nぱい\nにお礼\nれい\n言\nい\nっといてね。\n二\nふたり\n人はこのあとまず何\nなに\nをしますか。\n問題3\n例\n女\nおんな\nの人\nひと\nが友\nとも\n達\nだち\nのうちに来\nき\nて、話\nはな\nしています。\nＦ１ ： 田\nた\n中\nなか\nです。\nＦ２ ： あ、はあい。昨\nきのう\n日友\nとも\n達\nだち\nが泊\nと\nまりに来\nき\nてたんで、片\nかた\n付\nづ\nいてないけど、入\nはい\nって。\nＦ１ ： あ、でもここで。すぐ帰\nかえ\nるから。あのう、この前\nまえ\n借\nか\nりた本\nほん\nなんだけど、ちょっと破\nやぶ\nれちゃって。\nＦ２ ： え、本\nほん\n当\nとう\n？\nＦ１ ： うん、このページなんだけど。\nＦ２ ： あっ、うん、このくらいなら大\nだい\n丈\nじょう\n夫\nぶ\n。読\nよ\nめるし。\nＦ１ ： ほんと？　ごめん。これからは気\nき\nをつけるから。\nＦ２ ： うん、いいよ。ねえ、入\nはい\nってコーヒーでも飲\nの\nんでいかない？\nＦ１ ： ありがとう。\n女\nおんな\nの人\nひと\nは友\nとも\n達\nだち\nのうちへ何\nなに\nをしに来\nき\nましたか。\n１． 謝\nあやま\nりに来\nき\nた\n２． 本\nほん\nを借\nか\nりに来\nき\nた\n３． 泊\nと\nまりに来\nき\nた\n４． コーヒーを飲\nの\nみに来\nき\nた\n聴解スクリプト\n8\n\n1 番\nテレビでアナウンサーが話\nはな\nしています。\nＦ ： 皆\nみな\nさん、突\nとつ\n然\nぜん\nですが、私\nわたし\n、左\nひだり\n利\nき\nきなんです。マイクを持\nも\nつのも左\nひだり\n手\nて\n、はしを持\nも\nつのも左\nひだり\n手\nて\nです。今\nいま\n来\nき\nているこちらのお店\nみせ\n、文\nぶん\n房\nぼう\n具\nぐ\nなど、ちょっと見\nみ\nたところよくある普\nふ\n通\nつう\nのものが\n売\nう\nられていますが、大\nたい\n変\nへん\n人\nにん\n気\nき\nがあって、全\nぜん\n国\nこく\nからお客\nきゃく\nさんが集\nあつ\nまってくるそうです。すべ\nての商\nしょう\n品\nひん\nが左\nひだり\n利\nき\nきの人\nひと\nのためのものなんです。普\nふ\n段\nだん\nはあまり意\nい\n識\nしき\nしないかもしれませんが、\n普\nふ\n通\nつう\nのはさみ、包\nほう\n丁\nちょう\nなどは右\nみぎ\n手\nて\nで使\nつか\nうように作\nつく\nられています。こちらのお店\nみせ\nには、日\nにち\n常\nじょう\n使\nつか\nうものからパソコンのキーボードなどの電\nでん\n気\nき\n製\nせい\n品\nひん\n、ギターなどの楽\nがっ\n器\nき\nまであるんですよ。す\nごいですね。\nアナウンサーは主\nおも\nに何\nなに\nについて話\nはな\nしていますか。\n１． 左\nひだり\n利\nき\nき用\nよう\nの道\nどう\n具\nぐ\nの特\nとく\n徴\nちょう\n２． 左\nひだり\n利\nき\nきの人\nひと\nの苦\nく\n労\nろう\n３． この店\nみせ\nで扱\nあつか\nっている商\nしょう\n品\nひん\n４． この店\nみせ\nの利\nり\n用\nよう\n客\nきゃく\nの感\nかん\n想\nそう\n2 番\nラジオでスポーツ選\nせん\n手\nしゅ\nが話\nはな\nしています。\nＭ ： けがで思\nおも\nうような成\nせい\n績\nせき\nが出\nだ\nせず、テニス選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむことにしたあと、選\nせん\n手\nしゅ\nをや\nめて、指\nし\n導\nどう\n者\nしゃ\nになることも考\nかんが\nえました。でも、目\nもく\n標\nひょう\nを持\nも\nって頑\nがん\n張\nば\nる若\nわか\nい選\nせん\n手\nしゅ\nたちの試\nし\n合\nあい\nを\n見\nみ\nて、まだあきらめられない気\nき\n持\nも\nちが出\nで\nてきました。自\nじ\n分\nぶん\nもその場\nば\n所\nしょ\nに立\nた\nちたいと思\nおも\nい、選\nせん\n手\nしゅ\nを育\nそだ\nてるのはもう少\nすこ\nし先\nさき\nでもいいと思\nおも\nったんです。休\nやす\nんでいる間\nあいだ\nも応\nおう\n援\nえん\nしてくださった方\nかた\nたちのためにも、新\nあたら\nしい気\nき\n持\nも\nちでやっていきたいと思\nおも\nいます。\nこのスポーツ選\nせん\n手\nしゅ\nが伝\nつた\nえたいことは何\nなん\nですか。\n１． 選\nせん\n手\nしゅ\nとしての活\nかつ\n動\nどう\nを休\nやす\nむということ\n２． 選\nせん\n手\nしゅ\nをやめるということ\n３． 指\nし\n導\nどう\n者\nしゃ\nになるということ\n４． もう一\nいち\n度\nど\n選\nせん\n手\nしゅ\nとして活\nかつ\n動\nどう\nするということ\n聴解スクリプト\n9\n\n3 番\nテレビで博\nはく\n物\nぶつ\n館\
