<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Geometric Accents -->
  <circle cx="720" cy="80" r="140" fill="#6366F1" opacity="0.15" />
  <circle cx="80" cy="380" r="180" fill="#4F46E5" opacity="0.2" />

  <!-- Glass Card -->
  <rect x="50" y="45" width="700" height="360" rx="24" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Badge -->
  <rect x="90" y="80" width="160" height="38" rx="19" fill="#EEF2FF" />
  <text x="170" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#4338CA" text-anchor="middle">OFFICIAL JLPT</text>

  <!-- Level Badge -->
  <rect x="260" y="80" width="130" height="38" rx="19" fill="url(#goldGrad)" />
  <text x="325" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#78350F" text-anchor="middle">LEVEL N3</text>

  <!-- Title -->
  <text x="90" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" letter-spacing="-1">JLPT N3 마스터 허브</text>
  <text x="90" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="22" font-weight="600" fill="#E0E7FF">공식 문제집 1·2집 201문항 전수 탑재 완결판</text>

  <!-- Stats Pills -->
  <g transform="translate(90, 270)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="60" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" />
    <text x="24" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1">총 문항수</text>
    <text x="24" y="49" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">201문항 전수</text>

    <!-- Pill 2 -->
    <rect x="195" y="0" width="190" height="60" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" />
    <text x="219" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1">제1집 + 제2집</text>
    <text x="219" y="49" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#38BDF8">2012 &amp; 2018</text>

    <!-- Pill 3 -->
    <rect x="400" y="0" width="220" height="60" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" />
    <text x="424" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1">청해 1:1 슬라이싱</text>
    <text x="424" y="49" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#4ADE80">55문항 개별재생</text>
  </g>

  <!-- School footer -->
  <text x="710" y="380" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="rgba(255,255,255,0.5)" text-anchor="end">배재중학교 AI중점학교 통합 포털 에디션</text>
</svg>
